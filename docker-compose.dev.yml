# ═════════════════════════════════════════════════════════════════════════════
# Development Environment Overrides
#
# Usage: docker compose -f docker-compose.dev.yml up
#        docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# This extends the base docker-compose.yml with development-specific overrides
# ═════════════════════════════════════════════════════════════════════════════

services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
      - /frontend/.next

    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      NODE_OPTIONS: "--max-old-space-size=8192"

    command: npm run dev

    healthcheck:
      disable: true

  backend:
    build: ./backend
    ports:
      - "8000:8000"

    volumes:
      - ./backend:/backend

    environment:
      ENVIRONMENT: development
      DEBUG: "true"

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    healthcheck:
      disable: true

  celery_worker:
    build: ./backend
    volumes:
      - ./backend:/backend

    environment:
      ENVIRONMENT: development

    command: celery -A app.infrastructure.messaging.celery_app worker -Q ai,email,beat --loglevel=debug

    healthcheck:
      disable: true

  celery_beat:
    build: ./backend
    volumes:
      - ./backend:/backend

    environment:
      ENVIRONMENT: development

    command: celery -A app.infrastructure.messaging.celery_app beat --loglevel=debug

    healthcheck:
      disable: true

  postgres:
    ports:
      - "5432:5432"

    healthcheck:
      disable: true

  redis:
    ports:
      - "6379:6379"

    command: redis-server --appendonly no

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - postgres
