# Dedicated certificate-only proxy; no general proxy or administrative endpoint.
pid /run/credx-uat2-certs/nginx.pid;
error_log stderr warn;
events { worker_connections 64; }
http {
  access_log off;
  client_body_temp_path /run/credx-uat2-certs/body;
  proxy_temp_path /run/credx-uat2-certs/proxy;
  fastcgi_temp_path /run/credx-uat2-certs/fastcgi;
  uwsgi_temp_path /run/credx-uat2-certs/uwsgi;
  scgi_temp_path /run/credx-uat2-certs/scgi;
  resolver 169.254.169.253 ipv6=off valid=300s;
  resolver_timeout 3s;
  server {
    listen 127.0.0.1:18082;
    server_tokens off;
    location = /certs {
      limit_except GET { deny all; }
      set $google_certificate_host www.googleapis.com;
      proxy_pass https://$google_certificate_host/oauth2/v1/certs;
      proxy_ssl_server_name on;
      proxy_ssl_name www.googleapis.com;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
      proxy_send_timeout 3s;
    }
    location / { return 403; }
  }
}
