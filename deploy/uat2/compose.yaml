# Dedicated UAT2 topology. Run only after approved resource/security gates.
name: credx-uat2
x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
services:
  proxy:
    <<: *runtime
    image: ${UAT2_PROXY_IMAGE:?supply immutable caddy image digest}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy_config:/config
    env_file: [{path: ./barrier.env, format: raw}]
    networks: [edge, private]
    mem_limit: 256m
  frontend:
    <<: *runtime
    image: ${UAT2_FRONTEND_IMAGE:?supply immutable frontend image digest}
    env_file: [{path: ./frontend.env, format: raw}]
    networks: [private]
    mem_limit: 1536m
  backend:
    <<: *runtime
    image: ${UAT2_BACKEND_IMAGE:?supply immutable backend image digest}
    command: uvicorn app.uat2.main:app --host 0.0.0.0 --port 8000 --workers 1
    env_file: [{path: ./backend.env, format: raw}]
    environment:
      CREDX_UAT2: '1'
      ENVIRONMENT: uat2
      AUTH_DISABLED: 'false'
      UAT2_SOURCE_COMMIT: ${UAT2_SOURCE_COMMIT:?required source commit}
    networks: [private]
    volumes: [artifacts:/backend/data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    mem_limit: 1536m
  google-certs:
    <<: *runtime
    image: ${UAT2_CERTS_IMAGE:?supply immutable nginx image digest}
    volumes: [./google-certs.conf:/etc/nginx/conf.d/default.conf:ro]
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    networks: [edge, private]
    mem_limit: 128m
  simulation-worker:
    <<: *runtime
    image: ${UAT2_BACKEND_IMAGE:?supply immutable backend image digest}
    command: celery -A app.uat2.worker worker -Q uat2_simulation --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=25 --loglevel=warning
    env_file: [{path: ./backend.env, format: raw}]
    environment: {CREDX_UAT2: '1', ENVIRONMENT: uat2, AUTH_DISABLED: 'false'}
    networks: [private]
    volumes: [artifacts:/backend/data]
    mem_limit: 512m
  postgres:
    <<: *runtime
    image: ${UAT2_POSTGRES_IMAGE:?supply immutable postgres16 image digest}
    env_file: [{path: ./database.env, format: raw}]
    volumes: [postgres:/var/lib/postgresql/data]
    tmpfs: [/tmp, /var/run/postgresql]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U credx_uat2 -d credx_uat2']
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 768m
  redis:
    <<: *runtime
    image: ${UAT2_REDIS_IMAGE:?supply immutable redis7 image digest}
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    volumes: [redis:/data]
    networks: [private]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 192m
networks:
  edge: {}
  private: {internal: true}
volumes:
  postgres: {}
  redis: {}
  artifacts: {}
  certificates: {}
  proxy_config: {}
