services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: always

    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    env_file:
      - .env.prod

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

    networks:
      - app_network

  backend:
    build: ./backend
    restart: always

    environment:
      ENVIRONMENT: production

    env_file:
      - .env.prod

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

    networks:
      - app_network

    expose:
      - "8000"

  celery_worker:
    build: ./backend
    restart: always

    command: celery -A app.infrastructure.messaging.celery_app worker -Q ai,email,beat --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-2} --prefetch-multiplier=${CELERY_WORKER_PREFETCH_MULTIPLIER:-1} --max-tasks-per-child=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-25} --max-memory-per-child=${CELERY_WORKER_MAX_MEMORY_PER_CHILD_KB:-800000}

    environment:
      ENVIRONMENT: production
      CELERY_POOL: prefork

    env_file:
      - .env.prod

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '8'
          memory: 8G
        reservations:
          cpus: '4'
          memory: 4G

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

    networks:
      - app_network

  # Isolated Auto-Live Stage 1/2 planning worker. Stage 3 execution and
  # reconciliation remain on the general ai worker above.
  celery_auto_live_worker:
    build: ./backend
    restart: always

    command: celery -A app.infrastructure.messaging.celery_app worker -n auto-live-worker@%h -Q ${CELERY_AUTO_LIVE_WORKER_QUEUE:-auto_live} --loglevel=info --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=${CELERY_AUTO_LIVE_MAX_TASKS_PER_CHILD:-1}

    environment:
      ENVIRONMENT: production
      CELERY_POOL: prefork

    env_file:
      - .env.prod

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

    networks:
      - app_network

  celery_beat:
    build: ./backend
    restart: always

    command: celery -A app.infrastructure.messaging.celery_app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

    environment:
      ENVIRONMENT: production

    env_file:
      - .env.prod

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

    networks:
      - app_network

  postgres:
    image: postgres:14.22-trixie
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=pg_stat_statements"

    env_file:
      - .env.prod

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups

    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

    networks:
      - app_network

    expose:
      - "5432"

  redis:
    image: redis:trixie
    restart: always

    # Auto-Live uses expiring Redis leases for queue ownership. Evicting a
    # live lease can create avoidable recovery churn, so fail writes under
    # memory pressure rather than evicting arbitrary keys.
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy noeviction

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    volumes:
      - redis_data:/data

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

    networks:
      - app_network

    expose:
      - "6379"

volumes:
  postgres_data:
    driver: local
  postgres_backups:
    driver: local
  redis_data:
    driver: local

networks:
  app_network:
    driver: bridge
