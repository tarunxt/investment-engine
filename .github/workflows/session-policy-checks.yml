name: Session policy isolated acceptance
on:
  pull_request:
    paths:
      - 'backend/app/core/security.py'
      - 'backend/app/domains/auth/**'
      - 'backend/app/shared/ws_relay.py'
      - 'backend/alembic/versions/*session*'
      - 'backend/scripts/verify-session*'
      - 'backend/tests/test_token_purpose_isolated.py'
      - 'frontend/auth.ts'
      - 'frontend/lib/*SessionUpdate*'
      - 'frontend/lib/logoutOutcome.ts'
      - 'frontend/providers/AuthProvider.tsx'
      - 'frontend/app/api/bullpen-ai/_lib/serverBackendSession.ts'
      - 'frontend/tests/session*'
      - 'frontend/tests/session-http-browser/**'
      - 'frontend/app/backend-api/**'
      - '.github/workflows/session-policy-checks.yml'
permissions:
  contents: read
jobs:
  session-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install isolated test dependencies
        run: |
          python -m venv /tmp/a9-session-venv-20261103
          /tmp/a9-session-venv-20261103/bin/pip install 'SQLAlchemy==2.0.49' 'asyncpg==0.30.0' 'fastapi==0.136.1' 'pydantic==2.13.4' 'pydantic-settings==2.14.0' 'starlette==1.0.0' 'alembic==1.18.4' 'python-jose[cryptography]==3.5.0' 'passlib==1.7.4' argon2-cffi 'httpx==0.28.1' email-validator 'psycopg[binary]' pytest
      - name: Guarded source and BFF tests (no providers)
        run: |
          /tmp/a9-session-venv-20261103/bin/python backend/scripts/verify-session-lifecycle-offline.py
          /tmp/a9-session-venv-20261103/bin/python backend/scripts/verify-session-lifecycle-offline.py --run /tmp/a9-session-venv-20261103/bin/pytest --noconftest -q backend/tests/test_token_purpose_isolated.py
          node --experimental-vm-modules --test frontend/tests/session-safe-integration-offline.mjs frontend/tests/session-intent-integration-offline.mjs
      - name: Start synthetic PostgreSQL with no network or published ports
        run: |
          mkdir /tmp/a9-session-pg-socket-20261103
          chmod 777 /tmp/a9-session-pg-socket-20261103
          docker run --detach --rm --name a9-session-pg-20261103 --network none --mount type=bind,source=/tmp/a9-session-pg-socket-20261103,target=/var/run/postgresql -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=a9_synthetic postgres@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
          for attempt in $(seq 1 30); do
            if docker exec a9-session-pg-20261103 pg_isready -U postgres -d a9_synthetic; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Actual PostgreSQL transactions and separate process contention
        run: |
          /tmp/a9-session-venv-20261103/bin/python backend/scripts/verify-session-postgres-disposable.py
          /tmp/a9-session-venv-20261103/bin/python backend/scripts/verify-session-postgres-disposable.py --race-setup /tmp/a9-session-race-synthetic.json
          for worker in 1 2 3; do
            /tmp/a9-session-venv-20261103/bin/python backend/scripts/verify-session-postgres-disposable.py --race-worker /tmp/a9-session-race-synthetic.json /tmp/a9-session-race-result-$worker.json &
          done
          wait
          /tmp/a9-session-venv-20261103/bin/python backend/scripts/verify-session-postgres-disposable.py --race-check /tmp/a9-session-race-synthetic.json /tmp/a9-session-race-result-1.json /tmp/a9-session-race-result-2.json /tmp/a9-session-race-result-3.json
      - name: New migrations in disposable Docker backend
        run: |
          docker run --rm --network none --env PYTHONPATH=/venv/lib/python3.12/site-packages --mount type=bind,source=/tmp/a9-session-venv-20261103,target=/venv,readonly --mount type=bind,source="$PWD/backend",target=/backend,readonly --mount type=bind,source=/tmp/a9-session-pg-socket-20261103,target=/var/run/postgresql python:3.12-slim python /backend/scripts/verify-session-migrations-disposable.py
      - name: Install actual application and browser fixture dependencies
        run: |
          /tmp/a9-session-venv-20261103/bin/pip install -r backend/requirements.txt
          npm ci --ignore-scripts --prefix frontend
          cd frontend && npx playwright install --with-deps chromium
      - name: Actual main import and missing-schema startup rejection
        run: /tmp/a9-session-venv-20261103/bin/python backend/scripts/verify-session-full-startup-offline.py --schema-only
      - name: Actual browser cookies and two independent HTTP BFF processes
        run: |
          export SESSION_PROOF_PYTHON=/tmp/a9-session-venv-20261103/bin/python
          export SESSION_PROOF_CHROMIUM=$(cd frontend && node -p "require('playwright').chromium.executablePath()")
          node frontend/tests/session-http-browser/run.mjs
      - name: Remove only the synthetic fixture
        if: always()
        run: docker stop a9-session-pg-20261103 || true
