name: Inspect Approved Runtime Status

on:
  workflow_dispatch:
  push:
    branches: [codex/diagnose-credx-timeouts-20261002]
    paths: [.github/workflows/inspect-ranking-runtime.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read approved restart and memory-kill status without log contents
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          command_timeout: 120s
          script: |
            set -eu
            if ! sudo -n true 2>/dev/null; then
              printf 'runtime_probe_status=unavailable\n'
              exit 0
            fi
            sudo -n python3 - 2>/dev/null <<'PY_RUNTIME_STATUS'
            import subprocess
            
            SINCE = '2026-10-03 04:36:00 UTC'
            UNTIL = '2026-10-03 05:20:00 UTC'
            SERVICES = {'backend': 'investor-backend', 'frontend': 'investor-frontend', 'database': 'postgresql@18-main'}
            OOM_PATTERN = 'oom-kill|Killed process|killed by the OOM killer|Memory cgroup out of memory|Out of memory:'
            
            
            def read(args):
                try:
                    result = subprocess.run(args, capture_output=True, text=True, timeout=8, check=False)
                    return result.stdout if result.returncode == 0 else None
                except (OSError, subprocess.SubprocessError):
                    return None
            
            
            def seen_memory_kill(args):
                result = read(['journalctl', '--quiet', '--no-pager', '--output=cat', '--since', SINCE, '--until', UNTIL, '--grep', OOM_PATTERN, *args])
                return 'unavailable' if result is None else str(bool(result.strip())).lower()
            
            
            def main():
                for label, service in SERVICES.items():
                    raw = read(['systemctl', 'show', service, '--no-pager', '--property=ActiveState,NRestarts,Result,ExecMainCode,ExecMainStatus'])
                    props = dict(line.split('=', 1) for line in (raw or '').splitlines() if '=' in line)
                    active = props.get('ActiveState')
                    state = 'up' if active == 'active' else 'down' if active in {'inactive', 'failed', 'deactivating'} else 'unavailable'
                    count = props.get('NRestarts', '')
                    result = props.get('Result', '')
                    exit_class = result if result in {'success', 'exit-code', 'signal', 'core-dump', 'timeout', 'oom-kill', 'watchdog'} else 'unavailable'
                    code = props.get('ExecMainStatus', '')
                    print(f'{label}_state={state}')
                    print(f'{label}_restart_count={count if count.isdigit() else "unavailable"}')
                    print(f'{label}_exit_class={exit_class}')
                    print(f'{label}_exit_status={code if code.isdigit() else "unavailable"}')
                    # PID 1 limits this read to service-manager status, excluding app logs.
                    print(f'{label}_memory_kill_seen={seen_memory_kill(["--unit", service, "_PID=1"])}')
                print(f'host_memory_kill_seen={seen_memory_kill(["--dmesg"])}')
            
            
            if __name__ == '__main__':
                main()
            
            PY_RUNTIME_STATUS
