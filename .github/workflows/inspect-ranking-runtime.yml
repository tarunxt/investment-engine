name: Inspect Rankings Runtime

on:
  workflow_dispatch:
  push:
    branches: [codex/fix-ranking-errors, codex/history-refresh-recovery-20260917]
    paths: [.github/workflows/inspect-ranking-runtime.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect database availability and bounded error diagnostics
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 180s
          script: |
            set -eu
            date -u
            sudo -u investor git -C /srv/investor rev-parse HEAD
            free -h
            sudo systemctl list-jobs --no-pager
            sudo systemctl show investor-backend investor-celery-auto-live-worker --property=Id,ActiveState,SubState,MemoryCurrent,MemoryHigh,MemoryMax,MainPID --no-pager
            ps -eo pid,comm,rss,pcpu --sort=-rss | head -12
            curl -sS --max-time 8 http://127.0.0.1:8000/health/live || true
            sudo journalctl -u investor-backend --since '-10 minutes' -o cat --no-pager | grep -E 'Started server|startup|Shutting down|finished|ERROR|Traceback|/health/' | tail -20 || true
            sudo systemctl show investor-celery-auto-live-worker --property=TimeoutStopUSec,StateChangeTimestamp,ExecMainStartTimestamp --no-pager
            sudo -u postgres psql -X -d aidb -P pager=off -c "SELECT pid,state,wait_event_type,wait_event,now()-query_start AS age,left(query,110) AS shape FROM pg_stat_activity WHERE datname=current_database() ORDER BY query_start LIMIT 12;" || true
