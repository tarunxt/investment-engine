name: Inspect Rankings Runtime

on:
  workflow_dispatch:
  push:
    branches: [codex/fix-ranking-errors, codex/history-refresh-recovery-20260917]
    paths: [.github/workflows/inspect-ranking-runtime.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect database availability and bounded error diagnostics
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 180s
          script: |
            set -eu
            cd /srv/investor
            git rev-parse HEAD
            sudo systemctl show investor-backend -p ActiveState -p MainPID -p MemoryCurrent -p ActiveEnterTimestamp
            curl --max-time 8 --silent --show-error -w '\nhealth_seconds=%{time_total}\n' http://127.0.0.1:8000/health/live || true
            pid=$(sudo systemctl show investor-backend --value -p MainPID)
            sudo /tmp/credx-history-pyspy/bin/py-spy dump --pid "$pid" || true
            sudo journalctl -u investor-backend --since '5 minutes ago' --no-pager | grep -E 'request_performance|ERROR|Traceback' | tail -n 65
