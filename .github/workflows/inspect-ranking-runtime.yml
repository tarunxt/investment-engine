name: Inspect Rankings Runtime

on:
  workflow_dispatch:
  push:
    branches: [codex/fix-ranking-errors, codex/history-refresh-recovery-20260917]
    paths: [.github/workflows/inspect-ranking-runtime.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect database availability and bounded error diagnostics
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 180s
          script: |
            set -eu
            sudo /srv/investor/backend/.venv/bin/python -m pip install --disable-pip-version-check --target /tmp/credx-history-pyspy py-spy
            /tmp/credx-history-pyspy/bin/py-spy dump --help
            sudo /tmp/credx-history-pyspy/bin/py-spy dump --pid "$(systemctl show investor-backend --property=MainPID --value)"
