name: Inspect Rankings Runtime

on:
  workflow_dispatch:
  push:
    branches: [codex/diagnose-credx-timeouts-20261002]
    paths: [.github/workflows/inspect-ranking-runtime.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production availability without publishing internal diagnostics
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          command_timeout: 120s
          script: |
            set -eu
            # Output deliberately contains only bounded aggregate/status values.
            # Never print environment, paths, logs, process arguments or DB data.
            free_kib="$(df -Pk / | awk 'NR==2 {print $4}')"
            printf 'available_disk_kib=%s\n' "$free_kib"
            for role in backend frontend; do
              state=unknown
              for prefix in investor investment-engine; do
                if sudo systemctl is-active --quiet "${prefix}-${role}" 2>/dev/null; then
                  state=active
                  break
                fi
              done
              printf '%s_service=%s\n' "$role" "$state"
            done
            for probe in live ready; do
              printf 'backend_%s ' "$probe"
              curl -s -o /dev/null --max-time 8 -w 'http=%{http_code} elapsed=%{time_total}\n' "http://127.0.0.1:8000/health/$probe" || true
            done
