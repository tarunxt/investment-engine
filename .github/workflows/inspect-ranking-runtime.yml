name: Inspect one Sports request timing

on:
  workflow_dispatch:
  push:
    branches: [codex/inspect-sports-timing-20261003]
    paths: [.github/workflows/inspect-ranking-runtime.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Emit approved status and timing fields for one request
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 35s
          script: |
            set -eu
            sudo -n python3 - <<'PYPROBE'
            """Proposed read-only probe. Emits only whitelisted status/timing fields.
            
            Not executed against production. No raw log lines, paths, account identifiers,
            request bodies, queries or credentials are returned, including on failure.
            """
            import json
            import math
            import subprocess
            
            CORRELATION = 'fd8551f3-7617-49f6-83b4-7b718e10d959'
            START = '2026-10-03 09:47:00 UTC'
            END = '2026-10-03 09:50:00 UTC'
            TIMING_FIELDS = ('total_ms', 'auth_ms', 'db_ms', 'redis_ms', 'external_ms', 'serialization_ms', 'duration_ms')
            
            
            def project_record(line):
                marker = line.find('{')
                if marker < 0:
                    return None
                try:
                    record = json.loads(line[marker:])
                except (ValueError, RecursionError):
                    return None
                if not isinstance(record, dict) or record.get('correlation_id') != CORRELATION:
                    return None
                if record.get('path') not in ('/api/sports-rankings', '/backend-api/api/sports-rankings'):
                    return None
                if record.get('method') != 'GET':
                    return None
                result = {'matched': True}
                status = record.get('status')
                if type(status) is int and 100 <= status <= 599:
                    result['http_status'] = status
                for key in TIMING_FIELDS:
                    value = record.get(key)
                    if type(value) in (int, float) and math.isfinite(value) and 0 <= value <= 3600000:
                        result[key] = value
                if record.get('outcome') in ('timeout', 'unreachable', 'authentication_failed', 'success'):
                    result['outcome'] = record['outcome']
                return result
            
            
            def read_service(unit):
                try:
                    process = subprocess.run(
                        ['journalctl', '--unit', unit, '--since', START, '--until', END,
                         '--no-pager', '--output=cat', '--grep', CORRELATION, '--lines=100'],
                        capture_output=True, text=True, timeout=10, check=False,
                    )
                except (OSError, subprocess.TimeoutExpired):
                    return {'available': False}
                if process.returncode:
                    return {'available': False}
                records = [record for line in process.stdout.splitlines() if (record := project_record(line)) is not None]
                return {'available': True, 'matched': bool(records), 'timings': records[-3:]}
            
            
            if __name__ == '__main__':
                print(json.dumps({
                    'backend': read_service('investor-backend'),
                    'frontend': read_service('investor-frontend'),
                }, allow_nan=False, separators=(',', ':')))
            PYPROBE
