name: Inspect Production Disk

on:
  workflow_dispatch:
    inputs:
      confirm_cleanup:
        description: Type TRUNCATE_ROTATED_SYSLOG to clear the identified rotated syslog file.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect production disk usage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Inspect disk usage over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 900s
          command_timeout: 900s
          script: |
            set -euo pipefail

            APP="${{ vars.EC2_APP_PATH || '/srv/investment-engine' }}"
            LEGACY_APP="/srv/investor"
            if [[ ! -d "$APP" && -d "$LEGACY_APP" ]]; then
              APP="$LEGACY_APP"
            fi

            echo "==> Filesystem"
            df -h /

            if [[ "${{ inputs.confirm_cleanup }}" == "TRUNCATE_ROTATED_SYSLOG" ]]; then
              echo "==> Truncating identified rotated syslog file"
              sudo test -f /var/log/syslog.1
              sudo stat -c 'before_bytes=%s path=%n' /var/log/syslog.1
              sudo truncate -s 0 /var/log/syslog.1
              sudo stat -c 'after_bytes=%s path=%n' /var/log/syslog.1
              sync
              df -h /
            else
              echo "==> Read-only inspection mode"
            fi

            echo "==> Top-level disk usage"
            sudo du -xhd1 / 2>/dev/null | sort -h | tail -30

            echo "==> Application disk usage"
            sudo du -xhd2 "$APP" 2>/dev/null | sort -h | tail -40

            echo "==> Common cache and log directories"
            for directory in /var/cache /var/log /var/lib /tmp /var/tmp /home /srv; do
              if [[ -d "$directory" ]]; then
                echo "--- $directory"
                sudo du -xhd1 "$directory" 2>/dev/null | sort -h | tail -20
              fi
            done

            echo "==> Largest regular files"
            sudo find / -xdev -type f -size +50M -printf '%s %p\n' 2>/dev/null \
              | sort -n | tail -40
