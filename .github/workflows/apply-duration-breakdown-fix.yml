name: Apply dashboard duration breakdown fix

on:
  push:
    branches:
      - codex/dashboard-duration-breakdown-popup

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/dashboard-duration-breakdown-popup
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply source patch
        run: python3 scripts/apply_duration_breakdown_fix.py

      - name: Check patch formatting
        run: git diff --check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --fund=false

      - name: Run dashboard regression tests
        working-directory: frontend
        run: node --test tests/dashboard-refresh-errors.test.mjs

      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix dashboard stage duration breakdown interaction"
          git push origin HEAD:codex/dashboard-duration-breakdown-popup
