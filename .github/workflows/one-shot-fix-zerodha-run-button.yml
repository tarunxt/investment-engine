name: One-shot fix Zerodha Run button

on:
  push:
    branches:
      - fix/zerodha-run-button-popup-preflight

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zerodha-run-button-popup-preflight
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Patch Zerodha auto-rebalance start flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/app/console/dashboard/_components/RebalanceWorkflowSections.tsx')
          source = path.read_text()
          run_start = source.index('  const runWorkflow = useCallback(')

          # Remove the old late workflow-start block. In the broken flow this is
          # after the first await, so window.open no longer has a browser user gesture.
          late_start = source.index('      isWorkflowExecutingRef.current = true;', run_start)
          generated_anchor = source.index('      let generatedThreatMarkdown = "";', late_start)
          source = source[:late_start] + source[generated_anchor:]

          metadata_start = source.index(
              '      const runMetadata = await reserveAutoRebalanceRunMetadata(portfolio);',
              run_start,
          )
          current_stage_line = '      let currentStage: WorkflowStageKey = "sync";'
          metadata_end = source.index(current_stage_line, metadata_start) + len(current_stage_line)

          lines = [
              '      const shouldRunCurrentStage = (stage: WorkflowStageKey) =>',
              '        !runSpecificMode || stagesToRun.has(stage);',
              '      let currentStage: WorkflowStageKey = "sync";',
              '',
              '      // Zerodha authentication must be opened synchronously from the Run click.',
              '      // Waiting for the run-label reservation first loses the browser user gesture',
              '      // and Chrome/Safari can block the popup, making Run appear to do nothing.',
              '      const zerodhaPopup =',
              '        portfolio === "zerodha" && shouldRunCurrentStage("sync")',
              '          ? window.open("about:blank", "zerodha-connect", buildZerodhaPopupFeatures())',
              '          : null;',
              '',
              '      isWorkflowExecutingRef.current = true;',
              '      setRunningPortfolio(portfolio);',
              '      resetPortfolio(portfolio);',
              '      activeExecutionRefsRef.current = [];',
              '      cancelRequestedRef.current = false;',
              '      pauseRequestedRef.current = false;',
              '      setWorkflowPaused(false);',
              '',
              '      const startingStage =',
              '        STAGE_ORDER.find((stage) => shouldRunCurrentStage(stage)) ?? "sync";',
              '      currentStage = startingStage;',
              '      updateStage(portfolio, startingStage, {',
              '        state: "running",',
              '        startedAt: new Date().toISOString(),',
              '        runStatus:',
              '          portfolio === "zerodha"',
              '            ? "Starting Zerodha auto-rebalance"',
              '            : "Starting INDmoney auto-rebalance",',
              '        error: null,',
              '      });',
              '',
              '      let runMetadata: AutoRebalanceRunMetadata;',
              '      try {',
              '        runMetadata = await reserveAutoRebalanceRunMetadata(portfolio);',
              '      } catch (error) {',
              '        zerodhaPopup?.close();',
              '        const failedAt = new Date().toISOString();',
              '        const message = `Could not start ${',
              '          portfolio === "zerodha" ? "Zerodha" : "INDmoney"',
              '        } auto-rebalance: ${normalizeError(error)}`;',
              '        updateStage(portfolio, startingStage, {',
              '          state: "failed",',
              '          endedAt: failedAt,',
              '          runStatus: "start failed",',
              '          error: message,',
              '        });',
              '        isWorkflowExecutingRef.current = false;',
              '        setRunningPortfolio(null);',
              '        window.alert(message);',
              '        return;',
              '      }',
              '',
              '      activeAutoRebalanceMetadataRef.current[portfolio] = runMetadata;',
              '      setActiveAutoRebalanceMetadata((current) => ({',
              '        ...current,',
              '        [portfolio]: runMetadata,',
              '      }));',
          ]
          new_start = '\n'.join(lines)
          source = source[:metadata_start] + new_start + source[metadata_end:]

          # Keep Sync failures visible instead of collapsing back to only "Latest sync".
          idle_fn = source.index('function getIdleStageRows(')
          sync_rows_start = source.index('  if (stage === "sync") {', idle_fn)
          sync_rows_end = source.index('  if (LLM_STAGE_TILE_KEYS.has(stage))', sync_rows_start)
          sync_rows = '\n'.join([
              '  if (stage === "sync") {',
              '    const rows: StageTileRow[] = [',
              '      { label: "Latest sync", value: formatTimestamp(info.completedAt) },',
              '    ];',
              '    if (info.error) rows.push({ label: "Error", value: info.error });',
              '    return rows;',
              '  }',
          ]) + '\n'
          source = source[:sync_rows_start] + sync_rows + source[sync_rows_end:]
          path.write_text(source)

          test_path = Path('frontend/tests/rebalance-workflow-resilience.test.mjs')
          tests = test_path.read_text()
          if 'Zerodha Run preserves the popup user gesture' not in tests:
              addition = '\n'.join([
                  '',
                  'test("Zerodha Run preserves the popup user gesture and surfaces start failures", () => {',
                  '  const start = source.indexOf("const runWorkflow = useCallback");',
                  '  const end = source.indexOf("const syncPortfolioNow = useCallback", start);',
                  '  assert.ok(start >= 0 && end > start, "runWorkflow source should be present");',
                  '  const runWorkflowSource = source.slice(start, end);',
                  '  const popupIndex = runWorkflowSource.indexOf(\'window.open("about:blank"\');',
                  '  const reservationIndex = runWorkflowSource.indexOf(',
                  '    "await reserveAutoRebalanceRunMetadata(portfolio)",',
                  '  );',
                  '  assert.ok(popupIndex >= 0, "Zerodha popup should be pre-opened");',
                  '  assert.ok(reservationIndex >= 0, "run metadata should still be reserved");',
                  '  assert.ok(',
                  '    popupIndex < reservationIndex,',
                  '    "Zerodha popup must open before the first awaited reservation so the browser does not block it",',
                  '  );',
                  '  assert.match(runWorkflowSource, /Starting Zerodha auto-rebalance/);',
                  '  assert.match(runWorkflowSource, /zerodhaPopup\\?\\.close\\(\\)/);',
                  '  assert.match(runWorkflowSource, /Could not start \\$\\{/);',
                  '  assert.match(runWorkflowSource, /window\\.alert\\(message\\)/);',
                  '  assert.match(',
                  '    source,',
                  '    /if \\(info\\.error\\) rows\\.push\\(\\{ label: "Error", value: info\\.error \\}\\);/,',
                  '  );',
                  '});',
                  '',
              ])
              test_path.write_text(tests.rstrip() + addition)
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run auto-rebalance resilience tests
        working-directory: frontend
        run: node --test tests/rebalance-workflow-resilience.test.mjs tests/automated-rebalance-popup-reliability.test.mjs

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-fix-zerodha-run-button.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/console/dashboard/_components/RebalanceWorkflowSections.tsx frontend/tests/rebalance-workflow-resilience.test.mjs .github/workflows/one-shot-fix-zerodha-run-button.yml
          git diff --cached --check
          git commit -m "Fix Zerodha auto-rebalance Run popup preflight"
          git push origin HEAD:fix/zerodha-run-button-popup-preflight
