name: Format Bullpen Stage 2 actionables

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write
  pull-requests: read

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Correct Stage 2 JSX indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/app/console/bullpen-ai/_components/BullpenAutoRunScheduleCard.tsx")
          text = path.read_text()
          malformed = '''      </div>
              <div>
                <button
                  type="button"
                  onClick={() => setIsActionablesDialogOpen(true)}
                  className="text-left font-medium text-slate-950 underline-offset-2 transition hover:underline focus:outline-none focus:ring-2 focus:ring-amber-300"
                  aria-label={`Open actionables with ${actionables.eventExits.length} exits and ${actionables.buyNew.length} buys`}
                  aria-haspopup="dialog"
                  aria-expanded={isActionablesDialogOpen}
                >
                  Actionables: Exit=
                  <span className="font-semibold tabular-nums">
                    {displayStat(actionables.eventExits.length)}
                  </span>
                  {" | Buy="}
                  <span className="font-semibold tabular-nums">
                    {displayStat(actionables.buyNew.length)}
                  </span>
                </button>
              </div>
              {isActionablesDialogOpen ? (
                <BullpenStage2ActionablesDialog
                  actionables={actionables}
                  onClose={() => setIsActionablesDialogOpen(false)}
                />
              ) : null}
            </div>
          );
          }'''
          formatted = '''      </div>
                <div>
                  <button
                    type="button"
                    onClick={() => setIsActionablesDialogOpen(true)}
                    className="text-left font-medium text-slate-950 underline-offset-2 transition hover:underline focus:outline-none focus:ring-2 focus:ring-amber-300"
                    aria-label={`Open actionables with ${actionables.eventExits.length} exits and ${actionables.buyNew.length} buys`}
                    aria-haspopup="dialog"
                    aria-expanded={isActionablesDialogOpen}
                  >
                    Actionables: Exit=
                    <span className="font-semibold tabular-nums">
                      {displayStat(actionables.eventExits.length)}
                    </span>
                    {" | Buy="}
                    <span className="font-semibold tabular-nums">
                      {displayStat(actionables.buyNew.length)}
                    </span>
                  </button>
                </div>
                {isActionablesDialogOpen ? (
                  <BullpenStage2ActionablesDialog
                    actionables={actionables}
                    onClose={() => setIsActionablesDialogOpen(false)}
                  />
                ) : null}
              </div>
            );
          }'''

          if text.count(malformed) != 1:
              raise SystemExit(
                  f"Expected one malformed actionables block, found {text.count(malformed)}"
              )
          path.write_text(text.replace(malformed, formatted, 1))
          PY

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev --prefer-offline --no-audit --fund=false --loglevel=error

      - name: Verify actionables
        working-directory: frontend
        run: |
          node --test tests/bullpen-stage2-actionables.test.mjs
          npx tsc --noEmit --pretty false

      - name: Commit formatting
        shell: bash
        run: |
          rm .github/workflows/codex-format-bullpen-actionables.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/app/console/bullpen-ai/_components/BullpenAutoRunScheduleCard.tsx \
            .github/workflows/codex-format-bullpen-actionables.yml
          git commit -m "style: align Stage 2 actionables JSX"
          git push origin HEAD:"${GITHUB_HEAD_REF}"
