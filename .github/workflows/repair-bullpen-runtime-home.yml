name: Repair Bullpen Runtime Home

on:
  workflow_dispatch:
    inputs:
      confirm_repair:
        description: Type REPAIR_BULLPEN_RUNTIME to confirm the production Bullpen credential home can be updated and services restarted.
        required: true
        type: string
      credential_dir:
        description: Bullpen credential directory to repair. Leave blank to use the service user's default ~/.bullpen directory.
        required: false
        default: ""
        type: string
      source_dir:
        description: Existing Bullpen credential directory to copy from when repairing the service runtime home.
        required: true
        default: /home/ubuntu/.bullpen
        type: string

permissions:
  contents: read

jobs:
  repair:
    name: Repair Bullpen runtime env and credentials
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate confirmation
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirm_repair }}" != "REPAIR_BULLPEN_RUNTIME" ]]; then
            echo "Confirmation input did not match REPAIR_BULLPEN_RUNTIME." >&2
            exit 1
          fi

      - name: Repair Bullpen runtime over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 1200s
          command_timeout: 1200s
          script: |
            set -euo pipefail

            APP_ROOT="${{ vars.EC2_APP_PATH || '/srv/investment-engine' }}"
            LEGACY_APP_ROOT="/srv/investor"
            APP_USER="${{ vars.EC2_APP_USER || 'investment-engine' }}"
            LEGACY_APP_USER="investor"
            BACKEND_ENV_FILE="/etc/investor/backend.env"
            FRONTEND_ENV_FILE="/etc/investor/frontend.env"
            BULLPEN_BIN="/usr/local/bin/bullpen"
            CREDENTIAL_DIR_INPUT="${{ inputs.credential_dir }}"
            SOURCE_DIR="${{ inputs.source_dir }}"

            if [[ ! -d "$APP_ROOT" && -d "$LEGACY_APP_ROOT" ]]; then
              APP_ROOT="$LEGACY_APP_ROOT"
            fi

            if ! id "$APP_USER" >/dev/null 2>&1 && id "$LEGACY_APP_USER" >/dev/null 2>&1; then
              APP_USER="$LEGACY_APP_USER"
            fi

            APP_HOME="$(getent passwd "$APP_USER" | cut -d: -f6)"
            if [[ -z "$APP_HOME" ]]; then
              APP_HOME="/home/$APP_USER"
            fi
            if [[ -n "$CREDENTIAL_DIR_INPUT" ]]; then
              CREDENTIAL_DIR="$CREDENTIAL_DIR_INPUT"
            else
              CREDENTIAL_DIR="$APP_HOME/.bullpen"
            fi

            resolve_systemd_service_name() {
              local primary="$1"
              local legacy="$2"

              if systemctl is-active --quiet "$primary" >/dev/null 2>&1 || systemctl is-enabled --quiet "$primary" >/dev/null 2>&1; then
                printf '%s\n' "$primary"
                return
              fi

              if systemctl is-active --quiet "$legacy" >/dev/null 2>&1 || systemctl is-enabled --quiet "$legacy" >/dev/null 2>&1; then
                printf '%s\n' "$legacy"
                return
              fi

              if systemctl cat "$primary" >/dev/null 2>&1; then
                printf '%s\n' "$primary"
                return
              fi

              if systemctl cat "$legacy" >/dev/null 2>&1; then
                printf '%s\n' "$legacy"
                return
              fi

              printf '%s\n' "$primary"
            }

            restart_service_if_present() {
              local service_name="$1"
              if systemctl cat "$service_name" >/dev/null 2>&1; then
                echo "==> Restarting $service_name"
                sudo systemctl restart "$service_name"
                sudo systemctl is-active "$service_name"
              else
                echo "==> Skipping missing service: $service_name"
              fi
            }

            credentials_present() {
              local home_dir="$1"
              sudo test -f "$home_dir/credentials.json.enc" || sudo test -f "$home_dir/credentials.json"
            }

            BACKEND_SERVICE_NAME="$(
              resolve_systemd_service_name "investor-backend" "investment-engine-backend"
            )"
            WORKER_SERVICE_NAME="$(
              resolve_systemd_service_name "investor-celery-worker" "investment-engine-celery-worker"
            )"
            BEAT_SERVICE_NAME="$(
              resolve_systemd_service_name "investor-celery-beat" "investment-engine-celery-beat"
            )"
            FRONTEND_SERVICE_NAME="$(
              resolve_systemd_service_name "investor-frontend" "investment-engine-frontend"
            )"

            echo "==> App root: $APP_ROOT"
            echo "==> App user: $APP_USER"
            echo "==> App home: $APP_HOME"
            echo "==> Backend env: $BACKEND_ENV_FILE"
            echo "==> Frontend env: $FRONTEND_ENV_FILE"
            echo "==> Bullpen bin: $BULLPEN_BIN"
            echo "==> Service credential dir: $CREDENTIAL_DIR"
            echo "==> Bootstrap source dir: $SOURCE_DIR"

            sudo test -x "$BULLPEN_BIN"
            sudo test -f "$BACKEND_ENV_FILE"
            sudo test -f "$FRONTEND_ENV_FILE"
            id "$APP_USER" >/dev/null

            if [[ -d "$SOURCE_DIR" ]]; then
              if credentials_present "$SOURCE_DIR"; then
                echo "==> Source credential store detected"
              else
                echo "Source credential directory exists but does not contain Bullpen credentials: $SOURCE_DIR" >&2
                exit 1
              fi
            elif ! credentials_present "$CREDENTIAL_DIR"; then
              echo "Neither the service Bullpen credential dir nor the bootstrap source contains credentials." >&2
              exit 1
            fi

            echo "==> Preparing service Bullpen credential dir"
            sudo mkdir -p "$CREDENTIAL_DIR"
            if credentials_present "$CREDENTIAL_DIR"; then
              sudo cp -a "$CREDENTIAL_DIR" "$CREDENTIAL_DIR.bak.$(date +%Y%m%d%H%M%S)"
            fi
            if [[ -d "$SOURCE_DIR" && "$SOURCE_DIR" != "$CREDENTIAL_DIR" ]]; then
              sudo rsync -a --delete "$SOURCE_DIR"/ "$CREDENTIAL_DIR"/
            fi
            sudo chown -R "$APP_USER":"$APP_USER" "$CREDENTIAL_DIR"
            sudo find "$CREDENTIAL_DIR" -type d -exec chmod 700 {} \;
            sudo find "$CREDENTIAL_DIR" -type f -exec chmod 600 {} \;
            credentials_present "$CREDENTIAL_DIR"

            echo "==> Updating Bullpen runtime env in backend and frontend env files"
            sudo env \
              BACKEND_ENV_FILE="$BACKEND_ENV_FILE" \
              FRONTEND_ENV_FILE="$FRONTEND_ENV_FILE" \
              BULLPEN_BIN="$BULLPEN_BIN" \
              python3 - <<'PY'
            import os
            from pathlib import Path

            files = [
                Path(os.environ["BACKEND_ENV_FILE"]),
                Path(os.environ["FRONTEND_ENV_FILE"]),
            ]
            updates = {
                "BULLPEN_BIN": os.environ["BULLPEN_BIN"],
            }
            removals = {"BULLPEN_HOME", "BULLPEN_CREDENTIALS_HOME"}

            for path in files:
                lines = path.read_text(encoding="utf-8").splitlines()
                output: list[str] = []
                seen: set[str] = set()

                for line in lines:
                    stripped = line.lstrip()
                    if not stripped or stripped.startswith("#") or "=" not in line:
                        output.append(line)
                        continue

                    key, _ = line.split("=", 1)
                    if key in updates:
                        output.append(f"{key}={updates[key]}")
                        seen.add(key)
                    elif key in removals:
                        continue
                    else:
                        output.append(line)

                for key, value in updates.items():
                    if key not in seen:
                        output.append(f"{key}={value}")

                path.write_text("\n".join(output) + "\n", encoding="utf-8")
            PY

            restart_service_if_present "$BACKEND_SERVICE_NAME"
            restart_service_if_present "$WORKER_SERVICE_NAME"
            restart_service_if_present "$BEAT_SERVICE_NAME"
            restart_service_if_present "$FRONTEND_SERVICE_NAME"

            echo "==> Effective Bullpen env entries"
            sudo bash -lc "
              grep -E '^BULLPEN_BIN=' '$BACKEND_ENV_FILE'
              grep -E '^BULLPEN_BIN=' '$FRONTEND_ENV_FILE'
            "

            echo "==> Verifying Bullpen runtime as the production service user"
            sudo -u "$APP_USER" -H bash -lc "
              export HOME='$APP_HOME'
              unset BULLPEN_HOME
              unset BULLPEN_CREDENTIALS_HOME
              '$BULLPEN_BIN' status
              positions_file=\"\$HOME/credx-bullpen-positions.json\"
              '$BULLPEN_BIN' polymarket positions --output json > \"\$positions_file\"
              python3 -c 'import json, sys; payload = json.load(open(sys.argv[1], encoding=\"utf-8\")); assert isinstance(payload, (dict, list)); print(\"Bullpen positions JSON verified\")' \"\$positions_file\"
            "

            echo "==> Backend readiness"
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --location --max-time 20 http://127.0.0.1:8000/health/ready; then
                echo
                echo "Backend ready check passed on attempt $attempt"
                break
              fi

              if [[ "$attempt" == "30" ]]; then
                echo
                echo "Backend ready check did not pass after 30 attempts." >&2
                sudo systemctl status "$BACKEND_SERVICE_NAME" --no-pager || true
                exit 1
              fi

              echo
              echo "Backend not ready yet (attempt $attempt/30); retrying in 2s"
              sleep 2
            done

            echo "==> Recent backend logs"
            sudo journalctl -u "$BACKEND_SERVICE_NAME" -n 40 --no-pager
