name: Stage18 disposable release rehearsal

on:
  pull_request:
    paths:
      - '.github/workflows/stage18-rehearsal.yml'
      - 'scripts/public_launch/stage18*'
      - 'backend/tests/test_stage18*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage18-rehearsal:
    runs-on: ubuntu-latest
    container: python:3.13-bookworm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stage09
          POSTGRES_PASSWORD: stage09
          POSTGRES_DB: credx_stage09_test
        options: --health-cmd "pg_isready -U stage09 -d credx_stage09_test" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: .:backend
      PYTHONDONTWRITEBYTECODE: '1'
      ENVIRONMENT: test
      AUTH_DISABLED: 'false'
      DATABASE_URL: postgresql+psycopg2://stage09:stage09@postgres:5432/credx_stage09_test
      REDIS_URL: redis://127.0.0.1:1/15
      CREDX_STAGE09_DATABASE_ACK: disposable-docker-only
      CREDX_STAGE18_ACK: synthetic-disposable-only
      CREDX_STAGE17_REDIS_URL: redis://redis:6379/14
      CREDX_STAGE17_REDIS_ACK: disposable-ci-only
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install existing constrained project and disposable test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip install --disable-pip-version-check pytest pytest-asyncio aiosqlite==0.22.1
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates
          install -d /usr/share/postgresql-common/pgdg
          curl --fail --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          printf '%s\n' 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt bookworm-pgdg main' > /etc/apt/sources.list.d/pgdg.list
          apt-get update
          apt-get install -y --no-install-recommends postgresql-client-16
          /usr/lib/postgresql/16/bin/pg_dump --version
          /usr/lib/postgresql/16/bin/pg_restore --version
      - name: Run actual migration, restore, signup and queue rehearsal
        run: >-
          python -m pytest -q --junitxml=/tmp/stage18.xml
          backend/tests/test_stage18_migration_invariants.py
          backend/tests/test_stage18_junit_gate.py
          backend/tests/test_stage18_postgres_tools.py
          backend/tests/test_stage18_signup_clock.py
          backend/tests/test_stage18_asgi_load.py
          backend/tests/test_stage18_migrations_postgres.py
          backend/tests/test_stage18_queue_redis.py
          backend/tests/test_google_signin.py
          backend/tests/test_stage17_closure.py
          backend/tests/test_stage06_modules.py
          backend/tests/test_stage07_lifecycle.py
          backend/tests/test_stage09_connections_postgres.py
          backend/tests/test_stage17_disposable_consumer_services.py
          backend/tests/test_stage17_application_composition_postgres.py
      - name: Reject unexecuted or failed checks and bind exact source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/public_launch/stage18_junit_gate.py /tmp/stage18.xml --source-sha "$SOURCE_SHA" > /tmp/stage18-receipt.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage18-rehearsal-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/stage18.xml
            /tmp/stage18-receipt.json
            /tmp/stage18-asgi-load.json
          if-no-files-found: error
