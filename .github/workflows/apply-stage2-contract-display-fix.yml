name: Apply Stage 2 contract display fix

on:
  push:
    branches:
      - codex/fix-stage2-contract-display-fallback
    paths:
      - scripts/stage2-contract-display.patch

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: codex/fix-stage2-contract-display-fallback

      - name: Apply source patch
        run: |
          set -euo pipefail
          git apply --check scripts/stage2-contract-display.patch
          git apply scripts/stage2-contract-display.patch
          rm scripts/stage2-contract-display.patch
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev --prefer-offline --no-audit --fund=false --loglevel=error

      - name: Run focused Stage 2 display regressions
        working-directory: frontend
        run: |
          node --test \
            tests/bullpen-stage2-contract-display-fallback.test.mjs \
            tests/bullpen-stage2-actionables.test.mjs \
            tests/bullpen-auto-run-progress.test.mjs

      - name: Build production frontend
        working-directory: frontend
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_STANDALONE_BUILD: "true"
          NEXT_PUBLIC_API_URL: https://api.cred-x.in
          NEXT_PUBLIC_FRONTEND_URL: https://cred-x.in
          NEXTAUTH_URL: https://cred-x.in
          NEXTAUTH_SECRET: build-only-stage2-display-validation
          AUTH_TRUST_HOST: "true"
          BACKEND_API_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Commit validated source changes
        env:
          BRANCH_NAME: codex/fix-stage2-contract-display-fallback
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/app/console/bullpen-ai/_components/bullpenAutoRunProgress.ts \
            frontend/app/console/bullpen-ai/_components/BullpenAutoRunScheduleCard.tsx \
            frontend/tests/bullpen-stage2-contract-display-fallback.test.mjs \
            scripts/stage2-contract-display.patch
          git commit \
            -m "Recover Stage 2 actionables in compact monitor" \
            -m "[deploy-scope:frontend]"
          git push origin "HEAD:${BRANCH_NAME}"
