name: Materialize Stage 2 contract display fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - scripts/stage2-contract-display.trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-and-validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/materialize-stage2-contract-display-source-fix'
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout controlled source branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply source patch and remove bootstrap files
        id: prepare
        run: |
          set -euo pipefail
          if [[ ! -f scripts/stage2-contract-display.patch ]]; then
            echo "materialize=false" >> "${GITHUB_OUTPUT}"
            echo "Source patch was already materialized on this pull request branch."
            exit 0
          fi
          git apply --check scripts/stage2-contract-display.patch
          git apply scripts/stage2-contract-display.patch
          rm scripts/stage2-contract-display.patch
          rm -f scripts/stage2-contract-display.trigger
          rm .github/workflows/apply-stage2-contract-display-fix.yml
          git diff --check
          echo "materialize=true" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        if: steps.prepare.outputs.materialize == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.prepare.outputs.materialize == 'true'
        working-directory: frontend
        run: npm ci --include=dev --prefer-offline --no-audit --fund=false --loglevel=error

      - name: Run focused Stage 2 display regressions
        if: steps.prepare.outputs.materialize == 'true'
        working-directory: frontend
        run: |
          node --test \
            tests/bullpen-stage2-contract-display-fallback.test.mjs \
            tests/bullpen-stage2-actionables.test.mjs \
            tests/bullpen-auto-run-progress.test.mjs

      - name: Build production frontend
        if: steps.prepare.outputs.materialize == 'true'
        working-directory: frontend
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_STANDALONE_BUILD: "true"
          NEXT_PUBLIC_API_URL: https://api.cred-x.in
          NEXT_PUBLIC_FRONTEND_URL: https://cred-x.in
          NEXTAUTH_URL: https://cred-x.in
          NEXTAUTH_SECRET: build-only-stage2-display-validation
          AUTH_TRUST_HOST: "true"
          BACKEND_API_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Commit validated source changes to the pull request branch
        if: steps.prepare.outputs.materialize == 'true'
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit \
            -m "Recover Stage 2 actionables in compact monitor" \
            -m "[deploy-scope:frontend]"
          git push origin "HEAD:${BRANCH_NAME}"
