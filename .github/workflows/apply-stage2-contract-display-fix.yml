name: Materialize Stage 2 contract display fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - scripts/stage2-contract-display.trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-and-validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/materialize-stage2-contract-display-source-fix'
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout controlled source branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply source patch and remove bootstrap files
        id: prepare
        run: |
          set -euo pipefail
          if [[ ! -f scripts/stage2-contract-display.patch ]]; then
            echo "materialize=false" >> "${GITHUB_OUTPUT}"
            echo "Source patch was already materialized on this pull request branch."
            exit 0
          fi

          set +e
          git apply --recount --reject --whitespace=nowarn scripts/stage2-contract-display.patch
          apply_status=$?
          set -e
          echo "git apply --reject exit status: ${apply_status}"

          python - <<'PY'
          import re
          from pathlib import Path

          schedule_path = Path(
              "frontend/app/console/bullpen-ai/_components/BullpenAutoRunScheduleCard.tsx"
          )
          schedule = schedule_path.read_text()
          new_block = (
              "\n  const actionableContract = readStageTwoActionableDisplayContract(\n"
              "    llmWorkflowStage.outputs,\n"
              "  );\n"
              "  const authoritativeBuyMarketIds = actionableContract.buyMarketIds;\n"
          )
          if "const authoritativeBuyMarketIds = actionableContract.buyMarketIds;" not in schedule:
              pattern = re.compile(
                  r"\n\s*const authoritativeBuyMarketIds = readStageOutputStringList\(\s*"
                  r"llmWorkflowStage\.outputs\.stage2_actionable_buy_market_ids,\s*"
                  r"\);\s*const hasAuthoritativeActionables\s*=.*?"
                  r"(?=\n\s*const authoritativeBuyRows = authoritativeBuyMarketIds)",
                  re.DOTALL,
              )
              schedule, replacements = pattern.subn(new_block, schedule, count=1)
              if replacements != 1:
                  raise SystemExit(
                      "Stage 2 dialog actionable declaration regex did not match exactly once"
                  )

          schedule = schedule.replace(
              "    rows: hasAuthoritativeActionables ? authoritativeBuyRows : [],",
              "    rows: actionableContract.hasExactMarketIds ? authoritativeBuyRows : [],",
              1,
          )
          if (
              "rows: actionableContract.hasExactMarketIds ? authoritativeBuyRows : []"
              not in schedule
          ):
              raise SystemExit("Stage 2 dialog row-selection anchor was not found")
          schedule_path.write_text(schedule)

          progress = Path(
              "frontend/app/console/bullpen-ai/_components/bullpenAutoRunProgress.ts"
          ).read_text()
          test_path = Path(
              "frontend/tests/bullpen-stage2-contract-display-fallback.test.mjs"
          )
          schedule_markers = (
              "readStageTwoActionableDisplayContract",
              "hasActionableDisplay",
              "canOpenActionablesDialog",
              "stage2_actionable_exit_count",
              "stage2_actionable_buy_count",
              "Persisted Stage 2 action counts are available",
          )
          progress_markers = (
              "readStage2DisplayOutputs",
              "stage2_actionable_contract_display_recovered",
              "invest-plan-counts",
          )
          missing = [marker for marker in schedule_markers if marker not in schedule]
          missing += [marker for marker in progress_markers if marker not in progress]
          if not test_path.is_file():
              missing.append(str(test_path))
          if missing:
              raise SystemExit(
                  "Stage 2 display materialization is incomplete: " + ", ".join(missing)
              )
          PY

          mapfile -t reject_files < <(find frontend -type f -name '*.rej' -print)
          for reject_file in "${reject_files[@]}"; do
            if [[ "${reject_file}" != "frontend/app/console/bullpen-ai/_components/BullpenAutoRunScheduleCard.tsx.rej" ]]; then
              echo "Unexpected rejected hunk file: ${reject_file}" >&2
              cat "${reject_file}" >&2
              exit 1
            fi
          done
          rm -f frontend/app/console/bullpen-ai/_components/BullpenAutoRunScheduleCard.tsx.rej

          rm scripts/stage2-contract-display.patch
          rm -f scripts/stage2-contract-display.trigger
          rm .github/workflows/apply-stage2-contract-display-fix.yml
          git diff --check
          echo "materialize=true" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        if: steps.prepare.outputs.materialize == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.prepare.outputs.materialize == 'true'
        working-directory: frontend
        run: npm ci --include=dev --prefer-offline --no-audit --fund=false --loglevel=error

      - name: Run focused Stage 2 display regressions
        if: steps.prepare.outputs.materialize == 'true'
        working-directory: frontend
        run: |
          node --test \
            tests/bullpen-stage2-contract-display-fallback.test.mjs \
            tests/bullpen-stage2-actionables.test.mjs \
            tests/bullpen-auto-run-progress.test.mjs

      - name: Build production frontend
        if: steps.prepare.outputs.materialize == 'true'
        working-directory: frontend
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_STANDALONE_BUILD: "true"
          NEXT_PUBLIC_API_URL: https://api.cred-x.in
          NEXT_PUBLIC_FRONTEND_URL: https://cred-x.in
          NEXTAUTH_URL: https://cred-x.in
          NEXTAUTH_SECRET: build-only-stage2-display-validation
          AUTH_TRUST_HOST: "true"
          BACKEND_API_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Commit validated source changes to the pull request branch
        if: steps.prepare.outputs.materialize == 'true'
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit \
            -m "Recover Stage 2 actionables in compact monitor" \
            -m "[deploy-scope:frontend]"
          git push origin "HEAD:${BRANCH_NAME}"
