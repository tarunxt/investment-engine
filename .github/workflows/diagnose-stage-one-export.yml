name: Diagnose Stage 1 export
on:
  push:
    branches: [fix/export-diagnostics]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          command_timeout: 2m
          script: |
            set -eu
            sudo systemctl show investor-backend investor-celery-worker investor-celery-auto-live-worker --property=ActiveState,MemoryCurrent
            sudo journalctl -u investor-backend -u investor-celery-worker -u investor-celery-auto-live-worker --since '90 minutes ago' --no-pager | python3 -c 'import sys,re; lines=sys.stdin; patterns=[r"(?:WorkerLostError|SoftTimeLimitExceeded|TimeLimitExceeded|DeadlockDetected|LockNotAvailable)[^\n]*",r"(?:Task app.domains.polymarket_auto_live.tasks.execute_polymarket_auto_live_run|Stage 1 wallet)[^\n]*",r"Task app.domains.polymarket_auto_live.export_tasks.prepare_stage_one_excel[^\\n]*",r"(?:ModuleNotFoundError|ImportError|TimeoutError|ConnectionError|OperationalError|PermissionError|TypeError|AttributeError|RedisError|ValueError):[^\n]*",r"Stage 1 Excel preparation failed",r"Could not queue Stage 1 export",r"Received unregistered task[^\n]*",r"POST /polymarket/auto-live/runs/[^ ]+/stage-one-export[^\n]*"]; [print(m.group(0)[:300]) for line in lines for pattern in patterns if (m:=re.search(pattern,line)) and not re.search(r"password|token|secret|key=|://",m.group(0),re.I)]'
            runtime_dir="$(sudo systemctl show investor-backend -p WorkingDirectory --value)"
            cd "$runtime_dir"
            sudo .venv/bin/python - <<'PY'
            import json, time, os
            from dotenv import dotenv_values
            os.environ.update({k: v for k, v in dotenv_values('/etc/investor/backend.env').items() if v is not None})
            from app.domains.polymarket_auto_live.export_jobs import client, ROOT
            from app.infrastructure.messaging.celery_app import celery
            with client() as cache:
                for key in cache.scan_iter('bullpen:excel:v2:*'):
                    if key.endswith(':lock'):
                        continue
                    data = json.loads(cache.get(key) or '{}')
                    print('Export state:', data.get('status'), 'rows:', data.get('row_count'), 'ttl:', cache.ttl(key))
            for file in ROOT.glob('*.xlsx'):
                print('Prepared workbook bytes:', file.stat().st_size)
            active = celery.control.inspect(timeout=5).active() or {}
            for tasks in active.values():
                for task in tasks:
                    print('Active task:', task.get('name'), 'seconds:', round(time.time() - (task.get('time_start') or time.time())))
            PY
            sudo journalctl -k --since '2 hours ago' --no-pager | python3 -c 'import sys,re; [print(line.strip()) for line in sys.stdin if re.search(r"Out of memory: Killed process|oom-kill:|Memory cgroup out of memory",line)]'
