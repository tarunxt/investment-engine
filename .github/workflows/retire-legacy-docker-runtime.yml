name: Retire Legacy Docker Runtime

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type retire-legacy-docker-runtime to stop and remove the off-path myapp containers and images. Docker volumes are preserved.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-runtime-maintenance
  cancel-in-progress: false

jobs:
  retire:
    name: Retire off-path Docker runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.confirmation == 'retire-legacy-docker-runtime'

    steps:
      - name: Retire legacy Docker containers without deleting volumes
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 900s
          command_timeout: 900s
          script: |
            set -euo pipefail

            LEGACY_PROJECT="myapp"
            REQUIRED_FREE_KB=1048576

            echo "==> Verify the systemd runtime that serves production"
            sudo systemctl is-active --quiet investor-backend
            sudo systemctl is-active --quiet investor-frontend
            curl --fail --silent --show-error --max-time 20 http://127.0.0.1:8000/health/ready >/dev/null
            curl --fail --silent --show-error --max-time 20 http://127.0.0.1:3000/login >/dev/null
            sudo nginx -T 2>/dev/null | grep -F 'proxy_pass http://127.0.0.1:8000;' >/dev/null
            sudo nginx -T 2>/dev/null | grep -F 'proxy_pass http://127.0.0.1:3000;' >/dev/null

            command -v docker >/dev/null
            sudo systemctl is-active --quiet docker

            mapfile -t TARGET_CONTAINER_IDS < <(
              sudo docker ps -aq --filter "label=com.docker.compose.project=$LEGACY_PROJECT"
            )
            if (( ${#TARGET_CONTAINER_IDS[@]} == 0 )); then
              echo "No legacy Docker containers found for compose project $LEGACY_PROJECT."
              exit 0
            fi

            declare -A IMAGE_IDS=()
            for container_id in "${TARGET_CONTAINER_IDS[@]}"; do
              [[ "$container_id" =~ ^[a-f0-9]{64}$ ]] || {
                echo "Unexpected Docker container identifier: $container_id" >&2
                exit 1
              }

              container_name="$(sudo docker inspect --format '{{.Name}}' "$container_id")"
              container_project="$(sudo docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$container_id")"
              port_bindings="$(sudo docker inspect --format '{{json .HostConfig.PortBindings}}' "$container_id")"
              image_id="$(sudo docker inspect --format '{{.Image}}' "$container_id")"

              [[ "$container_name" == "/$LEGACY_PROJECT-"* ]] || {
                echo "Refusing to retire unexpected container name: $container_name" >&2
                exit 1
              }
              [[ "$container_project" == "$LEGACY_PROJECT" ]] || {
                echo "Refusing to retire container outside compose project $LEGACY_PROJECT: $container_name" >&2
                exit 1
              }
              [[ "$port_bindings" == "null" || "$port_bindings" == "{}" ]] || {
                echo "Refusing to retire published container $container_name: $port_bindings" >&2
                exit 1
              }
              [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]] || {
                echo "Unexpected Docker image identifier for $container_name: $image_id" >&2
                exit 1
              }

              IMAGE_IDS["$image_id"]=1
              echo "Validated off-path container: $container_name"
            done

            echo "==> Docker runtime before retirement"
            sudo docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
            sudo docker system df
            df -h /srv/investor

            mapfile -t RUNNING_CONTAINER_IDS < <(
              sudo docker ps -q --filter "label=com.docker.compose.project=$LEGACY_PROJECT"
            )
            if (( ${#RUNNING_CONTAINER_IDS[@]} > 0 )); then
              echo "==> Stop off-path legacy containers"
              sudo docker stop "${RUNNING_CONTAINER_IDS[@]}"
            fi

            echo "==> Remove off-path legacy containers (Docker volumes are not removed)"
            sudo docker rm "${TARGET_CONTAINER_IDS[@]}"

            echo "==> Remove images no longer referenced by any container"
            for image_id in "${!IMAGE_IDS[@]}"; do
              if sudo docker ps -aq --filter "ancestor=$image_id" | grep -q .; then
                echo "Keeping image still referenced by another container: $image_id"
                continue
              fi
              sudo docker image rm "$image_id"
            done

            echo "==> Verify the systemd runtime after retirement"
            sudo systemctl is-active --quiet investor-backend
            sudo systemctl is-active --quiet investor-frontend
            curl --fail --silent --show-error --max-time 20 http://127.0.0.1:8000/health/ready >/dev/null
            curl --fail --silent --show-error --max-time 20 http://127.0.0.1:3000/login >/dev/null
            sudo docker volume ls
            sudo docker system df
            AVAILABLE_KB="$(df -Pk /srv/investor | awk 'NR == 2 {print $4}')"
            echo "Disk space after retirement: ${AVAILABLE_KB} KiB free"
            if (( AVAILABLE_KB < REQUIRED_FREE_KB )); then
              echo "Legacy Docker retirement completed, but less than 1 GiB is free for the frontend build." >&2
              exit 1
            fi
