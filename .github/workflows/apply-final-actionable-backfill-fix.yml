name: Apply Final Actionable Backfill Fix

on:
  push:
    branches:
      - codex/fix-legacy-final-actionable-backfill
    paths:
      - scripts/apply_final_actionable_backfill_reliability_fix.py
      - .github/workflows/apply-final-actionable-backfill-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v7
        with:
          ref: codex/fix-legacy-final-actionable-backfill
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt pytest

      - name: Apply implementation
        run: python scripts/apply_final_actionable_backfill_reliability_fix.py

      - name: Validate backend sources
        run: |
          python -m compileall -q backend/app backend/tests
          PYTHONPATH=backend python -m pytest -q \
            backend/tests/test_final_actionable_history_parser.py \
            backend/tests/test_final_actionable_history_task_contract.py

      - name: Commit implementation
        run: |
          rm -f .github/workflows/apply-final-actionable-backfill-fix.yml
          git config user.name "Tarun Singh"
          git config user.email "37398213+tarunxt@users.noreply.github.com"
          git add -A
          git commit -m "Fix legacy final actionable history backfill"
          git push origin HEAD:codex/fix-legacy-final-actionable-backfill
