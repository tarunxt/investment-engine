name: Upstox safe token-format metadata
on:
  push:
    branches: [ops/upstox-runtime-metadata]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect only safe token format and expiry indicators
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          command_timeout: 3m
          script: |
            set -eu
            sudo -u investor -H bash --noprofile --norc <<'APP_SH'
            set -euo pipefail
            cd /srv/investor/backend
            source /srv/investor/deploy/no-docker/load-env-file.sh
            load_env_file /etc/investor/backend.env
            resolver=/srv/credx-uat/tools/aws-secrets-manager/references/asm-exec
            printf '%s  %s\n' 05a9f8164b63b286bcf88bf4223c95b799e0ecaada45ddcd805567f57b20299f "$resolver" | sha256sum -c --status
            export UPSTOX_ANALYTICS_TOKEN='{{resolve:secretsmanager:arn:aws:secretsmanager:ap-south-1:457945009677:secret:credx/production/upstox-analytics.-yEWL8d:SecretString}}'
            exec /usr/bin/python3 "$resolver" -- /srv/investor/backend/.venv/bin/python - <<'FORMAT_PY'
            import base64, datetime, json, os, time
            value = os.environ['UPSTOX_ANALYTICS_TOKEN']
            stripped = value.strip()
            parts = stripped.split('.')
            result = {'nonempty': bool(value), 'outer_whitespace': value != stripped, 'has_bearer_prefix': stripped.lower().startswith('bearer '), 'looks_like_json': stripped.startswith(('{','[')), 'contains_linebreaks': '\n' in value or '\r' in value, 'jwt_segment_count': len(parts), 'looks_truncated': '...' in value or '\u2026' in value}
            if len(parts) == 3:
                try:
                    payload = json.loads(base64.urlsafe_b64decode(parts[1] + '=' * (-len(parts[1]) % 4)))
                    expiry = payload.get('exp')
                    result['jwt_has_numeric_expiry'] = isinstance(expiry, (int,float))
                    if isinstance(expiry, (int,float)):
                        result['jwt_expired'] = expiry <= time.time()
                        result['jwt_expiry_utc'] = datetime.datetime.fromtimestamp(expiry,datetime.timezone.utc).isoformat()
                except Exception:
                    result['jwt_payload_parseable'] = False
            print('UPSTOX_TOKEN_FORMAT_METADATA=' + json.dumps(result, sort_keys=True))
            FORMAT_PY
            APP_SH
