name: Corrected bounded Upstox quote check
on:
  push:
    branches: [ops/upstox-runtime-metadata]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: One corrected quote through deployed production request builder
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          command_timeout: 3m
          script: |
            set -eu
            test "$(sudo -u investor -H git -C /srv/investor rev-parse HEAD)" = bca0d2a8e360dc23b12a8c75ff5c2d100ef1e6f3
            sudo -u investor -H bash --noprofile --norc <<'APP_SH'
            set -euo pipefail
            cd /srv/investor/backend
            source /srv/investor/deploy/no-docker/load-env-file.sh
            load_env_file /etc/investor/backend.env
            resolver=/srv/credx-uat/tools/aws-secrets-manager/references/asm-exec
            printf '%s  %s\n' 05a9f8164b63b286bcf88bf4223c95b799e0ecaada45ddcd805567f57b20299f "$resolver" | sha256sum -c --status
            export UPSTOX_ANALYTICS_TOKEN='{{resolve:secretsmanager:arn:aws:secretsmanager:ap-south-1:457945009677:secret:credx/production/upstox-analytics.-yEWL8d:SecretString}}'
            exec /usr/bin/python3 "$resolver" -- /srv/investor/backend/.venv/bin/python - <<'DIAGNOSTIC_PY'
            import asyncio, json, os
            from datetime import datetime, timezone
            import httpx
            from scripts import diagnose_upstox_quote as diagnostic
            from app.domains.zerodha.upstox_quotes import normalize_quotes

            instrument = 'NSE_EQ|INE848E01016'
            original = diagnostic.sanitized_result
            def checked_result(status, headers, raw, credential, key):
                result = original(status, headers, raw, credential, key)
                result['genuine_quote'] = False
                if status == 200:
                    try:
                        payload = json.loads(raw)
                        quotes = normalize_quotes(payload.get('data'), {'NSE:NHPC': instrument}, datetime.now(timezone.utc)) if isinstance(payload, dict) and payload.get('status') == 'success' else []
                        if len(quotes) == 1:
                            result['genuine_quote'] = True
                            result['quote'] = quotes[0]
                    except (ValueError, TypeError, OverflowError):
                        pass
                return result
            diagnostic.sanitized_result = checked_result
            async def main():
                started = datetime.now(timezone.utc).isoformat()
                async with asyncio.timeout(15):
                    async with httpx.AsyncClient(timeout=6, follow_redirects=False) as client:
                        result = await diagnostic.diagnose(client, instrument, os.environ['UPSTOX_ANALYTICS_TOKEN'])
                result['attempt_started_at'] = started
                result['attempt_finished_at'] = datetime.now(timezone.utc).isoformat()
                print('UPSTOX_CORRECTED_QUOTE_DIAGNOSTIC=' + json.dumps(result, sort_keys=True))
            asyncio.run(main())
            DIAGNOSTIC_PY
            APP_SH
