name: Upstox policy metadata (read only)
on:
  push:
    branches: [ops/upstox-runtime-metadata]
permissions:
  contents: read
jobs:
  owner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect only the new inline policy action and resource
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          command_timeout: 2m
          script: |
            set -eu
            sudo -u investor -H bash --noprofile --norc <<'APP_SH'
            set -euo pipefail
            cd /srv/investor/backend
            source /srv/investor/deploy/no-docker/load-env-file.sh
            load_env_file /etc/investor/backend.env
            .venv/bin/python - <<'POLICY_PY'
            import json, logging
            logging.disable(logging.CRITICAL)
            result = {'role': 'CredXCostDriverRole', 'policy': 'CredXUpstoxReadOnly'}
            try:
                import boto3
                from botocore.config import Config
                response = boto3.client('iam', config=Config(connect_timeout=3, read_timeout=5, retries={'max_attempts':0})).get_role_policy(RoleName=result['role'], PolicyName=result['policy'])
                document = response['PolicyDocument']
                statements = document.get('Statement', [])
                if isinstance(statements, dict): statements = [statements]
                result['statements'] = [{'Effect': statement.get('Effect'), 'Action': statement.get('Action'), 'Resource': statement.get('Resource'), 'Condition': statement.get('Condition')} for statement in statements]
            except Exception as error:
                result['error_type'] = type(error).__name__
                result['error_code'] = getattr(error, 'response', {}).get('Error', {}).get('Code')
            print('UPSTOX_IAM_POLICY_METADATA=' + json.dumps(result, sort_keys=True))
            POLICY_PY
            APP_SH
