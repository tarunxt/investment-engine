name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      scope:
        description: Deployment scope
        required: true
        default: auto
        type: choice
        options:
          - auto
          - frontend
          - backend
          - full

permissions:
  actions: read
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  FRONTEND_ARTIFACT_NAME: frontend-runtime-${{ github.sha }}
  FRONTEND_ARTIFACT_FILE: frontend-runtime-${{ github.sha }}.tar.gz

jobs:
  detect-changes:
    name: Detect deployment scope
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve deployment scope
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SCOPE: ${{ github.event.inputs.scope }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "Manual production deployments must run from the main branch." >&2
              exit 1
            fi
            case "${REQUESTED_SCOPE:-auto}" in
              frontend) scope="frontend-only" ;;
              backend) scope="backend-only" ;;
              auto|full) scope="full-stack" ;;
              *)
                echo "Unsupported manual deployment scope: ${REQUESTED_SCOPE}" >&2
                exit 1
                ;;
              esac

            if [[ "$scope" != "full-stack" ]]; then
              current_push_conclusion=""
              if current_push_conclusion="$(
                gh api \
                  "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20" \
                  --jq '.workflow_runs | map(select(.event == "push")) | first | .conclusion // ""'
              )"; then
                echo "Current main push deployment conclusion: ${current_push_conclusion:-<missing>}"
              else
                echo "Unable to verify the current main push deployment." >&2
              fi
              if [[ "$current_push_conclusion" != "success" ]]; then
                echo "Broadening manual scope to full-stack because the current main SHA has no successful push deployment."
                scope="full-stack"
              fi
            fi
          else
            changed_paths="${RUNNER_TEMP}/deploy-changed-paths"
            if [[ -z "${BEFORE_SHA:-}" || "${BEFORE_SHA}" =~ ^0+$ ]]; then
              echo "No reliable previous push SHA; forcing a recovery-safe full-stack deployment."
              scope="full-stack"
            else
              previous_conclusion=""
              if previous_conclusion="$(
                gh api \
                  "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?head_sha=${BEFORE_SHA}&per_page=20" \
                  --jq '.workflow_runs | map(select(.event == "push")) | first | .conclusion // ""'
              )"; then
                echo "Previous push deployment conclusion: ${previous_conclusion:-<missing>}"
              else
                echo "Unable to verify the previous push deployment; forcing full-stack recovery." >&2
              fi

              if [[ "$previous_conclusion" != "success" ]]; then
                scope="full-stack"
              else
                git diff --no-renames --name-only -z "${BEFORE_SHA}" "${GITHUB_SHA}" >"${changed_paths}"
                scope="$(node scripts/detect-deploy-scope.mjs --null --file "${changed_paths}")"
              fi
            fi

            directive="$(
              git log -1 --pretty=%B |
                sed -nE 's/^\[deploy-scope:(frontend|backend|full)\]$/\1/p' |
                tail -n 1
            )"
            if [[ -n "$directive" ]]; then
              case "$directive" in
                frontend) requested_scope="frontend-only" ;;
                backend) requested_scope="backend-only" ;;
                full) requested_scope="full-stack" ;;
              esac
              scope="$(
                node scripts/detect-deploy-scope.mjs \
                  --combine "$scope" "$requested_scope"
              )"
              echo "Explicit release scope '$directive' safely combined with detected changes."
            fi
          fi

          echo "scope=${scope}" >>"${GITHUB_OUTPUT}"
          echo "Deployment scope: ${scope}"

  build-frontend:
    name: Build production frontend artifact
    needs: detect-changes
    if: contains(fromJSON('["frontend-only","full-stack"]'), needs.detect-changes.outputs.scope)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    outputs:
      checkout_seconds: ${{ steps.checkout-timing.outputs.seconds }}
      dependency_seconds: ${{ steps.dependency-timing.outputs.seconds }}
      build_seconds: ${{ steps.build.outputs.seconds }}
      package_seconds: ${{ steps.package.outputs.seconds }}
      upload_seconds: ${{ steps.upload-timing.outputs.seconds }}

    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_STANDALONE_BUILD: "true"
      NEXT_PUBLIC_API_URL: ${{ vars.PROD_NEXT_PUBLIC_API_URL || 'https://api.cred-x.in' }}
      NEXT_PUBLIC_FRONTEND_URL: ${{ vars.PROD_NEXT_PUBLIC_FRONTEND_URL || 'https://cred-x.in' }}
      NEXT_PUBLIC_BRAND_PREFIX: ${{ vars.PROD_NEXT_PUBLIC_BRAND_PREFIX || 'Cred-X' }}
      NEXT_PUBLIC_BRAND_ACRONYM: ${{ vars.PROD_NEXT_PUBLIC_BRAND_ACRONYM || 'TIE' }}
      NEXT_PUBLIC_BRAND_EXPANSION: ${{ vars.PROD_NEXT_PUBLIC_BRAND_EXPANSION || 'Tarun''s Investment Engine' }}
      NEXT_PUBLIC_DISABLE_AUTH: ${{ vars.PROD_NEXT_PUBLIC_DISABLE_AUTH || 'false' }}
      NEXT_PUBLIC_DISABLE_API_PROXY: ${{ vars.PROD_NEXT_PUBLIC_DISABLE_API_PROXY || 'false' }}
      NEXT_PUBLIC_API_DEBUG: ${{ vars.PROD_NEXT_PUBLIC_API_DEBUG || 'false' }}
      NEXTAUTH_URL: ${{ vars.PROD_NEXTAUTH_URL || 'https://cred-x.in' }}
      NEXTAUTH_SECRET: build-only-runtime-secret-is-loaded-on-ec2
      AUTH_TRUST_HOST: "true"
      BACKEND_API_URL: http://127.0.0.1:8000

    steps:
      - name: Start checkout timer
        run: echo "CHECKOUT_STARTED_AT=$(date +%s)" >>"${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Record checkout duration
        id: checkout-timing
        run: echo "seconds=$(( $(date +%s) - CHECKOUT_STARTED_AT ))" >>"${GITHUB_OUTPUT}"

      - name: Start dependency restore timer
        run: echo "DEPENDENCIES_STARTED_AT=$(date +%s)" >>"${GITHUB_ENV}"

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore reusable Next.js Webpack cache
        uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: >-
            ${{ runner.os }}-node22-next-webpack-${{
              hashFiles('frontend/package-lock.json')
            }}-${{
              hashFiles('frontend/app/**', 'frontend/components/**', 'frontend/hooks/**',
              'frontend/lib/**', 'frontend/providers/**', 'frontend/services/**',
              'frontend/types/**', 'frontend/next.config.ts', 'frontend/tsconfig.json')
            }}
          restore-keys: |
            ${{ runner.os }}-node22-next-webpack-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev --prefer-offline --no-audit --fund=false --loglevel=error

      - name: Record dependency restore duration
        id: dependency-timing
        run: echo "seconds=$(( $(date +%s) - DEPENDENCIES_STARTED_AT ))" >>"${GITHUB_OUTPUT}"

      - name: Log build runner resources
        run: |
          echo "==> CPU"
          nproc
          echo "==> Memory"
          free -h
          echo "==> Swap"
          swapon --show || true
          echo "==> Disk"
          df -h "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"

      - name: Stamp production build fingerprint
        run: |
          build_timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/stamp-frontend-build.mjs \
            frontend/lib/generatedBuildInfo.ts \
            "${GITHUB_SHA}" \
            "${build_timestamp}"
          echo "BUILD_TIMESTAMP=${build_timestamp}" >>"${GITHUB_ENV}"

      - name: Build production frontend with Webpack
        id: build
        working-directory: frontend
        run: |
          set -o pipefail
          started_at="$(date +%s)"
          set +e
          /usr/bin/time -v -o "${RUNNER_TEMP}/frontend-webpack-resources.txt" \
            npm run build -- --webpack 2>&1 | tee "${RUNNER_TEMP}/frontend-webpack-build.log"
          build_status="${PIPESTATUS[0]}"
          set -e
          echo "seconds=$(( $(date +%s) - started_at ))" >>"${GITHUB_OUTPUT}"
          echo "==> Frontend build resource usage"
          cat "${RUNNER_TEMP}/frontend-webpack-resources.txt"
          exit "$build_status"

      - name: Package standalone frontend runtime
        id: package
        run: |
          started_at="$(date +%s)"
          deploy/no-docker/package-frontend-artifact.sh \
            frontend/.next \
            "${RUNNER_TEMP}/${FRONTEND_ARTIFACT_FILE}" \
            "${GITHUB_SHA}" \
            "${BUILD_TIMESTAMP}" \
            webpack
          echo "seconds=$(( $(date +%s) - started_at ))" >>"${GITHUB_OUTPUT}"

      - name: Verify packaged frontend runtime before upload
        run: |
          mkdir "${RUNNER_TEMP}/production-frontend-runtime"
          tar -xzf "${RUNNER_TEMP}/${FRONTEND_ARTIFACT_FILE}" \
            -C "${RUNNER_TEMP}/production-frontend-runtime"
          node scripts/verify-frontend-artifact-runtime.mjs \
            "${RUNNER_TEMP}/production-frontend-runtime" \
            "${GITHUB_SHA}"

      - name: Start artifact upload timer
        if: success()
        run: echo "UPLOAD_STARTED_AT=$(date +%s)" >>"${GITHUB_ENV}"

      - name: Upload production frontend artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FRONTEND_ARTIFACT_NAME }}
          path: |
            ${{ runner.temp }}/${{ env.FRONTEND_ARTIFACT_FILE }}
            ${{ runner.temp }}/${{ env.FRONTEND_ARTIFACT_FILE }}.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Record artifact upload duration
        id: upload-timing
        if: always() && env.UPLOAD_STARTED_AT != ''
        run: echo "seconds=$(( $(date +%s) - UPLOAD_STARTED_AT ))" >>"${GITHUB_OUTPUT}"

      - name: Frontend build timing summary
        if: always()
        run: |
          {
            echo "### Production frontend build"
            echo
            echo "| Phase | Duration |"
            echo "| --- | ---: |"
            echo "| Checkout | ${{ steps.checkout-timing.outputs.seconds || 'n/a' }}s |"
            echo "| Dependency/cache restore + npm ci | ${{ steps.dependency-timing.outputs.seconds || 'n/a' }}s |"
            echo "| Webpack production build | ${{ steps.build.outputs.seconds || 'n/a' }}s |"
            echo "| Artifact packaging | ${{ steps.package.outputs.seconds || 'n/a' }}s |"
            echo "| Artifact upload | ${{ steps.upload-timing.outputs.seconds || 'n/a' }}s |"
            echo
            echo "Production remains on Webpack; Turbopack is benchmarked separately in PR checks."
          } >>"${GITHUB_STEP_SUMMARY}"

  deploy-production:
    name: Deploy ${{ needs.detect-changes.outputs.scope }}
    needs:
      - detect-changes
      - build-frontend
    if: >-
      !cancelled() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.scope != 'none' &&
      (
        needs.detect-changes.outputs.scope == 'backend-only' ||
        needs.build-frontend.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Start artifact download timer
        if: needs.detect-changes.outputs.scope != 'backend-only'
        run: echo "DOWNLOAD_STARTED_AT=$(date +%s)" >>"${GITHUB_ENV}"

      - name: Download production frontend artifact
        if: needs.detect-changes.outputs.scope != 'backend-only'
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.FRONTEND_ARTIFACT_NAME }}
          path: artifact

      - name: Record artifact download duration
        id: download-timing
        if: always() && env.DOWNLOAD_STARTED_AT != ''
        run: echo "seconds=$(( $(date +%s) - DOWNLOAD_STARTED_AT ))" >>"${GITHUB_OUTPUT}"

      - name: Start artifact transfer timer
        if: needs.detect-changes.outputs.scope != 'backend-only'
        run: echo "TRANSFER_STARTED_AT=$(date +%s)" >>"${GITHUB_ENV}"

      - name: Transfer frontend artifact to EC2
        if: needs.detect-changes.outputs.scope != 'backend-only'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          source: artifact/${{ env.FRONTEND_ARTIFACT_FILE }},artifact/${{ env.FRONTEND_ARTIFACT_FILE }}.sha256
          target: /tmp/investor-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          strip_components: 1
          timeout: 10m
          command_timeout: 10m

      - name: Record artifact transfer duration
        id: transfer-timing
        if: always() && env.TRANSFER_STARTED_AT != ''
        run: echo "seconds=$(( $(date +%s) - TRANSFER_STARTED_AT ))" >>"${GITHUB_OUTPUT}"

      - name: Start remote deployment timer
        if: success()
        run: echo "REMOTE_DEPLOY_STARTED_AT=$(date +%s)" >>"${GITHUB_ENV}"

      - name: Deploy exact commit via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          DEPLOY_SCOPE: ${{ needs.detect-changes.outputs.scope }}
          REMOTE_ARTIFACT_DIR: /tmp/investor-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          REMOTE_ARTIFACT_FILE: ${{ env.FRONTEND_ARTIFACT_FILE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          envs: DEPLOY_COMMIT_SHA,DEPLOY_SCOPE,REMOTE_ARTIFACT_DIR,REMOTE_ARTIFACT_FILE
          timeout: 3600s
          command_timeout: 3600s
          script: |
            set -euo pipefail
            deploy_started_at="$(date +%s)"
            APP_ROOT="${{ vars.EC2_APP_PATH || '/srv/investment-engine' }}"
            LEGACY_APP_ROOT="/srv/investor"
            APP_USER="${{ vars.EC2_APP_USER || 'investment-engine' }}"
            LEGACY_APP_USER="investor"
            FRONTEND_ENV_FILE="/etc/investor/frontend.env"
            DEPLOY_LOCK_FILE="/run/investor-production-deploy.lock"
            remote_artifact=""

            cleanup_remote_artifact() {
              if [[ -n "${REMOTE_ARTIFACT_DIR:-}" && "$REMOTE_ARTIFACT_DIR" == /tmp/investor-deploy-* ]]; then
                rm -rf -- "$REMOTE_ARTIFACT_DIR"
              fi
            }
            trap cleanup_remote_artifact EXIT

            command -v flock >/dev/null
            sudo touch "$DEPLOY_LOCK_FILE"
            sudo chown "$(id -u):$(id -g)" "$DEPLOY_LOCK_FILE"
            exec 9>"$DEPLOY_LOCK_FILE"
            echo "==> Waiting for the production host deployment lock"
            if ! flock -w 1800 9; then
              echo "Timed out waiting for the production host deployment lock." >&2
              exit 1
            fi

            if [[ ! -d "$APP_ROOT" && -d "$LEGACY_APP_ROOT" ]]; then
              APP_ROOT="$LEGACY_APP_ROOT"
            fi
            if ! id "$APP_USER" >/dev/null 2>&1 && id "$LEGACY_APP_USER" >/dev/null 2>&1; then
              APP_USER="$LEGACY_APP_USER"
            fi

            echo "==> Production app root: $APP_ROOT"
            echo "==> Production app user: $APP_USER"
            echo "==> Resolved deployment scope: $DEPLOY_SCOPE"
            command -v git >/dev/null
            sudo test -d "$APP_ROOT/.git"
            id "$APP_USER" >/dev/null

            case "$DEPLOY_SCOPE" in
              frontend-only)
                MIN_FREE_KB=1048576
                REQUIRED_FREE_KB=524288
                ;;
              backend-only)
                MIN_FREE_KB=1048576
                REQUIRED_FREE_KB=262144
                ;;
              full-stack)
                MIN_FREE_KB=2097152
                REQUIRED_FREE_KB=1048576
                ;;
              *)
                echo "Invalid resolved deployment scope: $DEPLOY_SCOPE" >&2
                exit 1
                ;;
            esac

            AVAILABLE_KB="$(df -Pk "$APP_ROOT" | awk 'NR == 2 {print $4}')"
            if (( AVAILABLE_KB < MIN_FREE_KB )); then
              echo "==> Low disk space (${AVAILABLE_KB} KiB); pruning bounded caches without touching the active frontend slot"
              if [[ "$DEPLOY_SCOPE" != "frontend-only" ]]; then
                sudo journalctl --vacuum-time=3d --vacuum-size=64M || true
                sudo apt-get clean || true
                sudo find /var/cache/apt/archives -maxdepth 1 -type f -name '*.deb' -delete || true
                if [[ -x "$APP_ROOT/backend/.venv/bin/python" ]]; then
                  sudo -u "$APP_USER" -H "$APP_ROOT/backend/.venv/bin/python" -m pip cache purge || true
                fi
              fi
              if [[ "$DEPLOY_SCOPE" != "backend-only" && -d "$APP_ROOT/frontend" ]]; then
                active_build=".next"
                if sudo test -f "$APP_ROOT/frontend/.next-active-dir"; then
                  active_build="$(sudo -u "$APP_USER" -H tr -d '\r\n' <"$APP_ROOT/frontend/.next-active-dir")"
                fi
                case "$active_build" in
                  .next) inactive_build="$APP_ROOT/frontend/.next-candidate" ;;
                  .next-candidate) inactive_build="$APP_ROOT/frontend/.next" ;;
                  *)
                    echo "Invalid active frontend slot: ${active_build:-<empty>}" >&2
                    exit 1
                    ;;
                esac
                sudo -u "$APP_USER" -H rm -rf -- "$inactive_build"
              fi
              AVAILABLE_KB="$(df -Pk "$APP_ROOT" | awk 'NR == 2 {print $4}')"
              echo "==> Disk space after bounded cleanup: ${AVAILABLE_KB} KiB"
            fi
            if (( AVAILABLE_KB < REQUIRED_FREE_KB )); then
              echo "Deployment requires ${REQUIRED_FREE_KB} KiB free." >&2
              df -h "$APP_ROOT" >&2
              exit 1
            fi

            source_sync_started_at="$(date +%s)"
            sudo -u "$APP_USER" -H rm -f "$APP_ROOT/.git/index.lock"
            sudo -u "$APP_USER" -H git -C "$APP_ROOT" fetch origin main
            sudo -u "$APP_USER" -H git -C "$APP_ROOT" cat-file -e "${DEPLOY_COMMIT_SHA}^{commit}"
            sudo -u "$APP_USER" -H git -C "$APP_ROOT" reset --hard "$DEPLOY_COMMIT_SHA"
            actual_sha="$(sudo -u "$APP_USER" -H git -C "$APP_ROOT" rev-parse HEAD)"
            if [[ "$actual_sha" != "$DEPLOY_COMMIT_SHA" ]]; then
              echo "EC2 checkout mismatch: expected=$DEPLOY_COMMIT_SHA actual=$actual_sha" >&2
              exit 1
            fi
            echo "==> Exact source sync: $(( $(date +%s) - source_sync_started_at ))s"

            if [[ "$DEPLOY_SCOPE" != "backend-only" ]]; then
              remote_artifact="$REMOTE_ARTIFACT_DIR/$REMOTE_ARTIFACT_FILE"
              test -f "$remote_artifact"
              test -f "$remote_artifact.sha256"
              chmod 0755 "$REMOTE_ARTIFACT_DIR"
              chmod 0644 "$remote_artifact" "$remote_artifact.sha256"
            fi

            if [[ "$DEPLOY_SCOPE" != "frontend-only" ]] && command -v pg_isready >/dev/null 2>&1 && ! pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1; then
              echo "==> PostgreSQL is not ready; restarting it after disk recovery"
              sudo systemctl restart postgresql
              for attempt in $(seq 1 30); do
                pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1 && break
                sleep 1
              done
              pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1
            fi

            SKIP_GIT_SYNC=true \
            APP_ROOT="$APP_ROOT" \
            APP_USER="$APP_USER" \
            FRONTEND_ARTIFACT="$remote_artifact" \
            EXPECTED_FRONTEND_SHA="$DEPLOY_COMMIT_SHA" \
              bash "$APP_ROOT/deploy/no-docker/redeploy.sh" "$DEPLOY_SCOPE"

            if [[ "$DEPLOY_SCOPE" == "full-stack" ]]; then
              echo "==> Install/update Bullpen wallet healthcheck timer"
              APP_ROOT="$APP_ROOT" \
                APP_USER="$APP_USER" \
                FRONTEND_ENV_FILE="$FRONTEND_ENV_FILE" \
                bash "$APP_ROOT/deploy/no-docker/install-bullpen-healthcheck.sh"
            fi

            echo "==> EC2 deployment total: $(( $(date +%s) - deploy_started_at ))s"

      - name: Record remote deployment duration
        id: remote-timing
        if: always() && env.REMOTE_DEPLOY_STARTED_AT != ''
        run: echo "seconds=$(( $(date +%s) - REMOTE_DEPLOY_STARTED_AT ))" >>"${GITHUB_OUTPUT}"

      - name: Deployment timing summary
        if: always()
        run: |
          {
            echo "### Production deployment"
            echo
            echo "**Scope:** \`${{ needs.detect-changes.outputs.scope }}\`"
            echo
            echo "| Phase | Duration |"
            echo "| --- | ---: |"
            echo "| Checkout | ${{ needs.build-frontend.outputs.checkout_seconds || 'n/a' }}s |"
            echo "| Dependency/cache restore + npm ci | ${{ needs.build-frontend.outputs.dependency_seconds || 'n/a' }}s |"
            echo "| Frontend build | ${{ needs.build-frontend.outputs.build_seconds || 'n/a' }}s |"
            echo "| Artifact packaging | ${{ needs.build-frontend.outputs.package_seconds || 'n/a' }}s |"
            echo "| Artifact upload | ${{ needs.build-frontend.outputs.upload_seconds || 'n/a' }}s |"
            echo "| Artifact download | ${{ steps.download-timing.outputs.seconds || 'n/a' }}s |"
            echo "| Artifact transfer | ${{ steps.transfer-timing.outputs.seconds || 'n/a' }}s |"
            echo "| Remote source sync + deploy | ${{ steps.remote-timing.outputs.seconds || 'n/a' }}s |"
            echo
            echo "EC2 extraction, restart, fingerprint, and smoke-test durations are printed in the SSH step's final timing table."
          } >>"${GITHUB_STEP_SUMMARY}"
