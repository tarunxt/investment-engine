name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      scope:
        description: Deployment scope
        required: true
        default: auto
        type: choice
        options:
          - auto
          - backend
          - full

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      full: ${{ steps.filter.outputs.full }}

    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect deploy scope
        if: github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            full:
              - 'frontend/**'
              - '.env.prod.example'
              - '.github/workflows/deploy.yml'
              - 'deploy/no-docker/**'
              - 'scripts/**'

  deploy-backend:
    name: Deploy backend
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.scope == 'backend') ||
      (github.event_name == 'push' &&
        needs.detect-changes.outputs.backend == 'true' &&
        needs.detect-changes.outputs.full != 'true')

    steps:
      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 1800s
          command_timeout: 1800s
          script: |
            set -euo pipefail
            APP_ROOT="${{ vars.EC2_APP_PATH || '/srv/investment-engine' }}"
            LEGACY_APP_ROOT="/srv/investor"
            APP_USER="${{ vars.EC2_APP_USER || 'investment-engine' }}"
            LEGACY_APP_USER="investor"

            if [[ ! -d "$APP_ROOT" && -d "$LEGACY_APP_ROOT" ]]; then
              APP_ROOT="$LEGACY_APP_ROOT"
            fi

            if ! id "$APP_USER" >/dev/null 2>&1 && id "$LEGACY_APP_USER" >/dev/null 2>&1; then
              APP_USER="$LEGACY_APP_USER"
            fi

            echo "==> Production app root: $APP_ROOT"
            echo "==> Production app user: $APP_USER"
            command -v git >/dev/null
            sudo test -d "$APP_ROOT/.git"
            id "$APP_USER" >/dev/null

            MIN_FREE_KB=1048576
            REQUIRED_FREE_KB=262144
            AVAILABLE_KB="$(df -Pk "$APP_ROOT" | awk 'NR == 2 {print $4}')"
            if (( AVAILABLE_KB < MIN_FREE_KB )); then
              echo "==> Low disk space detected (${AVAILABLE_KB} KiB free); pruning bounded system caches"
              sudo journalctl --vacuum-time=3d --vacuum-size=64M || true
              sudo apt-get clean || true
              sudo rm -rf /var/cache/apt/archives/*.deb /tmp/* /var/tmp/* || true
              if [[ -x "$APP_ROOT/backend/.venv/bin/python" ]]; then
                sudo -u "$APP_USER" -H "$APP_ROOT/backend/.venv/bin/python" -m pip cache purge || true
              fi
              AVAILABLE_KB="$(df -Pk "$APP_ROOT" | awk 'NR == 2 {print $4}')"
              echo "==> Disk space after cache pruning: ${AVAILABLE_KB} KiB free"
            fi
            if (( AVAILABLE_KB < REQUIRED_FREE_KB )); then
              echo "Production backend deploy requires at least 256 MiB free after bounded cache cleanup." >&2
              df -h "$APP_ROOT" >&2
              exit 1
            fi
            sudo -u "$APP_USER" -H rm -f "$APP_ROOT/.git/index.lock"

            echo "==> Sync GitHub main to EC2"
            sudo -u "$APP_USER" -H git -C "$APP_ROOT" fetch origin main
            sudo -u "$APP_USER" -H git -C "$APP_ROOT" reset --hard origin/main

            if command -v pg_isready >/dev/null 2>&1 && ! pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1; then
              echo "==> PostgreSQL is not ready; restarting it after disk recovery"
              sudo systemctl restart postgresql
              for attempt in $(seq 1 30); do
                if pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1; then
                  break
                fi
                sleep 1
              done
              if ! pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1; then
                sudo systemctl status postgresql --no-pager --full >&2 || true
                exit 1
              fi
              echo "==> PostgreSQL is ready"
            fi

            echo "==> Run backend deploy"
            SKIP_GIT_SYNC=true APP_ROOT="$APP_ROOT" APP_USER="$APP_USER" bash "$APP_ROOT/deploy/no-docker/redeploy.sh" backend

  deploy-full:
    name: Deploy full stack
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.scope == 'auto' || github.event.inputs.scope == 'full')) ||
      (github.event_name == 'push' && needs.detect-changes.outputs.full == 'true')

    steps:
      - name: Deploy full stack via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 1800s
          command_timeout: 1800s
          script: |
            set -euo pipefail
            APP_ROOT="${{ vars.EC2_APP_PATH || '/srv/investment-engine' }}"
            LEGACY_APP_ROOT="/srv/investor"
            APP_USER="${{ vars.EC2_APP_USER || 'investment-engine' }}"
            LEGACY_APP_USER="investor"
            FRONTEND_ENV_FILE="/etc/investor/frontend.env"

            if [[ ! -d "$APP_ROOT" && -d "$LEGACY_APP_ROOT" ]]; then
              APP_ROOT="$LEGACY_APP_ROOT"
            fi

            if ! id "$APP_USER" >/dev/null 2>&1 && id "$LEGACY_APP_USER" >/dev/null 2>&1; then
              APP_USER="$LEGACY_APP_USER"
            fi

            GENERATED_BUILD_INFO_FILE="$APP_ROOT/frontend/lib/generatedBuildInfo.ts"

            echo "==> Production app root: $APP_ROOT"
            echo "==> Production app user: $APP_USER"
            command -v git >/dev/null
            sudo test -d "$APP_ROOT/.git"
            id "$APP_USER" >/dev/null

            # Never remove the active Next runtime during capacity recovery:
            # the running server can otherwise keep returning HTML that points
            # to assets which no longer exist. The deploy script selects and
            # cleans an inactive build slot only after reading its pointer.
            MIN_FREE_KB=3145728
            REQUIRED_FREE_KB=1048576
            AVAILABLE_KB="$(df -Pk "$APP_ROOT" | awk 'NR == 2 {print $4}')"
            if (( AVAILABLE_KB < MIN_FREE_KB )); then
              echo "==> Low disk space detected (${AVAILABLE_KB} KiB free); pruning bounded system caches and abandoned frontend candidates"
              sudo journalctl --vacuum-time=3d --vacuum-size=64M || true
              sudo apt-get clean || true
              sudo rm -rf \
                /var/cache/apt/archives/*.deb \
                /var/lib/apt/lists/* \
                /var/cache/man/* \
                /var/crash/* \
                /var/lib/systemd/coredump/* \
                /tmp/* \
                /var/tmp/* || true
              if [[ -x "$APP_ROOT/backend/.venv/bin/python" ]]; then
                sudo -u "$APP_USER" -H "$APP_ROOT/backend/.venv/bin/python" -m pip cache purge || true
              fi
              if [[ -d "$APP_ROOT/frontend" ]]; then
                ACTIVE_FRONTEND_BUILD=".next"
                ACTIVE_FRONTEND_POINTER="$APP_ROOT/frontend/.next-active-dir"
                if sudo test -f "$ACTIVE_FRONTEND_POINTER"; then
                  ACTIVE_FRONTEND_BUILD="$(
                    sudo -u "$APP_USER" -H cat "$ACTIVE_FRONTEND_POINTER" |
                      tr -d '\r\n'
                  )"
                fi
                case "$ACTIVE_FRONTEND_BUILD" in
                  .next)
                    INACTIVE_FRONTEND_BUILD="$APP_ROOT/frontend/.next-candidate"
                    ;;
                  .next-candidate)
                    INACTIVE_FRONTEND_BUILD="$APP_ROOT/frontend/.next"
                    ;;
                  *)
                    echo "Invalid active Next build directory: ${ACTIVE_FRONTEND_BUILD:-<empty>}" >&2
                    exit 1
                    ;;
                esac
                if sudo test -d "$INACTIVE_FRONTEND_BUILD"; then
                  INACTIVE_FRONTEND_BUILD_KB="$(
                    sudo du -sk "$INACTIVE_FRONTEND_BUILD" | awk '{print $1}'
                  )"
                  echo "==> Removing inactive Next build slot ($INACTIVE_FRONTEND_BUILD_KB KiB): $INACTIVE_FRONTEND_BUILD"
                  sudo -u "$APP_USER" -H rm -rf -- "$INACTIVE_FRONTEND_BUILD"
                fi
                sudo -u "$APP_USER" -H rm -rf \
                  "$APP_ROOT/frontend/.npm" \
                  "$APP_ROOT/frontend/out"
                sudo -u "$APP_USER" -H sh -c 'rm -rf "$HOME/.npm" "$HOME/.cache"' || true
              fi
              sudo -u "$APP_USER" -H git -C "$APP_ROOT" gc --prune=now || true
              AVAILABLE_KB="$(df -Pk "$APP_ROOT" | awk 'NR == 2 {print $4}')"
              echo "==> Disk space after cache/artifact pruning: ${AVAILABLE_KB} KiB free"
            fi
            if (( AVAILABLE_KB < REQUIRED_FREE_KB )); then
              echo "Production full-stack deploy requires at least 1 GiB free after bounded cache cleanup." >&2
              df -h "$APP_ROOT" >&2
              exit 1
            fi
            sudo -u "$APP_USER" -H rm -f "$APP_ROOT/.git/index.lock"

            echo "==> Sync GitHub main to EC2"
            sudo -u "$APP_USER" -H git -C "$APP_ROOT" fetch origin main
            sudo -u "$APP_USER" -H git -C "$APP_ROOT" reset --hard origin/main

            EXPECTED_FRONTEND_SHA="$(sudo -u "$APP_USER" -H git -C "$APP_ROOT" rev-parse HEAD)"
            BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "==> Stamp frontend build: $EXPECTED_FRONTEND_SHA"
            sudo test -f "$GENERATED_BUILD_INFO_FILE"
            sudo -u "$APP_USER" -H python3 - \
              "$GENERATED_BUILD_INFO_FILE" \
              "$EXPECTED_FRONTEND_SHA" \
              "$BUILD_TIMESTAMP" <<'PY'
            import json
            import sys
            from pathlib import Path

            path = Path(sys.argv[1])
            sha = json.dumps(sys.argv[2])
            timestamp = json.dumps(sys.argv[3])
            path.write_text(
                "// Generated by the production deployment workflow.\\n"
                f"export const GENERATED_BUILD_SHA = {sha};\\n"
                f"export const GENERATED_BUILD_TIMESTAMP: string | null = {timestamp};\\n",
                encoding="utf-8",
            )
            PY

            if command -v pg_isready >/dev/null 2>&1 && ! pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1; then
              echo "==> PostgreSQL is not ready; restarting it after disk recovery"
              sudo systemctl restart postgresql
              for attempt in $(seq 1 30); do
                if pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1; then
                  break
                fi
                sleep 1
              done
              if ! pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1; then
                sudo systemctl status postgresql --no-pager --full >&2 || true
                exit 1
              fi
              echo "==> PostgreSQL is ready"
            fi

            echo "==> Run full-stack deploy"
            SKIP_GIT_SYNC=true APP_ROOT="$APP_ROOT" APP_USER="$APP_USER" bash "$APP_ROOT/deploy/no-docker/redeploy.sh" full

            echo "==> Verify active frontend build fingerprint"
            ACTUAL_FRONTEND_SHA=""
            for attempt in $(seq 1 20); do
              FINGERPRINT_JSON="$(curl -fsS --max-time 5 http://127.0.0.1:3000/api/runtime-fingerprint || true)"
              ACTUAL_FRONTEND_SHA="$(
                python3 -c 'import json, sys; print(json.load(sys.stdin).get("build_sha", ""))' \
                  <<<"$FINGERPRINT_JSON" 2>/dev/null || true
              )"
              if [[ "$ACTUAL_FRONTEND_SHA" == "$EXPECTED_FRONTEND_SHA" ]]; then
                break
              fi
              echo "Frontend fingerprint mismatch (attempt $attempt/20): expected=$EXPECTED_FRONTEND_SHA actual=${ACTUAL_FRONTEND_SHA:-<missing>}"
              sleep 1
            done
            if [[ "$ACTUAL_FRONTEND_SHA" != "$EXPECTED_FRONTEND_SHA" ]]; then
              echo "The active frontend is not serving the build that was just deployed." >&2
              sudo systemctl status investor-frontend investment-engine-frontend --no-pager --full >&2 || true
              sudo journalctl -u investor-frontend -u investment-engine-frontend --no-pager --lines=120 >&2 || true
              exit 1
            fi
            echo "==> Active frontend fingerprint verified: $ACTUAL_FRONTEND_SHA"

            echo "==> Verify same-origin backend proxy"
            curl -fsS --max-time 6 http://127.0.0.1:3000/backend-api/health/live >/dev/null

            echo "==> Install/update Bullpen wallet healthcheck timer"
            APP_ROOT="$APP_ROOT" \
              APP_USER="$APP_USER" \
              FRONTEND_ENV_FILE="$FRONTEND_ENV_FILE" \
              bash "$APP_ROOT/deploy/no-docker/install-bullpen-healthcheck.sh"
