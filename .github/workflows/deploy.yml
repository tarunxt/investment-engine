name: Deploy to Production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false   # never cancel a running deploy mid-flight

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 900s          # 15 min for the full deploy
          command_timeout: 900s
          script: |
            set -euo pipefail

            APP="${{ secrets.APP_PATH }}"
            COMPOSE="docker compose -f $APP/docker-compose.prod.yml"

            echo "==> Pulling latest code"
            cd "$APP"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Building images"
            $COMPOSE build --pull --no-cache

            echo "==> Starting / updating containers"
            $COMPOSE up -d --remove-orphans

            echo "==> Running database migrations"
            $COMPOSE exec -T backend alembic upgrade head

            echo "==> Waiting for health checks"
            sleep 10
            $COMPOSE ps

            echo "==> Pruning unused images"
            docker image prune -f

            echo "==> Deploy complete"
