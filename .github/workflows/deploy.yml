name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      scope:
        description: Deployment scope
        required: true
        default: auto
        type: choice
        options:
          - auto
          - backend
          - full

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      full: ${{ steps.filter.outputs.full }}

    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect deploy scope
        if: github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            full:
              - 'frontend/**'
              - '.env.prod.example'
              - '.github/workflows/deploy.yml'
              - 'deploy/no-docker/**'
              - 'scripts/**'

  deploy-backend:
    name: Deploy backend
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.scope == 'backend') ||
      (github.event_name == 'push' &&
        needs.detect-changes.outputs.backend == 'true' &&
        needs.detect-changes.outputs.full != 'true')

    steps:
      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 1800s
          command_timeout: 1800s
          script: |
            set -euo pipefail
            APP="${{ secrets.APP_PATH }}"
            APP_SERVICE_USER="${{ secrets.APP_SERVICE_USER }}"
            if [[ -z "$APP_SERVICE_USER" ]]; then
              if id -u investment-engine >/dev/null 2>&1; then
                APP_SERVICE_USER="investment-engine"
              else
                APP_SERVICE_USER="investor"
              fi
            fi
            cd "$APP"
            sudo -u "$APP_SERVICE_USER" -H bash -lc "cd '$APP' && git fetch origin main && git reset --hard origin/main"
            SKIP_GIT_SYNC=true bash "$APP/deploy/no-docker/redeploy.sh" backend

  deploy-full:
    name: Deploy full stack
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.scope == 'auto' || github.event.inputs.scope == 'full')) ||
      (github.event_name == 'push' && needs.detect-changes.outputs.full == 'true')

    steps:
      - name: Deploy full stack via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 1800s
          command_timeout: 1800s
          script: |
            set -euo pipefail
            APP="${{ secrets.APP_PATH }}"
            APP_SERVICE_USER="${{ secrets.APP_SERVICE_USER }}"
            if [[ -z "$APP_SERVICE_USER" ]]; then
              if id -u investment-engine >/dev/null 2>&1; then
                APP_SERVICE_USER="investment-engine"
              else
                APP_SERVICE_USER="investor"
              fi
            fi
            cd "$APP"
            sudo -u "$APP_SERVICE_USER" -H bash -lc "cd '$APP' && git fetch origin main && git reset --hard origin/main"
            SKIP_GIT_SYNC=true bash "$APP/deploy/no-docker/redeploy.sh" full
