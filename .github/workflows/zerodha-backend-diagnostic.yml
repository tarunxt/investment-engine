name: Inspect Zerodha backend timeout
on:
  push:
    branches: [diagnose/zerodha-backend-timeout-20261007]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect backend and database without changing runtime
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          timeout: 120s
          command_timeout: 360s
          script: |
            set -euo pipefail
            APP="${{ vars.EC2_APP_PATH || '/srv/investment-engine' }}"
            if [[ ! -d "$APP" && -d /srv/investor ]]; then APP=/srv/investor; fi
            echo '== Runtime source locations =='
            for service in investor-backend investor-celery-recovery-analysis investor-recovery-analysis credx-recovery-analysis; do
              sudo systemctl show "$service" --property=Id,LoadState,ActiveState,MainPID,WorkingDirectory,DropInPaths
              pid=$(sudo systemctl show "$service" --property=MainPID --value)
              if [[ "$pid" =~ ^[1-9][0-9]*$ ]]; then sudo readlink "/proc/$pid/cwd"; fi
            done
            sudo systemctl list-units --all --no-pager '*recovery*' '*analysis*'
            sudo systemctl list-unit-files --no-pager '*recovery*' '*analysis*'
            echo '== Recovery middleware response =='
            curl -sS --max-time 8 http://127.0.0.1:8000/zerodha/status | python3 -c 'import json,sys; d=json.load(sys.stdin); print({k:d.get(k) for k in ("code","detail")})'
            echo '== Candidate directories =='
            sudo find /srv /opt -maxdepth 4 -name recovery.py -o -name '*recovery*' -type d 2>/dev/null
