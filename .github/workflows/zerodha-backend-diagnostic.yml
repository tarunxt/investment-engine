name: Inspect Zerodha backend timeout
on:
  push:
    branches: [diagnose/zerodha-backend-timeout-20261007]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect backend and database without changing runtime
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          timeout: 120s
          command_timeout: 360s
          script: |
            set -euo pipefail
            APP="${{ vars.EC2_APP_PATH || '/srv/investment-engine' }}"
            if [[ ! -d "$APP" && -d /srv/investor ]]; then APP=/srv/investor; fi
            APP_USER=investor
            echo '== Post-deploy services =='
            for unit in investor-backend investor-frontend investor-recovery-analysis investor-celery-worker investor-celery-email-worker investor-celery-auto-live-worker investor-celery-beat investor-celery-beat-worker; do
              sudo systemctl show "$unit" --property=Id,ActiveState,MainPID,NRestarts
            done
            echo '== Public endpoint timing =='
            for url in https://api.cred-x.in/health/ready https://api.cred-x.in/zerodha/status https://api.cred-x.in/zerodha/login-url https://api.cred-x.in/zerodha/portfolio; do
              echo "$url"
              curl -sS --max-time 8 -o /dev/null -w 'http=%{http_code} total=%{time_total}\n' "$url"
            done
            echo '== Runtime fingerprint =='
            curl -fsS --max-time 8 https://cred-x.in/api/runtime-fingerprint
            echo
            echo '== Read-only Zerodha database route checks =='
            sudo -u "$APP_USER" env APP_ROOT="$APP" bash <<'SH'
            set -euo pipefail
            cd "$APP_ROOT/backend"
            source "$APP_ROOT/deploy/no-docker/load-env-file.sh"
            load_env_file /etc/investor/backend.env
            export CREDX_RECOVERY_MODE=1
            .venv/bin/python - <<'PYCODE'
            import asyncio,json
            from types import SimpleNamespace
            from sqlalchemy import select
            import app.main  # Match API model registration before ORM reads.
            from app.infrastructure.database.session import AsyncSessionLocal
            from app.domains.zerodha.models import ZerodhaCredential
            from app.domains.zerodha.router import get_status,get_portfolio_overview,_svc
            async def verify():
                async with AsyncSessionLocal() as db:
                    user_id=(await db.execute(select(ZerodhaCredential.user_id).limit(1))).scalar_one_or_none()
                    status=await get_status(db=db,current_user=SimpleNamespace(id=user_id or 0))
                    portfolio=await get_portfolio_overview(limit=1,db=db,current_user=SimpleNamespace(id=user_id or 0))
                    print(json.dumps({"zerodha_configured":_svc.is_configured,"status_db_read":"passed","portfolio_db_read":"passed","existing_session_connected":status.connected}))
            asyncio.run(verify())
            PYCODE
            SH
