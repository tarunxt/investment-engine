name: Apply and validate Stage 3 blocked status refinement

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'codex/fix-stage3-support-blocker-balance-refresh'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/fix-stage3-support-blocker-balance-refresh
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Apply status refinement
        run: |
          set -euo pipefail
          test "$(wc -c < scripts/.stage3-support-status-v3.gz.b64)" -eq 1716
          echo '4b6ae6830a5401908d62aede57098e3c08e38de9dc290887654bb43c7644e3f2  scripts/.stage3-support-status-v3.gz.b64' | sha256sum -c -
          base64 -d scripts/.stage3-support-status-v3.gz.b64 > /tmp/stage3-support-status-v3.patch.gz
          echo '8e503560cbedd05d792cc91b3ce81513ce06328704505b013228888c9329bd6b  /tmp/stage3-support-status-v3.patch.gz' | sha256sum -c -
          gzip -d -c /tmp/stage3-support-status-v3.patch.gz > /tmp/stage3-support-status-v3.patch
          echo 'dd0f4a9002f8369d005b9ee3b20fe9622882c1cc9fc8e4882391f7bd88a24f85  /tmp/stage3-support-status-v3.patch' | sha256sum -c -
          git apply --check --verbose /tmp/stage3-support-status-v3.patch
          git apply --verbose /tmp/stage3-support-status-v3.patch
          git diff --check
      - name: Compile backend
        run: python -m compileall -q backend/app backend/tests
      - name: Install backend dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip install --disable-pip-version-check pytest
      - name: Run status and repository regressions
        env:
          PYTHONPATH: backend
        run: |
          pytest -q --tb=long \
            backend/tests/test_polymarket_auto_live_order_intents.py \
            backend/tests/test_polymarket_auto_live_repository_safety.py \
            -k 'support_blocker or persisted_execution_step or stage3_run_level_support_preflight'
      - name: Commit validated refinement
        run: |
          set -euo pipefail
          rm -f scripts/.stage3-support-status-v3.gz.b64
          rm -f .github/workflows/apply-stage3-support-status-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Report Bullpen support-blocked Stage 3 runs as partial and paused'
          git push origin HEAD:codex/fix-stage3-support-blocker-balance-refresh
