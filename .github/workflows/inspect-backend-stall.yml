name: Inspect Stalled Backend

on:
  push:
    branches: [codex/inspect-backend-stall]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect backend without mutation
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          timeout: 600s
          command_timeout: 600s
          script: |
            set -euo pipefail
            date -u
            uptime
            free -h
            swapon --show || true
            vmstat 1 3 || true
            sudo systemctl status investor-backend --no-pager || true
            pid="$(systemctl show investor-backend -p MainPID --value)"
            if [[ "$pid" =~ ^[0-9]+$ && "$pid" != 0 ]]; then
              echo "==> Backend process"
              ps -o pid,ppid,state,%cpu,%mem,rss,vsz,etime,cmd -p "$pid"
              sudo sed -n '/^Vm\(RSS\|Size\|Swap\|HWM\):/p' "/proc/$pid/status"
              echo "==> Backend memory cgroup"
              sudo cat /sys/fs/cgroup/system.slice/investor-backend.service/memory.events || true
              sudo cat /sys/fs/cgroup/system.slice/investor-backend.service/memory.pressure || true
              echo "==> Backend thread wait channels"
              for task in /proc/"$pid"/task/*; do
                printf '%s ' "${task##*/}"
                sudo cat "$task/wchan" || true
              done
              if command -v py-spy >/dev/null 2>&1; then
                echo "==> Python stack"
                sudo timeout 12 py-spy dump --pid "$pid" || true
              fi
            fi
            echo "==> Top processes"
            ps -eo pid,ppid,state,%cpu,%mem,rss,etime,comm --sort=-%mem | head -n 18
            echo "==> PostgreSQL active queries"
            sudo -u postgres psql -X -d aidb -P pager=off -c "SELECT pid, state, wait_event_type, wait_event, now()-query_start AS age, left(query, 220) AS query FROM pg_stat_activity WHERE datname=current_database() AND state <> 'idle' ORDER BY query_start LIMIT 15" || true
            echo "==> Nginx recent upstream timeouts"
            sudo tail -n 160 /var/log/nginx/error.log 2>/dev/null |
              grep -E 'upstream timed out|upstream prematurely closed|recv\(\) failed' | tail -n 35 |
              sed -E 's/(request: "[A-Z]+ [^?"]+)\?[^"]*/\1?redacted/' || true
            echo "==> Memory cgroup limits and host availability"
            sudo systemctl show investor-backend -p MemoryLow -p MemoryHigh -p MemoryMax -p MemorySwapMax --no-pager
            free -h
            echo "==> Direct health"
            curl -sS --max-time 7 -o /dev/null -w 'backend HTTP %{http_code} in %{time_total}s\n' http://127.0.0.1:8000/health/live || true
            echo "==> Recent backend performance"
            sudo journalctl -u investor-backend --since '2026-09-26 12:20:00 UTC' --no-pager |
              grep -E 'request_performance|MemoryError|FATAL|Killed|TimeoutError' | tail -n 55 || true
            echo "==> Kernel OOM"
            sudo journalctl -k --since '2026-09-26 12:20:00 UTC' --no-pager |
              grep -Ei 'oom|out of memory|memory cgroup' | tail -n 20 || true
