name: Inspect Stalled Backend

on:
  push:
    branches: [codex/inspect-backend-stall]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect backend without mutation
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          timeout: 600s
          command_timeout: 600s
          script: |
            set -euo pipefail
            date -u
            uptime
            free -h
            swapon --show || true
            vmstat 1 3 || true
            sudo systemctl status investor-backend --no-pager || true
            pid="$(systemctl show investor-backend -p MainPID --value)"
            if [[ "$pid" =~ ^[0-9]+$ && "$pid" != 0 ]]; then
              echo "==> Backend process"
              ps -o pid,ppid,state,%cpu,%mem,rss,vsz,etime,cmd -p "$pid"
              sudo sed -n '/^Vm\(RSS\|Size\|Swap\|HWM\):/p' "/proc/$pid/status"
              echo "==> Backend memory cgroup"
              sudo cat /sys/fs/cgroup/system.slice/investor-backend.service/memory.events || true
              sudo cat /sys/fs/cgroup/system.slice/investor-backend.service/memory.pressure || true
              echo "==> Backend thread wait channels"
              for task in /proc/"$pid"/task/*; do
                printf '%s ' "${task##*/}"
                sudo cat "$task/wchan" || true
              done
              if command -v py-spy >/dev/null 2>&1; then
                echo "==> Python stack"
                sudo timeout 12 py-spy dump --pid "$pid" || true
              fi
            fi
            echo "==> Top processes"
            ps -eo pid,ppid,state,%cpu,%mem,rss,etime,comm --sort=-%mem | head -n 18
            echo "==> PostgreSQL active queries"
            sudo -u postgres psql -X -d aidb -P pager=off -c "SELECT pid, state, wait_event_type, wait_event, now()-query_start AS age, left(query, 220) AS query FROM pg_stat_activity WHERE datname=current_database() AND state <> 'idle' ORDER BY query_start LIMIT 15" || true
            echo "==> Nginx recent upstream timeouts"
            sudo tail -n 160 /var/log/nginx/error.log 2>/dev/null |
              grep -E 'upstream timed out|upstream prematurely closed|recv\(\) failed' | tail -n 35 |
              sed -E 's/(request: "[A-Z]+ [^?"]+)\?[^"]*/\1?redacted/' || true
            echo "==> Memory cgroup limits and host availability"
            sudo systemctl show investor-backend -p MemoryLow -p MemoryHigh -p MemoryMax -p MemorySwapMax --no-pager
            free -h
            echo "==> Post-deploy verification after 6972284b"
            echo "==> Frontend deployment and local route verification"
            active="$(cat /srv/investor/frontend/.next-active-dir 2>/dev/null || true)"
            echo "active_frontend_slot=$active"
            if [[ "$active" == .next || "$active" == .next-candidate ]]; then
              sudo python3 -c 'import json,sys; p="/srv/investor/frontend/"+sys.argv[1]+"/deployment-manifest.json"; print("build_sha="+json.load(open(p)).get("build_sha","missing"))' "$active" || true
            fi
            for route in /login /backend-api/health/live /console/bullpen-sports; do
              curl -sS -o /dev/null -w "frontend_$route HTTP %{http_code} in %{time_total}s\\n" --max-time 12 "http://127.0.0.1:3000$route" || true
            done
            df -h /
            echo "==> Scan storage breakdown"
            sudo du -xhd1 /srv/investor/backend/.stage-one-exports /srv/investor/backend/.universal-scan-archive 2>/dev/null | sort -h | tail -n 30 || true
            echo "==> Cache ages and sizes"
            sudo find /srv/investor/backend/.stage-one-exports/scan-pages-v1 -mindepth 1 -maxdepth 1 -type d -printf '%T@ %s %p\n' 2>/dev/null | sort -n | head -n 5 || true
            for mins in 180 360 720 1440 2880 4320; do
              echo "cache_dirs_older_than_${mins}m=$(sudo find /srv/investor/backend/.stage-one-exports/scan-pages-v1 -mindepth 1 -maxdepth 1 -type d -mmin +$mins 2>/dev/null | wc -l)"
              sudo find /srv/investor/backend/.stage-one-exports/scan-pages-v1 -mindepth 1 -maxdepth 1 -type d -mmin +$mins -print0 2>/dev/null | sudo du -sch --files0-from=- 2>/dev/null | tail -n 1 || true
            done
            echo "==> Largest recent export rows"
            sudo find /srv/investor/backend/.stage-one-exports -maxdepth 2 -type f -name '*.jsonl*' -printf '%s %TY-%Tm-%Td %TH:%TM %p\n' 2>/dev/null | sort -nr | head -n 12 || true
            echo "==> Disk and logs"
            df -h /
            sudo du -xsh /var/log /srv/investor/backend/.stage-one-exports/scan-pages-v1 /srv/investor/backend/.stage-one-exports/scan-sources 2>/dev/null || true
            echo "==> Attached block devices and mounts"
            lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINTS,TYPE
            findmnt -n -o SOURCE,FSTYPE,SIZE,AVAIL /
            echo "==> AWS CLI and instance identity availability"
            if command -v aws >/dev/null 2>&1; then
              aws --version 2>&1
              timeout 7 aws sts get-caller-identity --query 'Arn' --output text 2>&1 || true
            fi
            echo "==> Immutable scan artifact counts by age"
            sudo find /srv/investor/backend/.stage-one-exports/scan-sources -maxdepth 1 -name '*.pack' -type f -printf '%s %TY-%Tm-%Td\n' 2>/dev/null | awk '{sizes[$2]+=$1;counts[$2]++} END {for (d in sizes) printf "%s %.2f GiB %d packs\\n",d,sizes[d]/1073741824,counts[d]}' | sort | tail -n 20 || true
            echo "==> Source and export cross volume feasibility"
            stat -f -c '%T %a blocks available' /srv/investor/backend/.stage-one-exports
            echo "==> Root volume metadata and resize permission dry run"
            instance_id="$(timeout 6 curl -fsS -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' http://169.254.169.254/latest/api/token 2>/dev/null || true)"
            if [[ -n "$instance_id" ]]; then
              token="$instance_id"
              instance_id="$(timeout 6 curl -fsS -H "X-aws-ec2-metadata-token: $token" http://169.254.169.254/latest/meta-data/instance-id 2>/dev/null || true)"
              region="$(timeout 6 curl -fsS -H "X-aws-ec2-metadata-token: $token" http://169.254.169.254/latest/meta-data/placement/region 2>/dev/null || true)"
              echo "instance=$instance_id region=$region"
              if [[ -n "$instance_id" && -n "$region" ]]; then
                timeout 10 aws ec2 describe-instances --region "$region" --instance-ids "$instance_id" --query 'Reservations[].Instances[].BlockDeviceMappings[].[DeviceName,Ebs.VolumeId]' --output text || true
                volumes="$(timeout 10 aws ec2 describe-instances --region "$region" --instance-ids "$instance_id" --query 'Reservations[].Instances[].BlockDeviceMappings[].Ebs.VolumeId' --output text || true)"
                for volume in $volumes; do
                  timeout 10 aws ec2 describe-volumes --region "$region" --volume-ids "$volume" --query 'Volumes[].[VolumeId,Size,VolumeType,State]' --output text || true
                  timeout 10 aws ec2 modify-volume --dry-run --region "$region" --volume-id "$volume" --size 160 2>&1 | tail -n 4 || true
                done
              fi
            fi
            echo "==> Ext4 reserve read only"
            sudo tune2fs -l /dev/nvme0n1p1 | grep -E 'Block count:|Reserved block count:|Free blocks:|Block size:|Reserved block percentage:|Reserved blocks uid:|Reserved blocks gid:' || true
            df -B1 --output=size,used,avail,target /
            echo "==> Direct health"
            curl -sS --max-time 7 -o /dev/null -w 'backend HTTP %{http_code} in %{time_total}s\n' http://127.0.0.1:8000/health/live || true
            echo "==> Recent backend performance"
            sudo journalctl -u investor-backend --since '2026-09-26 12:20:00 UTC' --no-pager |
              grep -E 'request_performance|MemoryError|FATAL|Killed|TimeoutError' | tail -n 55 || true
            echo "==> Kernel OOM"
            sudo journalctl -k --since '2026-09-26 12:20:00 UTC' --no-pager |
              grep -Ei 'oom|out of memory|memory cgroup' | tail -n 20 || true
