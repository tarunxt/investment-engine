name: Inspect Stalled Production Recovery
on:
  push:
    branches: [codex/inspect-stalled-recovery]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 120s
          script: |
            set -euo pipefail
            echo '==> Disk and memory'
            df -h / /srv/investor
            free -h
            echo '==> Service states'
            for unit in investor-frontend investor-backend investor-celery-worker postgresql; do
              printf '%s: ' "$unit"
              systemctl is-active "$unit" || true
            done
            echo '==> Local health'
            curl -sS -o /dev/null --max-time 8 -w 'frontend HTTP %{http_code}\n' http://127.0.0.1:3000/login || true
            curl -sS -o /dev/null --max-time 8 -w 'backend HTTP %{http_code}\n' http://127.0.0.1:8000/health/live || true
            echo '==> Rotation and system log sizes'
            stat -c '%a %U:%G %n' /var/log
            ls -lh /var/log/syslog* 2>/dev/null || true
            echo '==> Canonical app directory'
            readlink -f /srv/investor /srv/investment-engine || true
            echo '==> Largest app and temporary directories'
            sudo du -xhd2 "$(readlink -f /srv/investor)" /tmp /home/investor /var/log 2>/dev/null | sort -hr | head -n 35 || true
            echo '==> Export subdirectories'
            sudo du -xhd2 /home/deploy/apps/myapp/backend/.stage-one-exports 2>/dev/null | sort -hr | head -n 28 || true
            echo '==> Replayable scan page cache age'
            cache=/home/deploy/apps/myapp/backend/.stage-one-exports/scan-pages-v1
            for hours in 24 48 72; do
              find "$cache" -mindepth 1 -maxdepth 1 -type d -mmin "+$((hours*60))" -print0 |
                xargs -0 -r du -sk |
                awk -v hours="$hours" '{n++; kb+=$1} END {printf "older_than_%sh: %d directories, %.2f GiB\\n",hours,n,kb/1048576}'
            done
            echo '==> Scan export storage categories'
            sudo python3 - <<'PY'
            import collections, json
            from pathlib import Path
            root = Path('/home/deploy/apps/myapp/backend')
            for directory in (root / '.stage-one-exports', root / '.universal-scan-archive'):
                counts = collections.Counter()
                sizes = collections.Counter()
                for f in directory.iterdir():
                    if not f.is_file():
                        continue
                    suffix = 'filtered' if f.name.endswith('.filtered.jsonl') else 'rows' if f.suffix == '.jsonl' else 'manifest' if f.suffix == '.json' else 'temporary' if f.name.endswith('.tmp') else 'other'
                    if suffix == 'rows':
                        meta = f.with_suffix('.json')
                        try:
                            state = json.loads(meta.read_text()).get('completed')
                        except (OSError, ValueError):
                            state = 'missing_or_invalid'
                        suffix += ':' + str(state)
                    counts[suffix] += 1
                    sizes[suffix] += f.stat().st_size
                print(directory.name, [(key, counts[key], round(value/1024**3,2)) for key,value in sizes.most_common()])
            PY
            echo '==> Busy node process'
            ps -p 3076556 -o pid,ppid,etime,cmd || true
            echo '==> Top processes by memory'
            ps -eo pid,comm,%mem,%cpu --sort=-%mem | head -n 14
