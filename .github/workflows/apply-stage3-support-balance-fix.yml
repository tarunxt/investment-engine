name: Apply and validate Stage 3 support and balance fixes

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: stage3-support-balance-fix
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'codex/fix-stage3-support-blocker-balance-refresh'
    runs-on: ubuntu-24.04
    timeout-minutes: 70

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v7
        with:
          ref: codex/fix-stage3-support-blocker-balance-refresh
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Reassemble and apply source patch
        id: apply_patch
        continue-on-error: true
        run: |
          set -o pipefail
          {
            set -euo pipefail
            cat scripts/.stage3-support-balance-fix.part* > /tmp/stage3-support-balance-fix.patch.gz.b64
            test "$(wc -c < /tmp/stage3-support-balance-fix.patch.gz.b64)" -eq 16016
            echo '9591a194533fe8f855155f1a51e205c5470b091502cd257171755f4b87e1f3f7  /tmp/stage3-support-balance-fix.patch.gz.b64' | sha256sum -c -
            base64 -d /tmp/stage3-support-balance-fix.patch.gz.b64 > /tmp/stage3-support-balance-fix.patch.gz
            echo '9ee458ad3997ef7d7bfce7ba8fd4b7e58951dff8cda5981dcdbb9da15b87977a  /tmp/stage3-support-balance-fix.patch.gz' | sha256sum -c -
            gzip -d -c /tmp/stage3-support-balance-fix.patch.gz > /tmp/stage3-support-balance-fix.patch
            echo 'f913bcb1728adc9a01e36972c89b13765083429c92fa3c9a80ae352abd01f176  /tmp/stage3-support-balance-fix.patch' | sha256sum -c -
            git apply --check --verbose /tmp/stage3-support-balance-fix.patch
            git apply --verbose /tmp/stage3-support-balance-fix.patch
            git diff --check
          } 2>&1 | tee /tmp/stage3-support-balance-apply.log

      - name: Upload patch diagnostics
        if: steps.apply_patch.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: stage3-support-balance-apply-diagnostics
          path: |
            /tmp/stage3-support-balance-apply.log
            /tmp/stage3-support-balance-fix.patch
          retention-days: 2
          if-no-files-found: error

      - name: Stop after patch failure
        if: steps.apply_patch.outcome == 'failure'
        run: exit 1

      - name: Compile backend sources and tests
        run: python -m compileall -q backend/app backend/tests

      - name: Install backend dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip install --disable-pip-version-check pytest

      - name: Run focused backend regressions
        id: backend_tests
        continue-on-error: true
        env:
          PYTHONPATH: backend
        run: |
          set -o pipefail
          pytest -q --tb=long --maxfail=20 \
            backend/tests/test_polymarket_bot_start.py \
            backend/tests/test_polymarket_auto_live_order_intents.py \
            backend/tests/test_polymarket_auto_live_repository_safety.py \
            backend/tests/test_bullpen_run_audit.py \
            2>&1 | tee /tmp/stage3-support-balance-backend-tests.log

      - name: Upload backend test diagnostics
        if: steps.backend_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: stage3-support-balance-backend-test-diagnostics
          path: /tmp/stage3-support-balance-backend-tests.log
          retention-days: 2
          if-no-files-found: error

      - name: Stop after backend test failure
        if: steps.backend_tests.outcome == 'failure'
        run: exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev --prefer-offline --no-audit --fund=false --loglevel=error

      - name: Run focused frontend regressions
        id: frontend_tests
        continue-on-error: true
        working-directory: frontend
        run: |
          set -o pipefail
          {
            node --test tests/bullpen-auto-run-portfolio-refresh.test.mjs
            node --test tests/bullpen-auto-run-history.test.mjs
            node --test tests/bullpen-stage2-actionables.test.mjs
            node --test tests/bullpen-auto-run-invest-metrics.test.mjs
            node --test tests/bullpen-auto-run-stage3-invest.test.mjs
            node --test tests/bullpen-auto-run-progress.test.mjs
            node --test tests/bullpen-auto-run-status.test.mjs
          } 2>&1 | tee /tmp/stage3-support-balance-frontend-tests.log

      - name: Upload frontend test diagnostics
        if: steps.frontend_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: stage3-support-balance-frontend-test-diagnostics
          path: /tmp/stage3-support-balance-frontend-tests.log
          retention-days: 2
          if-no-files-found: error

      - name: Stop after frontend test failure
        if: steps.frontend_tests.outcome == 'failure'
        run: exit 1

      - name: Build production frontend
        working-directory: frontend
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_URL: https://api.cred-x.in
          NEXT_PUBLIC_FRONTEND_URL: https://cred-x.in
          NEXT_PUBLIC_BRAND_PREFIX: Cred-X
          NEXT_PUBLIC_BRAND_ACRONYM: TIE
          NEXT_PUBLIC_BRAND_EXPANSION: Tarun's Investment Engine
          NEXT_PUBLIC_DISABLE_AUTH: 'false'
          NEXT_PUBLIC_DISABLE_API_PROXY: 'false'
          NEXT_PUBLIC_API_DEBUG: 'false'
          NEXTAUTH_URL: https://cred-x.in
          NEXTAUTH_SECRET: ci-runtime-secret
          AUTH_TRUST_HOST: 'true'
          BACKEND_API_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Commit verified source and remove temporary payload
        run: |
          set -euo pipefail
          rm -f scripts/.stage3-support-balance-fix.part*
          rm -f .github/workflows/apply-stage3-support-balance-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No implementation changes were produced.' >&2
            exit 1
          fi
          git commit -m 'Pause Stage 3 on Bullpen support blockers and refresh balance asynchronously'
          git push origin HEAD:codex/fix-stage3-support-blocker-balance-refresh
