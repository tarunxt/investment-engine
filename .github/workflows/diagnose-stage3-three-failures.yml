name: Apply and validate Stage 3 authoritative follow-up

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: stage3-authoritative-followup
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'codex/diagnose-stage3-three-failures'
    runs-on: ubuntu-24.04
    timeout-minutes: 65

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v7
        with:
          ref: codex/diagnose-stage3-three-failures
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Reassemble and apply authoritative Stage 3 follow-up
        id: apply_patch
        continue-on-error: true
        run: |
          set -o pipefail
          {
            set -euo pipefail
            cat \
              scripts/.stage3-followup.part00 \
              scripts/.stage3-followup.part01 \
              scripts/.stage3-followup.part02 \
              scripts/.stage3-followup.part03 \
              scripts/.stage3-followup.part04 \
              scripts/.stage3-followup.part05 \
              scripts/.stage3-followup.part06 \
              > /tmp/stage3-authoritative-followup.patch.gz.b64
            test "$(wc -c < /tmp/stage3-authoritative-followup.patch.gz.b64)" -eq 24756
            echo '5773e53917542b21731290225c6e56be763dbd04c484e920b66369218e0e449f  /tmp/stage3-authoritative-followup.patch.gz.b64' | sha256sum -c -
            base64 -d /tmp/stage3-authoritative-followup.patch.gz.b64 \
              > /tmp/stage3-authoritative-followup.patch.gz
            echo '398de319950509ff29b072c2963cd7cae98ab9386c54a49baf4f5af973c5c33b  /tmp/stage3-authoritative-followup.patch.gz' | sha256sum -c -
            gzip -d -c /tmp/stage3-authoritative-followup.patch.gz \
              > /tmp/stage3-authoritative-followup.patch
            echo 'f11ec2a8279c6d2eab5839e1133c6cc62f0505051f17da8671ea975205530c07  /tmp/stage3-authoritative-followup.patch' | sha256sum -c -
            git apply --check --verbose /tmp/stage3-authoritative-followup.patch
            git apply --verbose /tmp/stage3-authoritative-followup.patch
            git diff --check
          } 2>&1 | tee /tmp/stage3-authoritative-apply.log

      - name: Upload patch diagnostics
        if: steps.apply_patch.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: stage3-authoritative-apply-diagnostics
          path: |
            /tmp/stage3-authoritative-apply.log
            /tmp/stage3-authoritative-followup.patch
          retention-days: 2
          if-no-files-found: error

      - name: Stop after patch failure
        if: steps.apply_patch.outcome == 'failure'
        run: exit 1

      - name: Compile backend sources and tests
        run: python -m compileall -q backend/app backend/tests

      - name: Install backend dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip install --disable-pip-version-check pytest

      - name: Run focused backend regressions
        id: backend_tests
        continue-on-error: true
        env:
          PYTHONPATH: backend
        run: |
          set -o pipefail
          pytest -q --tb=long --maxfail=20 \
            backend/tests/test_polymarket_auto_live.py \
            backend/tests/test_polymarket_auto_live_order_intents.py \
            backend/tests/test_polymarket_auto_live_repository_safety.py \
            backend/tests/test_stage2_actionable_handoff.py \
            backend/tests/test_bullpen_run_audit.py \
            backend/tests/test_stage3_slot_allocation.py \
            2>&1 | tee /tmp/stage3-authoritative-backend-tests.log

      - name: Upload backend test diagnostics
        if: steps.backend_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: stage3-authoritative-backend-test-diagnostics
          path: /tmp/stage3-authoritative-backend-tests.log
          retention-days: 2
          if-no-files-found: error

      - name: Stop after backend test failure
        if: steps.backend_tests.outcome == 'failure'
        run: exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev --prefer-offline --no-audit --fund=false --loglevel=error

      - name: Run focused frontend regressions
        id: frontend_tests
        continue-on-error: true
        working-directory: frontend
        run: |
          set -o pipefail
          {
            node --test tests/bullpen-stage2-actionables.test.mjs
            node --test tests/bullpen-auto-run-invest-metrics.test.mjs
            node --test tests/bullpen-run-console-detail.test.mjs
            node --test tests/bullpen-auto-run-stage3-invest.test.mjs
            node --test tests/bullpen-auto-run-progress.test.mjs
            node --test tests/bullpen-auto-run-status.test.mjs
          } 2>&1 | tee /tmp/stage3-authoritative-frontend-tests.log

      - name: Upload frontend test diagnostics
        if: steps.frontend_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: stage3-authoritative-frontend-test-diagnostics
          path: /tmp/stage3-authoritative-frontend-tests.log
          retention-days: 2
          if-no-files-found: error

      - name: Stop after frontend test failure
        if: steps.frontend_tests.outcome == 'failure'
        run: exit 1

      - name: Build production frontend
        working-directory: frontend
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_URL: https://api.cred-x.in
          NEXT_PUBLIC_FRONTEND_URL: https://cred-x.in
          NEXT_PUBLIC_BRAND_PREFIX: Cred-X
          NEXT_PUBLIC_BRAND_ACRONYM: TIE
          NEXT_PUBLIC_BRAND_EXPANSION: Tarun's Investment Engine
          NEXT_PUBLIC_DISABLE_AUTH: 'false'
          NEXT_PUBLIC_DISABLE_API_PROXY: 'false'
          NEXT_PUBLIC_API_DEBUG: 'false'
          NEXTAUTH_URL: https://cred-x.in
          NEXTAUTH_SECRET: ci-runtime-secret
          AUTH_TRUST_HOST: 'true'
          BACKEND_API_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Commit verified implementation and remove diagnostics
        run: |
          set -euo pipefail
          rm -f scripts/.stage3-followup.part*
          rm -f scripts/inspect-stage3-three-failures.py
          rm -f .github/workflows/diagnose-stage3-three-failures.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No implementation changes were produced.' >&2
            exit 1
          fi
          git commit -m 'Preserve and execute every authoritative Stage 2 action'
          git push origin HEAD:codex/diagnose-stage3-three-failures
