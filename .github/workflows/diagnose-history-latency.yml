name: Diagnose history read latency
on:
  push:
    branches: [fix/history-read-diagnostics]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 180s
          script: |
            set -eu
            sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d aidb -P pager=off <<'SQL'
            BEGIN READ ONLY;
            SET LOCAL statement_timeout = '30s';
            \timing on
            SELECT octet_length(CAST((SELECT json_build_object('version', history_run.version, 'order_funnel', history_run.order_funnel, 'stage_results', coalesce((SELECT json_agg(json_build_object('stage_number', history_fields.stage_number, 'stage_name', history_fields.stage_name, 'status', history_fields.status, 'reason', history_fields.reason, 'started_at', history_fields.started_at, 'completed_at', history_fields.completed_at, 'outputs', json_build_object('workflow_stage_key', history_counts.workflow_stage_key, 'phase_status', history_counts.phase_status, 'total_items', history_counts.total_items, 'scanned_candidates', history_counts.scanned_candidates, 'completed_items', history_counts.completed_items, 'accepted_candidates_count', history_counts.accepted_candidates_count, 'stage1_accepted_candidate_count', history_counts.stage1_accepted_candidate_count, 'failed_items', history_counts.failed_items, 'llm_candidate_count', history_counts.llm_candidate_count, 'stage2_eligible_rows_total', history_counts.stage2_eligible_rows_total, 'stage2_reviewed_rows', history_counts.stage2_reviewed_rows, 'llm_usable_provider_target_count', history_counts.llm_usable_provider_target_count, 'llm_successful_provider_target_count', history_counts.llm_successful_provider_target_count, 'llm_failed_provider_target_count', history_counts.llm_failed_provider_target_count, 'llm_failed_model_count', history_counts.llm_failed_model_count, 'orders_planned', history_counts.orders_planned, 'orders_processed', history_counts.orders_processed, 'orders_submitted', history_counts.orders_submitted, 'permanent_failure_count', history_counts.permanent_failure_count, 'current_blockage', history_counts.current_blockage, 'execution_gate_reason', history_counts.execution_gate_reason, 'error_message', history_counts.error_message, 'stage2_universe_blocker_summary', history_counts.stage2_universe_blocker_summary)) ORDER BY history_stage.ordinality) AS json_agg_1 
            FROM json_array_elements(CASE WHEN (json_typeof(history_run.stage_results) = 'array') THEN history_run.stage_results ELSE CAST('[]' AS JSON) END) WITH ORDINALITY AS history_stage(value, ordinality) JOIN LATERAL json_to_record(CASE WHEN (json_typeof(history_stage.value) = 'object') THEN history_stage.value ELSE CAST('{}' AS JSON) END) AS history_fields(stage_number JSON, stage_name JSON, status JSON, reason JSON, started_at JSON, completed_at JSON, outputs JSON) ON true JOIN LATERAL json_to_record(CASE WHEN (json_typeof(history_fields.outputs) = 'object') THEN history_fields.outputs ELSE CAST('{}' AS JSON) END) AS history_counts(workflow_stage_key JSON, phase_status JSON, total_items JSON, scanned_candidates JSON, completed_items JSON, accepted_candidates_count JSON, stage1_accepted_candidate_count JSON, failed_items JSON, llm_candidate_count JSON, stage2_eligible_rows_total JSON, stage2_reviewed_rows JSON, llm_usable_provider_target_count JSON, llm_successful_provider_target_count JSON, llm_failed_provider_target_count JSON, llm_failed_model_count JSON, orders_planned JSON, orders_processed JSON, orders_submitted JSON, permanent_failure_count JSON, current_blockage JSON, execution_gate_reason JSON, error_message JSON, stage2_universe_blocker_summary JSON) ON true), CAST('[]' AS JSON))) AS json_build_object_1 
            FROM LATERAL json_to_record(CASE WHEN (json_typeof(polymarket_auto_live_runs.console_projection) = 'object') THEN polymarket_auto_live_runs.console_projection ELSE CAST('{}' AS JSON) END) AS history_run(version JSON, order_funnel JSON, stage_results JSON)) AS TEXT)) AS list_projection_bytes FROM polymarket_auto_live_runs ORDER BY polymarket_auto_live_runs.started_at DESC, polymarket_auto_live_runs.created_at DESC 
             LIMIT 40;
            ROLLBACK;
            SQL
