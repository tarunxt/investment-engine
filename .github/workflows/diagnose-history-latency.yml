name: Diagnose history read latency
on:
  push:
    branches: [fix/history-read-diagnostics]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 180s
          script: |
            set -eu
            sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d aidb -P pager=off <<'SQL'
            BEGIN READ ONLY;
            SET LOCAL statement_timeout = '30s';
            \timing on
            SELECT octet_length(CAST(json_build_object('version', polymarket_auto_live_runs.console_projection -> 'version', 'order_funnel', polymarket_auto_live_runs.console_projection -> 'order_funnel', 'stage_results', coalesce((SELECT json_agg(json_build_object('stage_number', history_stage.value -> 'stage_number', 'stage_name', history_stage.value -> 'stage_name', 'status', history_stage.value -> 'status', 'reason', history_stage.value -> 'reason', 'started_at', history_stage.value -> 'started_at', 'completed_at', history_stage.value -> 'completed_at', 'outputs', json_build_object('workflow_stage_key', (history_stage.value -> 'outputs') -> 'workflow_stage_key', 'phase_status', (history_stage.value -> 'outputs') -> 'phase_status', 'total_items', (history_stage.value -> 'outputs') -> 'total_items', 'scanned_candidates', (history_stage.value -> 'outputs') -> 'scanned_candidates', 'completed_items', (history_stage.value -> 'outputs') -> 'completed_items', 'accepted_candidates_count', (history_stage.value -> 'outputs') -> 'accepted_candidates_count', 'stage1_accepted_candidate_count', (history_stage.value -> 'outputs') -> 'stage1_accepted_candidate_count', 'failed_items', (history_stage.value -> 'outputs') -> 'failed_items', 'llm_candidate_count', (history_stage.value -> 'outputs') -> 'llm_candidate_count', 'stage2_eligible_rows_total', (history_stage.value -> 'outputs') -> 'stage2_eligible_rows_total', 'stage2_reviewed_rows', (history_stage.value -> 'outputs') -> 'stage2_reviewed_rows', 'llm_usable_provider_target_count', (history_stage.value -> 'outputs') -> 'llm_usable_provider_target_count', 'llm_successful_provider_target_count', (history_stage.value -> 'outputs') -> 'llm_successful_provider_target_count', 'llm_failed_provider_target_count', (history_stage.value -> 'outputs') -> 'llm_failed_provider_target_count', 'llm_failed_model_count', (history_stage.value -> 'outputs') -> 'llm_failed_model_count', 'orders_planned', (history_stage.value -> 'outputs') -> 'orders_planned', 'orders_processed', (history_stage.value -> 'outputs') -> 'orders_processed', 'orders_submitted', (history_stage.value -> 'outputs') -> 'orders_submitted', 'permanent_failure_count', (history_stage.value -> 'outputs') -> 'permanent_failure_count', 'current_blockage', (history_stage.value -> 'outputs') -> 'current_blockage', 'execution_gate_reason', (history_stage.value -> 'outputs') -> 'execution_gate_reason', 'error_message', (history_stage.value -> 'outputs') -> 'error_message', 'stage2_universe_blocker_summary', (history_stage.value -> 'outputs') -> 'stage2_universe_blocker_summary')) ORDER BY history_stage.ordinality) AS json_agg_1 
            FROM json_array_elements(CASE WHEN (json_typeof((polymarket_auto_live_runs.console_projection -> 'stage_results')) = 'array') THEN polymarket_auto_live_runs.console_projection -> 'stage_results' ELSE CAST('[]' AS JSON) END) WITH ORDINALITY AS history_stage(value, ordinality)), CAST('[]' AS JSON))) AS TEXT)) AS list_projection_bytes 
            FROM polymarket_auto_live_runs ORDER BY polymarket_auto_live_runs.started_at DESC, polymarket_auto_live_runs.created_at DESC 
             LIMIT 40;
            ROLLBACK;
            SQL
