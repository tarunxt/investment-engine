name: Verify Bullpen data projection

on:
  push:
    branches:
      - codex/verify-bullpen-data-projection
  pull_request:
    branches:
      - codex/fix-bullpen-auto-run-data-projection

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  backend-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip install --disable-pip-version-check pytest

      - name: Run Bullpen projection and dashboard route contracts
        id: tests
        continue-on-error: true
        env:
          PYTHONPATH: backend
        run: |
          set -o pipefail
          pytest -q \
            backend/tests/test_polymarket_auto_live_console_projection.py \
            backend/tests/test_polymarket_auto_live_router.py \
            2>&1 | tee bullpen-backend-verification.log

      - name: Report verification failure
        if: steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Bullpen projection backend verification failed:'
            echo
            echo '```text'
            tail -n 220 bullpen-backend-verification.log
            echo '```'
          } > /tmp/bullpen-verification-comment.md
          gh pr comment 688 --body-file /tmp/bullpen-verification-comment.md
          exit 1
