name: Verify Bullpen data projection

on:
  push:
    branches:
      - codex/verify-bullpen-data-projection

permissions:
  contents: read

jobs:
  backend-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip install --disable-pip-version-check pytest

      - name: Run Bullpen projection and dashboard route contracts
        env:
          PYTHONPATH: backend
        run: |
          pytest -q \
            backend/tests/test_polymarket_auto_live_console_projection.py \
            backend/tests/test_polymarket_auto_live_router.py
