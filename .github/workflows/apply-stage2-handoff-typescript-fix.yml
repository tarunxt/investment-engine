name: Apply Stage 2 handoff TypeScript fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-test-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-stage2-actionables-stage3-handoff
          fetch-depth: 0

      - name: Apply TypeScript fix
        run: |
          git apply --check .github/patches/stage2-handoff-typescript-fix.patch
          git apply .github/patches/stage2-handoff-typescript-fix.patch
          git diff --check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run focused Stage 3 tests
        working-directory: frontend
        run: |
          node --test \
            tests/bullpen-auto-run-stage3-invest.test.mjs \
            tests/bullpen-stage2-actionables.test.mjs

      - name: Run production build
        working-directory: frontend
        run: npm run build

      - name: Commit fix
        run: |
          git rm \
            .github/workflows/apply-stage2-handoff-typescript-fix.yml \
            .github/patches/stage2-handoff-typescript-fix.patch
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add frontend/app/console/bullpen-ai/_components/BullpenAutoRunScheduleCard.tsx
          git commit -m "fix: type Stage 3 actionable handoff request"
          git push origin HEAD:codex/fix-stage2-actionables-stage3-handoff
