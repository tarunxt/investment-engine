name: Harden Bullpen trigger reservation

on:
  push:
    branches:
      - fix/bullpen-unified-auto-run-trigger
    paths:
      - .github/workflows/harden-bullpen-trigger-reservation.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/bullpen-unified-auto-run-trigger
          fetch-depth: 0

      - name: Commit all scheduler reservations atomically
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/domains/polymarket_auto_live/tasks.py")
          source = path.read_text(encoding="utf-8")
          old = '''            repo.save_state(user_id, state)\n            session.commit()\n            due_user_ids.append(user_id)\n\n    for user_id in due_user_ids:\n'''
          new = '''            repo.save_state(user_id, state)\n            due_user_ids.append(user_id)\n\n        # Keep every claimed due row locked until all next-run reservations in\n        # this Beat batch are durable. An overlapping tick can then claim only\n        # rows that were not part of this batch.\n        session.commit()\n\n    for user_id in due_user_ids:\n'''
          if source.count(old) != 1:
              raise SystemExit("expected scheduler reservation block exactly once")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify backend trigger contract
        run: |
          python -m py_compile backend/app/domains/polymarket_auto_live/tasks.py
          python backend/tests/test_polymarket_auto_live_trigger_unification.py
          git diff --check

      - name: Commit hardening
        run: |
          rm .github/workflows/harden-bullpen-trigger-reservation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden scheduled Auto Run trigger reservation"
          git push origin HEAD:fix/bullpen-unified-auto-run-trigger
