name: Diagnose Final Actionable History

on:
  push:
    branches:
      - codex/diagnose-final-actionable-history-prod
    paths:
      - .github/workflows/diagnose-final-actionable-history.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production stock history
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          timeout: 600s
          command_timeout: 600s
          script: |
            set -euo pipefail
            APP_ROOT="${{ vars.EC2_APP_PATH || '/srv/investment-engine' }}"
            APP_USER="${{ vars.EC2_APP_USER || 'investment-engine' }}"
            if [[ ! -d "$APP_ROOT" && -d /srv/investor ]]; then APP_ROOT=/srv/investor; fi
            if ! id "$APP_USER" >/dev/null 2>&1 && id investor >/dev/null 2>&1; then APP_USER=investor; fi
            echo "PRODUCTION_SHA=$(sudo -u "$APP_USER" -H git -C "$APP_ROOT" rev-parse HEAD)"
            sudo -u "$APP_USER" -H env APP_ROOT="$APP_ROOT" bash -c '
              set -euo pipefail
              set -a
              source /etc/investor/backend.env
              set +a
              cd "$APP_ROOT/backend"
              .venv/bin/python -
            ' <<'PY'
            import app.models  # noqa: F401

            from sqlalchemy import func, select

            from app.domains.auth.models import User
            from app.domains.runs.models import FinalActionableHistory
            from app.infrastructure.database.sync_session import SyncSessionLocal

            with SyncSessionLocal() as db:
                user = db.execute(
                    select(User).where(User.email == "tarun.singh6893@gmail.com")
                ).scalar_one()
                total = db.scalar(
                    select(func.count(FinalActionableHistory.id)).where(
                        FinalActionableHistory.user_id == user.id
                    )
                ) or 0
                print(f"TOTAL_HISTORY_ROWS={total}")
                for symbol in ("SUZLON", "ICICIBANK"):
                    conditions = (
                        FinalActionableHistory.user_id == user.id,
                        FinalActionableHistory.market == "india",
                        FinalActionableHistory.stock_symbol == symbol,
                    )
                    count = db.scalar(
                        select(func.count(FinalActionableHistory.id)).where(*conditions)
                    ) or 0
                    oldest = db.scalar(
                        select(func.min(FinalActionableHistory.covered_at)).where(*conditions)
                    )
                    newest = db.scalar(
                        select(func.max(FinalActionableHistory.covered_at)).where(*conditions)
                    )
                    suggested = db.scalar(
                        select(func.count(FinalActionableHistory.id)).where(
                            *conditions,
                            FinalActionableHistory.coverage_status == "suggested",
                        )
                    ) or 0
                    print(
                        f"STOCK={symbol} COUNT={count} SUGGESTED={suggested} "
                        f"OLDEST={oldest} NEWEST={newest}"
                    )
                    rows = list(
                        db.execute(
                            select(FinalActionableHistory)
                            .where(*conditions)
                            .order_by(
                                FinalActionableHistory.covered_at.asc(),
                                FinalActionableHistory.id.asc(),
                            )
                            .limit(5)
                        ).scalars()
                    )
                    for row in rows:
                        print(
                            "OLDEST_ROW",
                            symbol,
                            row.covered_at,
                            row.coverage_status,
                            row.action,
                            row.score,
                            row.rebalance_run_id,
                        )
            PY
