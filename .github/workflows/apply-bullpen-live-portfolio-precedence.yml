name: Apply Bullpen live portfolio precedence

on:
  push:
    branches:
      - fix/bullpen-live-portfolio-precedence
    paths:
      - .github/workflows/apply-bullpen-live-portfolio-precedence.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-bullpen-live-portfolio-precedence.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/bullpen-live-portfolio-precedence
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply live portfolio precedence fix
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label}, found {count}")
              return text.replace(old, new, 1)

          def replace_between(
              text: str,
              start_marker: str,
              end_marker: str,
              replacement: str,
              label: str,
          ) -> str:
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"Could not find start of {label}")
              end = text.find(end_marker, start + len(start_marker))
              if end < 0:
                  raise SystemExit(f"Could not find end of {label}")
              return text[:start] + replacement + text[end:]

          component_path = Path(
              "frontend/app/console/bullpen-ai/_components/BullpenAutoRunScheduleCard.tsx"
          )
          component = component_path.read_text(encoding="utf-8")

          component = replace_once(
              component,
              'import { resolveLatestVerifiedStage1Portfolio } from "@/lib/bullpenVerifiedPortfolio";',
              '''import {
            resolveLatestVerifiedStage1Portfolio,
            shouldUseVerifiedStage1PortfolioFallback,
          } from "@/lib/bullpenVerifiedPortfolio";''',
              "verified portfolio import",
          )

          component = replace_between(
              component,
              "  const portfolioActivePositions =",
              "  const {\n    activePositionQuestionByKey: stage3PreviewQuestionByKey,",
              '''  // Stage 1 is worker-verified, but it is historical run output and can
          // be older than the current wallet read. Use it only until a portfolio
          // snapshot has loaded; never let it hide fresher live Bullpen positions.
          const useVerifiedStage1Fallback =
            shouldUseVerifiedStage1PortfolioFallback({
              hasActivePositionsSnapshot,
              verifiedPortfolio: verifiedStage1Portfolio,
            });
          const portfolioActivePositions =
            useVerifiedStage1Fallback && verifiedStage1Portfolio
              ? verifiedStage1Portfolio.activePositions
              : activePositions;
          const portfolioHasActivePositionsSnapshot =
            hasActivePositionsSnapshot || useVerifiedStage1Fallback;
          ''',
              "portfolio source selection",
          )

          component = replace_between(
              component,
              "  const liveTradeAmountActivePositions =",
              "  const tradeAmountView = buildConsoleTradeAmountView({",
              '''  const liveTradeAmountActivePositions =
            useVerifiedStage1Fallback && verifiedStage1Portfolio
              ? verifiedStage1Portfolio.occupiedPositions
              : hasActivePositionsSnapshot
                ? activePositions.length
                : portfolioState
                  ? portfolioState.open_positions.filter(
                      (position) => position.shares > 0,
                    ).length
                  : (summary?.state.active_positions ?? null);
          ''',
              "trade amount occupied-position source",
          )

          component = replace_between(
              component,
              "  const tradeAmountView = buildConsoleTradeAmountView({",
              "  const tradeAmountDisplay =",
              '''  const tradeAmountView = buildConsoleTradeAmountView({
            cashInHandUsd:
              liveTradeAmountBalance?.available_balance_usd ??
              (useVerifiedStage1Fallback
                ? (verifiedStage1Portfolio?.cashInHandUsd ?? null)
                : null),
            activePositions: liveTradeAmountActivePositions,
            lastCalculatedTradeAmountUsd:
              summary?.state.last_console_trade_amount_usd ?? null,
            lastCalculatedCashInHandUsd:
              summary?.state.last_console_trade_cash_in_hand_usd ?? null,
            lastCalculatedActivePositions:
              summary?.state.last_console_trade_active_positions ?? null,
            lastCalculatedAvailableSlots:
              summary?.state.last_console_trade_available_slots ?? null,
            lastCalculatedMaxPositions:
              summary?.state.last_console_trade_max_positions ?? null,
          });
          ''',
              "trade amount calculation",
          )

          component = replace_between(
              component,
              "  const tradeAmountSummaryLabel =",
              "\n\n  useEffect(() => {",
              '''  const tradeAmountSummaryLabel =
            tradeAmountView.source === "live"
              ? useVerifiedStage1Fallback
                ? "Using latest Stage 1 fallback"
                : "Preview from current portfolio"
              : tradeAmountView.source === "last-calculated"
                ? "Showing last diagnostic amount"
                : "Waiting for live portfolio data";''',
              "trade amount source label",
          )

          component = replace_between(
              component,
              "          hasActivePositionsSnapshot={portfolioHasActivePositionsSnapshot}",
              "          refreshing={portfolioRefreshing}",
              '''          hasActivePositionsSnapshot={portfolioHasActivePositionsSnapshot}
                    positionsVerifiedByStage1={useVerifiedStage1Fallback}
                    positionsVerifiedAt={
                      useVerifiedStage1Fallback
                        ? (verifiedStage1Portfolio?.verifiedAt ?? null)
                        : null
                    }
                    verifiedCashInHandUsd={
                      useVerifiedStage1Fallback
                        ? (verifiedStage1Portfolio?.cashInHandUsd ?? null)
                        : null
                    }
          ''',
              "portfolio snapshot source props",
          )

          component = replace_between(
              component,
              '                    {tradeAmountView.source === "live"',
              '                      : tradeAmountView.source === "last-calculated"',
              '''                    {tradeAmountView.source === "live"
                              ? useVerifiedStage1Fallback
                                ? "Calculated from the latest completed Stage 1 fallback because a current portfolio snapshot is not available yet. The worker rechecks cash and occupied slots before any live buy."
                                : "Calculated from the latest Bullpen portfolio snapshot as a preview. The worker rechecks occupied slots and fresh balance before any live buy."
          ''',
              "trade amount source explanation",
          )

          component_path.write_text(component, encoding="utf-8")

          helper_path = Path("frontend/lib/bullpenVerifiedPortfolio.ts")
          helper = helper_path.read_text(encoding="utf-8")
          helper_marker = """/**
           * Stage 1 and the portfolio panel historically used separate wallet reads."""
          if "shouldUseVerifiedStage1PortfolioFallback" not in helper:
              marker_index = helper.find(helper_marker)
              if marker_index < 0:
                  raise SystemExit("Could not find verified portfolio helper insertion point")
              helper = (
                  helper[:marker_index]
                  + '''export function shouldUseVerifiedStage1PortfolioFallback({
            hasActivePositionsSnapshot,
            verifiedPortfolio,
          }: {
            hasActivePositionsSnapshot: boolean;
            verifiedPortfolio: VerifiedBullpenStage1Portfolio | null;
          }) {
            return !hasActivePositionsSnapshot && verifiedPortfolio !== null;
          }

          '''
                  + helper[marker_index:]
              )
          helper_path.write_text(helper, encoding="utf-8")

          verified_test_path = Path("frontend/tests/bullpen-verified-portfolio.test.mjs")
          verified_test = verified_test_path.read_text(encoding="utf-8")
          test_name = "live positions snapshot takes precedence over historical Stage 1 portfolio"
          if test_name not in verified_test:
              verified_test += f'''\n\ntest("{test_name}", async () => {{
            const {{
              resolveLatestVerifiedStage1Portfolio,
              shouldUseVerifiedStage1PortfolioFallback,
            }} = await loadVerifiedPortfolioModule();
            const verifiedPortfolio = resolveLatestVerifiedStage1Portfolio([
              run("verified", "2026-07-24T03:13:46Z", []),
            ]);

            assert.equal(
              shouldUseVerifiedStage1PortfolioFallback({{
                hasActivePositionsSnapshot: true,
                verifiedPortfolio,
              }}),
              false,
            );
            assert.equal(
              shouldUseVerifiedStage1PortfolioFallback({{
                hasActivePositionsSnapshot: false,
                verifiedPortfolio,
              }}),
              true,
            );
            assert.equal(
              shouldUseVerifiedStage1PortfolioFallback({{
                hasActivePositionsSnapshot: false,
                verifiedPortfolio: null,
              }}),
              false,
            );
          }});\n'''
          verified_test_path.write_text(verified_test, encoding="utf-8")

          compatibility_test_path = Path("frontend/tests/bullpen-ai-compatibility.test.mjs")
          compatibility_test = compatibility_test_path.read_text(encoding="utf-8")
          integration_test_name = "Bullpen portfolio uses Stage 1 verification only as a live-data fallback"
          if integration_test_name not in compatibility_test:
              compatibility_test += f'''\n\ntest("{integration_test_name}", () => {{
            const source = readFileSync(
              new URL(
                "../app/console/bullpen-ai/_components/BullpenAutoRunScheduleCard.tsx",
                import.meta.url,
              ),
              "utf8",
            );

            assert.match(source, /shouldUseVerifiedStage1PortfolioFallback/);
            assert.match(source, /positionsVerifiedByStage1={{useVerifiedStage1Fallback}}/);
            assert.doesNotMatch(
              source,
              /verifiedStage1Portfolio\\?\\.activePositions \\?\\? activePositions/,
            );
          }});\n'''
          compatibility_test_path.write_text(compatibility_test, encoding="utf-8")

          Path(
              ".github/workflows/apply-bullpen-live-portfolio-precedence.yml"
          ).unlink()
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --fund=false

      - name: Run Bullpen portfolio regressions
        working-directory: frontend
        run: >-
          node --test
          tests/bullpen-verified-portfolio.test.mjs
          tests/bullpen-ai-compatibility.test.mjs

      - name: Build frontend
        working-directory: frontend
        run: npm run build -- --webpack

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prefer live Bullpen portfolio over Stage 1 fallback"
          git push origin HEAD:fix/bullpen-live-portfolio-precedence
