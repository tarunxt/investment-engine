name: Materialize Bullpen position alias fix

on:
  push:
    branches:
      - codex/fix-bullpen-active-position-aliases

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: codex/fix-bullpen-active-position-aliases
          fetch-depth: 0

      - name: Patch Bullpen position parsers and add regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one match in {path}, found {count}: {old!r}")
              file_path.write_text(text.replace(old, new, 1))

          frontend = "frontend/lib/bullpenPositions.ts"

          replace_once(
              frontend,
              "  currentPrice?: unknown;\n  current_price?: unknown;\n",
              "  currentPrice?: unknown;\n  current_price?: unknown;\n  curPrice?: unknown;\n  cur_price?: unknown;\n",
          )
          replace_once(
              frontend,
              "  investedUsd?: unknown;\n  invested_usd?: unknown;\n",
              "  investedUsd?: unknown;\n  invested_usd?: unknown;\n  initialValue?: unknown;\n  initial_value?: unknown;\n",
          )
          replace_once(
              frontend,
              "  pnlPercent?: unknown;\n  pnl_percent?: unknown;\n",
              "  pnlPercent?: unknown;\n  pnl_percent?: unknown;\n  percentPnl?: unknown;\n  percent_pnl?: unknown;\n",
          )
          replace_once(
              frontend,
              "  shares?: unknown;\n",
              "  shares?: unknown;\n  size?: unknown;\n",
          )
          replace_once(
              frontend,
              "  unrealizedPnl?: unknown;\n  unrealized_pnl?: unknown;\n",
              "  unrealizedPnl?: unknown;\n  unrealized_pnl?: unknown;\n  cashPnl?: unknown;\n  cash_pnl?: unknown;\n",
          )
          replace_once(
              frontend,
              '''    "avg_price",\n    "avgPrice",\n    "current_price",\n    "currentPrice",\n    "current_value",\n    "currentValue",\n    "invested_usd",\n    "investedUsd",\n''',
              '''    "avg_price",\n    "avgPrice",\n    "size",\n    "current_price",\n    "currentPrice",\n    "cur_price",\n    "curPrice",\n    "current_value",\n    "currentValue",\n    "invested_usd",\n    "investedUsd",\n    "initial_value",\n    "initialValue",\n    "cash_pnl",\n    "cashPnl",\n    "percent_pnl",\n    "percentPnl",\n''',
          )
          replace_once(
              frontend,
              "  const existingShares = readNumber(existing.shares) || 0;\n  const incomingShares = readNumber(incoming.shares) || 0;\n",
              "  const existingShares = readNumber(existing.shares ?? existing.size) || 0;\n  const incomingShares = readNumber(incoming.shares ?? incoming.size) || 0;\n",
          )
          replace_once(
              frontend,
              '''  const existingCostBasis =\n    readNumber(existing.invested_usd ?? existing.investedUsd) ?? 0;\n  const incomingCostBasis =\n    readNumber(incoming.invested_usd ?? incoming.investedUsd) ?? 0;\n''',
              '''  const existingCostBasis =\n    readNumber(\n      existing.invested_usd ??\n        existing.investedUsd ??\n        existing.initial_value ??\n        existing.initialValue,\n    ) ?? 0;\n  const incomingCostBasis =\n    readNumber(\n      incoming.invested_usd ??\n        incoming.investedUsd ??\n        incoming.initial_value ??\n        incoming.initialValue,\n    ) ?? 0;\n''',
          )
          replace_once(
              frontend,
              "    ((readPrice(existing.current_price ?? existing.currentPrice) ?? 0) * existingShares);\n",
              "    ((readPrice(\n      existing.current_price ??\n        existing.currentPrice ??\n        existing.cur_price ??\n        existing.curPrice,\n    ) ?? 0) * existingShares);\n",
          )
          replace_once(
              frontend,
              "    ((readPrice(incoming.current_price ?? incoming.currentPrice) ?? 0) * incomingShares);\n",
              "    ((readPrice(\n      incoming.current_price ??\n        incoming.currentPrice ??\n        incoming.cur_price ??\n        incoming.curPrice,\n    ) ?? 0) * incomingShares);\n",
          )
          replace_once(
              frontend,
              "  const shares = readNumber(value.shares) || 0;\n",
              "  const shares = readNumber(value.shares ?? value.size) || 0;\n",
          )
          replace_once(
              frontend,
              '''  const costBasis =\n    readNumber(value.invested_usd ?? value.investedUsd) ??\n    (averagePrice !== null ? shares * averagePrice : 0);\n  const currentPrice = readPrice(value.current_price ?? value.currentPrice);\n''',
              '''  const costBasis =\n    readNumber(\n      value.invested_usd ??\n        value.investedUsd ??\n        value.initial_value ??\n        value.initialValue,\n    ) ?? (averagePrice !== null ? shares * averagePrice : 0);\n  const currentPrice = readPrice(\n    value.current_price ??\n      value.currentPrice ??\n      value.cur_price ??\n      value.curPrice,\n  );\n''',
          )
          replace_once(
              frontend,
              "    readNumber(value.unrealized_pnl ?? value.unrealizedPnl) ??\n",
              "    readNumber(\n      value.unrealized_pnl ??\n        value.unrealizedPnl ??\n        value.cash_pnl ??\n        value.cashPnl,\n    ) ??\n",
          )
          replace_once(
              frontend,
              "    readNumber(value.pnl_percent ?? value.pnlPercent) ??\n",
              "    readNumber(\n      value.pnl_percent ??\n        value.pnlPercent ??\n        value.percent_pnl ??\n        value.percentPnl,\n    ) ??\n",
          )

          backend = "backend/app/domains/polymarket_auto_live/console_profile.py"
          replace_once(
              backend,
              '''    "avg_price",\n    "avgPrice",\n    "current_price",\n    "currentPrice",\n    "current_value",\n    "currentValue",\n    "invested_usd",\n    "investedUsd",\n''',
              '''    "avg_price",\n    "avgPrice",\n    "size",\n    "current_price",\n    "currentPrice",\n    "cur_price",\n    "curPrice",\n    "current_value",\n    "currentValue",\n    "invested_usd",\n    "investedUsd",\n    "initial_value",\n    "initialValue",\n    "cash_pnl",\n    "cashPnl",\n    "percent_pnl",\n    "percentPnl",\n''',
          )
          replace_once(
              backend,
              '''        raw_current_price = row.get("current_price")\n        if raw_current_price is None:\n            raw_current_price = row.get("currentPrice")\n''',
              '''        raw_current_price = row.get("current_price")\n        if raw_current_price is None:\n            raw_current_price = row.get("currentPrice")\n        if raw_current_price is None:\n            raw_current_price = row.get("cur_price")\n        if raw_current_price is None:\n            raw_current_price = row.get("curPrice")\n''',
          )
          replace_once(
              backend,
              "        shares = round(_read_number(row.get(\"shares\")) or 0.0, 6)\n",
              '''        shares = round(\n            _read_number(row.get("shares"))\n            or _read_number(row.get("size"))\n            or 0.0,\n            6,\n        )\n''',
          )
          replace_once(
              backend,
              '''                _read_number(row.get("invested_usd"))\n                or _read_number(row.get("investedUsd"))\n                or (shares * (average_price_cents / 100))\n''',
              '''                _read_number(row.get("invested_usd"))\n                or _read_number(row.get("investedUsd"))\n                or _read_number(row.get("initial_value"))\n                or _read_number(row.get("initialValue"))\n                or (shares * (average_price_cents / 100))\n''',
          )

          frontend_test = Path("frontend/tests/bullpen-positions.test.mjs")
          frontend_marker = "standard Polymarket payload aliases remain active Bullpen positions"
          if frontend_marker not in frontend_test.read_text():
              frontend_test.write_text(
                  frontend_test.read_text()
                  + '''\n\ntest("standard Polymarket payload aliases remain active Bullpen positions", async () => {\n  const {\n    extractBullpenCliPositionRows,\n    filterDisplayBullpenPositions,\n    normalizeBullpenPosition,\n    summarizeBullpenPositions,\n  } = await loadBullpenPositionsModule();\n\n  const rows = extractBullpenCliPositionRows({\n    positions: [\n      {\n        conditionId:\n          "0x1111111111111111111111111111111111111111111111111111111111111111",\n        title: "Iran full airspace closure by August 15, 2099?",\n        slug: "iran-full-airspace-closure-by-august-15-2099",\n        eventSlug: "iran-full-airspace-closure-by-august-15-2099",\n        outcome: "No",\n        size: "3.017",\n        avgPrice: "0.60",\n        initialValue: "1.81",\n        curPrice: "0.855",\n        currentValue: "2.58",\n        cashPnl: "0.77",\n        percentPnl: "42.5",\n        endDate: "2099-08-15",\n        redeemable: false,\n      },\n    ],\n  });\n\n  assert.equal(rows.length, 1);\n  const position = normalizeBullpenPosition(rows[0], () => null);\n  const visible = filterDisplayBullpenPositions([position]);\n  const summary = summarizeBullpenPositions(visible, null);\n\n  assert.equal(position.shares, 3.017);\n  assert.equal(position.averagePrice, 0.6);\n  assert.equal(position.costBasis, 1.81);\n  assert.equal(position.currentPrice, 0.855);\n  assert.equal(position.currentValue, 2.58);\n  assert.equal(position.unrealizedPnl, 0.77);\n  assert.equal(position.unrealizedPnlPercent, 42.5);\n  assert.equal(position.economicClassification, "active");\n  assert.equal(visible.length, 1);\n  assert.equal(summary.activeCount, 1);\n});\n'''
              )

          backend_test = Path("backend/tests/test_bullpen_position_payload_aliases.py")
          backend_test.write_text(
              '''from app.domains.polymarket_auto_live.console_profile import (\n    parse_console_wallet_positions_payload,\n)\n\n\ndef test_standard_polymarket_payload_aliases_remain_active_positions() -> None:\n    positions = parse_console_wallet_positions_payload(\n        {\n            "positions": [\n                {\n                    "conditionId": "0x" + ("1" * 64),\n                    "title": "Iran full airspace closure by August 15, 2099?",\n                    "slug": "iran-full-airspace-closure-by-august-15-2099",\n                    "eventSlug": "iran-full-airspace-closure-by-august-15-2099",\n                    "outcome": "No",\n                    "size": "3.017",\n                    "avgPrice": "0.60",\n                    "initialValue": "1.81",\n                    "curPrice": "0.855",\n                    "currentValue": "2.58",\n                    "cashPnl": "0.77",\n                    "percentPnl": "42.5",\n                    "endDate": "2099-08-15",\n                    "redeemable": False,\n                }\n            ]\n        }\n    )\n\n    assert len(positions) == 1\n    position = positions[0]\n    assert position.shares == 3.017\n    assert position.average_price_cents == 60.0\n    assert position.exposure_usd == 1.81\n    assert position.current_price_cents == 85.5\n    assert position.current_value_usd == 2.58\n    assert position.classification == "active"\n'''
          )
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev --prefer-offline --no-audit --fund=false --loglevel=error

      - name: Run frontend position regression
        working-directory: frontend
        run: node --test tests/bullpen-positions.test.mjs

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip install --disable-pip-version-check pytest

      - name: Run backend position regression
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_bullpen_position_payload_aliases.py

      - name: Commit materialized fix
        run: |
          rm .github/workflows/materialize-bullpen-position-alias-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Bullpen active position payload aliases"
          git push origin HEAD:codex/fix-bullpen-active-position-aliases
