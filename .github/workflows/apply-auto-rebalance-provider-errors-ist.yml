name: Apply auto-rebalance provider resilience and IST fixes

on:
  push:
    branches:
      - fix/auto-rebalance-provider-errors-ist
    paths:
      - .github/workflows/apply-auto-rebalance-provider-errors-ist.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auto-rebalance-provider-errors-ist
          fetch-depth: 0

      - name: Apply implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              if old not in text:
                  raise SystemExit(f"Expected snippet not found in {path}: {old[:120]!r}")
              file_path.write_text(text.replace(old, new, 1))

