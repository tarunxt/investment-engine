name: Apply Final Actionable History Patch

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.head_ref == 'codex/persist-final-actionable-history'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply implementation
        run: python3 scripts/fix_apply_final_actionable_history_patch.py

      - name: Validate generated sources
        run: |
          git diff --check
          python3 -m py_compile \
            backend/app/domains/runs/models.py \
            backend/app/domains/runs/schemas.py \
            backend/app/domains/runs/final_actionable_history.py \
            backend/app/domains/runs/router.py \
            backend/app/domains/runs/tasks.py \
            backend/alembic/versions/b5c6d7e8f9g0_add_final_actionable_history.py
          node --test frontend/tests/final-actionables-history-persistence.test.mjs

      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist complete final actionables history"
          git push origin HEAD:${{ github.head_ref }}
