name: Apply and validate final Stage 3 authoritative fixes

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: stage3-authoritative-final
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'codex/fix-stage3-authoritative-final'
    runs-on: ubuntu-24.04
    timeout-minutes: 65

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v7
        with:
          ref: codex/fix-stage3-authoritative-final
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Reassemble and apply Stage 3 authoritative fixes
        id: apply_patch
        continue-on-error: true
        run: |
          set -o pipefail
          {
            set -euo pipefail
            cat \
              scripts/.stage3-followup.part00 \
              scripts/.stage3-followup.part01 \
              scripts/.stage3-followup.part02 \
              scripts/.stage3-followup.part03 \
              scripts/.stage3-followup.part04 \
              scripts/.stage3-followup.part05 \
              scripts/.stage3-followup.part06 \
              > /tmp/stage3-authoritative-followup-v2.patch.gz.b64
            test "$(wc -c < /tmp/stage3-authoritative-followup-v2.patch.gz.b64)" -eq 26212
            echo '8ee5252f13dfca9d85eeb5d10091dfede11c386ea21bb89b34f2131339c22353  /tmp/stage3-authoritative-followup-v2.patch.gz.b64' | sha256sum -c -
            base64 -d /tmp/stage3-authoritative-followup-v2.patch.gz.b64 > /tmp/stage3-authoritative-followup-v2.patch.gz
            echo '9daed39e1b906d4e92409e39d365813e26d571752eb36be112c386c3641132ef  /tmp/stage3-authoritative-followup-v2.patch.gz' | sha256sum -c -
            gzip -d -c /tmp/stage3-authoritative-followup-v2.patch.gz > /tmp/stage3-authoritative-followup-v2.patch
            echo 'c322b20dddfe911b9f8628019dd59dfe1da689d49c0ba291182bd4b1440d0c14  /tmp/stage3-authoritative-followup-v2.patch' | sha256sum -c -
            git apply --check --verbose /tmp/stage3-authoritative-followup-v2.patch
            git apply --verbose /tmp/stage3-authoritative-followup-v2.patch

            test "$(wc -c < scripts/.stage3-followup-v3.incremental.gz.b64)" -eq 1604
            echo 'b1afc438fde6b3ce999249ad6e45797d8acfb52d25262f9e578fea6d58069652  scripts/.stage3-followup-v3.incremental.gz.b64' | sha256sum -c -
            base64 -d scripts/.stage3-followup-v3.incremental.gz.b64 > /tmp/stage3-authoritative-incremental-v3.patch.gz
            echo '25954808eacb30bd7d325cb3ecb20c7ebf6897c669cd93d71f767d8d7db089a7  /tmp/stage3-authoritative-incremental-v3.patch.gz' | sha256sum -c -
            gzip -d -c /tmp/stage3-authoritative-incremental-v3.patch.gz > /tmp/stage3-authoritative-incremental-v3.patch
            echo 'ec0e31274fb3cd4d0da65f002caab8ed6aab091353e9c5fddc902d970eeb75c7  /tmp/stage3-authoritative-incremental-v3.patch' | sha256sum -c -
            git apply --check --verbose /tmp/stage3-authoritative-incremental-v3.patch
            git apply --verbose /tmp/stage3-authoritative-incremental-v3.patch

            test "$(wc -c < scripts/.stage3-followup-v4-debug.gz.b64)" -eq 728
            echo 'e8cf48425e4385621f816687f849af0efc8e8685bbc754bf6b807432918917f9  scripts/.stage3-followup-v4-debug.gz.b64' | sha256sum -c -
            base64 -d scripts/.stage3-followup-v4-debug.gz.b64 > /tmp/stage3-authoritative-incremental-v4-debug.patch.gz
            echo '0e48ec8855605fb3a94e9405c077727c0b0a7aa224fd1a0acf29ed833a47409b  /tmp/stage3-authoritative-incremental-v4-debug.patch.gz' | sha256sum -c -
            gzip -d -c /tmp/stage3-authoritative-incremental-v4-debug.patch.gz > /tmp/stage3-authoritative-incremental-v4-debug.patch
            echo '3aa369e18ed6fb0f96d5ce5d3ce8f0b1d4f622977727e1aefe5695f786485720  /tmp/stage3-authoritative-incremental-v4-debug.patch' | sha256sum -c -
            git apply --check --verbose /tmp/stage3-authoritative-incremental-v4-debug.patch
            git apply --verbose /tmp/stage3-authoritative-incremental-v4-debug.patch

            test "$(wc -c < scripts/.stage3-followup-v5-test-contract.gz.b64)" -eq 1068
            echo '7f5519488b97399a5d563e04dcaa6610972d4d2a952144353483db365d1bd3b8  scripts/.stage3-followup-v5-test-contract.gz.b64' | sha256sum -c -
            base64 -d scripts/.stage3-followup-v5-test-contract.gz.b64 > /tmp/stage3-authoritative-incremental-v5-test-contract.patch.gz
            echo '25cbede62f209bf00049d6a4bfbf2e12f90e70a425023975eb3a2329770c05f5  /tmp/stage3-authoritative-incremental-v5-test-contract.patch.gz' | sha256sum -c -
            gzip -d -c /tmp/stage3-authoritative-incremental-v5-test-contract.patch.gz > /tmp/stage3-authoritative-incremental-v5-test-contract.patch
            echo '65fbdfcda88c2a5179d5ce708c619fdc81059acfd9b20883a986dcefb4dac821  /tmp/stage3-authoritative-incremental-v5-test-contract.patch' | sha256sum -c -
            git apply --check --verbose /tmp/stage3-authoritative-incremental-v5-test-contract.patch
            git apply --verbose /tmp/stage3-authoritative-incremental-v5-test-contract.patch
            git diff --check
          } 2>&1 | tee /tmp/stage3-authoritative-apply.log

      - name: Upload patch diagnostics
        if: steps.apply_patch.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: stage3-authoritative-final-apply-diagnostics
          path: /tmp/stage3-authoritative-apply.log
          retention-days: 2
          if-no-files-found: error

      - name: Stop after patch failure
        if: steps.apply_patch.outcome == 'failure'
        run: exit 1

      - name: Compile backend sources and tests
        run: python -m compileall -q backend/app backend/tests

      - name: Install backend dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip install --disable-pip-version-check pytest

      - name: Run focused backend regressions
        id: backend_tests
        continue-on-error: true
        env:
          PYTHONPATH: backend
        run: |
          set -o pipefail
          pytest -q --tb=long --maxfail=20 \
            backend/tests/test_polymarket_auto_live.py \
            backend/tests/test_polymarket_auto_live_order_intents.py \
            backend/tests/test_polymarket_auto_live_repository_safety.py \
            backend/tests/test_stage2_actionable_handoff.py \
            backend/tests/test_bullpen_run_audit.py \
            backend/tests/test_stage3_slot_allocation.py \
            2>&1 | tee /tmp/stage3-authoritative-backend-tests.log

      - name: Upload backend test diagnostics
        if: steps.backend_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: stage3-authoritative-final-backend-test-diagnostics
          path: /tmp/stage3-authoritative-backend-tests.log
          retention-days: 2
          if-no-files-found: error

      - name: Stop after backend test failure
        if: steps.backend_tests.outcome == 'failure'
        run: exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev --prefer-offline --no-audit --fund=false --loglevel=error

      - name: Run focused frontend regressions
        id: frontend_tests
        continue-on-error: true
        working-directory: frontend
        run: |
          set -o pipefail
          {
            node --test tests/bullpen-stage2-actionables.test.mjs
            node --test tests/bullpen-auto-run-invest-metrics.test.mjs
            node --test tests/bullpen-run-console-detail.test.mjs
            node --test tests/bullpen-auto-run-stage3-invest.test.mjs
            node --test tests/bullpen-auto-run-progress.test.mjs
            node --test tests/bullpen-auto-run-status.test.mjs
          } 2>&1 | tee /tmp/stage3-authoritative-frontend-tests.log

      - name: Upload frontend test diagnostics
        if: steps.frontend_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: stage3-authoritative-final-frontend-test-diagnostics
          path: /tmp/stage3-authoritative-frontend-tests.log
          retention-days: 2
          if-no-files-found: error

      - name: Stop after frontend test failure
        if: steps.frontend_tests.outcome == 'failure'
        run: exit 1

      - name: Build production frontend
        working-directory: frontend
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_URL: https://api.cred-x.in
          NEXT_PUBLIC_FRONTEND_URL: https://cred-x.in
          NEXT_PUBLIC_BRAND_PREFIX: Cred-X
          NEXT_PUBLIC_BRAND_ACRONYM: TIE
          NEXT_PUBLIC_BRAND_EXPANSION: Tarun's Investment Engine
          NEXT_PUBLIC_DISABLE_AUTH: 'false'
          NEXT_PUBLIC_DISABLE_API_PROXY: 'false'
          NEXT_PUBLIC_API_DEBUG: 'false'
          NEXTAUTH_URL: https://cred-x.in
          NEXTAUTH_SECRET: ci-runtime-secret
          AUTH_TRUST_HOST: 'true'
          BACKEND_API_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Commit verified implementation and remove temporary payload
        run: |
          set -euo pipefail
          rm -f scripts/.stage3-followup.part*
          rm -f scripts/.stage3-followup-v3.incremental.gz.b64
          rm -f scripts/.stage3-followup-v4-debug.gz.b64
          rm -f scripts/.stage3-followup-v5-test-contract.gz.b64
          rm -f .github/workflows/apply-stage3-authoritative-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No implementation changes were produced.' >&2
            exit 1
          fi
          git commit -m 'Fix authoritative Stage 3 planned and execution consistency'
          git push origin HEAD:codex/fix-stage3-authoritative-final
