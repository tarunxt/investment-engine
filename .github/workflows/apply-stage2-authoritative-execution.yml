name: Apply and verify Stage 2 authoritative execution

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage2-authoritative-execution
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.ref == 'codex/complete-stage2-authoritative-execution')
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v7
        with:
          ref: codex/complete-stage2-authoritative-execution
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Decode and apply authoritative Stage 2 implementation
        id: apply_patch
        continue-on-error: true
        run: |
          set -o pipefail
          {
            set -euo pipefail
            tr -d '\r\n' < scripts/.stage2-authoritative-single-source.patch.gz.b64 \
              > /tmp/stage2-authoritative-single-source.patch.gz.b64
            echo "encoded_bytes=$(wc -c < /tmp/stage2-authoritative-single-source.patch.gz.b64)"
            sha256sum /tmp/stage2-authoritative-single-source.patch.gz.b64
            test "$(wc -c < /tmp/stage2-authoritative-single-source.patch.gz.b64)" -eq 24512
            echo 'de9dbc790a2161d28b878bb3450572b9bc11c4c63e5aaa89b4c16cd8e0c73dd1  /tmp/stage2-authoritative-single-source.patch.gz.b64' | sha256sum -c -
            base64 -d /tmp/stage2-authoritative-single-source.patch.gz.b64 \
              > /tmp/stage2-authoritative-single-source.patch.gz
            echo 'cfd1005e24946e0f67fd9c7837ad2fe6835abb2af96effafd69a4c8a72a16eb3  /tmp/stage2-authoritative-single-source.patch.gz' | sha256sum -c -
            gzip -d -c /tmp/stage2-authoritative-single-source.patch.gz \
              > /tmp/stage2-authoritative-single-source.patch
            echo '83f0fb70946dd8ae498b25fd7c7a0ae7b7678b4de07eb23df03ea94ba706243e  /tmp/stage2-authoritative-single-source.patch' | sha256sum -c -
            git apply --check --verbose /tmp/stage2-authoritative-single-source.patch
            git apply --verbose /tmp/stage2-authoritative-single-source.patch
            git diff --check
          } 2>&1 | tee /tmp/stage2-authoritative-apply.log

      - name: Upload patch-application diagnostics
        if: steps.apply_patch.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: stage2-authoritative-apply-diagnostics
          path: |
            /tmp/stage2-authoritative-apply.log
            /tmp/stage2-authoritative-single-source.patch
          if-no-files-found: error
          retention-days: 2

      - name: Stop after patch-application failure
        if: steps.apply_patch.outcome == 'failure'
        run: exit 1

      - name: Compile backend sources
        run: python -m compileall -q backend/app

      - name: Install backend test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip install --disable-pip-version-check pytest

      - name: Run focused backend regression suite
        id: backend_tests
        continue-on-error: true
        env:
          PYTHONPATH: backend
        run: |
          set -o pipefail
          pytest -vv --tb=long --maxfail=20 \
            backend/tests/test_stage2_actionable_handoff.py \
            backend/tests/test_polymarket_auto_live_order_intents.py \
            backend/tests/test_bullpen_run_audit.py \
            backend/tests/test_polymarket_auto_live.py \
            backend/tests/test_stage3_slot_allocation.py \
            2>&1 | tee /tmp/stage2-authoritative-backend-tests.log

      - name: Upload backend regression diagnostics
        if: steps.backend_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: stage2-authoritative-backend-test-diagnostics
          path: /tmp/stage2-authoritative-backend-tests.log
          if-no-files-found: error
          retention-days: 2

      - name: Stop after backend regression failure
        if: steps.backend_tests.outcome == 'failure'
        run: exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev --prefer-offline --no-audit --fund=false --loglevel=error

      - name: Run focused frontend regression suite
        id: frontend_tests
        continue-on-error: true
        working-directory: frontend
        run: |
          set -o pipefail
          {
            node --test tests/bullpen-stage2-actionables.test.mjs
            node --test tests/bullpen-auto-run-stage3-invest.test.mjs
            node --test tests/bullpen-auto-run-progress.test.mjs
            node --test tests/bullpen-auto-run-status.test.mjs
          } 2>&1 | tee /tmp/stage2-authoritative-frontend-tests.log

      - name: Upload frontend regression diagnostics
        if: steps.frontend_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: stage2-authoritative-frontend-test-diagnostics
          path: /tmp/stage2-authoritative-frontend-tests.log
          if-no-files-found: error
          retention-days: 2

      - name: Stop after frontend regression failure
        if: steps.frontend_tests.outcome == 'failure'
        run: exit 1

      - name: Build production frontend
        working-directory: frontend
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_URL: https://api.cred-x.in
          NEXT_PUBLIC_FRONTEND_URL: https://cred-x.in
          NEXT_PUBLIC_BRAND_PREFIX: Cred-X
          NEXT_PUBLIC_BRAND_ACRONYM: TIE
          NEXT_PUBLIC_BRAND_EXPANSION: Tarun's Investment Engine
          NEXT_PUBLIC_DISABLE_AUTH: 'false'
          NEXT_PUBLIC_DISABLE_API_PROXY: 'false'
          NEXT_PUBLIC_API_DEBUG: 'false'
          NEXTAUTH_URL: https://cred-x.in
          NEXTAUTH_SECRET: ci-runtime-secret
          AUTH_TRUST_HOST: 'true'
          BACKEND_API_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Commit verified implementation
        run: |
          set -euo pipefail
          rm -f scripts/.stage2-authoritative-single-source.patch.gz.b64
          rm -f scripts/.stage2-patch.part*
          rm -f .github/workflows/apply-stage2-authoritative-execution.yml
          rm -f .github/workflows/export-stage2-authoritative-source.yml
          rm -f .github/workflows/verify-stage2-handoff-production.yml
          rm -f scripts/inspect-production-stage2-handoff.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No implementation changes were produced.' >&2
            exit 1
          fi
          git commit -m 'Make Stage 2 actionables authoritative and executable'
          git push origin HEAD:codex/complete-stage2-authoritative-execution
