name: Apply Stage 2 active-position ticks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

# One-shot implementation workflow; it removes itself after a successful patch.
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/active-position-ticks-stage2
          fetch-depth: 0

      - name: Apply active-position tick UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path} but found {count}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1))

          table = Path("frontend/app/console/bullpen-ai/_components/BullpenQuestionsTable.tsx")
          schedule = Path("frontend/app/console/bullpen-ai/_components/BullpenAutoRunScheduleCard.tsx")

          replace_once(table, "  ArrowUpDown,\n  ExternalLink,\n", "  ArrowUpDown,\n  CheckCircle2,\n  ExternalLink,\n")
          replace_once(table, "  setReturnsPerDayQuestion,\n  rowHighlight,\n}: {", "  setReturnsPerDayQuestion,\n  rowHighlight,\n  isActivePosition,\n}: {")
          replace_once(table, "  setReturnsPerDayQuestion: (question: BullpenQuestionRow) => void;\n  rowHighlight?: BullpenEventSummarySectionKind;\n}) {", "  setReturnsPerDayQuestion: (question: BullpenQuestionRow) => void;\n  rowHighlight?: BullpenEventSummarySectionKind;\n  isActivePosition: boolean;\n}) {")
          replace_once(table, '''          <div className="flex items-start gap-2">\n            <button\n''', '''          <div className="flex items-start gap-2">\n            {isActivePosition ? (\n              <span\n                className="mt-0.5 inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-full border border-emerald-300 bg-emerald-100 text-emerald-700 shadow-sm"\n                aria-label="Current active Bullpen position"\n                title="Current active Bullpen position"\n              >\n                <CheckCircle2 className="h-5 w-5 stroke-[3]" aria-hidden="true" />\n              </span>\n            ) : null}\n            <button\n''')
          replace_once(table, "  rowHighlightById,\n  emptyMessage,", "  rowHighlightById,\n  activePositionQuestionIds,\n  emptyMessage,")
          replace_once(table, '''  rowHighlightById?: Record<\n    string,\n    "active-retained" | "event-exit" | "new-opportunity"\n  >;\n  emptyMessage: string;''', '''  rowHighlightById?: Record<\n    string,\n    "active-retained" | "event-exit" | "new-opportunity"\n  >;\n  activePositionQuestionIds?: ReadonlySet<string>;\n  emptyMessage: string;''')
          replace_once(table, "                            rowHighlight,\n                          }),", "                            rowHighlight,\n                            isActivePosition:\n                              activePositionQuestionIds?.has(question.id) ?? false,\n                          }),")

          helper_anchor = '''function getRunWorkflowStageResult(\n  run: BullpenAutoLiveRun | null | undefined,\n'''
          helper = '''function buildStageTwoActivePositionQuestionIds({\n  rows,\n  activePositions,\n}: {\n  rows: BullpenQuestionRow[];\n  activePositions: BullpenActivePositionView[];\n}) {\n  const activeQuestionIds = new Set<string>();\n  const unmatchedRows = [...rows];\n\n  activePositions\n    .filter(isActiveBullpenPosition)\n    .forEach((position) => {\n      const result = BullpenEventIdentityResolver.resolveMatch({\n        target: buildBullpenEventIdentityFromPosition(position),\n        candidates: unmatchedRows,\n        getIdentity: BullpenEventIdentityResolver.fromQuestion,\n      });\n      const matchedRow =\n        result.status === "matched" ? (result.match?.item ?? null) : null;\n      if (!matchedRow) return;\n\n      activeQuestionIds.add(matchedRow.id);\n      const matchedIndex = unmatchedRows.findIndex(\n        (row) => row.id === matchedRow.id,\n      );\n      if (matchedIndex >= 0) unmatchedRows.splice(matchedIndex, 1);\n    });\n\n  return activeQuestionIds;\n}\n\n'''
          replace_once(schedule, helper_anchor, helper + helper_anchor)
          replace_once(schedule, '''export function StageTwoLlmRunDetailsDialog({\n  state,\n  onClose,\n}: {\n  state: StageTwoLlmRunDialogState;\n  onClose: () => void;\n}) {''', '''export function StageTwoLlmRunDetailsDialog({\n  state,\n  activePositions = [],\n  onClose,\n}: {\n  state: StageTwoLlmRunDialogState;\n  activePositions?: BullpenActivePositionView[];\n  onClose: () => void;\n}) {''')
          replace_once(schedule, '''  const eventsSummaryRows = buildStageTwoEventsSummaryRows(\n    reviewedRows,\n    state.decisions,\n    state.run?.id ?? null,\n    eventsSummaryAsOfTimestamp,\n  );\n  const availableLlmDecisionRows = llmTableRows.filter(''', '''  const eventsSummaryRows = buildStageTwoEventsSummaryRows(\n    reviewedRows,\n    state.decisions,\n    state.run?.id ?? null,\n    eventsSummaryAsOfTimestamp,\n  );\n  const activePositionQuestionIds = buildStageTwoActivePositionQuestionIds({\n    rows: eventsSummaryRows,\n    activePositions,\n  });\n  const availableLlmDecisionRows = llmTableRows.filter(''')
          replace_once(schedule, "                rowsOverride={eventsSummaryRows}\n                emptyMessage=", "                rowsOverride={eventsSummaryRows}\n                activePositionQuestionIds={activePositionQuestionIds}\n                emptyMessage=")
          replace_once(schedule, '''          <StageTwoLlmRunDetailsDialog\n            state={refreshedStageTwoLlmRunDialog}\n            onClose={() => setStageTwoLlmRunDialog(null)}\n          />''', '''          <StageTwoLlmRunDetailsDialog\n            state={refreshedStageTwoLlmRunDialog}\n            activePositions={activePositions}\n            onClose={() => setStageTwoLlmRunDialog(null)}\n          />''')

          Path("frontend/tests/bullpen-stage-two-active-position-ticks.test.mjs").write_text('''import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport test from "node:test";\n\nconst tableSource = readFileSync(new URL("../app/console/bullpen-ai/_components/BullpenQuestionsTable.tsx", import.meta.url), "utf8");\nconst scheduleSource = readFileSync(new URL("../app/console/bullpen-ai/_components/BullpenAutoRunScheduleCard.tsx", import.meta.url), "utf8");\n\ntest("Stage 2 Events Summary marks current active Bullpen positions with a large green tick", () => {\n  assert.match(tableSource, /activePositionQuestionIds\\?: ReadonlySet<string>/);\n  assert.match(tableSource, /Current active Bullpen position/);\n  assert.match(tableSource, /CheckCircle2 className="h-5 w-5 stroke-\\[3\\]"/);\n  assert.match(scheduleSource, /function buildStageTwoActivePositionQuestionIds/);\n  assert.match(scheduleSource, /buildBullpenEventIdentityFromPosition\\(position\\)/);\n  assert.match(scheduleSource, /getIdentity: BullpenEventIdentityResolver\\.fromQuestion/);\n  assert.match(scheduleSource, /activePositionQuestionIds=\\{activePositionQuestionIds\\}/);\n  assert.match(scheduleSource, /activePositions=\\{activePositions\\}/);\n});\n''')
          Path(".github/workflows/codex-active-position-ticks-stage2.yml").unlink()
          PY

      - name: Run focused frontend tests
        working-directory: frontend
        run: node --test tests/bullpen-stage-two-active-position-ticks.test.mjs tests/bullpen-auto-run-stage-output-dialog.test.mjs

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show active Bullpen positions in Stage 2 summary"
          git push origin HEAD:codex/active-position-ticks-stage2
