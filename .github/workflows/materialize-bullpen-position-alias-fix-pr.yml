name: Materialize Bullpen position alias fix on PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Execute embedded materializer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/materialize-bullpen-position-alias-fix.yml')
          source = workflow.read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          embedded = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(textwrap.dedent(embedded), str(workflow), 'exec'))
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev --prefer-offline --no-audit --fund=false --loglevel=error

      - name: Run frontend position regression
        working-directory: frontend
        run: node --test tests/bullpen-positions.test.mjs

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip install --disable-pip-version-check pytest

      - name: Run backend position regression
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_bullpen_position_payload_aliases.py

      - name: Commit materialized fix
        run: |
          rm .github/workflows/materialize-bullpen-position-alias-fix.yml
          rm .github/workflows/materialize-bullpen-position-alias-fix-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Bullpen active position payload aliases"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
