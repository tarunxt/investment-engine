name: Apply Stage 2 actionables handoff

on:
  push:
    branches:
      - codex/fix-stage2-actionables-stage3-handoff
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-stage2-actionables-handoff
  cancel-in-progress: false

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-stage2-actionables-stage3-handoff
          fetch-depth: 0

      - name: Apply implementation patch
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_BLOB_SHA: bbe0c184c56a526355dadc6d2c9441e9fe2efcf0
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${PATCH_BLOB_SHA}" --jq .content \
            | tr -d '\n' \
            | base64 -d > /tmp/stage2-actionables-handoff.patch
          git apply --check /tmp/stage2-actionables-handoff.patch
          git apply /tmp/stage2-actionables-handoff.patch
          git diff --check

      - name: Validate backend syntax
        run: |
          python -m py_compile \
            backend/app/domains/polymarket_auto_live/engine.py \
            backend/app/domains/polymarket_auto_live/schemas.py \
            backend/tests/test_stage2_actionable_handoff.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run focused frontend tests
        working-directory: frontend
        run: |
          node --test \
            tests/bullpen-auto-run-stage3-invest.test.mjs \
            tests/bullpen-stage2-actionables.test.mjs

      - name: Commit implementation
        run: |
          git rm .github/workflows/inspect-stage3-actionables.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add backend frontend
          git commit -m "fix: preserve Stage 2 actionables in Stage 3"
          git push origin HEAD:codex/fix-stage2-actionables-stage3-handoff
