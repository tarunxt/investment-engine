name: Apply Stage 2 actionables handoff

on:
  push:
    branches:
      - codex/fix-stage2-actionables-stage3-handoff
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-stage2-actionables-handoff
  cancel-in-progress: false

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-stage2-actionables-stage3-handoff
          fetch-depth: 0

      - name: Expand and verify implementation patch
        run: |
          gzip -dc .github/patches/stage2-actionables-stage3-handoff.patch.gz \
            > /tmp/stage2-actionables-stage3-handoff.patch
          echo "f42ca5a3db36485ba852fd6d6b71f07186c5ece80da8c7bff65e837abc9e4ca2  /tmp/stage2-actionables-stage3-handoff.patch" \
            | sha256sum --check
          git apply --check /tmp/stage2-actionables-stage3-handoff.patch
          git apply /tmp/stage2-actionables-stage3-handoff.patch
          git diff --check

      - name: Validate backend syntax
        run: |
          python -m py_compile \
            backend/app/domains/polymarket_auto_live/engine.py \
            backend/app/domains/polymarket_auto_live/schemas.py \
            backend/tests/test_stage2_actionable_handoff.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run focused frontend tests
        working-directory: frontend
        run: |
          node --test \
            tests/bullpen-auto-run-stage3-invest.test.mjs \
            tests/bullpen-stage2-actionables.test.mjs

      - name: Commit implementation
        run: |
          git rm \
            .github/workflows/inspect-stage3-actionables.yml \
            .github/patches/stage2-actionables-stage3-handoff.patch \
            .github/patches/stage2-actionables-stage3-handoff.patch.gz
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add backend frontend
          git commit -m "fix: preserve Stage 2 actionables in Stage 3"
          git push origin HEAD:codex/fix-stage2-actionables-stage3-handoff
