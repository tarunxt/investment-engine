name: Diagnose Stage 2 implementation apply

on:
  push:
    branches:
      - codex/fix-stage2-actionables-stage3-handoff
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-stage2-actionables-stage3-handoff
          fetch-depth: 0

      - name: Capture apply diagnostics
        run: |
          set +e
          {
            echo '== branch =='
            git status --short --branch
            echo '== compressed file =='
            ls -l .github/patches/stage2-actionables-stage3-handoff.patch.gz
            sha256sum .github/patches/stage2-actionables-stage3-handoff.patch.gz
            git hash-object .github/patches/stage2-actionables-stage3-handoff.patch.gz
            gzip -t .github/patches/stage2-actionables-stage3-handoff.patch.gz
            echo "gzip_status=$?"
            gzip -dc .github/patches/stage2-actionables-stage3-handoff.patch.gz > /tmp/stage2-handoff.patch
            echo "expand_status=$?"
            wc -c /tmp/stage2-handoff.patch
            sha256sum /tmp/stage2-handoff.patch
            git hash-object /tmp/stage2-handoff.patch
            echo '== patch check =='
            git apply --check --verbose /tmp/stage2-handoff.patch
            echo "apply_status=$?"
            echo '== file hashes =='
            git hash-object \
              backend/app/domains/polymarket_auto_live/engine.py \
              backend/app/domains/polymarket_auto_live/schemas.py \
              frontend/app/console/bullpen-ai/_components/BullpenAutoRunScheduleCard.tsx \
              frontend/app/console/bullpen-ai/_components/bullpenAutoRunStage3Invest.ts \
              frontend/tests/bullpen-auto-run-stage3-invest.test.mjs \
              frontend/types/api.ts
          } > implementation-apply-diagnostics.txt 2>&1
          cat implementation-apply-diagnostics.txt

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: stage2-implementation-apply-diagnostics
          path: implementation-apply-diagnostics.txt
          if-no-files-found: error
