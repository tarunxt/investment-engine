name: Diagnose Stage 2 actionables handoff patch

on:
  push:
    branches:
      - codex/fix-stage2-actionables-stage3-handoff
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-stage2-actionables-stage3-handoff
          fetch-depth: 0

      - name: Capture patch diagnostics
        run: |
          set +e
          {
            echo '== branch =='
            git status --short --branch
            echo '== patch stat =='
            git apply --stat .github/patches/stage2-actionables-stage3-handoff.patch
            echo '== patch summary =='
            git apply --summary .github/patches/stage2-actionables-stage3-handoff.patch
            echo '== verbose check =='
            git apply --check --verbose .github/patches/stage2-actionables-stage3-handoff.patch
            echo "apply_status=$?"
            echo '== relevant file hashes =='
            git hash-object \
              backend/app/domains/polymarket_auto_live/engine.py \
              backend/app/domains/polymarket_auto_live/schemas.py \
              frontend/app/console/bullpen-ai/_components/BullpenAutoRunScheduleCard.tsx \
              frontend/app/console/bullpen-ai/_components/bullpenAutoRunStage3Invest.ts \
              frontend/tests/bullpen-auto-run-stage3-invest.test.mjs \
              frontend/types/api.ts
          } > stage3-patch-diagnostics.txt 2>&1
          cat stage3-patch-diagnostics.txt

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: stage3-patch-diagnostics
          path: stage3-patch-diagnostics.txt
          if-no-files-found: error
