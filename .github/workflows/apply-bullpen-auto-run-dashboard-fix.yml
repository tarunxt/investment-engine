name: Apply Bullpen auto-run dashboard fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/scripts/apply_bullpen_auto_run_dashboard_fix.py
      - .github/workflows/apply-bullpen-auto-run-dashboard-fix.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/fix-bullpen-auto-run-dashboard-timeout

      - name: Refine applicator for current test fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply_bullpen_auto_run_dashboard_fix.py')
          text = path.read_text(encoding='utf-8')
          label = '        label="dashboard route reader monkeypatch",\n    )'
          label_start = text.index(label)
          block_start = text.rfind('    text = replace_once(', 0, label_start)
          block_end = label_start + len(label)
          if block_start < 0:
              raise SystemExit('could not locate dashboard reader monkeypatch replacement')
          replacement = """    text = replace_once(
              text,
              '''    monkeypatch.setattr(
                  "app.domains.polymarket_auto_live.router._get_bot",
                  fake_get_bot,
              )
              monkeypatch.setattr(
                  "app.domains.polymarket_auto_live.router._attach_latest_active_auth",
                  fake_attach_auth,
              )
          ''',
              '''    monkeypatch.setattr(
                  "app.domains.polymarket_auto_live.router._read_dashboard_summary",
                  fake_read_dashboard_summary,
              )
              monkeypatch.setattr(
                  "app.domains.polymarket_auto_live.router._attach_latest_active_auth",
                  fake_attach_auth,
              )
          ''',
              label="dashboard route reader monkeypatch",
          )"""
          path.write_text(
              text[:block_start] + replacement + text[block_end:],
              encoding='utf-8',
          )
          PY

      - name: Apply source and regression-test changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          output="$(python .github/scripts/apply_bullpen_auto_run_dashboard_fix.py 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [[ $status -ne 0 ]]; then
            body="$(printf 'One-shot fix applicator failed:\n\n```text\n%s\n```' "$output")"
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
            exit "$status"
          fi

      - name: Validate transformed sources
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          for path in (
              Path('backend/app/domains/polymarket_auto_live/router.py'),
              Path('backend/app/domains/polymarket_auto_live/bot.py'),
              Path('backend/tests/test_polymarket_auto_live_router.py'),
          ):
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          PY
          grep -q 'timeoutMs: 5_000' frontend/app/console/bullpen-ai/_components/BullpenAutoRunScheduleCard.tsx
          grep -q 'bullpen_auto_run_dashboard_poll_degraded' frontend/app/console/bullpen-ai/_components/BullpenAutoRunScheduleCard.tsx
          grep -q '_read_dashboard_summary(credentials)' backend/app/domains/polymarket_auto_live/router.py
          git diff --check

      - name: Remove one-shot helper files
        run: |
          rm .github/scripts/apply_bullpen_auto_run_dashboard_fix.py
          rm .github/workflows/apply-bullpen-auto-run-dashboard-fix.yml

      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Bullpen auto-run dashboard polling'
          git push origin HEAD:codex/fix-bullpen-auto-run-dashboard-timeout
