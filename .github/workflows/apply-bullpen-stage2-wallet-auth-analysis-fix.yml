name: Apply Bullpen Stage 2 wallet auth analysis fix

on:
  push:
    branches:
      - fix/bullpen-stage2-wallet-auth-analysis

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v7
        with:
          ref: fix/bullpen-stage2-wallet-auth-analysis
          fetch-depth: 0

      - name: Apply focused Stage 1 to Stage 2 degradation fix
        run: |
          python - <<'PY'
          from pathlib import Path

          engine_path = Path('backend/app/domains/polymarket_auto_live/engine.py')
          source = engine_path.read_text()
          old = '''        except Exception as exc:\n            if not _is_stage1_wallet_handoff_timeout(exc):\n                _cancel_background_task(console_balance_task)\n                reason = (\n                    "Stage 1 failed because Cred-X could not refresh fresh Bullpen wallet positions: "\n                    f"{exc}"\n                )\n                return fail_stage_one_wallet_refresh(reason)\n\n            recovered_snapshot = await recover_stage1_wallet_snapshot(\n                f"transient-{getattr(exc, 'classification', 'timeout')}"\n            )\n            if recovered_snapshot is None:\n                _cancel_background_task(live_wallet_positions_task)\n                stage1_wallet_refresh_error = (\n                    "Fresh Bullpen wallet refresh timed out and bounded recovery "\n                    "could not obtain a recent verified shared snapshot."\n                )\n                live_wallet_positions = []\n            else:\n                live_wallet_snapshot = recovered_snapshot\n                live_wallet_positions = recovered_snapshot.positions\n'''
          new = '''        except Exception as exc:\n            # A wallet refresh failure must not erase independently scanned Stage 1\n            # candidates. Active-position reconciliation and Stage 3 execution still\n            # require verified wallet evidence, but Stage 2 can safely analyze fresh\n            # candidate markets while bounded recovery tries to restore that evidence.\n            failure_classification = getattr(exc, "classification", None)\n            recovery_trigger = (\n                "transient-timeout"\n                if _is_stage1_wallet_handoff_timeout(exc)\n                else f"wallet-refresh-{failure_classification or 'error'}"\n            )\n            recovered_snapshot = await recover_stage1_wallet_snapshot(recovery_trigger)\n            if recovered_snapshot is None:\n                _cancel_background_task(live_wallet_positions_task)\n                stage1_wallet_refresh_error = (\n                    "Fresh Bullpen wallet refresh failed and bounded recovery could "\n                    "not obtain a recent verified shared snapshot. Stage 2 will review "\n                    "new candidates only; Stage 3 remains blocked. "\n                    f"Wallet error: {exc}"\n                )\n                live_wallet_positions = []\n            else:\n                live_wallet_snapshot = recovered_snapshot\n                live_wallet_positions = recovered_snapshot.positions\n'''
          if source.count(old) != 1:
              raise SystemExit(f'Expected exactly one wallet-failure block, found {source.count(old)}')
          source = source.replace(old, new)
          engine_path.write_text(source)

          test_path = Path('backend/tests/test_polymarket_auto_live_stage1_wallet_degradation_contract.py')
          test_path.write_text('''from pathlib import Path\n\n\nENGINE_SOURCE = (\n    Path(__file__).resolve().parents[1]\n    / "app"\n    / "domains"\n    / "polymarket_auto_live"\n    / "engine.py"\n).read_text()\n\n\ndef test_non_timeout_wallet_failure_keeps_candidate_only_stage2_available():\n    assert "if not _is_stage1_wallet_handoff_timeout(exc):" not in ENGINE_SOURCE\n    assert (\n        "Stage 1 failed because Cred-X could not refresh fresh Bullpen wallet positions"\n        not in ENGINE_SOURCE\n    )\n    assert "recovered_snapshot = await recover_stage1_wallet_snapshot(recovery_trigger)" in ENGINE_SOURCE\n    assert "Stage 2 will review new candidates only; Stage 3 remains blocked." in ENGINE_SOURCE\n    assert '"stage2_candidate_only": bool(stage1_wallet_refresh_error)' in ENGINE_SOURCE\n    assert '"blocked_by_stage1_wallet_refresh": True' in ENGINE_SOURCE\n\n\ndef test_wallet_failure_recovery_preserves_timeout_and_auth_classification():\n    assert '"transient-timeout"' in ENGINE_SOURCE\n    assert "wallet-refresh-{failure_classification or 'error'}" in ENGINE_SOURCE\n''')

          docs_path = Path('docs/bullpen-run-audit.md')
          docs = docs_path.read_text()
          marker = '## Candidate-only Stage 2 after wallet-read failure'
          if marker not in docs:
              docs += '''\n\n## Candidate-only Stage 2 after wallet-read failure\n\nFor the Bullpen console top-10 profile, a failure to refresh the verified wallet\nsnapshot (including authentication/session failures, timeouts, or other runtime\nread errors) is execution-degrading rather than candidate-analysis-blocking. The\nrun first attempts the existing bounded recent verified-snapshot recovery. If no\nverified wallet evidence is available, Stage 1 records the wallet error as a\nwarning and Stage 2 may still review the independently scanned **new candidate**\nmarkets with the run's frozen LLM target selection. Active-position review is\nomitted for that pass and `stage2_candidate_only` /\n`blocked_by_stage1_wallet_refresh` remain frozen in the run evidence. Stage 3 is\nkept blocked: no exits, sizing, order planning, or submission may use the\ncandidate-only result until verified wallet evidence is restored. Historical\nfrozen snapshots are not rewritten.\n'''
              docs_path.write_text(docs)
          PY

      - name: Remove one-shot workflow from final diff
        run: git rm .github/workflows/apply-bullpen-stage2-wallet-auth-analysis-fix.yml

      - name: Validate focused regression and syntax
        run: |
          python -m compileall -q backend/app/domains/polymarket_auto_live/engine.py
          cd backend
          python -m pytest -q \
            tests/test_polymarket_auto_live_stage1_wallet_degradation_contract.py \
            tests/test_polymarket_auto_live_stage1_runtime.py

      - name: Commit and push final fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/domains/polymarket_auto_live/engine.py \
                  backend/tests/test_polymarket_auto_live_stage1_wallet_degradation_contract.py \
                  docs/bullpen-run-audit.md
          git commit -m 'Allow candidate-only Stage 2 when Bullpen wallet refresh fails'
          git push origin HEAD:fix/bullpen-stage2-wallet-auth-analysis
