      CREDX_STAGE04_DATABASE_URL: postgresql+psycopg2://stage04:stage04@postgres:5432/credx_stage04_test
      CREDX_STAGE04_DATABASE_ACK: disposable-docker-only
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install backend fixture dependencies and real disposable Redis
        run: |
          apt-get update
          apt-get install -y --no-install-recommends redis-server
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip install --disable-pip-version-check pytest==8.4.2 pytest-asyncio==1.4.0 aiosqlite==0.22.1
      - name: Upgrade, downgrade and re-upgrade only disposable Stage04 DB
        run: python backend/scripts/verify_stage04_migration.py
      - name: Run real concurrency, restart, crash, duplicate and retry contracts
        run: pytest -q --junitxml=/tmp/stage04.xml backend/tests/test_stage04_idempotency_postgres.py
      - name: Require every Stage04 contract to execute
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/stage04.xml').getroot()
          assert not root.findall('.//testcase/skipped'), 'Stage04 contracts must not skip'
          assert len(root.findall('.//testcase')) >= 10, 'Stage04 contract selection incomplete'
          print('All Stage04 real PostgreSQL/Redis contracts executed.')
