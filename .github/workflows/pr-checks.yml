name: Apply and verify Stage 2 actionables full-pipeline fix

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'codex/fix-stage2-actionables-full-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout the PR head branch
        uses: actions/checkout@v7
        with:
          ref: codex/fix-stage2-actionables-full-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Decode and apply the permanent source patch
        run: |
          set -o pipefail
          : > /tmp/stage2-actionables-patch-error.log
          {
            base64 -d scripts/.stage2-actionables-fix.py.gz.b64 | gzip -d > /tmp/apply_stage2_actionables_stage3_fix.py
            python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply_stage2_actionables_stage3_fix.py')
          source = path.read_text(encoding='utf-8')
          old = """    '        set_run_stage_result(\\n            run,\\n            build_workflow_stage_result(\\n                stage_number=3,\\n',
              '        initial_stage3_planned_exit_count = len(\\n"""
          new = """    '            \"decision_rows_persisted\": 0,\\n        }\\n        set_run_stage_result(\\n            run,\\n            build_workflow_stage_result(\\n                stage_number=3,\\n',
              '            \"decision_rows_persisted\": 0,\\n        }\\n        initial_stage3_planned_exit_count = len(\\n"""
          if old not in source:
              raise SystemExit('Runtime patch anchor for Stage 3 initial checkpoint was not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
            python /tmp/apply_stage2_actionables_stage3_fix.py
          } 2>&1 | tee /tmp/stage2-actionables-patch-error.log

      - name: Upload patch diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stage2-actionables-patch-diagnostics
          path: |
            /tmp/stage2-actionables-patch-error.log
            /tmp/apply_stage2_actionables_stage3_fix.py
          if-no-files-found: error
          retention-days: 2

      - name: Compile backend sources
        run: python -m compileall -q backend/app

      - name: Install backend test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip install --disable-pip-version-check pytest

      - name: Run focused backend regression tests
        env:
          PYTHONPATH: backend
        run: |
          pytest -q \
            backend/tests/test_stage2_actionable_handoff.py \
            backend/tests/test_polymarket_auto_live_stage1_runtime.py \
            backend/tests/test_stage3_slot_allocation.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev --prefer-offline --no-audit --fund=false --loglevel=error

      - name: Run focused frontend regression tests
        working-directory: frontend
        run: |
          node --test tests/bullpen-stage2-stage3-planned-handoff.test.mjs
          node --test tests/bullpen-auto-run-stage3-invest.test.mjs
          node --test tests/bullpen-auto-run-progress.test.mjs

      - name: Build the production frontend
        working-directory: frontend
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_URL: https://api.cred-x.in
          NEXT_PUBLIC_FRONTEND_URL: https://cred-x.in
          NEXT_PUBLIC_BRAND_PREFIX: Cred-X
          NEXT_PUBLIC_BRAND_ACRONYM: TIE
          NEXT_PUBLIC_BRAND_EXPANSION: Tarun's Investment Engine
          NEXT_PUBLIC_DISABLE_AUTH: 'false'
          NEXT_PUBLIC_DISABLE_API_PROXY: 'false'
          NEXT_PUBLIC_API_DEBUG: 'false'
          NEXTAUTH_URL: https://cred-x.in
          NEXTAUTH_SECRET: ci-runtime-secret
          AUTH_TRUST_HOST: 'true'
          BACKEND_API_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Commit the verified source implementation
        run: |
          set -euo pipefail
          git fetch origin main
          rm -f scripts/.stage2-actionables-fix.py.gz.b64
          rm -f scripts/stage2-actionables-patch-error.log
          rm -f .github/workflows/apply-stage2-actionables-full-pipeline.yml
          git checkout origin/main -- .github/workflows/pr-checks.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No source changes were produced.'
            exit 1
          fi
          git commit -m 'Fix Stage 2 actionables and wallet handoff into Stage 3 Planned'
          git push origin HEAD:codex/fix-stage2-actionables-full-pipeline
