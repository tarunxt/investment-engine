name: Format auto-rebalance fixes

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Format changed backend files
        shell: bash
        run: |
          python3 -m pip install --quiet black==26.3.1
          black \
            backend/app/domains/ai_providers/availability.py \
            backend/app/domains/ai_providers/factory.py \
            backend/app/domains/ai_providers/router.py \
            backend/app/domains/portfolio_events/target_resolution.py \
            backend/app/domains/runs/use_cases/create_run.py \
            backend/app/domains/zerodha/events_router.py \
            backend/app/domains/zerodha/threats_router.py \
            backend/app/domains/indmoney_us/events_router.py \
            backend/app/domains/indmoney_us/threats_router.py

      - name: Format inserted frontend callbacks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("frontend/services/api.ts")
          lines = path.read_text().splitlines()
          formatted = []
          in_callback = False
          for line in lines:
              if line == "        async (item) => {":
                  in_callback = True
                  formatted.append(line)
                  continue
              if in_callback and line == "        },":
                  in_callback = False
                  formatted.append(line)
                  continue
              if in_callback and line:
                  formatted.append("          " + line)
              else:
                  formatted.append(line)
          path.write_text("\n".join(formatted) + "\n")
          PY
          git diff --check

      - name: Commit formatted application files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend
          git commit -m "Format auto-rebalance resilience changes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
