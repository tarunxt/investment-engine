name: Commit validated auto-rebalance fixes

on:
  pull_request:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply validated implementation
        shell: bash
        run: |
          git show origin/main:.github/workflows/pr-checks.yml > .github/workflows/pr-checks.yml
          python3 - <<'RUNNER'
          from pathlib import Path

          workflow = Path(".github/workflows/apply-auto-rebalance-provider-errors-ist.yml").read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          raw_implementation = workflow[start:end]
          implementation = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in raw_implementation.splitlines()
          ) + "\n"

          helper_start = implementation.index("def replace_once(")
          helper_end = implementation.index(
              '\n\nPath("backend/app/domains/ai_providers/availability.py")',
              helper_start,
          )
          tolerant_helper = (
              "def replace_once(path: str, old: str, new: str) -> None:\n"
              "    file_path = Path(path)\n"
              "    text = file_path.read_text()\n"
              "    if old in text:\n"
              "        file_path.write_text(text.replace(old, new, 1))\n"
              "        return\n"
              "    source_lines = text.splitlines(keepends=True)\n"
              "    needle = [line.strip() for line in old.strip('\\n').splitlines()]\n"
              "    for index in range(0, len(source_lines) - len(needle) + 1):\n"
              "        candidate = [line.strip() for line in source_lines[index:index + len(needle)]]\n"
              "        if candidate == needle:\n"
              "            file_path.write_text(''.join(source_lines[:index]) + new + ''.join(source_lines[index + len(needle):]))\n"
              "            return\n"
              "    raise SystemExit(f'Expected snippet not found in {path}: {old[:120]!r}')\n"
          )
          implementation = (
              implementation[:helper_start]
              + tolerant_helper
              + implementation[helper_end:]
          )
          exec(compile(implementation, "apply-auto-rebalance-fix.py", "exec"))
          RUNNER

      - name: Commit application files
        shell: bash
        run: |
          git restore --source=HEAD --staged --worktree \
            .github/workflows/pr-checks.yml \
            .github/workflows/apply-auto-rebalance-provider-errors-ist.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend
          git commit -m "Fix auto-rebalance provider failures and IST timestamps"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
