name: Pull Request Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-syntax:
    name: Backend Python syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compile backend Python sources
        run: python3 -m compileall -q backend/app

  backend-performance-regressions:
    name: Backend dashboard performance contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip install --disable-pip-version-check pytest aiosqlite==0.22.1

      - name: Run dashboard and Bullpen scan contract tests
        env:
          PYTHONPATH: backend
        run: >-
          pytest -q
          backend/tests/test_sports_rankings.py
          backend/tests/test_sports_ranking_integrity.py
          backend/tests/test_bullpen_run_audit.py
          backend/tests/test_sports_ranking_participants.py
          backend/tests/test_sports_rankings_read_projection.py
          backend/tests/test_sports_catalogue_summary.py
          backend/tests/test_sports_participant_read_cache.py
          backend/tests/test_sports_master.py
          backend/tests/test_cricket_rankings.py
          backend/tests/test_database_outage.py
          backend/tests/test_completion_notifications.py
          backend/tests/test_auto_rebalance_audit_durability.py
          backend/tests/test_auto_rebalance_run_sequence.py
          backend/tests/test_run_completion_email.py
          backend/tests/test_dashboard_summary.py
          backend/tests/test_indmoney_us_parser.py
          backend/tests/test_indmoney_snapshot_validation.py
          backend/tests/test_portfolio_analysis_read_projection.py
          backend/tests/test_cost_dashboard_cache.py
          backend/tests/test_cost_drivers_router.py
          backend/tests/test_api_usage_attempts.py
          backend/tests/test_api_usage_coverage.py
          backend/tests/test_api_usage_reconciliation.py
          backend/tests/test_job_usage_identity.py
          backend/tests/test_output_contracts.py
          backend/tests/test_output_consistency.py
          backend/tests/test_output_source_context.py
          backend/tests/test_output_runtime.py
          backend/tests/test_output_runtime_cancellation.py
          backend/tests/test_job_table_validation.py
          backend/tests/test_deepseek_provider.py
          backend/tests/test_openai_provider.py
          backend/tests/test_google_sheets_output_contracts.py
          backend/tests/test_google_sheets_tasks.py
          backend/tests/test_trade_analysis_display.py
          backend/tests/test_final_actionable_history_identity.py
          backend/tests/test_final_actionable_history_parser.py
          backend/tests/test_final_actionable_history_completion_trigger.py
          backend/tests/test_final_actionable_history_task_contract.py
          backend/tests/test_urgent_actionables_history.py
          backend/tests/test_universal_scan_auto_run.py
          backend/tests/test_universal_export_integrity.py
          backend/tests/test_universal_stage1_handoff_repair.py
          backend/tests/test_bullpen_sports_filter_profile.py
          backend/tests/test_polymarket_auto_live_trigger_unification.py
          backend/tests/test_polymarket_auto_live_stage1_runtime.py
          backend/tests/test_polymarket_auto_live.py::test_console_profile_runs_candidate_only_stage_2_after_wallet_handoff_timeout
          backend/tests/test_polymarket_auto_live_lifecycle_safety.py
          backend/tests/test_polymarket_auto_live_run_recovery.py
          backend/tests/test_polymarket_auto_live_event_trends_stage2.py
          backend/tests/test_polymarket_auto_live_history_workspaces.py
          backend/tests/test_bullpen_trend_snapshot.py
          backend/tests/test_polymarket_auto_live_router.py
          backend/tests/test_polymarket_auto_live_console_projection.py
          backend/tests/test_polymarket_auto_live_history_pagination.py
          backend/tests/test_polymarket_passive_reads.py
          backend/tests/test_polymarket_runtime_router.py
          backend/tests/test_bullpen_passive_healthcheck.py
          backend/tests/test_trading_bots_passive_summary.py
          backend/tests/test_polymarket_auto_live.py::test_trading_bots_summary_returns_four_cards_in_order

  backend-audit-concurrency:
    name: Workflow audit PostgreSQL concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit_test
          POSTGRES_PASSWORD: audit_test
          POSTGRES_DB: credx_audit_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit_test -d credx_audit_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip install --disable-pip-version-check pytest aiosqlite==0.22.1
      - name: Verify workflow concurrency and bounded source queries
        env:
          PYTHONPATH: backend
          CREDX_AUDIT_TEST_DATABASE_URL: postgresql+asyncpg://audit_test:audit_test@127.0.0.1:5432/credx_audit_test_ci
          CREDX_AUDIT_TEST_DATABASE_ACK: disposable-local-only
        run: pytest -q backend/tests/test_auto_rebalance_audit_postgres.py backend/tests/test_output_source_context_postgres.py

  deployment-contracts:
    name: Deployment scope, artifact, slot, and rollback tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check deployment shell syntax
        run: |
          bash -n \
            deploy/no-docker/redeploy.sh \
            deploy/no-docker/scripts/configure-postgres-recovery.sh \
            deploy/no-docker/package-frontend-artifact.sh \
            deploy/no-docker/scripts/run-frontend.sh \
            scripts/release-prod.sh

      - name: Run deployment contract tests
        run: |
          node --test \
            scripts/detect-deploy-scope.test.mjs \
            scripts/check-javascript-budgets.test.mjs \
            scripts/high-traffic-response-inventory.test.mjs \
            deploy/no-docker/frontend-artifact.test.mjs \
            deploy/no-docker/postgres-recovery.test.mjs \
            deploy/no-docker/redeploy-contract.test.mjs \
            deploy/no-docker/deploy-storage-safety.test.mjs \
            deploy/no-docker/redeploy-transaction.test.mjs \
            deploy/no-docker/repair-next-runtime-artifacts.test.mjs

  frontend-regressions:
    name: Frontend dashboard regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --include=dev --prefer-offline --no-audit --fund=false --loglevel=error

      - name: Run dashboard regression tests
        run: >-
          node --test
          tests/api-read-fallbacks.test.mjs
          tests/universal-export-retention.test.mjs
          tests/sports-rankings-recovery.test.mjs
          tests/sports-rankings-summary.test.mjs
          tests/sports-rankings-error-dialog.test.mjs
          tests/bounded-api-transport.test.mjs
          tests/bullpen-proxy-timeout-budget.test.mjs
          tests/bullpen-history-portfolio.test.mjs
          tests/runtime-performance-regressions.test.mjs
          tests/bullpen-server-auth.test.mjs
          tests/dashboard-refresh-errors.test.mjs
          tests/dashboard-portfolio-totals.test.mjs
          tests/rebalance-workflow-resilience.test.mjs
          tests/auto-rebalance-audit-persistence.test.mjs
          tests/rebalance-stage-inputs.test.mjs
          tests/output-source-jobs.test.mjs
          tests/output-consistency-notice.test.mjs
          tests/auto-rebalance-provider-errors-ist.test.mjs
          tests/bullpen-auto-run-status.test.mjs
          tests/bullpen-auto-run-history.test.mjs
          tests/runs-history-loading.test.mjs
          tests/full-run-history.test.mjs
          tests/final-actionables-run-identity.test.mjs
          tests/final-actionables-consensus-denominator.test.mjs
          tests/final-actionables-history-persistence.test.mjs
          tests/final-actionables-position-context.test.mjs
          tests/final-actionables-calculation-performance.test.mjs
          tests/actionable-quantity-display.test.mjs
          tests/final-actionables-optional-cache.test.mjs
          tests/investment-recommendation-fallback.test.mjs
          tests/investment-recommendation-schema.test.mjs
          tests/portfolio-analysis-read-budgets.test.mjs
          tests/trade-analysis-execution.test.mjs
          tests/bullpen-auto-live-passive-read.test.mjs
          tests/polymarket-bot-passive-read.test.mjs
          tests/polymarket-bot-ec2-commands.test.mjs
          tests/trading-bots-passive-summary.test.mjs
          tests/bullpen-sports-workspace.test.mjs
          tests/bullpen-event-clusters.test.mjs
          tests/bullpen-claim-returns.test.mjs

  frontend-build-benchmark:
    name: Frontend ${{ matrix.bundler }} cold build and runtime verification
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    continue-on-error: ${{ matrix.bundler == 'turbopack' }}
    strategy:
      fail-fast: false
      matrix:
        bundler:
          - webpack
          - turbopack

    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_STANDALONE_BUILD: "true"
      NEXT_PUBLIC_API_URL: https://api.cred-x.in
      NEXT_PUBLIC_FRONTEND_URL: https://cred-x.in
      NEXT_PUBLIC_BRAND_PREFIX: Cred-X
      NEXT_PUBLIC_BRAND_ACRONYM: TIE
      NEXT_PUBLIC_BRAND_EXPANSION: Tarun's Investment Engine
      NEXT_PUBLIC_DISABLE_AUTH: "false"
      NEXT_PUBLIC_DISABLE_API_PROXY: "false"
      NEXT_PUBLIC_API_DEBUG: "false"
      NEXTAUTH_URL: https://cred-x.in
      NEXTAUTH_SECRET: ci-runtime-secret
      AUTH_TRUST_HOST: "true"
      BACKEND_API_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev --prefer-offline --no-audit --fund=false --loglevel=error

      - name: Log cold-build runner resources
        run: |
          echo "==> CPU"
          nproc
          echo "==> Memory"
          free -h
          echo "==> Swap"
          swapon --show || true
          echo "==> Disk"
          df -h "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"

      - name: Stamp benchmark fingerprint
        run: |
          node scripts/stamp-frontend-build.mjs \
            frontend/lib/generatedBuildInfo.ts \
            "${GITHUB_SHA}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Run isolated cold production build
        id: benchmark
        working-directory: frontend
        env:
          BUNDLER: ${{ matrix.bundler }}
        run: |
          set -o pipefail
          rm -rf .next
          started_at="$(date +%s)"
          if [[ "$BUNDLER" == "webpack" ]]; then
            build_command=(npm run build)
          else
            build_command=(npm run build)
          fi
          set +e
          /usr/bin/time -v \
            -o "${RUNNER_TEMP}/frontend-${BUNDLER}-resources.txt" \
            "${build_command[@]}" 2>&1 |
            tee "${RUNNER_TEMP}/frontend-${BUNDLER}-build.log"
          build_status="${PIPESTATUS[0]}"
          set -e
          echo "seconds=$(( $(date +%s) - started_at ))" >>"${GITHUB_OUTPUT}"
          cat "${RUNNER_TEMP}/frontend-${BUNDLER}-resources.txt"
          exit "$build_status"

      - name: Package benchmark artifact
        id: package
        env:
          BUNDLER: ${{ matrix.bundler }}
        run: |
          deploy/no-docker/package-frontend-artifact.sh \
            frontend/.next \
            "${RUNNER_TEMP}/frontend-${BUNDLER}.tar.gz" \
            "${GITHUB_SHA}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${BUNDLER}"
          mkdir "${RUNNER_TEMP}/frontend-${BUNDLER}-runtime"
          tar -xzf "${RUNNER_TEMP}/frontend-${BUNDLER}.tar.gz" \
            -C "${RUNNER_TEMP}/frontend-${BUNDLER}-runtime"

      - name: Install Chromium for authenticated render checks
        if: matrix.bundler == 'webpack'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Verify authenticated render and lazy route behavior
        if: matrix.bundler == 'webpack'
        working-directory: frontend
        run: npm run test:playwright-hardening

      - name: Verify fingerprint, auth, routes, assets, and backend proxy
        id: runtime
        env:
          BUNDLER: ${{ matrix.bundler }}
        run: |
          node scripts/verify-frontend-artifact-runtime.mjs \
            "${RUNNER_TEMP}/frontend-${BUNDLER}-runtime" \
            "${GITHUB_SHA}"

      - name: Record benchmark result
        if: always()
        env:
          BUNDLER: ${{ matrix.bundler }}
          BUILD_OUTCOME: ${{ steps.benchmark.outcome }}
          BUILD_SECONDS: ${{ steps.benchmark.outputs.seconds }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
        run: |
          peak_rss_kb="$(
            awk -F: '/Maximum resident set size/ {
              sub(/^[[:space:]]*/, "", $2)
              print $2
            }' "${RUNNER_TEMP}/frontend-${BUNDLER}-resources.txt" 2>/dev/null ||
              true
          )"
          jq -n \
            --arg bundler "$BUNDLER" \
            --arg build_outcome "${BUILD_OUTCOME:-unknown}" \
            --arg package_outcome "${PACKAGE_OUTCOME:-unknown}" \
            --arg runtime_outcome "${RUNTIME_OUTCOME:-unknown}" \
            --arg seconds "${BUILD_SECONDS:-}" \
            --arg peak_rss_kb "${peak_rss_kb:-}" \
            '{
              bundler: $bundler,
              build_outcome: $build_outcome,
              package_outcome: $package_outcome,
              runtime_outcome: $runtime_outcome,
              compatibility: (
                if (
                  $build_outcome == "success" and
                  $package_outcome == "success" and
                  $runtime_outcome == "success"
                )
                then "passed"
                else "failed"
                end
              ),
              seconds: $seconds,
              peak_rss_kb: $peak_rss_kb
            }' >"${RUNNER_TEMP}/frontend-${BUNDLER}-benchmark.json"

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-${{ matrix.bundler }}-benchmark-result
          path: ${{ runner.temp }}/frontend-${{ matrix.bundler }}-benchmark.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-${{ matrix.bundler }}-benchmark
          path: |
            ${{ runner.temp }}/frontend-${{ matrix.bundler }}-resources.txt
            ${{ runner.temp }}/frontend-${{ matrix.bundler }}-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Add benchmark summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.bundler }} frontend benchmark"
            echo
            echo "- Cold build duration: ${{ steps.benchmark.outputs.seconds || 'n/a' }}s"
            echo "- Production selection: Webpack remains the safe deployment artifact."
            echo "- Runtime gate: fingerprint, login/auth, dashboard, Bullpen AI, JS/CSS, and backend proxy."
          } >>"${GITHUB_STEP_SUMMARY}"

  frontend-build-comparison:
    name: Compare Webpack and Turbopack production builds
    needs: frontend-build-benchmark
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download benchmark results
        uses: actions/download-artifact@v8
        with:
          pattern: frontend-*-benchmark-result
          path: benchmark-results
          merge-multiple: true

      - name: Publish side-by-side benchmark
        run: |
          webpack_result="benchmark-results/frontend-webpack-benchmark.json"
          turbopack_result="benchmark-results/frontend-turbopack-benchmark.json"
          test -f "$webpack_result"
          test -f "$turbopack_result"

          {
            echo "### Webpack vs Turbopack cold production build"
            echo
            echo "| Bundler | Compatibility gate | Duration | Peak RSS | Production |"
            echo "| --- | --- | ---: | ---: | --- |"
            for result in "$webpack_result" "$turbopack_result"; do
              bundler="$(jq -r '.bundler' "$result")"
              outcome="$(jq -r '.compatibility' "$result")"
              seconds="$(jq -r '.seconds | if . == "" then "n/a" else . + "s" end' "$result")"
              peak_rss="$(jq -r '.peak_rss_kb | if . == "" then "n/a" else . + " KiB" end' "$result")"
              if [[ "$bundler" == "webpack" ]]; then
                selection="selected"
              else
                selection="benchmark only"
              fi
              echo "| $bundler | $outcome | $seconds | $peak_rss | $selection |"
            done
            echo
            echo "Webpack remains mandatory for production artifacts. A successful Turbopack benchmark is compatibility evidence only."
          } >>"${GITHUB_STEP_SUMMARY}"
