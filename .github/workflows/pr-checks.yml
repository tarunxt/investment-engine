  frontend-build-benchmark:
    name: Frontend ${{ matrix.bundler }} cold build and runtime verification
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ matrix.bundler == 'webpack' && 40 || 25 }}
    continue-on-error: ${{ matrix.bundler == 'turbopack' }}
    strategy:
      fail-fast: false
      matrix:
        bundler:
          - webpack
          - turbopack

    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_STANDALONE_BUILD: "true"
      NEXT_PUBLIC_API_URL: https://api.cred-x.in
      NEXT_PUBLIC_FRONTEND_URL: https://cred-x.in
      NEXT_PUBLIC_BRAND_PREFIX: Cred-X
      NEXT_PUBLIC_BRAND_ACRONYM: TIE
      NEXT_PUBLIC_BRAND_EXPANSION: Tarun's Investment Engine
      NEXT_PUBLIC_DISABLE_AUTH: "false"
      NEXT_PUBLIC_DISABLE_API_PROXY: "false"
      NEXT_PUBLIC_API_DEBUG: "false"
      NEXTAUTH_URL: https://cred-x.in
      AUTH_TRUST_HOST: "true"
      BACKEND_API_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev --prefer-offline --no-audit --fund=false --loglevel=error

      - name: Generate ephemeral benchmark authentication fixture
        run: |
          node - <<'JS'
          const { randomBytes } = require('node:crypto');
          const { appendFileSync } = require('node:fs');
          const value = randomBytes(32).toString('hex');
          console.log(`::add-mask::${value}`);
          appendFileSync(process.env.GITHUB_ENV, `NEXTAUTH_SECRET=${value}\n`);
          JS

      - name: Verify Stage18 browser receipt contracts
        working-directory: frontend
        run: node --test scripts/stage18-browser-evidence.test.mjs

      - name: Log cold-build runner resources
        run: |
          echo "==> CPU"
          nproc
          echo "==> Memory"
          free -h
          echo "==> Swap"
          swapon --show || true
          echo "==> Disk"
          df -h "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"

      - name: Stamp benchmark fingerprint
        run: |
          node scripts/stamp-frontend-build.mjs \
            frontend/lib/generatedBuildInfo.ts \
            "${SOURCE_SHA}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Run isolated cold production build
        id: benchmark
        working-directory: frontend
        env:
          BUNDLER: ${{ matrix.bundler }}
        run: |
          set -o pipefail
          rm -rf .next
          started_at="$(date +%s)"
          if [[ "$BUNDLER" == "webpack" ]]; then
            build_command=(npm run build)
          else
            build_command=(npm run build)
          fi
          set +e
          /usr/bin/time -v \
            -o "${RUNNER_TEMP}/frontend-${BUNDLER}-resources.txt" \
            "${build_command[@]}" 2>&1 |
            tee "${RUNNER_TEMP}/frontend-${BUNDLER}-build.log"
          build_status="${PIPESTATUS[0]}"
          set -e
          echo "seconds=$(( $(date +%s) - started_at ))" >>"${GITHUB_OUTPUT}"
          cat "${RUNNER_TEMP}/frontend-${BUNDLER}-resources.txt"
          exit "$build_status"

      - name: Package benchmark artifact
        id: package
        env:
          BUNDLER: ${{ matrix.bundler }}
        run: |
          deploy/no-docker/package-frontend-artifact.sh \
            frontend/.next \
            "${RUNNER_TEMP}/frontend-${BUNDLER}.tar.gz" \
            "${SOURCE_SHA}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${BUNDLER}"
          mkdir "${RUNNER_TEMP}/frontend-${BUNDLER}-runtime"
          tar -xzf "${RUNNER_TEMP}/frontend-${BUNDLER}.tar.gz" \
            -C "${RUNNER_TEMP}/frontend-${BUNDLER}-runtime"

      - name: Install Chromium for authenticated render checks
        if: matrix.bundler == 'webpack'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Verify authenticated render and lazy route behavior
        if: matrix.bundler == 'webpack'
        working-directory: frontend
        env:
          STAGE18_BROWSER_RECEIPT: ${{ runner.temp }}/stage18-browser-receipt.json
        run: npm run test:playwright-hardening

      - name: Retain exact-source Stage18 browser result
        if: always() && matrix.bundler == 'webpack'
        uses: actions/upload-artifact@v7
        with:
          name: stage18-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/stage18-browser-receipt.json
          if-no-files-found: warn
          retention-days: 7

      - name: Verify fingerprint, auth, routes, assets, and backend proxy
        id: runtime
        env:
          BUNDLER: ${{ matrix.bundler }}
        run: |
          node scripts/verify-frontend-artifact-runtime.mjs \
            "${RUNNER_TEMP}/frontend-${BUNDLER}-runtime" \
            "${SOURCE_SHA}"

      - name: Set up Python for linked fake browser acceptance
        if: matrix.bundler == 'webpack'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install existing synthetic backend dependencies
        if: matrix.bundler == 'webpack'
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt aiosqlite

      - name: Verify real UI with isolated linked fake backend
        if: matrix.bundler == 'webpack'
        timeout-minutes: 15
        working-directory: frontend
        env:
          LINKED_BROWSER_EVIDENCE: ${{ runner.temp }}/linked-browser-evidence
        run: node scripts/linked-preview-playwright.mjs

      - name: Retain linked fake browser evidence
        if: always() && matrix.bundler == 'webpack'
        uses: actions/upload-artifact@v7
        with:
          name: linked-fake-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/linked-browser-evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Record benchmark result
        if: always()
        env:
          BUNDLER: ${{ matrix.bundler }}
          BUILD_OUTCOME: ${{ steps.benchmark.outcome }}
          BUILD_SECONDS: ${{ steps.benchmark.outputs.seconds }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
        run: |
          peak_rss_kb="$(
            awk -F: '/Maximum resident set size/ {
              sub(/^[[:space:]]*/, "", $2)
              print $2
            }' "${RUNNER_TEMP}/frontend-${BUNDLER}-resources.txt" 2>/dev/null ||
              true
          )"
          jq -n \
            --arg bundler "$BUNDLER" \
            --arg build_outcome "${BUILD_OUTCOME:-unknown}" \
            --arg package_outcome "${PACKAGE_OUTCOME:-unknown}" \
            --arg runtime_outcome "${RUNTIME_OUTCOME:-unknown}" \
            --arg seconds "${BUILD_SECONDS:-}" \
            --arg peak_rss_kb "${peak_rss_kb:-}" \
            '{
              bundler: $bundler,
              build_outcome: $build_outcome,
              package_outcome: $package_outcome,
              runtime_outcome: $runtime_outcome,
              compatibility: (
                if (
                  $build_outcome == "success" and
                  $package_outcome == "success" and
                  $runtime_outcome == "success"
                )
                then "passed"
                else "failed"
                end
              ),
              seconds: $seconds,
              peak_rss_kb: $peak_rss_kb
            }' >"${RUNNER_TEMP}/frontend-${BUNDLER}-benchmark.json"

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-${{ matrix.bundler }}-benchmark-result
          path: ${{ runner.temp }}/frontend-${{ matrix.bundler }}-benchmark.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-${{ matrix.bundler }}-benchmark
          path: |
            ${{ runner.temp }}/frontend-${{ matrix.bundler }}-resources.txt
            ${{ runner.temp }}/frontend-${{ matrix.bundler }}-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Add benchmark summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.bundler }} frontend benchmark"
            echo
            echo "- Cold build duration: ${{ steps.benchmark.outputs.seconds || 'n/a' }}s"
            echo "- Production selection: Webpack remains the safe deployment artifact."
            echo "- Runtime gate: fingerprint, login/auth, dashboard, Bullpen AI, JS/CSS, and backend proxy."
          } >>"${GITHUB_STEP_SUMMARY}"

  frontend-build-comparison:
    name: Compare Webpack and Turbopack production builds
    needs: frontend-build-benchmark
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download benchmark results
        uses: actions/download-artifact@v8
        with:
          pattern: frontend-*-benchmark-result
          path: benchmark-results
          merge-multiple: true

      - name: Publish side-by-side benchmark
        run: |
          webpack_result="benchmark-results/frontend-webpack-benchmark.json"
          turbopack_result="benchmark-results/frontend-turbopack-benchmark.json"
          test -f "$webpack_result"
          test -f "$turbopack_result"

          {
            echo "### Webpack vs Turbopack cold production build"
            echo
            echo "| Bundler | Compatibility gate | Duration | Peak RSS | Production |"
            echo "| --- | --- | ---: | ---: | --- |"
            for result in "$webpack_result" "$turbopack_result"; do
              bundler="$(jq -r '.bundler' "$result")"
              outcome="$(jq -r '.compatibility' "$result")"
              seconds="$(jq -r '.seconds | if . == "" then "n/a" else . + "s" end' "$result")"
              peak_rss="$(jq -r '.peak_rss_kb | if . == "" then "n/a" else . + " KiB" end' "$result")"
              if [[ "$bundler" == "webpack" ]]; then
                selection="selected"
              else
                selection="benchmark only"
              fi
              echo "| $bundler | $outcome | $seconds | $peak_rss | $selection |"
            done
            echo
            echo "Webpack remains mandatory for production artifacts. A successful Turbopack benchmark is compatibility evidence only."
          } >>"${GITHUB_STEP_SUMMARY}"

  uat2-native-package:
    name: UAT2 native isolated contracts and Linux package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install isolated test dependencies
        run: python -m pip install -r backend/requirements.txt pytest-asyncio aiosqlite
      - name: Test UAT2 native configuration and application contracts
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql+psycopg2://synthetic_test:unused@127.0.0.1:1/uat2_unit_only
          REDIS_URL: redis://127.0.0.1:1/15
          ENVIRONMENT: test
          AUTH_DISABLED: 'false'
        run: |
          python -m unittest discover -s deploy/uat2/native -p 'test_*.py' -v
          pytest -q backend/tests/test_uat2_policy.py backend/tests/test_uat2_runtime.py backend/tests/test_google_signin.py
      - name: Build and validate native release without credentials or deployment
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          deploy/uat2/native/build.sh "$RUNNER_TEMP/uat2-native-package"
          python deploy/uat2/native/ctl.py inspect-bundle "$RUNNER_TEMP/uat2-native-package"
      - name: Audit complete native bundle before retention
        run: python deploy/uat2/native/package.py audit "$RUNNER_TEMP/uat2-native-package"
      - name: Retain complete deployable native bundle
        id: native-bundle
        uses: actions/upload-artifact@v7
        with:
          name: uat2-native-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/uat2-native-package
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Download retained bundle for integrity round trip
        uses: actions/download-artifact@v8
        with:
          name: uat2-native-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/uat2-native-roundtrip
      - name: Verify retained content and offline dependency installation
        run: |
          python deploy/uat2/native/package.py offline-check "$RUNNER_TEMP/uat2-native-roundtrip" | tee "$RUNNER_TEMP/uat2-native-retention-verification.json"
      - name: Retain verification receipt
        uses: actions/upload-artifact@v7
        with:
          name: uat2-native-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/uat2-native-retention-verification.json
          retention-days: 1
          if-no-files-found: error

  stage09-rollback-rehearsal:
    name: Historical Stage09 ccb0b3c4 PostgreSQL16 rollback rehearsal (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: [direct_restore, downgrade_then_restore]
    container: python:3.13-bookworm
    services:
      postgres:
        image: postgres:16-bookworm
        env:
