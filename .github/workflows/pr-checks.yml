name: Apply auto-rebalance provider resilience and IST fixes

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Restore final PR checks and apply implementation
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          cat > .github/workflows/pr-checks.yml <<'EOF'
          name: Pull Request Checks

          on:
            pull_request:

          permissions:
            contents: read

          jobs:
            frontend:
              name: Frontend build and dashboard regression tests
              runs-on: ubuntu-latest
              timeout-minutes: 20

              defaults:
                run:
                  working-directory: frontend

              env:
                NODE_ENV: production
                NEXTAUTH_URL: http://localhost:3000
                NEXTAUTH_SECRET: pull-request-check-secret
                NEXT_PUBLIC_FRONTEND_URL: http://localhost:3000
                BACKEND_API_URL: http://127.0.0.1:8000

              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Set up Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                    cache-dependency-path: frontend/package-lock.json

                - name: Install frontend dependencies
                  run: npm ci --no-audit --fund=false

                - name: Run dashboard regression tests
                  run: >-
                    node --test
                    tests/bullpen-server-auth.test.mjs
                    tests/dashboard-refresh-errors.test.mjs

                - name: Build frontend
                  run: npm run build -- --webpack 2>&1 | tee frontend-build.log

                - name: Upload frontend build log
                  if: failure()
                  uses: actions/upload-artifact@v4
                  with:
                    name: frontend-build-log
                    path: frontend/frontend-build.log
                    if-no-files-found: error
          EOF

          set +e
          python3 - <<'RUNNER' > apply-auto-rebalance.log 2>&1
          from pathlib import Path

          workflow = Path(".github/workflows/apply-auto-rebalance-provider-errors-ist.yml").read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          raw_implementation = workflow[start:end]
          implementation = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in raw_implementation.splitlines()
          ) + "\n"
          exec(compile(implementation, "apply-auto-rebalance-fix.py", "exec"))
          RUNNER
          status=$?
          set -e
          echo "$status" > apply-auto-rebalance.status
          cat apply-auto-rebalance.log
          exit "$status"

      - name: Upload implementation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-rebalance-implementation-diagnostics
          path: |
            apply-auto-rebalance.log
            apply-auto-rebalance.status
          if-no-files-found: error

      - name: Stop after implementation failure
        if: steps.apply.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --fund=false

      - name: Validate implementation
        shell: bash
        run: |
          python3 -m py_compile \
            backend/app/domains/ai_providers/availability.py \
            backend/app/domains/ai_providers/factory.py \
            backend/app/domains/portfolio_events/target_resolution.py \
            backend/app/domains/runs/use_cases/create_run.py \
            backend/app/domains/jobs/tasks.py \
            backend/app/domains/ai_providers/router.py \
            backend/app/domains/zerodha/events_router.py \
            backend/app/domains/zerodha/threats_router.py \
            backend/app/domains/indmoney_us/events_router.py \
            backend/app/domains/indmoney_us/threats_router.py
          node --test \
            frontend/tests/auto-rebalance-provider-errors-ist.test.mjs \
            frontend/tests/rebalance-workflow-resilience.test.mjs \
            frontend/tests/bullpen-server-auth.test.mjs \
            frontend/tests/dashboard-refresh-errors.test.mjs
          npm --prefix frontend run build -- --webpack
          git diff --check

      - name: Commit implementation to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f apply-auto-rebalance.log apply-auto-rebalance.status
          git add -A
          git commit -m "Fix auto-rebalance provider failures and IST timestamps"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
