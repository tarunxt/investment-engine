name: Pull Request Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and dashboard regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    env:
      NODE_ENV: production
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: pull-request-check-secret
      NEXT_PUBLIC_FRONTEND_URL: http://localhost:3000
      BACKEND_API_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --fund=false

      - name: Run dashboard regression tests
        run: >-
          node --test
          tests/bullpen-server-auth.test.mjs
          tests/dashboard-refresh-errors.test.mjs
          tests/auto-rebalance-provider-errors-ist.test.mjs

      - name: Build frontend
        run: npm run build -- --webpack 2>&1 | tee frontend-build.log

      - name: Upload frontend build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-log
          path: frontend/frontend-build.log
          if-no-files-found: error
