name: Package auto-rebalance provider resilience and IST fixes

on:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply validated implementation
        shell: bash
        run: |
          cat > .github/workflows/pr-checks.yml <<'EOF'
          name: Pull Request Checks

          on:
            pull_request:

          permissions:
            contents: read

          jobs:
            frontend:
              name: Frontend build and dashboard regression tests
              runs-on: ubuntu-latest
              timeout-minutes: 20

              defaults:
                run:
                  working-directory: frontend

              env:
                NODE_ENV: production
                NEXTAUTH_URL: http://localhost:3000
                NEXTAUTH_SECRET: pull-request-check-secret
                NEXT_PUBLIC_FRONTEND_URL: http://localhost:3000
                BACKEND_API_URL: http://127.0.0.1:8000

              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Set up Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                    cache-dependency-path: frontend/package-lock.json

                - name: Install frontend dependencies
                  run: npm ci --no-audit --fund=false

                - name: Run dashboard regression tests
                  run: >-
                    node --test
                    tests/bullpen-server-auth.test.mjs
                    tests/dashboard-refresh-errors.test.mjs

                - name: Build frontend
                  run: npm run build -- --webpack 2>&1 | tee frontend-build.log

                - name: Upload frontend build log
                  if: failure()
                  uses: actions/upload-artifact@v4
                  with:
                    name: frontend-build-log
                    path: frontend/frontend-build.log
                    if-no-files-found: error
          EOF

          python3 - <<'RUNNER'
          from pathlib import Path

          workflow = Path(".github/workflows/apply-auto-rebalance-provider-errors-ist.yml").read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          raw_implementation = workflow[start:end]
          implementation = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in raw_implementation.splitlines()
          ) + "\n"

          helper_start = implementation.index("def replace_once(")
          helper_end = implementation.index(
              '\n\nPath("backend/app/domains/ai_providers/availability.py")',
              helper_start,
          )
          tolerant_helper = (
              "def replace_once(path: str, old: str, new: str) -> None:\n"
              "    file_path = Path(path)\n"
              "    text = file_path.read_text()\n"
              "    if old in text:\n"
              "        file_path.write_text(text.replace(old, new, 1))\n"
              "        return\n"
              "    source_lines = text.splitlines(keepends=True)\n"
              "    needle = [line.strip() for line in old.strip('\\n').splitlines()]\n"
              "    for index in range(0, len(source_lines) - len(needle) + 1):\n"
              "        candidate = [line.strip() for line in source_lines[index:index + len(needle)]]\n"
              "        if candidate == needle:\n"
              "            file_path.write_text(''.join(source_lines[:index]) + new + ''.join(source_lines[index + len(needle):]))\n"
              "            return\n"
              "    raise SystemExit(f'Expected snippet not found in {path}: {old[:120]!r}')\n"
          )
          implementation = (
              implementation[:helper_start]
              + tolerant_helper
              + implementation[helper_end:]
          )
          exec(compile(implementation, "apply-auto-rebalance-fix.py", "exec"))
          RUNNER

      - name: Package changed files
        shell: bash
        run: |
          git diff --name-status > auto-rebalance-manifest.txt
          git diff --binary > auto-rebalance.patch
          mapfile -t files < <(git diff --name-only --diff-filter=ACM)
          tar -czf auto-rebalance-files.tar.gz "${files[@]}"
          cat auto-rebalance-manifest.txt

      - name: Upload implementation package
        uses: actions/upload-artifact@v4
        with:
          name: auto-rebalance-validated-implementation
          path: |
            auto-rebalance-manifest.txt
            auto-rebalance.patch
            auto-rebalance-files.tar.gz
          if-no-files-found: error
