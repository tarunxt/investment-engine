name: Pull Request Checks

on:
  pull_request:

permissions:
  contents: write

jobs:
  frontend:
    name: Frontend build and dashboard regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    env:
      NODE_ENV: production
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: pull-request-check-secret
      NEXT_PUBLIC_FRONTEND_URL: http://localhost:3000
      BACKEND_API_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply duration popup source patch
        id: duration_patch
        working-directory: ${{ github.workspace }}
        run: |
          pwd
          ls -la scripts/apply_duration_breakdown_fix.py
          if [ -f scripts/apply_duration_breakdown_fix.py ]; then
            python3 -u scripts/apply_duration_breakdown_fix.py
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check patch formatting
        if: steps.duration_patch.outputs.applied == 'true'
        working-directory: ${{ github.workspace }}
        run: git diff --check

      - name: Install frontend dependencies
        run: npm ci --no-audit --fund=false

      - name: Run dashboard regression tests
        run: >-
          node --test
          tests/bullpen-server-auth.test.mjs
          tests/dashboard-refresh-errors.test.mjs

      - name: Build frontend
        run: npm run build -- --webpack 2>&1 | tee frontend-build.log

      - name: Commit generated duration popup fix
        if: steps.duration_patch.outputs.applied == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- .github/workflows/pr-checks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix dashboard stage duration breakdown interaction"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Upload frontend build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-log
          path: frontend/frontend-build.log
          if-no-files-found: ignore
