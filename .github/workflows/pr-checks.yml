          assert not root.findall('.//testcase/skipped'), 'Stage05 migration gate cannot skip checks'
          assert len(root.findall('.//testcase')) >= 10
          PY_CHECK

  stage04-durable-idempotency:
    name: Stage04 PostgreSQL idempotency and Redis restart contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: python:3.13
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stage04
          POSTGRES_PASSWORD: stage04
          POSTGRES_DB: credx_stage04_test
        options: --health-cmd "pg_isready -U stage04 -d credx_stage04_test" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: backend
      ENVIRONMENT: test
      AUTH_DISABLED: 'false'
