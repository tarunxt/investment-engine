name: Recover Production Disk

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/production-disk-recovery.yml'
  workflow_dispatch:
    inputs:
      deploy_after_cleanup:
        description: Deploy the current main branch after cleanup
        required: true
        default: true
        type: boolean
  workflow_run:
    workflows:
      - Deploy to Production
    types:
      - completed
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  recover:
    name: Reclaim disk and recover deploy
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Reclaim production disk space
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 3600s
          command_timeout: 3600s
          script: |
            set -Eeuo pipefail

            EVENT_NAME='${{ github.event_name }}'
            WORKFLOW_CONCLUSION='${{ github.event.workflow_run.conclusion }}'
            MANUAL_DEPLOY='${{ inputs.deploy_after_cleanup }}'

            APP_ROOT='${{ vars.EC2_APP_PATH || '/srv/investor' }}'
            ALT_APP_ROOT='/srv/investment-engine'
            APP_USER='${{ vars.EC2_APP_USER || 'investor' }}'
            ALT_APP_USER='investment-engine'

            TARGET_FREE_KB=4194304
            MINIMUM_DEPLOY_FREE_KB=2097152
            LEGACY_DOCKER_PROJECT='myapp'

            if [[ ! -d "$APP_ROOT/.git" && -d "$ALT_APP_ROOT/.git" ]]; then
              APP_ROOT="$ALT_APP_ROOT"
            fi
            if ! id "$APP_USER" >/dev/null 2>&1 && id "$ALT_APP_USER" >/dev/null 2>&1; then
              APP_USER="$ALT_APP_USER"
            fi

            command -v git >/dev/null
            sudo test -d "$APP_ROOT/.git"
            id "$APP_USER" >/dev/null

            available_kb() {
              df -Pk "$APP_ROOT" | awk 'NR == 2 {print $4}'
            }

            app_service_prefix() {
              if sudo systemctl is-active --quiet investor-backend &&
                 sudo systemctl is-active --quiet investor-frontend; then
                printf 'investor\n'
                return 0
              fi
              if sudo systemctl is-active --quiet investment-engine-backend &&
                 sudo systemctl is-active --quiet investment-engine-frontend; then
                printf 'investment-engine\n'
                return 0
              fi
              return 1
            }

            systemd_runtime_healthy() {
              local prefix
              prefix="$(app_service_prefix)" || return 1
              curl --fail --silent --show-error --max-time 20 \
                http://127.0.0.1:8000/health/ready >/dev/null
              curl --fail --silent --show-error --max-time 20 \
                http://127.0.0.1:3000/login >/dev/null
              sudo nginx -T 2>/dev/null |
                grep -F 'proxy_pass http://127.0.0.1:8000;' >/dev/null
              sudo nginx -T 2>/dev/null |
                grep -F 'proxy_pass http://127.0.0.1:3000;' >/dev/null
              echo "==> Verified live systemd runtime: ${prefix}-*"
            }

            storage_report() {
              echo '==> Filesystem'
              df -hT "$APP_ROOT" || true
              echo '==> Largest /var paths'
              sudo du -xhd1 /var 2>/dev/null | sort -hr | head -n 25 || true
              echo '==> Largest /var/lib paths'
              sudo du -xhd2 /var/lib 2>/dev/null | sort -hr | head -n 35 || true
              echo '==> Largest /var/log paths'
              sudo du -xhd2 /var/log 2>/dev/null | sort -hr | head -n 25 || true
              echo '==> Files larger than 250 MiB under /var'
              sudo find /var -xdev -type f -size +250M -printf '%s %p\n' \
                2>/dev/null | sort -nr | head -n 40 || true
              if command -v lsof >/dev/null 2>&1; then
                echo '==> Deleted files still held open and larger than 50 MiB'
                sudo lsof -nP +L1 2>/dev/null |
                  awk 'NR > 1 && $7 ~ /^[0-9]+$/ && $7 >= 52428800 {print $1, $2, $7, $9}' |
                  sort -k3,3nr | head -n 40 || true
              fi
              if command -v docker >/dev/null 2>&1 &&
                 sudo docker info >/dev/null 2>&1; then
                echo '==> Docker usage'
                sudo docker system df -v || true
                sudo docker ps -a \
                  --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' || true
                echo '==> Docker volume data directories'
                sudo find /var/lib/docker/volumes -mindepth 2 -maxdepth 2 \
                  -type d -name _data -exec du -sh {} + 2>/dev/null |
                  sort -hr | head -n 30 || true
              fi
              if sudo test -d /var/lib/postgresql; then
                echo '==> PostgreSQL filesystem usage'
                sudo du -xhd3 /var/lib/postgresql 2>/dev/null |
                  sort -hr | head -n 35 || true
              fi
            }

            remove_inactive_frontend_build() {
              local frontend_root="$APP_ROOT/frontend"
              local active_build='.next'
              local pointer="$frontend_root/.next-active-dir"
              local inactive_build

              [[ -d "$frontend_root" ]] || return 0
              if sudo test -f "$pointer"; then
                active_build="$(
                  sudo -u "$APP_USER" -H cat "$pointer" | tr -d '\r\n'
                )"
              fi
              case "$active_build" in
                .next)
                  inactive_build="$frontend_root/.next-candidate"
                  ;;
                .next-candidate)
                  inactive_build="$frontend_root/.next"
                  ;;
                *)
                  echo "Invalid Next active build pointer; preserving both slots: ${active_build:-<empty>}" >&2
                  return 0
                  ;;
              esac

              if sudo test -d "$inactive_build"; then
                echo "==> Removing inactive Next build: $inactive_build"
                sudo -u "$APP_USER" -H rm -rf -- "$inactive_build"
              fi
              sudo -u "$APP_USER" -H rm -rf -- \
                "$frontend_root/.npm" \
                "$frontend_root/out" || true
            }

            base_cleanup() {
              echo '==> Base cleanup: logs, package caches, temp files and rebuildable app caches'

              sudo mkdir -p /etc/systemd/journald.conf.d
              printf '%s\n' \
                '[Journal]' \
                'SystemMaxUse=96M' \
                'RuntimeMaxUse=48M' \
                'SystemKeepFree=2G' \
                'MaxRetentionSec=3day' |
                sudo tee /etc/systemd/journald.conf.d/credx-disk-budget.conf >/dev/null
              sudo journalctl --rotate || true
              sudo journalctl --vacuum-time=3d --vacuum-size=96M || true
              sudo systemctl restart systemd-journald || true

              sudo apt-get clean || true
              sudo rm -rf \
                /var/cache/apt/archives/*.deb \
                /var/lib/apt/lists/* \
                /var/cache/man/* \
                /var/cache/debconf/*-old \
                /var/lib/snapd/cache/* \
                /var/crash/* \
                /var/lib/systemd/coredump/* || true

              sudo find /var/tmp -xdev -mindepth 1 -mtime +1 -delete \
                2>/dev/null || true
              sudo find /var/log -xdev -type f \
                \( -name '*.gz' -o -name '*.old' -o -name '*.log.[1-9]*' \) \
                -mtime +2 -delete 2>/dev/null || true

              if command -v logrotate >/dev/null 2>&1; then
                sudo logrotate /etc/logrotate.conf || true
              fi

              for log_path in \
                /var/log/syslog \
                /var/log/auth.log \
                /var/log/kern.log; do
                if sudo test -f "$log_path" &&
                   (( $(sudo stat -c '%s' "$log_path") >= 268435456 )); then
                  echo "==> Truncating oversized active log: $log_path"
                  sudo truncate -s 0 "$log_path"
                fi
              done

              for log_dir in /var/log/nginx /var/log/postgresql; do
                sudo test -d "$log_dir" || continue
                while IFS= read -r oversized_log; do
                  echo "==> Truncating oversized active service log: $oversized_log"
                  sudo truncate -s 0 "$oversized_log"
                done < <(
                  sudo find "$log_dir" -xdev -type f -name '*.log' \
                    -size +256M -print 2>/dev/null
                )
              done

              if [[ -x "$APP_ROOT/backend/.venv/bin/python" ]]; then
                sudo -u "$APP_USER" -H \
                  "$APP_ROOT/backend/.venv/bin/python" -m pip cache purge || true
              fi

              local app_home
              app_home="$(getent passwd "$APP_USER" | cut -d: -f6)"
              if [[ -n "$app_home" && -d "$app_home" ]]; then
                sudo -u "$APP_USER" -H rm -rf -- \
                  "$app_home/.cache/pip" \
                  "$app_home/.cache/node-gyp" \
                  "$app_home/.npm/_cacache" || true
              fi

              remove_inactive_frontend_build
            }

            prune_disabled_snaps() {
              command -v snap >/dev/null 2>&1 || return 0
              echo '==> Removing disabled Snap revisions'
              sudo snap set system refresh.retain=2 || true
              while read -r snap_name snap_revision; do
                [[ -n "$snap_name" && -n "$snap_revision" ]] || continue
                sudo snap remove "$snap_name" --revision="$snap_revision" || true
              done < <(
                LANG=C snap list --all 2>/dev/null |
                  awk 'NR > 1 && $NF == "disabled" {print $1, $3}'
              )
            }

            retire_legacy_docker_runtime() {
              command -v docker >/dev/null 2>&1 || return 0

              if ! sudo docker info >/dev/null 2>&1; then
                if ! systemd_runtime_healthy; then
                  echo 'Docker is unavailable and the systemd runtime could not be verified; preserving Docker data.' >&2
                  return 0
                fi
                echo '==> Starting Docker temporarily to inspect and retire the off-path runtime'
                sudo systemctl start docker || return 0
                sleep 3
                sudo docker info >/dev/null 2>&1 || return 0
              fi

              mapfile -t target_container_ids < <(
                sudo docker ps -aq \
                  --filter "label=com.docker.compose.project=$LEGACY_DOCKER_PROJECT"
              )

              if (( ${#target_container_ids[@]} > 0 )); then
                systemd_runtime_healthy

                declare -A image_ids=()
                local container_id container_name container_project
                local port_bindings image_id

                for container_id in "${target_container_ids[@]}"; do
                  [[ "$container_id" =~ ^[a-f0-9]{12}([a-f0-9]{52})?$ ]] || {
                    echo "Unexpected Docker container identifier: $container_id" >&2
                    return 1
                  }
                  container_name="$(
                    sudo docker inspect --format '{{.Name}}' "$container_id"
                  )"
                  container_project="$(
                    sudo docker inspect \
                      --format '{{ index .Config.Labels "com.docker.compose.project" }}' \
                      "$container_id"
                  )"
                  port_bindings="$(
                    sudo docker inspect \
                      --format '{{json .HostConfig.PortBindings}}' "$container_id"
                  )"
                  image_id="$(
                    sudo docker inspect --format '{{.Image}}' "$container_id"
                  )"

                  [[ "$container_name" == "/$LEGACY_DOCKER_PROJECT-"* ]] || {
                    echo "Refusing unexpected Docker container: $container_name" >&2
                    return 1
                  }
                  [[ "$container_project" == "$LEGACY_DOCKER_PROJECT" ]] || {
                    echo "Refusing container outside project $LEGACY_DOCKER_PROJECT: $container_name" >&2
                    return 1
                  }
                  [[ "$port_bindings" == 'null' || "$port_bindings" == '{}' ]] || {
                    echo "Refusing published legacy container $container_name: $port_bindings" >&2
                    return 1
                  }
                  [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]] || {
                    echo "Unexpected image identifier for $container_name: $image_id" >&2
                    return 1
                  }

                  image_ids["$image_id"]=1
                  echo "==> Validated off-path legacy container: $container_name"
                done

                mapfile -t running_container_ids < <(
                  sudo docker ps -q \
                    --filter "label=com.docker.compose.project=$LEGACY_DOCKER_PROJECT"
                )
                if (( ${#running_container_ids[@]} > 0 )); then
                  echo '==> Stopping off-path legacy Docker containers'
                  sudo docker stop "${running_container_ids[@]}"
                fi

                echo '==> Removing off-path legacy Docker containers; volumes remain preserved'
                sudo docker rm "${target_container_ids[@]}"

                for image_id in "${!image_ids[@]}"; do
                  if sudo docker ps -aq --filter "ancestor=$image_id" |
                     grep -q .; then
                    echo "Keeping image still referenced by another container: $image_id"
                  else
                    sudo docker image rm "$image_id" || true
                  fi
                done
              fi

              echo '==> Pruning all currently unused Docker containers, images, networks and build cache'
              sudo docker container prune -f || true
              sudo docker image prune -af || true
              sudo docker network prune -f || true
              sudo docker builder prune -af || true
              sudo docker system df || true
              echo 'Docker volumes are intentionally preserved.'
            }

            release_deleted_open_files() {
              command -v lsof >/dev/null 2>&1 || return 0

              local deleted_bytes
              deleted_bytes="$(
                sudo lsof -nP +L1 2>/dev/null |
                  awk 'NR > 1 && $7 ~ /^[0-9]+$/ && $7 >= 52428800 {sum += $7} END {print sum + 0}'
              )"
              if (( deleted_bytes < 134217728 )); then
                return 0
              fi

              echo "==> Releasing ${deleted_bytes} bytes held by deleted files"
              local service
              for service in \
                investor-backend investment-engine-backend \
                investor-celery-worker investment-engine-celery-worker \
                investor-celery-auto-live-worker investment-engine-celery-auto-live-worker \
                investor-celery-beat investment-engine-celery-beat \
                investor-celery-beat-worker investment-engine-celery-beat-worker \
                investor-frontend investment-engine-frontend \
                nginx rsyslog; do
                sudo systemctl try-restart "$service" >/dev/null 2>&1 || true
              done
            }

            checkpoint_postgresql() {
              command -v psql >/dev/null 2>&1 || return 0
              sudo systemctl is-active --quiet postgresql || return 0
              echo '==> Requesting a PostgreSQL checkpoint; no tables or rows are deleted'
              sudo -u postgres psql -X -v ON_ERROR_STOP=1 \
                -d postgres -c 'CHECKPOINT;' >/dev/null 2>&1 || true
            }

            echo "==> Recovery event: $EVENT_NAME${WORKFLOW_CONCLUSION:+ ($WORKFLOW_CONCLUSION)}"
            echo "==> Production app root: $APP_ROOT"
            echo "==> Production app user: $APP_USER"
            INITIAL_AVAILABLE_KB="$(available_kb)"
            echo "==> Initial free space: ${INITIAL_AVAILABLE_KB} KiB"
            storage_report

            if [[ "$EVENT_NAME" == 'workflow_run' ]] &&
               (( INITIAL_AVAILABLE_KB >= TARGET_FREE_KB )); then
              echo 'The failed deploy was not caused by low disk space; skipping recovery.'
              exit 0
            fi

            if (( INITIAL_AVAILABLE_KB < TARGET_FREE_KB )); then
              base_cleanup
              prune_disabled_snaps
              retire_legacy_docker_runtime
              checkpoint_postgresql
              release_deleted_open_files
            fi

            FINAL_AVAILABLE_KB="$(available_kb)"
            echo "==> Final free space: ${FINAL_AVAILABLE_KB} KiB"
            storage_report

            DEPLOY_AFTER_CLEANUP=false
            case "$EVENT_NAME" in
              push|workflow_run)
                DEPLOY_AFTER_CLEANUP=true
                ;;
              workflow_dispatch)
                [[ "$MANUAL_DEPLOY" == 'true' ]] &&
                  DEPLOY_AFTER_CLEANUP=true
                ;;
              schedule)
                DEPLOY_AFTER_CLEANUP=false
                ;;
            esac

            if [[ "$DEPLOY_AFTER_CLEANUP" != 'true' ]]; then
              exit 0
            fi

            if (( FINAL_AVAILABLE_KB < MINIMUM_DEPLOY_FREE_KB )); then
              echo 'Less than 2 GiB remains after safe cleanup. The workflow preserved Docker volumes and PostgreSQL data; inspect the final storage report before deleting either.' >&2
              exit 1
            fi

            echo '==> Sync GitHub main to EC2'
            sudo -u "$APP_USER" -H rm -f "$APP_ROOT/.git/index.lock"
            sudo -u "$APP_USER" -H git -C "$APP_ROOT" fetch origin main
            sudo -u "$APP_USER" -H git -C "$APP_ROOT" reset --hard origin/main

            if command -v pg_isready >/dev/null 2>&1 &&
               ! pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1; then
              echo '==> Restarting PostgreSQL after disk recovery'
              sudo systemctl restart postgresql
              for _ in $(seq 1 30); do
                pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1 &&
                  break
                sleep 1
              done
              pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1
            fi

            echo '==> Run recovered full-stack deployment'
            SKIP_GIT_SYNC=true APP_ROOT="$APP_ROOT" APP_USER="$APP_USER" \
              bash "$APP_ROOT/deploy/no-docker/redeploy.sh" full

            if [[ -f "$APP_ROOT/deploy/no-docker/install-bullpen-healthcheck.sh" ]]; then
              APP_ROOT="$APP_ROOT" \
                APP_USER="$APP_USER" \
                FRONTEND_ENV_FILE='/etc/investor/frontend.env' \
                bash "$APP_ROOT/deploy/no-docker/install-bullpen-healthcheck.sh"
            fi

            echo "==> Recovery deployment completed with $(available_kb) KiB free"
