name: Recover Production Disk

on:
  workflow_dispatch:
    inputs:
      deploy_after_cleanup:
        description: Deploy main after recovery
        required: true
        default: true
        type: boolean
      reset_generated_audit_blobs:
        description: Reset oversized generated Bullpen audit blobs; core runs/orders/remarks/checks/report JSON remain
        required: true
        default: true
        type: boolean
  workflow_run:
    workflows: ['Deploy to Production']
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: production-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Reclaim disk and recover deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          timeout: 5400s
          command_timeout: 5400s
          script: |
            set -Eeuo pipefail

            EVENT='${{ github.event_name }}'
            CONCLUSION='${{ github.event.workflow_run.conclusion }}'
            DEPLOY_INPUT='${{ inputs.deploy_after_cleanup }}'
            RESET_INPUT='${{ inputs.reset_generated_audit_blobs }}'
            APP_ROOT='${{ vars.EC2_APP_PATH || '/srv/investor' }}'
            APP_USER='${{ vars.EC2_APP_USER || 'investor' }}'
            [[ -d "$APP_ROOT/.git" ]] || APP_ROOT='/srv/investment-engine'
            id "$APP_USER" >/dev/null 2>&1 || APP_USER='investment-engine'
            DEPLOY_LOCK_FILE='/run/investor-production-deploy.lock'

            command -v flock >/dev/null
            sudo touch "$DEPLOY_LOCK_FILE"
            sudo chown "$(id -u):$(id -g)" "$DEPLOY_LOCK_FILE"
            exec 9>"$DEPLOY_LOCK_FILE"
            if [[ "$EVENT" == schedule ]]; then
              if ! flock -n 9; then
                echo '==> A production deployment is active; skipping scheduled recovery.'
                exit 0
              fi
            elif ! flock -w 900 9; then
              echo 'Timed out waiting for the production host deployment lock.' >&2
              exit 1
            fi

            TARGET_FREE_KB=4194304
            REQUIRED_FREE_KB=2097152
            RESET_THRESHOLD_BYTES=4294967296
            SCHEDULE_THRESHOLD_BYTES=8589934592
            DB=''
            PREFIX=''
            SERVICES_STOPPED=false

            free_kb() { df -Pk "$APP_ROOT" | awk 'NR==2 {print $4}'; }

            find_db() {
              local db found
              while read -r db; do
                found="$(sudo -u postgres psql -X -At -d "$db" \
                  -c "SELECT to_regclass('public.bullpen_run_audit_blobs') IS NOT NULL" \
                  2>/dev/null || true)"
                [[ "$found" == t ]] && { echo "$db"; return 0; }
              done < <(sudo -u postgres psql -X -At -d postgres \
                -c "SELECT datname FROM pg_database WHERE datallowconn AND NOT datistemplate")
              return 1
            }

            pg_report() {
              DB="${DB:-$(find_db || true)}"
              [[ -n "$DB" ]] || return 0
              echo "==> PostgreSQL database: $DB"
              sudo -u postgres psql -X -P pager=off -d "$DB" <<'SQL' || true
            SELECT relid::regclass AS relation,
                   pg_size_pretty(pg_total_relation_size(relid)) AS total,
                   pg_size_pretty(pg_relation_size(relid)) AS heap,
                   n_live_tup, n_dead_tup
            FROM pg_stat_user_tables
            ORDER BY pg_total_relation_size(relid) DESC
            LIMIT 20;
            SQL
            }

            report() {
              df -hT "$APP_ROOT" || true
              echo '==> Largest /var/lib paths'
              sudo du -xhd2 /var/lib 2>/dev/null | sort -hr | head -n 30 || true
              echo '==> Large /var files'
              sudo find /var -xdev -type f -size +250M -printf '%s %p\n' \
                2>/dev/null | sort -nr | head -n 35 || true
              pg_report
            }

            cleanup_caches() {
              sudo journalctl --rotate || true
              sudo journalctl --vacuum-time=3d --vacuum-size=96M || true
              sudo apt-get clean || true
              sudo rm -rf /var/lib/apt/lists/* /var/lib/snapd/cache/* \
                /var/cache/apt/archives/*.deb /var/crash/* \
                /var/lib/systemd/coredump/* || true
              sudo find /var/tmp -xdev -mindepth 1 -mtime +1 -delete 2>/dev/null || true
              [[ -x "$APP_ROOT/backend/.venv/bin/python" ]] &&
                sudo -u "$APP_USER" -H "$APP_ROOT/backend/.venv/bin/python" \
                  -m pip cache purge || true
              local home
              home="$(getent passwd "$APP_USER" | cut -d: -f6)"
              [[ -n "$home" ]] && sudo -u "$APP_USER" -H rm -rf \
                "$home/.cache/pip" "$home/.npm/_cacache" || true
            }

            resolve_prefix() {
              sudo systemctl cat investor-backend >/dev/null 2>&1 && { echo investor; return; }
              sudo systemctl cat investment-engine-backend >/dev/null 2>&1 && { echo investment-engine; return; }
              return 1
            }

            stop_app() {
              PREFIX="$(resolve_prefix)"
              local role unit
              for role in frontend celery-auto-live-worker celery-email-worker celery-worker \
                celery-beat-worker celery-beat backend; do
                unit="${PREFIX}-${role}"
                sudo systemctl cat "$unit" >/dev/null 2>&1 &&
                  sudo systemctl stop "$unit"
              done
              SERVICES_STOPPED=true
            }

            start_app() {
              [[ "$SERVICES_STOPPED" == true ]] || return 0
              local role unit
              for role in backend celery-beat celery-beat-worker celery-worker celery-email-worker \
                celery-auto-live-worker frontend; do
                unit="${PREFIX}-${role}"
                sudo systemctl cat "$unit" >/dev/null 2>&1 &&
                  sudo systemctl start "$unit" || true
              done
              SERVICES_STOPPED=false
            }

            repair_fk() {
              [[ -n "$DB" ]] || return 0
              local exists
              exists="$(sudo -u postgres psql -X -At -d "$DB" \
                -c "SELECT to_regclass('public.credx_blob_fk_restore') IS NOT NULL" \
                2>/dev/null || true)"
              [[ "$exists" == t ]] || return 0
              sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$DB" <<'SQL'
            DO $x$ DECLARE r record; BEGIN
              FOR r IN SELECT * FROM public.credx_blob_fk_restore LOOP
                EXECUTE format('UPDATE %I.%I SET %I=NULL WHERE %I IS NOT NULL',
                  r.table_schema,r.table_name,r.column_name,r.column_name);
              END LOOP;
            END $x$;
            UPDATE public.bullpen_run_audit_snapshots
               SET source_run_updated_at=NULL, canonical_bundle_hash=NULL;
            DO $x$ DECLARE r record; BEGIN
              FOR r IN SELECT * FROM public.credx_blob_fk_restore LOOP
                IF NOT EXISTS (
                  SELECT 1 FROM pg_constraint c
                  JOIN pg_class t ON t.oid=c.conrelid
                  JOIN pg_namespace n ON n.oid=t.relnamespace
                  WHERE n.nspname=r.table_schema AND t.relname=r.table_name
                    AND c.conname=r.constraint_name
                ) THEN
                  EXECUTE format('ALTER TABLE %I.%I ADD CONSTRAINT %I %s NOT VALID',
                    r.table_schema,r.table_name,r.constraint_name,r.constraint_definition);
                END IF;
              END LOOP;
            END $x$;
            DO $x$ DECLARE r record; BEGIN
              FOR r IN SELECT * FROM public.credx_blob_fk_restore LOOP
                EXECUTE format('ALTER TABLE %I.%I VALIDATE CONSTRAINT %I',
                  r.table_schema,r.table_name,r.constraint_name);
              END LOOP;
            END $x$;
            DROP TABLE public.credx_blob_fk_restore;
            SQL
            }

            finish() {
              status=$?
              [[ "$status" -eq 0 ]] || repair_fk || true
              start_app || true
              exit "$status"
            }
            trap finish EXIT

            compact_audit_store() {
              DB="$(find_db || true)"
              [[ -n "$DB" ]] || return 0
              local bytes largest largest_bytes allow=false
              bytes="$(sudo -u postgres psql -X -At -d "$DB" \
                -c "SELECT pg_total_relation_size('public.bullpen_run_audit_blobs'::regclass)")"
              read -r largest largest_bytes < <(sudo -u postgres psql -X -At -F ' ' \
                -d "$DB" -c "SELECT relid::regclass::text,pg_total_relation_size(relid) FROM pg_stat_user_tables ORDER BY 2 DESC LIMIT 1")
              echo "==> Largest DB relation: $largest ($largest_bytes bytes)"
              echo "==> Audit blob relation: $bytes bytes"
              (( bytes >= RESET_THRESHOLD_BYTES )) || return 0
              [[ "$RESET_INPUT" == true ]] && allow=true
              (( $(free_kb) < REQUIRED_FREE_KB )) && allow=true
              [[ "$EVENT" == schedule && "$bytes" -ge "$SCHEDULE_THRESHOLD_BYTES" ]] && allow=true
              [[ "$allow" == true ]] || { echo 'Audit reset not authorised.' >&2; return 1; }
              [[ "$largest" == bullpen_run_audit_blobs ]] || {
                echo 'Largest table is not bullpen_run_audit_blobs; refusing mutation.' >&2
                return 1
              }

              echo '==> Resetting generated Bullpen audit blob payloads'
              echo 'Core runs/orders, snapshot metadata, remarks, manual checks and feedback report JSON remain.'
              stop_app
              sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$DB" <<'SQL'
            DROP TABLE IF EXISTS public.credx_blob_fk_restore;
            CREATE TABLE public.credx_blob_fk_restore(
              table_schema text, table_name text, column_name text,
              constraint_name text, constraint_definition text,
              PRIMARY KEY(table_schema,table_name,constraint_name));
            INSERT INTO public.credx_blob_fk_restore
            SELECT n.nspname,t.relname,a.attname,c.conname,pg_get_constraintdef(c.oid)
            FROM pg_constraint c
            JOIN pg_class t ON t.oid=c.conrelid
            JOIN pg_namespace n ON n.oid=t.relnamespace
            JOIN pg_attribute a ON a.attrelid=c.conrelid AND a.attnum=c.conkey[1]
            WHERE c.contype='f'
              AND c.confrelid='public.bullpen_run_audit_blobs'::regclass
              AND array_length(c.conkey,1)=1;
            DO $x$ DECLARE r record; BEGIN
              FOR r IN SELECT * FROM public.credx_blob_fk_restore LOOP
                EXECUTE format('ALTER TABLE %I.%I DROP CONSTRAINT %I',
                  r.table_schema,r.table_name,r.constraint_name);
              END LOOP;
            END $x$;
            SQL
              sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$DB" \
                -c 'TRUNCATE public.bullpen_run_audit_blobs;'
              echo "==> Free after truncate: $(free_kb) KiB"
              repair_fk
              sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d "$DB" \
                -c 'ANALYZE public.bullpen_run_audit_blobs; CHECKPOINT;'
              start_app
            }

            echo "==> Event: $EVENT ${CONCLUSION:-}"
            echo "==> App root/user: $APP_ROOT / $APP_USER"
            initial="$(free_kb)"
            echo "==> Initial free: $initial KiB"
            report

            if [[ "$EVENT" == workflow_run && "$initial" -ge "$TARGET_FREE_KB" ]]; then
              echo 'Deploy failure was not caused by disk pressure.'
              exit 0
            fi

            if (( initial < TARGET_FREE_KB )); then
              cleanup_caches
              compact_audit_store
            elif [[ "$EVENT" == schedule ]]; then
              compact_audit_store
            fi

            final="$(free_kb)"
            echo "==> Final free: $final KiB"
            report

            deploy=false
            [[ "$EVENT" == workflow_run ]] && deploy=true
            [[ "$EVENT" == workflow_dispatch && "$DEPLOY_INPUT" == true ]] && deploy=true
            [[ "$deploy" == true ]] || exit 0
            (( final >= REQUIRED_FREE_KB )) || {
              echo 'Less than 2 GiB remains after guarded recovery.' >&2
              exit 1
            }

            sudo -u "$APP_USER" -H rm -f "$APP_ROOT/.git/index.lock"
            sudo -u "$APP_USER" -H git -C "$APP_ROOT" fetch origin main
            sudo -u "$APP_USER" -H git -C "$APP_ROOT" reset --hard origin/main
            EXPECTED_FRONTEND_SHA="$(
              sudo -u "$APP_USER" -H git -C "$APP_ROOT" rev-parse HEAD
            )"
            BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sudo -u "$APP_USER" -H node \
              "$APP_ROOT/scripts/stamp-frontend-build.mjs" \
              "$APP_ROOT/frontend/lib/generatedBuildInfo.ts" \
              "$EXPECTED_FRONTEND_SHA" \
              "$BUILD_TIMESTAMP"
            # This guarded recovery workflow is the only supported exception to
            # CI-built frontend artifacts because it may need to reconstruct a
            # runtime after production disk repair.
            SKIP_GIT_SYNC=true \
            ALLOW_ON_HOST_FRONTEND_BUILD=true \
            EXPECTED_FRONTEND_SHA="$EXPECTED_FRONTEND_SHA" \
            APP_ROOT="$APP_ROOT" \
            APP_USER="$APP_USER" \
              bash "$APP_ROOT/deploy/no-docker/redeploy.sh" full-stack
            echo "==> Deployment complete; free: $(free_kb) KiB"
