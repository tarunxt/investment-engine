name: Cost driver contracts

on:
  pull_request:
    paths:
      - '.github/workflows/cost-drivers-contracts.yml'
      - 'backend/app/domains/cost_drivers/**'
      - 'backend/alembic/versions/a12_collection_intent_001.py'
      - 'backend/tests/test_cost*'
      - 'backend/tests/conftest.py'
      - 'frontend/app/console/profile/cost-drivers/**'
      - 'frontend/scripts/cost-snapshot-contract-playwright.mjs'
      - 'frontend/scripts/cost-usage-recovery-playwright.mjs'

permissions:
  contents: read

jobs:
  synthetic-cost-contracts:
    name: Cost contracts on disposable PostgreSQL 18.6 and offline components
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: cost_fixture
          POSTGRES_DB: cost_fixture
          POSTGRES_HOST_AUTH_METHOD: trust
        volumes:
          - /tmp/cost-a12-pg18-socket:/var/run/postgresql
        options: >-
          --health-cmd "pg_isready -U cost_fixture -d cost_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: backend
      DATABASE_URL: postgresql+asyncpg://fixture:fixture@127.0.0.1:1/fixture
      REDIS_URL: redis://127.0.0.1:1/0
      COST_TEST_POSTGRES_URL: postgresql+psycopg2://cost_fixture@/cost_fixture?host=/tmp/cost-a12-pg18-socket
    steps:
      - name: Checkout exact proposed head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install backend fixture dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip install --disable-pip-version-check pytest
      - name: Execute all cost-driver fixtures without provider transport
        run: pytest -q --junitxml=/tmp/cost-contracts.xml backend/tests/test_cost*
      - name: Require every selected cost fixture to execute
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/cost-contracts.xml').getroot()
          assert not root.findall('.//testcase/skipped'), 'Cost acceptance cannot skip fixtures'
          print('All cost fixtures executed on disposable PostgreSQL; no runtime migration or provider collection.')
          PY
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install frontend fixture dependencies
        working-directory: frontend
        run: npm ci --include=dev --no-audit --fund=false --loglevel=error
      - name: Install isolated browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run actual component lifecycle and recovery fixtures offline
        working-directory: frontend
        run: |
          node --input-type=module -e "import {chromium} from 'playwright'; console.log(chromium.executablePath())" > /tmp/cost-chromium-path
          export CHROMIUM_PATH="$(cat /tmp/cost-chromium-path)"
          node scripts/cost-snapshot-contract-playwright.mjs
          node scripts/cost-usage-recovery-playwright.mjs
