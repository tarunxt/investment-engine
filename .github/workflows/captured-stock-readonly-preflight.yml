name: Captured Stock Details read-only host preflight
on:
  push:
    branches: [codex/captured-stock-readonly-preflight-20261007]
    paths: [.github/workflows/captured-stock-readonly-preflight.yml]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read sanitized runtime and database metadata
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          timeout: 120s
          command_timeout: 240s
          script: |
            #!/usr/bin/env bash
            # Proposed one-off read-only preflight. No host files, services or credentials change.
            set -euo pipefail
            export PYTHONDONTWRITEBYTECODE=1 GIT_OPTIONAL_LOCKS=0
            APP_ROOT=/srv/investor
            APP_USER=investor
            sudo -n test -d "$APP_ROOT/.git"
            source_sha=$(sudo -n -u "$APP_USER" env GIT_OPTIONAL_LOCKS=0 git -c core.fsmonitor=false -c core.hooksPath=/dev/null -C "$APP_ROOT" rev-parse HEAD)
            printf 'source_sha=%s\n' "$source_sha"
            source_clean=false
            if sudo -n -u "$APP_USER" env GIT_OPTIONAL_LOCKS=0 git -c core.fsmonitor=false -c core.hooksPath=/dev/null -C "$APP_ROOT" diff --no-ext-diff --no-textconv --quiet && sudo -n -u "$APP_USER" env GIT_OPTIONAL_LOCKS=0 git -c core.fsmonitor=false -c core.hooksPath=/dev/null -C "$APP_ROOT" diff --cached --no-ext-diff --no-textconv --quiet; then
              source_clean=true
              echo 'tracked_source_clean=true'
            else
              echo 'tracked_source_clean=false'
            fi
            sudo -n python3 -B - <<'RUNTIME'
            import hashlib,json,pathlib,re,shutil,subprocess
            from datetime import datetime,timezone
            from decimal import Decimal,InvalidOperation
            units=['investor-backend','investor-recovery-analysis','investor-frontend']
            financial=[family+'-'+role for family in ('investor','investment-engine') for role in ('celery-worker','celery-email-worker','celery-auto-live-worker','celery-beat','celery-beat-worker')]
            report={'checked_at':datetime.now(timezone.utc).isoformat(),'services':{},'docker_binary_available':shutil.which('docker') is not None,'pg_dump_available':shutil.which('pg_dump') is not None,'analysis_drain':'not established by service liveness'}
            properties='Id,LoadState,ActiveState,MainPID,ExecStart,ExecStartPre,ExecStartPost,ExecStop,WorkingDirectory,TimeoutStopUSec,KillMode,KillSignal'
            for unit in units+financial:
                result=subprocess.run(['systemctl','show',unit,'--property='+properties],capture_output=True,text=True,timeout=8)
                if result.returncode:
                    report['services'][unit]={'query_ok':False}
                    continue
                values=dict(line.split('=',1) for line in result.stdout.splitlines() if '=' in line)
                item={key:values.get(key) for key in ('Id','LoadState','ActiveState','MainPID','WorkingDirectory','TimeoutStopUSec','KillMode','KillSignal')}
                item['query_ok']=True
                for key in ('ExecStartPre','ExecStartPost','ExecStop'):
                    raw=values.get(key,'')
                    item[key+'_present']=bool(raw)
                    item[key+'_sha256']=hashlib.sha256(raw.encode()).hexdigest() if raw else None
                raw=values.get('ExecStart','')
                item['ExecStart_sha256']=hashlib.sha256(raw.encode()).hexdigest()
                item['launch_paths']=re.findall(r'\bpath=([^ ;}]+)',raw)
                if unit in ('investor-backend','investor-recovery-analysis'):
                    try:
                        pid=int(values.get('MainPID','0'))
                        if pid<=0: raise ValueError('No active PID')
                        env=dict(part.split(b'=',1) for part in pathlib.Path(f'/proc/{pid}/environ').read_bytes().split(b'\0') if b'=' in part)
                        item['recovery_mode']=env.get(b'CREDX_RECOVERY_MODE',b'absent').decode() if env.get(b'CREDX_RECOVERY_MODE') in (b'0',b'1') else 'unknown'
                        for key in ('RECOMMENDATION_AUDIT_ENABLED','RECOMMENDATION_AUDIT_EXTERNAL_ENABLED','RECOMMENDATION_AUDIT_FUNDAMENTALS_ENABLED'):
                            raw=env.get(key.encode(),b'false').strip().lower()
                            item[key]='off' if raw in (b'0',b'false',b'off',b'no') else 'on' if raw in (b'1',b'true',b'on',b'yes') else 'unknown'
                        item['daily_cap_zero']=Decimal(env.get(b'RECOMMENDATION_AUDIT_DAILY_CAP_USD',b'0').decode())==0
                    except Exception as error:
                        item['runtime_query_error']=type(error).__name__
                report['services'][unit]=item
            report['financial_consumers_confirmed_stopped']=all(report['services'].get(unit,{}).get('ActiveState') in ('inactive','failed') for unit in financial)
            report['active_recovery_confirmed']=all(report['services'].get(unit,{}).get('ActiveState')=='active' and report['services'][unit].get('recovery_mode')=='1' for unit in units[:2])
            report['filesystem_free_bytes']=shutil.disk_usage('/srv/investor').free
            if report['docker_binary_available']:
                try:
                    result=subprocess.run(['docker','ps','--format','{{.Names}}\t{{.Image}}\t{{.Status}}'],capture_output=True,text=True,timeout=8)
                    report['docker_daemon_accessible']=result.returncode==0
                    report['running_containers']=[{'name':row.split('\t')[0],'image':row.split('\t')[1],'status':row.split('\t')[2]} for row in result.stdout.splitlines() if len(row.split('\t'))==3] if result.returncode==0 else []
                except Exception as error:
                    report['docker_query_error']=type(error).__name__
            report['wrapper_and_hook_review']='required; command arguments and environment contents are not returned'
            print(json.dumps(report,sort_keys=True))
            RUNTIME
            # Diagnose only the known clean source and known private artifact.
            if [[ "$source_sha" != 0a12caddaf9bbd681487906774400a3ad4d0369b || "$source_clean" != true ]]; then
              echo 'wrapper_diagnostic=blocked: unknown live source'
              exit 1
            fi
            sudo -n python3 -B - <<'WRAPPER_DIAGNOSTIC'
            """Read-only predicate diagnosis; no command/environment values are disclosed."""
            import hashlib,json,pathlib,re,subprocess
            
            root=pathlib.Path('/srv/investor');stage=root/'.audit-migration-2ae3e9466014'
            expected={
             'investor-backend':('7c43b70dc498240fe21bb667c8eff4240153dffa79d44b177c0f2038b164dc16','/srv/investor/deploy/no-docker/scripts/run-backend.sh','/srv/investor/backend'),
             'investor-recovery-analysis':('e9e706a3dbbddc24d0dff19ccb3b16e48e5e5a97d3e4b65f0eaddc795827c520','/srv/investor/backend/.venv/bin/celery','/srv/investor/backend'),
             'investor-frontend':('ec007da927932b6b77244b216de7393b5344694321fd51673dc72520d86b4e91','/srv/investor/deploy/no-docker/scripts/run-frontend.sh','/srv/investor/frontend'),
            }
            try:
                previous=stage/'previous-source'
                manifest_path=previous/'manifest.json'
                if previous.is_symlink() or not previous.is_dir() or stage.is_symlink() or manifest_path.is_symlink() or not manifest_path.is_file() or manifest_path.stat().st_size>2*1024*1024: raise RuntimeError('Unknown source artifact')
                manifest=json.loads(manifest_path.read_text())
                report={}
                for unit,(fingerprint,launch,directory) in expected.items():
                    result=subprocess.run(['systemctl','show',unit,'--property=ExecStart,ExecStartPre,ExecStartPost,ExecStop,WorkingDirectory,KillMode,TimeoutStopUSec,KillSignal,Environment,EnvironmentFiles'],capture_output=True,text=True,timeout=5,check=True)
                    values=dict(line.split('=',1) for line in result.stdout.splitlines() if '=' in line)
                    raw=values['ExecStart'];allowed_env='/etc/investor/frontend.env' if unit=='investor-frontend' else '/etc/investor/backend.env'
                    env_paths=re.findall(r'(/[^ ]+)',values.get('EnvironmentFiles',''))
                    path=pathlib.Path(launch);relative=path.relative_to(root).as_posix()
                    report[unit]={
                      'exact_launch_path':re.findall(r'\bpath=([^ ;}]+)',raw)==[launch],
                      'exact_working_directory':values['WorkingDirectory']==directory,
                      'hooks_absent':all(not values.get(key) for key in ('ExecStartPre','ExecStartPost','ExecStop')),
                      'kill_control_group':values['KillMode']=='control-group',
                      'timeout_stop':values['TimeoutStopUSec'],'kill_signal':values['KillSignal'],
                      'full_exec_fingerprint_matches_prior':hashlib.sha256(raw.encode()).hexdigest()==fingerprint,
                      'current_full_exec_sha256':hashlib.sha256(raw.encode()).hexdigest(),
                      'stable_start_time_separator_present':' ; start_time=' in raw,
                      'environment_file_count':len(env_paths),
                      'declared_environment_file_paths':[name for name in env_paths if re.fullmatch(r'/etc/investor/[A-Za-z0-9_.-]+\.env',name)],
                      'all_declared_paths_are_investor_env_metadata':all(re.fullmatch(r'/etc/investor/[A-Za-z0-9_.-]+\.env',name) for name in env_paths),
                      'environment_paths_expected':set(env_paths)<= {allowed_env},
                      'worker_canonical_env_expected':env_paths==[allowed_env],
                      'environment_files_has_ignore_errors':'ignore_errors=' in values.get('EnvironmentFiles',''),
                      'environment_files_has_space_before_annotation':' (ignore_errors=' in values.get('EnvironmentFiles',''),
                      'launcher_manifest_covered':relative in manifest['files'],
                      'launcher_bytes_match_manifest':hashlib.sha256(path.read_bytes()).hexdigest()==manifest['files'].get(relative) if '/.venv/' not in launch and relative in manifest['files'] and path.is_file() and not path.is_symlink() else None,
                    }
                print(json.dumps({'wrapper_predicates':report,'previous_source_sha_matches_base':manifest['previous_sha']=='0a12caddaf9bbd681487906774400a3ad4d0369b','source_file_count':len(manifest['files'])},sort_keys=True))
            except Exception as error:
                print(json.dumps({'wrapper_diagnostic':'blocked','error_type':type(error).__name__}))
                raise SystemExit(1)
            WRAPPER_DIAGNOSTIC
            # Public, unauthenticated GETs only; no financial/analysis route is called.
            curl --fail --silent --show-error --connect-timeout 5 --max-time 10 --request GET --write-out '\nHTTP_STATUS=%{http_code}\n' https://api.cred-x.in/health/ready
            curl --fail --silent --show-error --connect-timeout 5 --max-time 10 --request GET --write-out '\nHTTP_STATUS=%{http_code}\n' https://cred-x.in/api/runtime-fingerprint
            # Do not execute a dirty/unknown live loader or app module merely to inspect metadata.
            if [[ "$source_sha" != 0a12caddaf9bbd681487906774400a3ad4d0369b || "$source_clean" != true ]]; then
              echo 'database_preflight=skipped: live source is not the known reviewed clean base'
              exit 1
            fi
            # Use the existing non-evaluating env loader and app user; never print its contents.
            sudo -n -u "$APP_USER" env APP_ROOT="$APP_ROOT" PYTHONDONTWRITEBYTECODE=1 bash <<'DATABASE'
            set -euo pipefail
            cd "$APP_ROOT/backend"
            source "$APP_ROOT/deploy/no-docker/load-env-file.sh"
            load_env_file /etc/investor/backend.env
            export PYTHONDONTWRITEBYTECODE=1 CREDX_RECOVERY_MODE=1
            .venv/bin/python -B - <<'DBPY'
            import asyncio,json,pathlib,subprocess
            async def verify():
                engine=None
                outcome=1
                try:
                    async with asyncio.timeout(25):
                        # Catch configuration/import errors and bound connection + all reads.
                        import hashlib
                        from sqlalchemy import Column,MetaData,String,Table,func,inspect,select,text
                        from app.infrastructure.database.session import AsyncSessionLocal,async_engine
                        engine=async_engine
                        engine.echo=False
                        audit_tables=('recommendation_evidence','recommendation_decisions','recommendation_verifications','recommendation_spend_accounts','recommendation_spend_attempts')
                        async with AsyncSessionLocal() as db:
                            # Necessary transaction-local SQL enforces read-only PostgreSQL I/O.
                            await db.execute(text('SET TRANSACTION READ ONLY'))
                            await db.execute(text('SET LOCAL statement_timeout = 5000'))
                            await db.execute(text('SET LOCAL lock_timeout = 1000'))
                            connection=await db.connection()
                            tables=set(await connection.run_sync(lambda sync:inspect(sync).get_table_names()))
                            revision=[]
                            if 'alembic_version' in tables:
                                table=Table('alembic_version',MetaData(),Column('version_num',String))
                                revision=list((await db.execute(select(table.c.version_num))).scalars())
                            identity=(await db.execute(text('SELECT current_database(), inet_server_addr()::text, inet_server_port(), current_schema()'))).one()
                            target_hash=hashlib.sha256(json.dumps(list(identity)).encode()).hexdigest()
                            query="""SELECT ns.nspname, rel.relname, tr.tgname, fn.proname, tr.tgenabled, tr.tgtype, md5(pg_get_functiondef(fn.oid)) FROM pg_catalog.pg_trigger tr JOIN pg_catalog.pg_class rel ON rel.oid=tr.tgrelid JOIN pg_catalog.pg_namespace ns ON ns.oid=rel.relnamespace JOIN pg_catalog.pg_proc fn ON fn.oid=tr.tgfoid WHERE NOT tr.tgisinternal AND ns.nspname=current_schema() AND rel.relname IN ('recommendation_evidence','recommendation_decisions') AND tr.tgname IN ('recommendation_evidence_immutable','recommendation_decisions_immutable') ORDER BY rel.relname, tr.tgname"""
                            triggers=[dict(zip(('schema','table','name','function','enabled','event_type_bits','function_definition_md5'),row)) for row in (await db.execute(text(query))).all()]
                            jobs=Table('jobs',MetaData(),Column('status',String),Column('auto_rebalance_portfolio',String))
                            active_jobs=dict((await db.execute(select(jobs.c.status,func.count()).where(jobs.c.auto_rebalance_portfolio.in_(('india','indmoney_us')),jobs.c.status.in_(('pending','processing'))).group_by(jobs.c.status))).all())
                            database_bytes=(await db.execute(select(func.pg_database_size(func.current_database())))).scalar_one()
                            from app.core.config import settings
                            from redis.asyncio import Redis
                            worker_pid=int(subprocess.run(['systemctl','show','investor-recovery-analysis','--property=MainPID','--value'],capture_output=True,text=True,timeout=5,check=True).stdout.strip())
                            if worker_pid<=0: raise ValueError('Inactive recovery worker')
                            runtime_env=dict(part.split(b'=',1) for part in pathlib.Path(f'/proc/{worker_pid}/environ').read_bytes().split(b'\0') if b'=' in part)
                            runtime_broker=(runtime_env.get(b'CELERY_BROKER_URL') or runtime_env.get(b'REDIS_URL') or b'').decode()
                            canonical_broker=settings.celery_broker_url or settings.redis_url
                            broker_matches_worker=runtime_broker==canonical_broker
                            if not broker_matches_worker: raise ValueError('Canonical broker differs from running worker')
                            broker=Redis.from_url(canonical_broker,socket_connect_timeout=3,socket_timeout=3)
                            try:
                                pipeline=broker.pipeline(transaction=False)
                                queue='credx:recovery:analysis:v1:credx_recovery_analysis'
                                for priority in range(10):
                                    pipeline.llen(queue if priority==0 else queue+'\x06\x16'+str(priority))
                                pipeline.hlen('credx:recovery:analysis:v1:unacked')
                                pipeline.zcard('credx:recovery:analysis:v1:unacked_index')
                                counts=await pipeline.execute()
                                queue_state={'pending':sum(counts[:10]),'unacked':counts[10],'unacked_index':counts[11]}
                            finally:
                                await broker.aclose()
                            print(json.dumps({'database_target_fingerprint':target_hash,'alembic_revisions':revision,'expected_parent_verified':revision==['api_attempt_events_001'],'audit_tables_present':{name:name in tables for name in audit_tables},'audit_immutable_trigger_metadata':triggers,'audit_trigger_enforcement':'not established by metadata alone','transaction_read_only':True,'active_equity_job_status_counts':active_jobs,'recovery_queue_counts':queue_state,'canonical_broker_matches_active_worker':broker_matches_worker,'database_bytes':database_bytes,'backup_ready':'not established; approved verified backup required before migration'}))
                            await db.rollback()
                            outcome=0
                except Exception as error:
                    print(json.dumps({'database_preflight':'failed','error_type':type(error).__name__}))
                finally:
                    if engine is not None:
                        try:
                            await asyncio.wait_for(engine.dispose(),timeout=5)
                        except Exception as error:
                            print(json.dumps({'database_cleanup':'failed','error_type':type(error).__name__}))
                            outcome=1
                return outcome
            try:
                raise SystemExit(asyncio.run(verify()))
            except Exception as error:
                print(json.dumps({'database_driver':'failed','error_type':type(error).__name__}))
                raise SystemExit(1)
            DBPY
            DATABASE
