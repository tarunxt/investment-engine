name: UAT synthetic isolation
on:
  pull_request:
    paths:
      - 'backend/app/uat/**'
      - 'scripts/uat/**'
      - '.github/workflows/uat-synthetic.yml'
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check --index-url https://pypi.org/simple -r scripts/uat/requirements-test.txt
      - name: Run synthetic UAT suite
        run: python -m unittest discover -s scripts/uat/tests -v
