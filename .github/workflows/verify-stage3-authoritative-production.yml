name: Verify Stage 3 authoritative production deployment

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  verify-production:
    if: github.event.pull_request.head.ref == 'codex/verify-stage3-authoritative-production'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: c3d286a5d69f828cdefb713a5096020705666cee

    steps:
      - name: Verify exact production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?head_sha=${EXPECTED_SHA}&per_page=20")"
          run_id="$(jq -r '.workflow_runs | map(select(.head_sha == env.EXPECTED_SHA)) | first | .id // empty' <<<"$payload")"
          status="$(jq -r '.workflow_runs | map(select(.head_sha == env.EXPECTED_SHA)) | first | .status // empty' <<<"$payload")"
          conclusion="$(jq -r '.workflow_runs | map(select(.head_sha == env.EXPECTED_SHA)) | first | .conclusion // empty' <<<"$payload")"
          echo "run_id=${run_id:-missing} status=${status:-missing} conclusion=${conclusion:-missing}"
          [[ -n "$run_id" && "$status" == 'completed' && "$conclusion" == 'success' ]]
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
            --jq '.jobs[] | [.name,.status,(.conclusion // "")] | @tsv'

      - name: Verify deployed frontend fingerprint
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location --max-time 20 https://cred-x.in/api/runtime-fingerprint)"
          echo "$response" | jq .
          [[ "$(jq -r '.build_sha // empty' <<<"$response")" == "$EXPECTED_SHA" ]]

      - name: Verify public backend health
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location --max-time 20 https://api.cred-x.in/health)"
          echo "$response" | jq .
          [[ "$(jq -r '.status // empty' <<<"$response")" == 'ok' ]]

      - name: Verify exact production checkout
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          timeout: 120s
          command_timeout: 180s
          script: |
            set -euo pipefail
            EXPECTED_SHA='c3d286a5d69f828cdefb713a5096020705666cee'
            APP_ROOT="${{ vars.EC2_APP_PATH || '/srv/investment-engine' }}"
            APP_USER="${{ vars.EC2_APP_USER || 'investment-engine' }}"
            if [[ ! -d "$APP_ROOT" && -d /srv/investor ]]; then APP_ROOT=/srv/investor; fi
            if ! id "$APP_USER" >/dev/null 2>&1 && id investor >/dev/null 2>&1; then APP_USER=investor; fi

            actual_sha="$(sudo -u "$APP_USER" -H git -C "$APP_ROOT" rev-parse HEAD)"
            echo "APP_ROOT=$APP_ROOT APP_USER=$APP_USER"
            echo "PRODUCTION_GIT_SHA=$actual_sha"
            [[ "$actual_sha" == "$EXPECTED_SHA" ]]

            echo "backend=$(sudo systemctl is-active investor-backend 2>/dev/null || true)"
            echo "frontend=$(sudo systemctl is-active investor-frontend 2>/dev/null || true)"
            echo "auto_live_worker=$(sudo systemctl is-active investor-celery-auto-live-worker 2>/dev/null || true)"
            echo "nginx=$(sudo systemctl is-active nginx 2>/dev/null || true)"
            echo "postgresql=$(sudo systemctl is-active postgresql 2>/dev/null || true)"
            echo "redis_server=$(sudo systemctl is-active redis-server 2>/dev/null || true)"
            echo 'PRODUCTION_STAGE3_AUTHORITATIVE_DEPLOYMENT_VERIFIED=true'
