name: Apply Bullpen auto-run data projection fix

on:
  push:
    branches:
      - codex/fix-bullpen-auto-run-data-projection
    paths:
      - .github/scripts/apply_bullpen_auto_run_data_projection_fix.py
      - .github/workflows/apply-bullpen-auto-run-data-projection-fix.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/scripts/apply_bullpen_auto_run_data_projection_fix.py
      - .github/workflows/apply-bullpen-auto-run-data-projection-fix.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Fix Bullpen auto-run data propagation permanently'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/fix-bullpen-auto-run-data-projection

      - name: Apply permanent source and test changes
        run: |
          set -euo pipefail
          python .github/scripts/apply_bullpen_auto_run_data_projection_fix.py
          python - <<'PY'
          import re
          from pathlib import Path

          test_path = Path('frontend/tests/bullpen-ai-compatibility.test.mjs')
          test_text = test_path.read_text(encoding='utf-8')
          replacements = [
              (
                  r'''const nextSummary = await apiService\.getBullpenAutoLiveDashboardSummary\(\{\s*signal: requestSignal,\s*timeoutMs: 4_000,\s*\}\);''',
                  r'''const nextSummary = await apiService\.getBullpenAutoLiveDashboardSummary\(\{\s*signal: requestSignal,\s*timeoutMs: 5_000,\s*\}\);''',
                  'dashboard timeout assertion',
              ),
              (
                  r'''assert.match(autoRunCardSource, /setSummary\(nextSummary\);/);''',
                  r'''assert.match(autoRunCardSource, /setSummary\(visiblePayload\.summary\);/);''',
                  'terminal evidence summary assertion',
              ),
          ]
          for old, new, label in replacements:
              if test_text.count(old) != 1:
                  raise RuntimeError(
                      f'{label}: expected one match, found {test_text.count(old)}'
                  )
              test_text = test_text.replace(old, new, 1)
          test_path.write_text(test_text, encoding='utf-8')

          card_path = Path(
              'frontend/app/console/bullpen-ai/_components/BullpenAutoRunScheduleCard.tsx'
          )
          card_text = card_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'^\s*\(run\?\.stage2_llm_targets_snapshot\?\.length\n'
              r'\s*\? run\.stage2_llm_targets_snapshot\.length\n'
              r'\s*: null\) \?\?\n',
              flags=re.MULTILINE,
          )
          card_text, count = pattern.subn('', card_text, count=1)
          if count != 1:
              raise RuntimeError(
                  f'unsupported run target snapshot fallback: expected one match, found {count}'
              )
          card_path.write_text(card_text, encoding='utf-8')
          PY

      - name: Record generated-source diagnostics
        continue-on-error: true
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          for path in (
              Path('backend/app/domains/polymarket_auto_live/console_projection.py'),
              Path('backend/tests/test_polymarket_auto_live_console_projection.py'),
          ):
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          PY
          git diff --check

      - name: Run focused frontend regressions
        id: frontend
        continue-on-error: true
        working-directory: frontend
        run: |
          set -o pipefail
          {
            npm ci &&
            node --test \
              tests/bullpen-auto-run-sync.test.mjs \
              tests/bullpen-ai-compatibility.test.mjs &&
            npx tsc --noEmit
          } 2>&1 | tee ../bullpen-auto-run-frontend.log

      - name: Report frontend regression failure
        if: steps.frontend.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Generated Bullpen data-projection patch failed focused frontend verification:'
            echo
            echo '```text'
            grep -n -B 12 -A 30 -E '^(not ok|.*AssertionError|.*error TS[0-9]+)' bullpen-auto-run-frontend.log | head -n 240 || true
            echo '```'
          } > /tmp/bullpen-auto-run-comment.md
          gh api \
            --method PATCH \
            repos/${GITHUB_REPOSITORY}/issues/comments/5090904168 \
            -F body=@/tmp/bullpen-auto-run-comment.md
          exit 1

      - name: Remove one-shot helper files
        run: |
          rm .github/scripts/apply_bullpen_auto_run_data_projection_fix.py
          rm .github/workflows/apply-bullpen-auto-run-data-projection-fix.yml

      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Bullpen auto-run data propagation permanently'
          git push origin HEAD:codex/fix-bullpen-auto-run-data-projection
