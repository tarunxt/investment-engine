            MAX_BYTES=512*1024*1024
            
            
            def require(value):
                if not value: raise RuntimeError('Retained previous-source artifact is not verified')
            
            
            def checksum(path):
                result=hashlib.sha256()
                with path.open('rb') as source:
                    for block in iter(lambda:source.read(1024*1024),b''):result.update(block)
                return result.hexdigest()
            
            
            def verify():
                previous=STAGE/'previous-source'
                require(previous.is_dir() and not previous.is_symlink())
                require(previous.stat().st_uid==os.getuid() and stat.S_IMODE(previous.stat().st_mode)==0o700)
                require({p.name for p in previous.iterdir()}=={'manifest.json','backend-source.tar.gz'})
                for path in previous.iterdir():
                    info=path.lstat()
                    require(stat.S_ISREG(info.st_mode) and not path.is_symlink() and info.st_uid==os.getuid() and stat.S_IMODE(info.st_mode)==0o600 and info.st_nlink==1)
                manifest_path=previous/'manifest.json';archive=previous/'backend-source.tar.gz'
                require(manifest_path.stat().st_size<=2*1024*1024 and archive.stat().st_size<=MAX_BYTES)
                manifest=json.loads(manifest_path.read_text())
                require(manifest['schema']==1 and manifest['app_root']==str(ROOT) and manifest['previous_sha']==BASE)
                require(checksum(archive)==manifest['archive_sha256'])
                # The preceding stage verifier has established this exact public module's
                # candidate Git hash. It contains only the approved source-artifact logic.
                spec=importlib.util.spec_from_file_location('verified_source_artifact',STAGE/'deploy/no-docker/backend-recovery-artifact.py')
                helper=importlib.util.module_from_spec(spec);spec.loader.exec_module(helper)
                sources=helper.checked_files(ROOT,helper.tracked_sources(ROOT))
                expected={p.relative_to(ROOT).as_posix():checksum(p) for p in sources}
                require(expected==manifest['files'] and 0<len(expected)<=20000)
