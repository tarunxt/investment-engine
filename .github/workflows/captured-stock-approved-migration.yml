            load_env_file /etc/investor/backend.env
            export CREDX_RECOVERY_MODE=1 PYTHONDONTWRITEBYTECODE=1 AUDIT_API_FENCED="$credx_audit_producer_fenced" PYTHONPATH=/srv/investor/.audit-migration-2ae3e9466014/backend
            /srv/investor/backend/.venv/bin/python -B - "$credx_audit_requested_phase" <<'DBPY'
            """Approved one-time additive migration driver, run as existing app user.
            
            Canonical credentials remain opaque; only sanitized operational metadata exits.
            The surrounding reviewed shell owns the production lock and service lifecycle.
            """
            import hashlib
            import json
            import os
            from pathlib import Path
            import shutil
            import subprocess
            import sys
            import time
            from uuid import uuid4
            
            
            EXPECTED_TARGET="22a7ee52deda57df24809b18531a85437fc57b695b5662162d68f30c01c248d1"
            PARENT="api_attempt_events_001"
            REVISION="recommendation_audit_001"
            TABLES=("recommendation_evidence","recommendation_decisions","recommendation_verifications","recommendation_spend_accounts","recommendation_spend_attempts")
            STAGE=Path("/srv/investor/.audit-migration-2ae3e9466014")
