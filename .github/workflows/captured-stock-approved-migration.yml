                        tables=set(sa.inspect(connection).get_table_names())
                        version=sa.Table("alembic_version",sa.MetaData(),sa.Column("version_num",sa.String))
                        revisions=list(connection.execute(sa.select(version.c.version_num)).scalars())
                        if expected_revision is None:
