            fi
            # The preserved directory is read only as its existing approved owner.
            # Unknown content, permissions or bytes block before executing any staged code.
            sudo -n -u "$APP_USER" env PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'STAGE'
            """Read-only exact-source validation under the already approved app identity."""
            import hashlib
