                return digest.hexdigest()
            
            
            def private_command(args, *, timeout, environment=None):
                # Bounded tool detail stays private; command arguments contain no credential.
                def retain(stdout,stderr):
                    path=STAGE/"operations.private.log"
                    descriptor=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_APPEND|os.O_NOFOLLOW,0o600)
                    with os.fdopen(descriptor,"ab") as log:
                        log.write(("command="+Path(args[0]).name+" phase="+str(PHASE)+"\n").encode())
                        log.write((stdout or b"")[:1024*1024]);log.write((stderr or b"")[:1024*1024]);log.write(b"\n")
                try: result=subprocess.run(args,env=environment,capture_output=True,timeout=timeout)
                except subprocess.TimeoutExpired as error:
                    retain(error.stdout,error.stderr)
                    raise OperationalBlocked("Bounded operational command timed out") from None
                retain(result.stdout,result.stderr)
                require(result.returncode==0,"Bounded operational command failed; inspect private tool log")
                return result.stdout
            
            
            def metadata(engine, *, expected_revision=PARENT):
                with engine.connect() as connection:
                    transaction=connection.begin()
                    try:
                        connection.execute(sa.text("SET TRANSACTION READ ONLY"))
                        identity=connection.execute(sa.text("SELECT current_database(), inet_server_addr()::text, inet_server_port(), current_schema()" )).one()
                        target=hashlib.sha256(json.dumps(list(identity)).encode()).hexdigest()
