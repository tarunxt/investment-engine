name: Captured Stock Details approved additive migration
on:
  push:
    branches: [codex/captured-stock-approved-migration-20261008]
    paths: [.github/workflows/captured-stock-approved-migration.yml]
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify backup and drain, apply only the approved additive revision
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          timeout: 120s
          command_timeout: 18m
          script: |
            #!/usr/bin/env bash
            # One-time approved additive migration; no financial/analysis route is invoked.
            set -euo pipefail
            export PYTHONDONTWRITEBYTECODE=1 GIT_OPTIONAL_LOCKS=0
            APP_ROOT=/srv/investor
            APP_USER=investor
            MIGRATION_STAGE=/srv/investor/.audit-migration-2ae3e9466014
            CANDIDATE_SHA=2ae3e9466014c5b68bab4b878389a26f0e26077b
            BASE_SHA=0a12caddaf9bbd681487906774400a3ad4d0369b
            restore_api=false
            restore_worker=false
            worker_gracefully_stopped=false
            check_financial_stopped() {
              for family in investor investment-engine; do
                for role in celery-worker celery-email-worker celery-auto-live-worker celery-beat celery-beat-worker; do
                  state=$(sudo -n systemctl show "$family-$role" --property=ActiveState --value) || return 1
                  [[ "$state" == inactive || "$state" == failed ]] || return 1
                done
              done
            }
            check_runtime() {
              check_financial_stopped || return 1
              sudo -n python3 -B - <<'RUNTIME'
            import json,pathlib,subprocess
            from decimal import Decimal
            def require(value):
                if not value: raise RuntimeError('Runtime preservation check failed')
            try:
                for unit in ('investor-backend','investor-recovery-analysis'):
                    result=subprocess.run(['systemctl','show',unit,'--property=ActiveState,MainPID,ExecStartPre,ExecStartPost,ExecStop'],capture_output=True,text=True,timeout=5,check=True)
                    values=dict(line.split('=',1) for line in result.stdout.splitlines() if '=' in line)
                    require(values['ActiveState']=='active' and all(not values.get(key) for key in ('ExecStartPre','ExecStartPost','ExecStop')))
                    pid=int(values['MainPID']);require(pid>0)
                    env=dict(part.split(b'=',1) for part in pathlib.Path(f'/proc/{pid}/environ').read_bytes().split(b'\0') if b'=' in part)
                    require(env.get(b'CREDX_RECOVERY_MODE')==b'1')
                    for key in (b'RECOMMENDATION_AUDIT_ENABLED',b'RECOMMENDATION_AUDIT_RECOVERY_STORED_ONLY_ENABLED',b'RECOMMENDATION_AUDIT_EXTERNAL_ENABLED',b'RECOMMENDATION_AUDIT_FUNDAMENTALS_ENABLED'):
                        require(env.get(key,b'false').strip().lower() in (b'0',b'false',b'off',b'no'))
                    require(Decimal(env.get(b'RECOMMENDATION_AUDIT_DAILY_CAP_USD',b'0').decode())==0)
                print('active_original_recovery_and_disabled_audit_verified=true')
            except Exception as error:
                print(json.dumps({'runtime_preservation':'blocked','error_type':type(error).__name__}))
                raise SystemExit(1)
            RUNTIME
            }
            check_source() {
              [[ "$(sudo -n -u "$APP_USER" git -c core.fsmonitor=false -c core.hooksPath=/dev/null -C "$APP_ROOT" rev-parse HEAD)" == "$BASE_SHA" ]] || return 1
              sudo -n -u "$APP_USER" git -c core.fsmonitor=false -c core.hooksPath=/dev/null -C "$APP_ROOT" diff --no-ext-diff --no-textconv --quiet || return 1
              sudo -n -u "$APP_USER" git -c core.fsmonitor=false -c core.hooksPath=/dev/null -C "$APP_ROOT" diff --cached --no-ext-diff --no-textconv --quiet
            }
            check_wrappers() {
              sudo -n python3 -B - "$1" <<'WRAPPERS'
            import hashlib,json,os,pathlib,re,subprocess,sys
            root=pathlib.Path('/srv/investor');stage=root/'.audit-migration-2ae3e9466014'
            expected={
             'investor-backend':('7c43b70dc498240fe21bb667c8eff4240153dffa79d44b177c0f2038b164dc16','/srv/investor/deploy/no-docker/scripts/run-backend.sh','/srv/investor/backend'),
             'investor-recovery-analysis':('e9e706a3dbbddc24d0dff19ccb3b16e48e5e5a97d3e4b65f0eaddc795827c520','/srv/investor/backend/.venv/bin/celery','/srv/investor/backend'),
             'investor-frontend':('ec007da927932b6b77244b216de7393b5344694321fd51673dc72520d86b4e91','/srv/investor/deploy/no-docker/scripts/run-frontend.sh','/srv/investor/frontend'),
            }
            def require(value):
                if not value: raise SystemExit('Unknown command, hook or wrapper coverage blocks service lifecycle')
            def checksum(path):
                digest=hashlib.sha256()
                with path.open('rb') as stream:
                    for block in iter(lambda:stream.read(1024*1024),b''): digest.update(block)
                return digest.hexdigest()
            manifest=json.loads((stage/'previous-source/manifest.json').read_text())
            report={}
            for unit,(fingerprint,launch,directory) in expected.items():
                result=subprocess.run(['systemctl','show',unit,'--property=ExecStart,ExecStartPre,ExecStartPost,ExecStop,WorkingDirectory,KillMode,TimeoutStopUSec,KillSignal,Environment,EnvironmentFiles'],capture_output=True,text=True,timeout=5,check=True)
                values=dict(line.split('=',1) for line in result.stdout.splitlines() if '=' in line)
                raw=values['ExecStart']
                require(re.findall(r'\bpath=([^ ;}]+)',raw)==[launch] and values['WorkingDirectory']==directory)
                require(all(not values.get(key) for key in ('ExecStartPre','ExecStartPost','ExecStop')))
                require(values['KillMode']=='control-group')
                if unit=='investor-backend': require(values['TimeoutStopUSec']=='30s' and values['KillSignal']=='2')
                if unit=='investor-recovery-analysis': require(values['TimeoutStopUSec']=='5min' and values['KillSignal']=='15')
                if sys.argv[1]=='observe': require(hashlib.sha256(raw.encode()).hexdigest()==fingerprint)
                require(' ; start_time=' in raw)
                stable=raw.split(' ; start_time=',1)[0]
                allowed_env='/etc/investor/frontend.env' if unit=='investor-frontend' else '/etc/investor/analysis-recovery.env'
                env_paths=re.findall(r'(/[^ ]+)',values.get('EnvironmentFiles',''))
                require(env_paths==[allowed_env])
                report[unit]={'command':hashlib.sha256(stable.encode()).hexdigest(),'environment':hashlib.sha256(values.get('Environment','').encode()).hexdigest(),'environment_files':hashlib.sha256(values.get('EnvironmentFiles','').encode()).hexdigest()}
                path=pathlib.Path(launch)
                if '/.venv/' not in launch:
                    relative=path.relative_to(root).as_posix()
                    require(relative in manifest['files'] and checksum(path)==manifest['files'][relative])
            for name in ('backend/.venv/bin/celery','backend/.venv/bin/python'):
                path=root/name
                require(path.is_file())
                report[name]={'resolved_path':str(path.resolve()),'sha256':checksum(path)}
            for filename in ('/etc/investor/backend.env','/etc/investor/frontend.env','/etc/investor/analysis-recovery.env'):
                path=pathlib.Path(filename);require(path.is_file() and not path.is_symlink());report[filename]=checksum(path)
            record=stage/'runtime-wrapper-hashes.json'
            if sys.argv[1]=='observe':
                record.write_text(json.dumps(report,sort_keys=True)+'\n');os.chmod(record,0o600)
            else: require(json.loads(record.read_text())==report)
            print('canonical_wrapper_and_venv_preservation_verified=true')
            WRAPPERS
            }
            finish() {
              result=$?
              trap - EXIT
              if [[ "$restore_worker" == true || "$restore_api" == true ]]; then
                if ! check_source || ! check_financial_stopped || ! check_wrappers restore; then
                  echo 'ROLLBACK_BLOCKED: wrapper or preserved runtime changed; recovery service restart blocked; current state requires confirmation.' >&2
                  echo 'migration_runner_exit=1'
                  exit 1
                fi
              fi
              if [[ "$restore_worker" == true ]]; then
                if [[ "$worker_gracefully_stopped" != true ]] || ! run_database_phase resume; then
                  echo 'RESUME_BLOCKED: recovery worker lacks a confirmed graceful empty state; restart blocked; current state requires confirmation.' >&2
                  result=1
                else
                  sudo -n systemctl start investor-recovery-analysis || result=1
                fi
              fi
              if [[ "$restore_api" == true ]]; then sudo -n systemctl start investor-backend || result=1; fi
              if [[ "$restore_api" == true ]]; then
                ready=false
                for attempt in $(seq 1 40); do
                  if curl -fsS --max-time 3 http://127.0.0.1:8000/health/ready >/dev/null; then ready=true; break; fi
                  sleep 1
                done
                [[ "$ready" == true ]] || result=1
                if [[ "$restore_worker" != true || "$worker_gracefully_stopped" == true ]]; then
                  check_runtime || result=1
                fi
              fi
              echo "migration_runner_exit=$result"
              exit "$result"
            }
            trap finish EXIT
            sudo -n test -d "$APP_ROOT/.git"
            sudo -n touch /run/investor-production-deploy.lock
            sudo -n chown "$(id -u):$(id -g)" /run/investor-production-deploy.lock
            exec 9>/run/investor-production-deploy.lock
            flock -w 60 9
            [[ "$(sudo -n -u "$APP_USER" git -c core.fsmonitor=false -c core.hooksPath=/dev/null -C "$APP_ROOT" rev-parse HEAD)" == "$BASE_SHA" ]]
            sudo -n -u "$APP_USER" git -c core.fsmonitor=false -c core.hooksPath=/dev/null -C "$APP_ROOT" diff --no-ext-diff --no-textconv --quiet
            sudo -n -u "$APP_USER" git -c core.fsmonitor=false -c core.hooksPath=/dev/null -C "$APP_ROOT" diff --cached --no-ext-diff --no-textconv --quiet
            # The exception applies only when no existing backend container runner is active.
            [[ "$(sudo -n docker ps -q | wc -l | tr -d ' ')" == 0 ]]
            for unit in investor-backend investor-recovery-analysis investor-frontend; do
              sudo -n systemctl is-active --quiet "$unit"
              for property in ExecStartPre ExecStartPost ExecStop; do
                [[ -z "$(sudo -n systemctl show "$unit" --property="$property" --value)" ]]
              done
            done
            # No overwrite, install or source checkout; exact approved code is archived separately.
            sudo -n -u "$APP_USER" git -c core.hooksPath=/dev/null -C "$APP_ROOT" fetch origin codex/captured-stock-verification-20261007
            sudo -n -u "$APP_USER" git -C "$APP_ROOT" cat-file -e "$CANDIDATE_SHA^{commit}"
            if ! sudo -n -u "$APP_USER" test -e "$MIGRATION_STAGE"; then
