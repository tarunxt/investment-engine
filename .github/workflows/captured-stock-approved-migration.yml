            import stat
            import subprocess
            
            ROOT=Path('/srv/investor')
            STAGE=ROOT/'.audit-migration-2ae3e9466014'
            CANDIDATE='2ae3e9466014c5b68bab4b878389a26f0e26077b'
            MAX_BYTES=512*1024*1024
            
            
            def require(value):
                if not value: raise RuntimeError('Preserved stage is not the exact private approved candidate')
            
            
            def verify():
                require(not STAGE.is_symlink() and STAGE.is_dir())
                state=STAGE.stat()
                require(state.st_uid==os.getuid() and stat.S_IMODE(state.st_mode)==0o700)
                result=subprocess.run(['git','-c','core.fsmonitor=false','-c','core.hooksPath=/dev/null','-C',str(ROOT),'ls-tree','-rz',CANDIDATE,'--','backend','deploy/no-docker'],capture_output=True,timeout=10,check=True)
                expected={}
                directories=set()
                for raw in result.stdout.split(b'\0'):
                    if not raw: continue
                    header,name=raw.split(b'\t',1)
