                    require(name not in expected)
                    expected[name]=(mode,digest)
                    directories.update(parent.as_posix() for parent in path.parents if parent!=PurePosixPath('.'))
                require(0<len(expected)<=20000)
                retained={'previous-source/manifest.json','previous-source/backend-source.tar.gz'}
                actual=set();actual_directories=set();total=0
                for path in STAGE.rglob('*'):
                    name=path.relative_to(STAGE).as_posix();info=path.lstat()
                    require(not path.is_symlink() and info.st_uid==os.getuid())
                    if stat.S_ISDIR(info.st_mode): actual_directories.add(name)
                    else:
                        require(stat.S_ISREG(info.st_mode) and info.st_nlink==1)
                        actual.add(name);total+=info.st_size
                # Reject unexpected runtime/private content before reading any file bytes.
                has_retained_artifact='previous-source' in actual_directories
                require(actual==(set(expected)|retained if has_retained_artifact else set(expected)))
                require(actual_directories==(directories|{'previous-source'} if has_retained_artifact else directories) and total<=2*MAX_BYTES)
                if has_retained_artifact:
                    require(stat.S_IMODE((STAGE/'previous-source').stat().st_mode)==0o700)
                    for name in retained:require(stat.S_IMODE((STAGE/name).stat().st_mode)==0o600)
                for name,(mode,digest) in expected.items():
                    path=STAGE/name;info=path.stat()
                    require(stat.S_IMODE(info.st_mode)==(0o755 if mode=='100755' else 0o644))
                    data=path.read_bytes()
                    require(hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==digest)
                print('preserved_private_stage_exact_candidate_verified=true')
            
            
            if __name__=='__main__':
                try: verify()
