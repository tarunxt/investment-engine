            SOURCE_ARTIFACT
            sudo -n python3 -B - <<'FRONTEND'
            import json,urllib.request
            from pathlib import Path
            def require(value):
                if not value: raise RuntimeError('Previous frontend preservation check failed')
            response=json.load(urllib.request.urlopen('https://cred-x.in/api/runtime-fingerprint',timeout=5))
            require(response['build_sha']=='0a12caddaf9bbd681487906774400a3ad4d0369b')
            for line in Path('/etc/investor/frontend.env').read_text().splitlines():
                if line.strip().startswith('NEXT_PUBLIC_RECOMMENDATION_AUDIT_ENABLED'):
                    require(line.split('=',1)[1].strip().strip('"').strip("'")=='false')
            print('previous_frontend_sha_verified=true')
            FRONTEND
            run_database_phase() {
              local phase="$1"
              sudo -n -u "$APP_USER" env AUDIT_MIGRATION_PHASE="$phase" AUDIT_API_FENCED="$restore_api" PYTHONDONTWRITEBYTECODE=1 bash <<'DATABASE'
            set -euo pipefail
            readonly credx_audit_requested_phase="$AUDIT_MIGRATION_PHASE"
            readonly credx_audit_producer_fenced="$AUDIT_API_FENCED"
            cd /srv/investor/.audit-migration-2ae3e9466014/backend
