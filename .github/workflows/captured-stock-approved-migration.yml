                        require(all((name in tables)==(expected_revision==REVISION) for name in TABLES),"Unexpected audit schema")
                        jobs=sa.Table("jobs",sa.MetaData(),sa.Column("status",sa.String),sa.Column("auto_rebalance_portfolio",sa.String))
                        jobs_count=connection.execute(sa.select(sa.func.count()).select_from(jobs).where(jobs.c.status.in_(("pending","processing")),jobs.c.auto_rebalance_portfolio.in_(("india","indmoney_us")))).scalar_one()
                        require(jobs_count==0,"Existing analysis jobs prevent a verified drain")
                        size=connection.execute(sa.select(sa.func.pg_database_size(sa.func.current_database()))).scalar_one()
                        return {"database_target_fingerprint":target,"alembic_revisions":revisions,"active_equity_jobs":jobs_count,"database_bytes":size}
                    finally: transaction.rollback()
            
            
            def queue_state(*, active_worker):
                broker_url=settings.celery_broker_url or settings.redis_url
                if active_worker:
                    # Existing API and consumer may use the preserved analysis-recovery
                    # overlay. It must resolve to the exact approved canonical DB/broker.
                    for unit in ("investor-backend","investor-recovery-analysis"):
                        state=private_command(["systemctl","show",unit,"--property=ActiveState,MainPID"],timeout=5).decode()
                        values=dict(line.split("=",1) for line in state.splitlines() if "=" in line)
                        if unit=="investor-backend" and os.getenv("AUDIT_API_FENCED")=="true":
                            require(values.get("ActiveState")=="inactive" and values.get("MainPID")=="0","Fenced producer is not confirmed stopped")
                            continue
                        pid=int(values["MainPID"]);require(pid>0 and values.get("ActiveState")=="active","Recovery service is inactive before drain")
                        env=dict(part.split(b"=",1) for part in Path(f"/proc/{pid}/environ").read_bytes().split(b"\0") if b"=" in part)
                        require((env.get(b"CELERY_BROKER_URL") or env.get(b"REDIS_URL") or b"").decode()==broker_url,"Runtime broker differs from canonical settings")
                        require(env.get(b"DATABASE_URL",b"").decode()==settings.database_url,"Runtime database differs from approved canonical settings")
                    (STAGE/"broker.sha256").write_text(hashlib.sha256(broker_url.encode()).hexdigest())
                    os.chmod(STAGE/"broker.sha256",0o600)
                else:
                    require((STAGE/"broker.sha256").read_text()==hashlib.sha256(broker_url.encode()).hexdigest(),"Broker changed while draining")
                with Redis.from_url(broker_url,socket_connect_timeout=3,socket_timeout=3) as broker:
                    pipeline=broker.pipeline(transaction=False)
                    for priority in range(10): pipeline.llen(PREFIX+"credx_recovery_analysis"+("" if priority==0 else "\x06\x16"+str(priority)))
                    pipeline.hlen(PREFIX+"unacked");pipeline.zcard(PREFIX+"unacked_index")
                    counts=pipeline.execute()
                require(all(value==0 for value in counts),"Recovery queue is not drained")
                return {"pending":sum(counts[:10]),"unacked":counts[10],"unacked_index":counts[11]}
            
            
            def backup(url):
                pg_dump=shutil.which("pg_dump");pg_restore=shutil.which("pg_restore")
                require(pg_dump is not None and pg_restore is not None,"Existing backup tools unavailable")
                destination=STAGE/"database-backup";destination.mkdir(mode=0o700,exist_ok=False)
                archive=destination/"before-recommendation-audit.dump"
                params={"host":url.host,"port":url.port or 5432,"user":url.username,"dbname":url.database,"password":url.password,**url.query}
                backup_engine=sa.create_engine("postgresql+psycopg2://",poolclass=NullPool,connect_args={**params,"connect_timeout":3,"options":"-c statement_timeout=5000 -c lock_timeout=1000"},echo=False)
                try: metadata(backup_engine)  # Verify the exact effective libpq backup parameters.
                finally: backup_engine.dispose()
                env={**os.environ,"PGHOST":params["host"],"PGPORT":str(params["port"]),"PGUSER":params["user"],"PGDATABASE":params["dbname"],"PGPASSWORD":params["password"],"PGCONNECT_TIMEOUT":"3"}
                # Preserve server TLS options supported by libpq; do not invent a weaker mode.
                for key in ("sslmode","sslcert","sslkey","sslrootcert"):
                    if key in url.query: env["PG"+key.upper()]=url.query[key]
                started=time.monotonic();process=None
                with (destination/"pg-dump.private.log").open("wb") as errors:
                    os.chmod(destination/"pg-dump.private.log",0o600)
                    try:
                        process=subprocess.Popen([pg_dump,"--format=custom","--compress=6","--no-password","--file",str(archive)],env=env,stdout=subprocess.DEVNULL,stderr=errors)
                        while process.poll() is None:
                            require(time.monotonic()-started<360,"Backup exceeded its bound")
                            require(shutil.disk_usage(STAGE).free>=RESERVE_BYTES,"Backup would consume the reserved deployment capacity")
                            time.sleep(0.25)
                        require(process.returncode==0,"Database backup failed")
                    finally:
                        if process is not None and process.poll() is None:
                            process.terminate()
                            try: process.wait(timeout=5)
                            except subprocess.TimeoutExpired: process.kill();process.wait(timeout=5)
                os.chmod(archive,0o600)
                require(archive.stat().st_size>0,"Empty database backup")
                private_command([pg_restore,"--list",str(archive)],timeout=20)
                # Read and decompress the complete archive without connecting/restoring data.
                private_command([pg_restore,"--file=/dev/null",str(archive)],timeout=180)
                require(shutil.disk_usage(STAGE).free>=RESERVE_BYTES,"Reserved deployment capacity unavailable")
                result={"archive_sha256":checksum(archive),"bytes":archive.stat().st_size,"archive_read_verified":True,"database_target_fingerprint":EXPECTED_TARGET}
                (destination/"manifest.json").write_text(json.dumps(result,sort_keys=True)+"\n");os.chmod(destination/"manifest.json",0o600)
                return result
            
            
            def immutable_probe(engine):
                with engine.connect() as connection:
                    outer=connection.begin()
                    try:
                        require(connection.execute(sa.text("SELECT current_setting('session_replication_role')")).scalar_one()=="origin","Trigger role is not origin")
                        for name in TABLES[:2]:
                            table=sa.Table(name,sa.MetaData(),autoload_with=connection)
                            row={"id":str(uuid4()),"user_id":-1,"content_hash":"0"*64,"payload":{},"captured_at":sa.func.now()}
                            if name=="recommendation_evidence": row.update(kind="release_probe",source_key="transactional-release-probe")
                            else: row.update(run_id=-1,market="india",symbol="FIXTUREEQ",exchange="NSE",decision_at=sa.func.now(),provenance="release_probe")
                            connection.execute(table.insert().values(**row))
                            for statement in (table.update().where(table.c.id==row["id"]).values(payload={"probe":True}),table.delete().where(table.c.id==row["id"])):
                                savepoint=connection.begin_nested();blocked=False
                                try: connection.execute(statement)
                                except Exception as error:
                                    blocked=getattr(getattr(error,"orig",None),"pgcode",None)=="P0001" and "Recommendation evidence is append-only" in str(getattr(error,"orig",""))
                                finally: savepoint.rollback()
                                require(blocked,"Immutable audit trigger did not reject mutation")
                    finally: outer.rollback()  # No synthetic audit row persists.
                return True
            
            
