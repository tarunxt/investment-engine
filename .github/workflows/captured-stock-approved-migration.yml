                    raise SystemExit(1)
            STAGE
            check_runtime
            # The exact existing candidate artifact helper runs only as investor. It needs
            # no nested sudo, credential access, service operation or directory widening.
            export CREDX_RECOVERY_ROLLBACK_DIR="$MIGRATION_STAGE/previous-source"
            if ! sudo -n -u "$APP_USER" test -d "$CREDX_RECOVERY_ROLLBACK_DIR"; then
              sudo -n -u "$APP_USER" env PYTHONDONTWRITEBYTECODE=1 python3 -B \
                "$MIGRATION_STAGE/deploy/no-docker/backend-recovery-artifact.py" snapshot \
                "$APP_ROOT" "$CREDX_RECOVERY_ROLLBACK_DIR" --previous-sha "$BASE_SHA"
            fi
            # Reuse only the still-exact private rollback artifact; never overwrite it.
            sudo -n -u "$APP_USER" env PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'SOURCE_ARTIFACT'
            """Read-only validation of the retained authorized previous-source artifact."""
