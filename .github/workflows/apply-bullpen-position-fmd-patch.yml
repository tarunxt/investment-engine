name: Apply Bullpen Position FMD Patch

on:
  push:
    branches:
      - fix/bullpen-position-source-fmd

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run Bullpen position FMD patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted fix and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          router = "backend/app/domains/polymarket/router.py"
          replace_once(
              router,
              "\n\nclass BullpenRuntimeHealthResponse(BaseModel):\n",
              '''\n\nclass BullpenRuntimeDisplaySnapshot(BaseModel):\n    \"\"\"Sanitized wallet evidence safe for authenticated UI display.\"\"\"\n\n    payload: dict[str, object]\n    fetched_at: str\n    account_identity: str | None = None\n    position_classifier_version: int | None = None\n    source: str | None = None\n    freshness_state: str | None = None\n\n\nclass BullpenRuntimeDisplayPositionsResponse(BaseModel):\n    ok: bool\n    snapshot: BullpenRuntimeDisplaySnapshot | None = None\n    stale_snapshot: BullpenRuntimeDisplaySnapshot | None = None\n    error: str | None = None\n\n\nclass BullpenRuntimeHealthResponse(BaseModel):\n''',
          )
          replace_once(
              router,
              "\n\nasync def _get_bot(current_user: User) -> object:\n",
              '''\n\ndef _sanitize_bullpen_display_snapshot(\n    snapshot: BullpenPositionsSnapshot | None,\n) -> BullpenRuntimeDisplaySnapshot | None:\n    if snapshot is None:\n        return None\n    return BullpenRuntimeDisplaySnapshot(\n        payload=snapshot.payload,\n        fetched_at=snapshot.fetched_at,\n        account_identity=snapshot.account_identity,\n        position_classifier_version=snapshot.position_classifier_version,\n        source=snapshot.source,\n        freshness_state=snapshot.freshness_state,\n    )\n\n\nasync def _get_bot(current_user: User) -> object:\n''',
          )
          replace_once(
              router,
              '\n\n@router.get("/runtime/health", response_model=BullpenRuntimeHealthResponse)\n',
              '''\n\n@router.get(\n    \"/runtime/positions/display\",\n    response_model=BullpenRuntimeDisplayPositionsResponse,\n)\nasync def get_bullpen_runtime_display_positions(\n    force_fresh: bool = Query(default=False),\n    passive: bool = Query(default=False),\n    caller_source: str | None = Query(default=None, max_length=80),\n    max_age_seconds: int = Query(default=20, ge=0, le=300),\n    current_user: User = Depends(get_current_user),\n):\n    \"\"\"Read-only, sanitized Bullpen wallet evidence for the signed-in UI.\n\n    The operational singleton runtime endpoints remain admin-only. This route\n    exposes only portfolio evidence and deliberately strips credential and\n    runtime diagnostics from the snapshot before it crosses the user boundary.\n    \"\"\"\n\n    del current_user\n    if passive and force_fresh:\n        raise HTTPException(\n            status_code=400,\n            detail=\"Passive Bullpen positions requests cannot force a refresh.\",\n        )\n    broker = get_bullpen_runtime_broker()\n    stale_snapshot = await broker.read_display_positions_snapshot()\n    if stale_snapshot is None:\n        stale_snapshot = await broker.read_cached_positions_snapshot()\n    try:\n        snapshot = await broker.get_positions_snapshot(\n            force_fresh=force_fresh,\n            allow_refresh=not passive,\n            caller_source=caller_source,\n            max_age_seconds=max_age_seconds,\n        )\n        return BullpenRuntimeDisplayPositionsResponse(\n            ok=True,\n            snapshot=_sanitize_bullpen_display_snapshot(snapshot),\n        )\n    except Exception as exc:\n        return BullpenRuntimeDisplayPositionsResponse(\n            ok=False,\n            stale_snapshot=_sanitize_bullpen_display_snapshot(stale_snapshot),\n            error=_http_error_detail(exc),\n        )\n\n\n@router.get("/runtime/health", response_model=BullpenRuntimeHealthResponse)\n''',
          )

          replace_once(
              "frontend/app/api/bullpen-ai/positions/route.ts",
              '`/polymarket/runtime/positions?${backendQuery.toString()}`',
              '`/polymarket/runtime/positions/display?${backendQuery.toString()}`',
          )

          positions = "frontend/lib/bullpenPositions.ts"
          replace_once(
              positions,
              "\n\nexport function shouldPreserveBullpenPositionsOnRefresh({\n",
              '''\n\nexport function canUseBullpenDisplayCacheWithVerifiedLineage({\n  current,\n  incoming,\n  incomingSource,\n}: {\n  current: BullpenPositionsSnapshotLineage | null | undefined;\n  incoming: BullpenPositionsSnapshotLineage | null | undefined;\n  incomingSource: BullpenPositionsSource | null | undefined;\n}) {\n  if (incomingSource !== \"redis-cache\" || !current || !incoming) return false;\n  if (incoming.source?.trim().toLowerCase() !== \"redis-cache\") return false;\n\n  const currentAccount = normalizeLineageAccountIdentity(current.accountIdentity);\n  const incomingAccount = normalizeLineageAccountIdentity(incoming.accountIdentity);\n  if (currentAccount && incomingAccount !== currentAccount) return false;\n\n  if (\n    hasKnownLineageValue(current.positionClassifierVersion) &&\n    current.positionClassifierVersion !== incoming.positionClassifierVersion\n  ) {\n    return false;\n  }\n\n  // Display caches may be produced by the read-only operator bridge and thus\n  // carry a different (or sanitized-away) credential artifact. Same-account,\n  // same-classifier evidence is safe to render, while the verified live\n  // snapshot remains the execution baseline.\n  return true;\n}\n\n\nexport function shouldPreserveBullpenPositionsOnRefresh({\n''',
          )

          client = "frontend/app/console/bullpen-ai/_components/BullpenAiPageClient.tsx"
          replace_once(
              client,
              "  canAutoRebaselineBullpenPositionsLineage,\n  getBullpenPositionsLineageMismatchFields,\n",
              "  canAutoRebaselineBullpenPositionsLineage,\n  canUseBullpenDisplayCacheWithVerifiedLineage,\n  getBullpenPositionsLineageMismatchFields,\n",
          )
          replace_once(
              client,
              '''      const preservingForLineageMismatch =\n        lineageMismatchFields.length > 0 &&\n        !canEstablishFreshLineageBaseline &&\n        Boolean(previousLiveSnapshot);\n      const preserveForDegradedFallback =\n        Boolean(previousLiveSnapshot && !incomingIsFreshUsableLive) ||\n''',
              '''      const canRenderDisplayCache =\n        canUseBullpenDisplayCacheWithVerifiedLineage({\n          current: previousLiveSnapshot?.lineage,\n          incoming: incomingLineage,\n          incomingSource: livePositionsPayload.positionsSource,\n        });\n      const preservingForLineageMismatch =\n        lineageMismatchFields.length > 0 &&\n        !canEstablishFreshLineageBaseline &&\n        !canRenderDisplayCache &&\n        Boolean(previousLiveSnapshot);\n      const preserveForDegradedFallback =\n        Boolean(previousLiveSnapshot && !incomingSnapshotUsable) ||\n''',
          )

          backend_test = Path("backend/tests/test_polymarket_runtime_router.py")
          backend_text = backend_test.read_text()
          marker = "test_runtime_display_positions_allows_signed_in_user_and_strips_runtime_credentials"
          if marker not in backend_text:
              backend_text += '''\n\n@pytest.mark.anyio\nasync def test_runtime_display_positions_allows_signed_in_user_and_strips_runtime_credentials(\n    monkeypatch,\n):\n    snapshot = BullpenPositionsSnapshot(\n        payload={\n            \"positions\": [\n                {\"market\": \"Current wallet row\", \"outcome\": \"Yes\", \"shares\": 2.0}\n            ],\n            \"summary\": {\"total_value\": 22.91},\n        },\n        fetched_at=\"2026-08-10T05:15:15+00:00\",\n        cli_version=\"bullpen 0.1.116\",\n        credential_artifact=BullpenCredentialArtifact(\n            path=\"/home/ubuntu/.bullpen/credentials.json.enc\",\n            inode=99,\n            mtime=100.0,\n            mtime_ns=100,\n            size=200,\n        ),\n        account_identity=\"0xabc123\",\n        position_classifier_version=4,\n        source=\"redis-cache\",\n        freshness_state=\"cached\",\n        diagnostics=BullpenCommandDiagnostics(\n            command_category=\"positions\",\n            pid=1234,\n            unix_user=\"ubuntu\",\n            effective_home=\"/home/ubuntu\",\n            snapshot_producer_source=\"operator-cli-display-bridge\",\n        ),\n    )\n\n    class FakeBroker:\n        async def read_display_positions_snapshot(self):\n            return snapshot\n\n        async def read_cached_positions_snapshot(self):\n            raise AssertionError(\"Display snapshot should be preferred.\")\n\n        async def get_positions_snapshot(self, **kwargs):\n            assert kwargs[\"caller_source\"] == \"ui-history-portfolio-refresh\"\n            return snapshot\n\n    app = FastAPI()\n    app.include_router(polymarket_router)\n    app.dependency_overrides[get_current_user] = lambda: SimpleNamespace(\n        id=8,\n        role=UserRole.USER,\n    )\n    monkeypatch.setattr(\n        \"app.domains.polymarket.router.get_bullpen_runtime_broker\",\n        lambda: FakeBroker(),\n    )\n\n    transport = httpx.ASGITransport(app=app)\n    async with httpx.AsyncClient(transport=transport, base_url=\"http://testserver\") as client:\n        response = await client.get(\n            \"/polymarket/runtime/positions/display\",\n            params={\n                \"force_fresh\": \"true\",\n                \"max_age_seconds\": \"0\",\n                \"caller_source\": \"ui-history-portfolio-refresh\",\n            },\n        )\n\n    assert response.status_code == 200\n    payload = response.json()\n    assert payload[\"ok\"] is True\n    assert len(payload[\"snapshot\"][\"payload\"][\"positions\"]) == 1\n    assert payload[\"snapshot\"][\"account_identity\"] == \"0xabc123\"\n    assert payload[\"snapshot\"][\"position_classifier_version\"] == 4\n    assert \"credential_artifact\" not in payload[\"snapshot\"]\n    assert \"diagnostics\" not in payload[\"snapshot\"]\n\n\n@pytest.mark.anyio\nasync def test_operational_runtime_positions_remain_admin_only(monkeypatch):\n    app = FastAPI()\n    app.include_router(polymarket_router)\n    app.dependency_overrides[get_current_user] = lambda: SimpleNamespace(\n        id=8,\n        role=UserRole.USER,\n    )\n    monkeypatch.setattr(\n        \"app.domains.polymarket.router.get_bullpen_runtime_broker\",\n        lambda: (_ for _ in ()).throw(\n            AssertionError(\"Non-admin users must not reach the operational runtime.\")\n        ),\n    )\n\n    transport = httpx.ASGITransport(app=app)\n    async with httpx.AsyncClient(transport=transport, base_url=\"http://testserver\") as client:\n        response = await client.get(\"/polymarket/runtime/positions\")\n\n    assert response.status_code == 403\n'''
              backend_test.write_text(backend_text)

          frontend_test = Path("frontend/tests/bullpen-positions.test.mjs")
          frontend_text = frontend_test.read_text()
          marker = "same-account Redis display cache can replace stale displayed live rows"
          if marker not in frontend_text:
              frontend_text += '''\n\ntest(\"same-account Redis display cache can replace stale displayed live rows without replacing execution lineage\", async () => {\n  const { canUseBullpenDisplayCacheWithVerifiedLineage } =\n    await loadBullpenPositionsModule();\n  const current = {\n    accountIdentity: \"0xABC123\",\n    credentialArtifact: { inode: 10, mtimeNs: 20, size: 30 },\n    positionClassifierVersion: 4,\n    source: \"live-cli\",\n    freshnessState: \"fresh\",\n  };\n  const sameWalletDisplay = {\n    accountIdentity: \"0xabc123\",\n    credentialArtifact: { inode: null, mtimeNs: null, size: null },\n    positionClassifierVersion: 4,\n    source: \"redis-cache\",\n    freshnessState: \"cached\",\n  };\n\n  assert.equal(\n    canUseBullpenDisplayCacheWithVerifiedLineage({\n      current,\n      incoming: sameWalletDisplay,\n      incomingSource: \"redis-cache\",\n    }),\n    true,\n  );\n  assert.equal(\n    canUseBullpenDisplayCacheWithVerifiedLineage({\n      current,\n      incoming: { ...sameWalletDisplay, accountIdentity: \"0xdifferent\" },\n      incomingSource: \"redis-cache\",\n    }),\n    false,\n  );\n  assert.equal(\n    canUseBullpenDisplayCacheWithVerifiedLineage({\n      current,\n      incoming: { ...sameWalletDisplay, positionClassifierVersion: 5 },\n      incomingSource: \"redis-cache\",\n    }),\n    false,\n  );\n});\n'''
              frontend_test.write_text(frontend_text)

          route_test = Path("frontend/tests/bullpen-positions-route-access.test.mjs")
          route_test.write_text('''import assert from \"node:assert/strict\";\nimport test from \"node:test\";\nimport { readFileSync } from \"node:fs\";\n\ntest(\"Bullpen UI positions use the authenticated display endpoint rather than the admin runtime endpoint\", () => {\n  const source = readFileSync(\n    new URL(\"../app/api/bullpen-ai/positions/route.ts\", import.meta.url),\n    \"utf8\",\n  );\n  assert.match(source, /\\/polymarket\\/runtime\\/positions\\/display\\?\\$\\{backendQuery\\.toString\\(\\)\\}/);\n  assert.doesNotMatch(source, /`\\/polymarket\\/runtime\\/positions\\?\\$\\{backendQuery\\.toString\\(\\)\\}`/);\n});\n''')
          PY
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tarun Singh"
          git config user.email "37398213+tarunxt@users.noreply.github.com"
          git add backend/app/domains/polymarket/router.py \
            backend/tests/test_polymarket_runtime_router.py \
            frontend/app/api/bullpen-ai/positions/route.ts \
            frontend/app/console/bullpen-ai/_components/BullpenAiPageClient.tsx \
            frontend/lib/bullpenPositions.ts \
            frontend/tests/bullpen-positions.test.mjs \
            frontend/tests/bullpen-positions-route-access.test.mjs
          git commit -m "Fix Bullpen UI current position source"
          git push origin HEAD:fix/bullpen-position-source-fmd
