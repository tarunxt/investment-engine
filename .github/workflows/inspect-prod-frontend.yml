name: Inspect Production Frontend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect frontend runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Inspect frontend service over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 900s
          command_timeout: 900s
          script: |
            set -euo pipefail
            APP="${{ vars.EC2_APP_PATH || '/srv/investment-engine' }}"
            LEGACY_APP="/srv/investor"
            if [[ ! -d "$APP" && -d "$LEGACY_APP" ]]; then
              APP="$LEGACY_APP"
            fi
            FRONTEND_ENV_FILE="/etc/investor/frontend.env"
            APP_SERVICE_USER="${{ vars.EC2_APP_USER || 'investment-engine' }}"
            if ! id "$APP_SERVICE_USER" >/dev/null 2>&1 && id investor >/dev/null 2>&1; then
              APP_SERVICE_USER="investor"
            fi
            resolve_systemd_service_name() {
              local preferred="$1"
              local fallback="$2"

              if systemctl is-active --quiet "$preferred" >/dev/null 2>&1 || systemctl is-enabled --quiet "$preferred" >/dev/null 2>&1; then
                printf '%s\n' "$preferred"
                return
              fi

              if systemctl is-active --quiet "$fallback" >/dev/null 2>&1 || systemctl is-enabled --quiet "$fallback" >/dev/null 2>&1; then
                printf '%s\n' "$fallback"
                return
              fi

              if systemctl cat "$preferred" >/dev/null 2>&1; then
                printf '%s\n' "$preferred"
                return
              fi

              printf '%s\n' "$fallback"
            }

            FRONTEND_SERVICE_NAME="$(
              resolve_systemd_service_name "investor-frontend" "investment-engine-frontend"
            )"

            echo "==> App root"
            sudo test -d "$APP/frontend"
            echo "$APP"

            echo "==> Filesystem capacity"
            df -h "$APP"
            sudo du -x -h -d 1 "$APP" /var /tmp 2>/dev/null | sort -h | tail -n 80 || true
            sudo du -x -h -d 2 /var/lib 2>/dev/null | sort -h | tail -n 100 || true
            sudo du -x -h -d 2 "$APP/frontend" 2>/dev/null | sort -h | tail -n 80 || true

            echo "==> PostgreSQL allocation (read-only)"
            if [[ -d /var/lib/postgresql ]]; then
              sudo du -x -h -d 3 /var/lib/postgresql 2>/dev/null | sort -h | tail -n 120 || true
            fi
            if command -v psql >/dev/null 2>&1 && id postgres >/dev/null 2>&1; then
              sudo -u postgres psql -X -d postgres -P pager=off -c "
                SELECT
                  datname AS database,
                  pg_size_pretty(pg_database_size(datname)) AS size
                FROM pg_database
                WHERE datallowconn
                ORDER BY pg_database_size(datname) DESC;
              " || true
              sudo -u postgres psql -X -d aidb -P pager=off -c "
                SELECT
                  n.nspname AS schema,
                  c.relname AS relation,
                  c.relkind AS kind,
                  pg_size_pretty(pg_total_relation_size(c.oid)) AS total_size,
                  pg_size_pretty(pg_relation_size(c.oid)) AS table_size,
                  pg_size_pretty(pg_indexes_size(c.oid)) AS index_size
                FROM pg_class c
                JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE c.relkind IN ('r', 'm')
                  AND n.nspname NOT IN ('pg_catalog', 'information_schema')
                ORDER BY pg_total_relation_size(c.oid) DESC
                LIMIT 40;
              " || true
            else
              echo "postgres psql access is unavailable"
            fi

            echo "==> Container runtime allocation (read-only)"
            if [[ -d /var/lib/containerd ]]; then
              sudo du -x -h -d 4 /var/lib/containerd 2>/dev/null | sort -h | tail -n 160 || true
            fi
            sudo systemctl list-units --type=service --all 'containerd*' 'docker*' 'kubelet*' --no-pager || true
            sudo systemctl list-unit-files 'containerd*' 'docker*' 'kubelet*' --no-pager || true
            if command -v ctr >/dev/null 2>&1; then
              sudo ctr namespaces list || true
              while IFS= read -r namespace; do
                [[ "$namespace" =~ ^[A-Za-z0-9._-]+$ ]] || continue
                echo "-- containerd namespace: $namespace"
                sudo ctr --namespace "$namespace" containers list || true
                sudo ctr --namespace "$namespace" tasks list || true
                sudo ctr --namespace "$namespace" images list || true
                sudo ctr --namespace "$namespace" snapshots list || true
              done < <(sudo ctr namespaces list -q 2>/dev/null || true)
            else
              echo "ctr is not installed"
            fi
            if command -v crictl >/dev/null 2>&1; then
              sudo crictl ps -a || true
              sudo crictl images || true
            fi
            if command -v nerdctl >/dev/null 2>&1; then
              sudo nerdctl system df || true
            fi
            if command -v docker >/dev/null 2>&1; then
              echo "==> Docker containers and reclaimability (read-only)"
              sudo docker ps -a --no-trunc --format 'table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}\t{{.Mounts}}' || true
              sudo docker system df -v || true
            else
              echo "docker is not installed"
            fi

            echo "==> Listener ownership"
            sudo ss -ltnp || true
            echo "==> App service families"
            sudo systemctl list-units --type=service --all 'investor-*' 'investment-engine-*' --no-pager || true

            echo "==> Journal allocation"
            sudo journalctl --disk-usage || true

            echo "==> Deleted files still held open"
            if command -v lsof >/dev/null 2>&1; then
              sudo lsof +L1 2>/dev/null | tail -n 80 || true
            else
              echo "lsof is not installed"
            fi

            echo "==> Frontend env file presence"
            sudo test -f "$FRONTEND_ENV_FILE"
            sudo ls -l "$FRONTEND_ENV_FILE"

            echo "==> Frontend env values"
            sudo env FRONTEND_ENV_FILE="$FRONTEND_ENV_FILE" bash -lc '
              for key in NODE_ENV NEXT_PUBLIC_API_URL NEXT_PUBLIC_FRONTEND_URL NEXTAUTH_URL AUTH_TRUST_HOST NEXT_PUBLIC_BRAND_PREFIX; do
                line="$(grep -E "^${key}=" "$FRONTEND_ENV_FILE" || true)"
                if [[ -n "$line" ]]; then
                  echo "$line"
                else
                  echo "$key=missing"
                fi
              done

              if grep -q "^NEXTAUTH_SECRET=" "$FRONTEND_ENV_FILE"; then
                echo "NEXTAUTH_SECRET=present"
              else
                echo "NEXTAUTH_SECRET=missing"
              fi
            '

            echo "==> Frontend service status"
            sudo systemctl status "$FRONTEND_SERVICE_NAME" --no-pager || true

            echo "==> Recent frontend logs"
            sudo journalctl -u "$FRONTEND_SERVICE_NAME" -n 200 --no-pager || true

            echo "==> Localhost frontend responses"
            curl -i --max-time 20 http://127.0.0.1:3000/login || true
            curl -i --max-time 20 http://127.0.0.1:3000/api/auth/csrf || true

            echo "==> Frontend process env sanity"
            sudo -u "$APP_SERVICE_USER" -H bash -lc "
              cd '$APP/frontend'
              node -e 'console.log({ node: process.version, nextauthUrl: process.env.NEXTAUTH_URL || null, frontendUrl: process.env.NEXT_PUBLIC_FRONTEND_URL || null, apiUrl: process.env.NEXT_PUBLIC_API_URL || null, trustHost: process.env.AUTH_TRUST_HOST || null })'
            "
