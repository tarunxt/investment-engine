name: Inspect Upstox Protection Metadata
on:
  push:
    branches: [ops/inspect-upstox-protection]
    paths: [.github/workflows/inspect-prod-frontend.yml]
permissions:
  contents: read
jobs:
  inspect:
    name: Read existing Upstox limiter metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only production inspection
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          command_timeout: 120s
          script: |
            set -eu
            echo 'READ ONLY: no configuration, secret, cache-value or provider reads; no state writes or restarts.'
            sudo /srv/investor/backend/.venv/bin/python - <<'PY'
            import collections, datetime, hashlib, json, math, subprocess
            import redis
            from urllib.request import urlopen
            result = {'at':datetime.datetime.now(datetime.timezone.utc).isoformat(), 'redis_connection':'existing unauthenticated loopback:6379; backend target not assumed', 'databases':[]}
            prefix='upstox:full-quotes:v1:'+hashlib.sha256(b'2').hexdigest()
            allowed={'admitted','quota_blocked','backoff_blocked','history_warmup','cache_hit','coalesced','coalesced_unavailable','provider_429','provider_failure','invalid_response','empty_response','unmapped','success'}
            try:
                with redis.Redis(host='127.0.0.1',port=6379,db=0,socket_connect_timeout=1,socket_timeout=1,decode_responses=True) as client:
                    seconds,micro=client.time()
                    result['redis_server_time_ms']=seconds*1000+micro//1000
                    keyspace=client.info('keyspace')
                databases=sorted({0}|{int(k[2:]) for k in keyspace if k.startswith('db') and k[2:].isdigit()})
                if len(databases)>32: raise RuntimeError('Database enumeration bound exceeded')
                for db in databases:
                    with redis.Redis(host='127.0.0.1',port=6379,db=db,socket_connect_timeout=1,socket_timeout=1,decode_responses=True) as client:
                        history=client.get(prefix+':history')
                        counters=client.hgetall(prefix+':counters')
                        if history is None and not counters: continue
                        record={'db':db,'counters':{k:int(v) for k,v in counters.items() if k in allowed and v.isdigit()},'cooldown_remaining_ms':client.pttl(prefix+':cooldown'),'reservation_count':client.zcard(prefix+':requests')}
                        try:
                            stamp=float(history)
                            if math.isfinite(stamp) and 0<stamp<result['redis_server_time_ms']+3600000: record['history_timestamp_ms']=stamp
                        except (ValueError,TypeError): pass
                        result['databases'].append(record)
            except Exception as error:
                result['redis_error_type']=type(error).__name__
            try:
                with urlopen('http://127.0.0.1:8000/health/ready',timeout=5) as response:
                    body=json.loads(response.read(20000))
                    result['health']={'http':response.status,'status':body.get('status'),'checks':{k:v for k,v in body.get('checks',{}).items() if k in {'redis','postgres'} and v in {'ok','unavailable'}}}
            except Exception as error:
                result['health_error_type']=type(error).__name__
            events={'coordination_unavailable':'Upstox quote coordination unavailable; provider access suppressed','provider_failure':'Upstox read-only quote fallback unavailable','provider_429':'Upstox quote rate limited; shared cooldown applied'}
            try:
                logs=subprocess.run(['journalctl','-u','investor-backend','--since','2026-10-31 10:23:00 UTC','-n','2000','--no-pager','-o','json'],capture_output=True,text=True,timeout=15,check=True)
                counts=collections.Counter(); last={}
                for line in logs.stdout.splitlines():
                    try: entry=json.loads(line)
                    except ValueError: continue
                    message=entry.get('MESSAGE','')
                    for category,exact in events.items():
                        if message.endswith(exact):
                            counts[category]+=1
                            stamp=entry.get('__REALTIME_TIMESTAMP','')
                            if str(stamp).isdigit(): last[category]=int(stamp)
                result['recognized_guard_log_counts']=dict(counts)
                result['recognized_guard_last_event_us']=last
                result['log_coverage']='at most 2000 backend records since 10:23 UTC; no raw messages returned'
            except Exception as error:
                result['journal_error_type']=type(error).__name__
            print(json.dumps(result,sort_keys=True))
            PY


