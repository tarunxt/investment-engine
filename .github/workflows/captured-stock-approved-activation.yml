          CHECKOUT_SECONDS: ${{ needs.build-frontend.outputs.checkout_seconds }}
          DEPENDENCY_SECONDS: ${{ needs.build-frontend.outputs.dependency_seconds }}
          BUILD_SECONDS: ${{ needs.build-frontend.outputs.build_seconds }}
          PACKAGE_SECONDS: ${{ needs.build-frontend.outputs.package_seconds }}
          UPLOAD_SECONDS: ${{ needs.build-frontend.outputs.upload_seconds }}
          DOWNLOAD_SECONDS: ${{ steps.download-timing.outputs.seconds }}
