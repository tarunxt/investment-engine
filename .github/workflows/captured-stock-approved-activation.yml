            def prepare(state_path):
                require(not state_path.exists() and state_path.parent.is_dir() and not state_path.parent.is_symlink(),'state_path')
                require(stat.S_IMODE(state_path.parent.stat().st_mode)==0o700 and state_path.parent.stat().st_uid==os.getuid(),'state_parent_owner_mode')
                records={}
                for path,keys in TARGETS.items():
                    data,info=read_target(path);planned,changes=plan_bytes(data,keys)
                    records[str(path)]=record_for(data,planned,changes,info)
                state={'schema':1,'targets':records}
