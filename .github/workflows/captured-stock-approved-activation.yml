                    require(re.fullmatch(r'/srv/investor/\.audit-activation-[0-9a-f]{40}-[0-9]+-[0-9]+/flag-state.json',state_name) is not None,'fixed_state_destination')
                    require(operation in {'prepare','enable','verify','restore'},'named_flag_operation')
                    if operation=='prepare':prepare(state_path)
                    elif operation=='verify':verify_enabled(state_path)
                    else:change(state_path,restore=operation=='restore')
