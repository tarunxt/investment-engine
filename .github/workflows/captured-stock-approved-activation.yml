                with os.fdopen(descriptor,'w') as target:
                    json.dump(state,target,sort_keys=True);target.write('\n');target.flush();os.fsync(target.fileno())
                print('approved_flag_state_retained=true')
            
            
            def change(state_path,*,restore):
                require(not state_path.is_symlink() and state_path.is_file() and state_path.stat().st_size<=MAX_BYTES,'state_file')
                require(state_path.stat().st_uid==os.getuid() and stat.S_IMODE(state_path.stat().st_mode)==0o600 and state_path.stat().st_nlink==1,'state_owner_mode')
                state=json.loads(state_path.read_text())
                require(state.get('schema')==1 and set(state['targets'])=={str(path) for path in TARGETS},'state_targets')
                plans=[]
                for path,keys in TARGETS.items():
                    data,info=read_target(path);record=state['targets'][str(path)]
                    require((info.st_uid,info.st_gid,stat.S_IMODE(info.st_mode))==(record['uid'],record['gid'],record['mode']),'target_owner_mode_drift')
