            --arg commit "$GITHUB_SHA" \
            --arg scope "$DEPLOY_SCOPE" \
            --arg checkout "${CHECKOUT_SECONDS:-}" \
            --arg dependency_restore "${DEPENDENCY_SECONDS:-}" \
            --arg frontend_build "${BUILD_SECONDS:-}" \
            --arg packaging "${PACKAGE_SECONDS:-}" \
            --arg artifact_upload "${UPLOAD_SECONDS:-}" \
            --arg artifact_download "${DOWNLOAD_SECONDS:-}" \
            --arg artifact_transfer "${TRANSFER_SECONDS:-}" \
            --arg remote_deploy "${REMOTE_SECONDS:-}" \
            --argjson remote_phases "$remote_phases" \
            '{
              schemaVersion: 1,
              commit: $commit,
              scope: $scope,
              durationsSeconds: {
                checkout: ($checkout | tonumber?),
                dependencyRestore: ($dependency_restore | tonumber?),
                frontendBuild: ($frontend_build | tonumber?),
                packaging: ($packaging | tonumber?),
                artifactUpload: ($artifact_upload | tonumber?),
                artifactDownload: ($artifact_download | tonumber?),
                artifactTransfer: ($artifact_transfer | tonumber?),
                remoteDeploy: ($remote_deploy | tonumber?)
              },
              remotePhasesSeconds: $remote_phases
            }' >"${RUNNER_TEMP}/deployment-timings.json"

      - name: Upload raw deployment timing logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-timing-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
