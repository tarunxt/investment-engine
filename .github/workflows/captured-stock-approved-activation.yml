        run: |
          printf '%s\n' "$DEPLOY_STDOUT" >"${RUNNER_TEMP}/remote-deploy.log"
          remote_phases="$(
            awk -F '\t' '$1 == "INVESTOR_DEPLOY_TIMING" {
              print $2 "\t" $3
