                    'investor-recovery-analysis':('/srv/investor/backend/.venv/bin/celery','/srv/investor/backend','5min','15','/etc/investor/analysis-recovery.env'),
                    'investor-frontend':('/srv/investor/deploy/no-docker/scripts/run-frontend.sh','/srv/investor/frontend','30s','15','/etc/investor/frontend.env'),
