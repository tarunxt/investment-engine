                    pattern=re.compile(rb'^[ \t]*'+re.escape(key)+rb'[ \t]*=[ \t]*(.*?)[ \t]*(?:\r?\n)?$')
                    matches=[(index,pattern.fullmatch(line)) for index,line in enumerate(lines)]
                    matches=[(index,match) for index,match in matches if match]
                    require(len(matches)<=1,'duplicate_flag')
                    if matches:
                        index,match=matches[0];value=match.group(1).strip()
                        if len(value)>=2 and value[:1]==value[-1:] and value[:1] in (b'"',b"'"):value=value[1:-1]
                        require(value.lower() in OFF,'prior_flag_not_off')
                        old=lines[index];ending=b'\r\n' if old.endswith(b'\r\n') else b'\n' if old.endswith(b'\n') else b''
                        new=key+b'=true'+ending
                        changes.append({'index':index,'old':base64.b64encode(old).decode(),'new':base64.b64encode(new).decode()})
                        lines[index]=new
                    else:
                        # Append without treating a credential's final line as a flag.
                        prefix=b'\n' if lines and not lines[-1].endswith(b'\n') else b''
                        new=prefix+key+b'=true\n'
