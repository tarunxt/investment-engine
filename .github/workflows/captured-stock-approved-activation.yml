name: Captured Stock Details approved stored-only activation
on:
  push:
    branches: [codex/captured-stock-approved-activation-20261008]
    paths: [.github/workflows/captured-stock-approved-activation.yml]
permissions:
  actions: read
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  RELEASE_SHA: abacd883a6cb17f257bbd869e1c530234fbefd48
  FRONTEND_ARTIFACT_NAME: frontend-runtime-abacd883a6cb17f257bbd869e1c530234fbefd48
  FRONTEND_ARTIFACT_FILE: frontend-runtime-abacd883a6cb17f257bbd869e1c530234fbefd48.tar.gz

jobs:
  activation-offline:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: abacd883a6cb17f257bbd869e1c530234fbefd48
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Execute private frontend adapter transaction and rollback fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir .audit-activation-offline
          cat > .audit-activation-offline/adapter.py <<'ADAPTER_SOURCE'
          """Private exact-source adapter: promote an artifact without installing host config."""
          import hashlib
          from pathlib import Path
          import sys
          
          SOURCE_SHA256='474c37bb276855cce2c028fd75767b7095a274a3d189277782aa487fdf116e72'
          OLD='''if [[ "$DEPLOY_FRONTEND" == "true" ]]; then
            install_systemd_unit "$FRONTEND_SERVICE_NAME"
            echo "==> Install/update frontend nginx template when changed"
            install_or_update_nginx_template
          fi'''
          NEW='''if [[ "$DEPLOY_FRONTEND" == "true" ]]; then
            echo "==> Private activation preserves existing systemd and Nginx configuration"
            preserved_frontend_unit="$SYSTEMD_UNIT_ROOT/$(systemd_unit_file_name "$FRONTEND_SERVICE_NAME")"
            sudo test -f "$preserved_frontend_unit" || { echo "Existing frontend unit required" >&2; exit 1; }
            INSTALLED_SYSTEMD_UNITS+=("$preserved_frontend_unit")
          fi'''
          
          def adapt(source):
              if hashlib.sha256(source).hexdigest()!=SOURCE_SHA256:raise RuntimeError('Exact reviewed redeployer required')
              text=source.decode()
              if text.count(OLD)!=1:raise RuntimeError('Exact configuration block required')
              return text.replace(OLD,NEW,1)
          
          if __name__=='__main__':
              try:
                  if len(sys.argv)!=2 or sys.argv[1]!='/srv/investor/deploy/no-docker/redeploy.sh':raise RuntimeError('Known source required')
                  sys.stdout.write(adapt(Path(sys.argv[1]).read_bytes()))
              except Exception as error:
                  print('activation_frontend_adapter=blocked; error_type='+type(error).__name__,file=sys.stderr)
                  raise SystemExit(1)
          ADAPTER_SOURCE
          python3 - <<'COMPILE_ADAPTER'
          import importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('adapter',Path('.audit-activation-offline/adapter.py'))
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          Path('.audit-activation-offline/compiled-activation-frontend.sh').write_text(module.adapt(Path('deploy/no-docker/redeploy.sh').read_bytes()))
          COMPILE_ADAPTER
          cat > .audit-activation-offline/activation-frontend-transaction.test.mjs <<'FRONTEND_FIXTURE'
          import assert from "node:assert/strict";
          import { createHash, randomBytes } from "node:crypto";
          import { execFile } from "node:child_process";
          import {
            chmod,
            cp,
            mkdir,
            mkdtemp,
            readFile,
            symlink,
            writeFile,
          } from "node:fs/promises";
          import path from "node:path";
          import test from "node:test";
          import { promisify } from "node:util";
          import { fileURLToPath } from "node:url";
          
          const execFileAsync = promisify(execFile);
          const repositoryRoot = process.cwd();
          const realNode = process.execPath;
          
          async function executable(filePath, source) {
            await writeFile(filePath, source, "utf8");
            await chmod(filePath, 0o755);
          }
          
          async function createHarness() {
            const root = await mkdtemp("/tmp/investor-deploy-transaction-");
            const releaseRoot = path.join(root, "release");
            const srvRoot = path.join(root, "srv");
            const appRoot = path.join(srvRoot, "investor");
            const frontendRoot = path.join(releaseRoot, "frontend");
            const fakeBin = path.join(root, "bin");
            const logPath = path.join(root, "commands.log");
            const systemdRoot = path.join(root, "systemd");
            const nginxRoot = path.join(root, "nginx");
            await mkdir(frontendRoot, { recursive: true });
            await mkdir(srvRoot, { recursive: true });
            await mkdir(fakeBin, { recursive: true });
            await mkdir(systemdRoot, { recursive: true });
            await writeFile(path.join(systemdRoot,"investor-frontend.service"),"existing-unit");
            await mkdir(path.join(nginxRoot, "sites-available"), { recursive: true });
            await mkdir(path.join(nginxRoot, "sites-enabled"), { recursive: true });
            await symlink(releaseRoot, appRoot);
            await cp(path.join(repositoryRoot, "deploy"), path.join(releaseRoot, "deploy"), {
              recursive: true,
            });
            await writeFile(path.join(releaseRoot,"deploy/no-docker/redeploy.sh"),await readFile(".audit-activation-offline/compiled-activation-frontend.sh"));
            await cp(path.join(repositoryRoot, "scripts"), path.join(releaseRoot, "scripts"), {
              recursive: true,
            });
            await cp(
              path.join(repositoryRoot, "frontend", "package-lock.json"),
              path.join(frontendRoot, "package-lock.json"),
            );
          
            const activeSlot = path.join(frontendRoot, ".next");
            await mkdir(path.join(activeSlot, ".next", "static"), { recursive: true });
            await writeFile(path.join(activeSlot, "server.js"), "previous-runtime\n");
            await writeFile(path.join(activeSlot, ".next", "BUILD_ID"), "previous\n");
            await writeFile(path.join(activeSlot, "active-marker"), "previous-untouched\n");
            await writeFile(path.join(frontendRoot, ".next-active-dir"), ".next\n");
          
            const artifactRoot = path.join(root, "artifact-root");
            await mkdir(path.join(artifactRoot, ".next", "static"), { recursive: true });
            await writeFile(path.join(artifactRoot, "server.js"), "candidate-runtime\n");
            await writeFile(path.join(artifactRoot, ".next", "BUILD_ID"), "candidate\n");
            await writeFile(
              path.join(artifactRoot, ".next", "static", "candidate.js"),
              "candidate\n",
            );
            await writeFile(path.join(artifactRoot, "candidate-marker"), "candidate\n");
            const artifact = path.join(root, "frontend.tar.gz");
            await execFileAsync("tar", ["-czf", artifact, "-C", artifactRoot, "."]);
            const artifactBytes = await readFile(artifact);
            const checksum = createHash("sha256").update(artifactBytes).digest("hex");
            await writeFile(`${artifact}.sha256`, `${checksum}  frontend.tar.gz\n`);
          
            const frontendEnv = path.join(root, "frontend.env");
            await writeFile(
              frontendEnv,
              [
                "NEXTAUTH_URL=http://127.0.0.1:3000",
                "NEXTAUTH_SECRET="+randomBytes(24).toString("hex"),
                "NEXT_PUBLIC_FRONTEND_URL=https://cred-x.test",
                "NEXT_PUBLIC_API_URL=https://api.cred-x.test",
              ].join("\n"),
            );
          
            await executable(
              path.join(fakeBin, "sudo"),
              `#!/usr/bin/env bash
          set -e
          while [[ "\${1:-}" == "-u" || "\${1:-}" == "-H" || "\${1:-}" == "--" ]]; do
            if [[ "$1" == "-u" ]]; then shift 2; else shift; fi
          done
          if [[ "\${1:-}" == "bash" && "\${2:-}" == "-lc" ]]; then
            exec bash -c "export PATH='${fakeBin}':\\$PATH; \${3}"
          fi
          exec "$@"
          `,
            );
            await executable(
              path.join(fakeBin, "systemctl"),
              `#!/usr/bin/env bash
          echo "systemctl $*" >> "${logPath}"
          case "\${1:-}" in
            is-active|is-enabled)
              unit="\${@: -1}"
              if [[ "$unit" == *frontend* || "$unit" == nginx ]]; then
                [[ "\${2:-}" == "--quiet" ]] || echo active
                exit 0
              fi
              [[ "\${2:-}" == "--quiet" ]] || echo inactive
              exit 1
              ;;
            cat)
              [[ "\${2:-}" == *frontend* ]]
              ;;
            show)
              echo 0
              ;;
            *)
              exit 0
              ;;
          esac
          `,
            );
            await executable(
              path.join(fakeBin, "systemd-analyze"),
              `#!/usr/bin/env bash
          echo "systemd-analyze $*" >> "${logPath}"
          exit 0
          `,
            );
            await executable(
              path.join(fakeBin, "nginx"),
              `#!/usr/bin/env bash
          echo "nginx $*" >> "${logPath}"
          exit 0
          `,
            );
            await executable(
              path.join(fakeBin, "node"),
              `#!/usr/bin/env bash
          set -e
          script="\${1:-}"
          if [[ "$script" == *frontend-artifact.mjs ]]; then
            command="\${2:-}"
            frontend_root="\${3:-}"
            case "$command" in
              select)
                active=".next"
                [[ -f "$frontend_root/.next-active-dir" ]] && active="$(tr -d '\\r\\n' < "$frontend_root/.next-active-dir")"
                [[ "$active" == ".next" ]] && printf '.next\\t.next-candidate\\n' || printf '.next-candidate\\t.next\\n'
                ;;
              resolve-launch)
                active="$(tr -d '\\r\\n' < "$frontend_root/.next-active-dir")"
                printf 'standalone-slot\\t%s/%s\\t%s\\n' "$frontend_root" "$active" "$active"
                ;;
              point)
                printf '%s\\n' "\${4}" > "$frontend_root/.next-active-dir"
                ;;
              validate-host)
                test -f "$frontend_root/server.js"
                ;;
              *)
                exit 2
                ;;
            esac
            exit 0
          fi
          if [[ "$script" == *verify-frontend-artifact-runtime.mjs ]]; then
            exit 0
          fi
          exec "${realNode}" "$@"
          `,
            );
            await executable(path.join(fakeBin,"install"),`#!/bin/bash
          echo "FORBIDDEN_CONFIG_WRITE" >> "${logPath}"
          exit 99
          `);
            await executable(
              path.join(fakeBin, "curl"),
              `#!/usr/bin/env bash
          set -e
          url=""
          headers=""
          output=""
          write_out=""
          while (( "$#" )); do
            case "$1" in
              --dump-header) headers="$2"; shift 2 ;;
              --output|-o) output="$2"; shift 2 ;;
              --write-out|-w) write_out="$2"; shift 2 ;;
              --max-time) shift 2 ;;
              --fail|--silent|--show-error|--location|-f|-s|-S|-L|-fsS) shift ;;
              http*) url="$1"; shift ;;
              *) shift ;;
            esac
          done
          body="ok"
          case "$url" in
            */api/runtime-fingerprint)
              body='{"build_sha":"candidate-sha"}'
              ;;
            */api/auth/csrf)
              body='{"csrfToken":"test-csrf"}'
              ;;
            */api/auth/providers)
              body='{"credentials":{"id":"credentials","signinUrl":"http://127.0.0.1:3000/api/auth/signin/credentials"}}'
              ;;
            */console/dashboard)
              [[ -n "$headers" ]] && printf 'HTTP/1.1 307 Temporary Redirect\\r\\nlocation: /login?redirectTo=%%2Fconsole%%2Fdashboard\\r\\n\\r\\n' > "$headers"
              write_out="307"
              ;;
            */console/bullpen-ai)
              [[ -n "$headers" ]] && printf 'HTTP/1.1 307 Temporary Redirect\\r\\nlocation: /login?redirectTo=%%2Fconsole%%2Fbullpen-ai\\r\\n\\r\\n' > "$headers"
              write_out="307"
              ;;
            */_next/static/*.css)
              [[ -n "$headers" ]] && printf 'HTTP/1.1 200 OK\\r\\ncontent-type: text/css\\r\\n\\r\\n' > "$headers"
              body='body{}'
              ;;
            */_next/static/*.js)
              [[ -n "$headers" ]] && printf 'HTTP/1.1 200 OK\\r\\ncontent-type: application/javascript\\r\\n\\r\\n' > "$headers"
              body='(()=>{})()'
              ;;
            */login)
              body='<link href="/_next/static/app.css"><script src="/_next/static/app.js"></script>'
              ;;
          esac
          if [[ -n "$output" && "$output" != "/dev/null" ]]; then
            printf '%s' "$body" > "$output"
          elif [[ -z "$output" ]]; then
            printf '%s' "$body"
          fi
          [[ -n "$write_out" ]] && printf '%s' "$write_out"
          exit 0
          `,
            );
          
            return {
              root,
              appRoot,
              frontendRoot,
              fakeBin,
              logPath,
              systemdRoot,
              nginxRoot,
              frontendEnv,
              artifact,
            };
          }
          
          async function runFailure(phase) {
            const harness = await createHarness();
            let result;
            try {
              await execFileAsync(
                "bash",
                [path.join(harness.appRoot, "deploy/no-docker/redeploy.sh"), "frontend-only"],
                {
                  env: {
                    ...process.env,
                    PATH: `${harness.fakeBin}:${process.env.PATH}`,
                    APP_ROOT: harness.appRoot,
                    APP_USER: process.env.USER,
                    FRONTEND_ENV_FILE: harness.frontendEnv,
                    FRONTEND_ARTIFACT: harness.artifact,
                    EXPECTED_FRONTEND_SHA: "candidate-sha",
                    SKIP_GIT_SYNC: "true",
                    SYSTEMD_UNIT_ROOT: harness.systemdRoot,
                    NGINX_CONFIG_ROOT: harness.nginxRoot,
                    SMOKE_RETRIES: "1",
                    SMOKE_RETRY_SLEEP_SECONDS: "0",
                    SERVICE_STARTUP_RETRIES: "1",
                    SERVICE_STARTUP_RETRY_SLEEP_SECONDS: "0",
                    SERVICE_STABLE_SECONDS: "0",
                    INVESTOR_DEPLOY_TEST_MODE: "true",
                    INVESTOR_DEPLOY_TEST_FAIL_PHASE: phase,
                  },
                },
              );
              assert.fail(`deployment unexpectedly succeeded for ${phase}`);
            } catch (error) {
              result = error;
            }
            const trace=await readFile(harness.logPath,"utf8").catch(()=>"");
            assert.doesNotMatch(trace,/FORBIDDEN_CONFIG_WRITE|daemon-reload|reload nginx/);
            assert.ok(`${result.stdout??""}\n${result.stderr??""}`.includes(`Injected deployment test failure: ${phase}`),`${phase} was not reached: ${result.stderr??""}`);
            return { harness, result };
          }
          
          for (const phase of ["extraction", "host-validation", "candidate-verification"]) {
            test(`pre-promotion ${phase} failure leaves the active slot untouched`, async () => {
              const { harness } = await runFailure(phase);
              assert.equal(
                (await readFile(path.join(harness.frontendRoot, ".next-active-dir"), "utf8")).trim(),
                ".next",
              );
              assert.equal(
                await readFile(path.join(harness.frontendRoot, ".next", "active-marker"), "utf8"),
                "previous-untouched\n",
              );
            });
          }
          
          for (const phase of [
            "service-startup",
            "fingerprint-verification",
            "js-css-verification",
            "authjs-verification",
            "dashboard-smoke",
            "bullpen-smoke",
            "backend-proxy-verification",
            "contained-release-guard",
            "nginx-validation",
          ]) {
            test(`post-promotion ${phase} failure executes and verifies rollback`, async () => {
              const { harness, result } = await runFailure(phase);
              const combinedOutput = `${result.stdout ?? ""}\n${result.stderr ?? ""}`;
              const commands = await readFile(harness.logPath, "utf8").catch(() => "");
              assert.match(combinedOutput, /Restoring the previous frontend build/);
              assert.match(combinedOutput, /Final verification of restored frontend/);
              assert.equal(
                (await readFile(path.join(harness.frontendRoot, ".next-active-dir"), "utf8")).trim(),
                ".next",
              );
              assert.equal(
                await readFile(path.join(harness.frontendRoot, ".next", "active-marker"), "utf8"),
                "previous-untouched\n",
              );
              assert.equal(
                await readFile(
                  path.join(harness.frontendRoot, ".next-candidate", "candidate-marker"),
                  "utf8",
                ),
                "candidate\n",
              );
              assert.ok(
                commands.match(/systemctl restart investor-frontend/g)?.length >= 2,
                commands,
              );
              assert.doesNotMatch(
                commands,
                /investor-(?:backend|celery-worker|celery-beat)/,
              );
            });
          }
          
          test("private adapter succeeds while preserving host files and the previous slot",async()=>{
           const h=await createHarness();
           await writeFile(path.join(h.systemdRoot,"investor-frontend.service"),"existing-unit-canary");
           await writeFile(path.join(h.nginxRoot,"sites-available","existing"),"existing-nginx-canary");
           const result=await execFileAsync("bash",[path.join(h.appRoot,"deploy/no-docker/redeploy.sh"),"frontend-only"],{env:{...process.env,
           PATH:`${h.fakeBin}:${process.env.PATH}`,APP_ROOT:h.appRoot,APP_USER:process.env.USER,FRONTEND_ENV_FILE:h.frontendEnv,
           FRONTEND_ARTIFACT:h.artifact,EXPECTED_FRONTEND_SHA:"candidate-sha",SKIP_GIT_SYNC:"true",SYSTEMD_UNIT_ROOT:h.systemdRoot,NGINX_CONFIG_ROOT:h.nginxRoot,
           SMOKE_RETRIES:"1",SMOKE_RETRY_SLEEP_SECONDS:"0",SERVICE_STARTUP_RETRIES:"1",SERVICE_STARTUP_RETRY_SLEEP_SECONDS:"0",SERVICE_STABLE_SECONDS:"0"}});
           assert.match(result.stdout,/Deploy complete/);
           assert.equal(await readFile(path.join(h.systemdRoot,"investor-frontend.service"),"utf8"),"existing-unit-canary");
           assert.equal(await readFile(path.join(h.nginxRoot,"sites-available","existing"),"utf8"),"existing-nginx-canary");
           assert.equal(await readFile(path.join(h.frontendRoot,".next","active-marker"),"utf8"),"previous-untouched\n");
           assert.equal((await readFile(path.join(h.frontendRoot,".next-active-dir"),"utf8")).trim(),".next-candidate");
           assert.doesNotMatch(await readFile(h.logPath,"utf8"),/FORBIDDEN_CONFIG_WRITE|daemon-reload|reload nginx|investor-(?:backend|celery-worker|celery-beat)/);
          });
          FRONTEND_FIXTURE
          bash -n .audit-activation-offline/compiled-activation-frontend.sh
          node --test .audit-activation-offline/activation-frontend-transaction.test.mjs
  build-frontend:
    name: Build production frontend artifact
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    outputs:
      checkout_seconds: ${{ steps.checkout-timing.outputs.seconds }}
      dependency_seconds: ${{ steps.dependency-timing.outputs.seconds }}
      build_seconds: ${{ steps.build.outputs.seconds }}
      package_seconds: ${{ steps.package.outputs.seconds }}
      upload_seconds: ${{ steps.upload-timing.outputs.seconds }}

    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_STANDALONE_BUILD: "true"
      NEXT_PUBLIC_API_URL: ${{ vars.PROD_NEXT_PUBLIC_API_URL || 'https://api.cred-x.in' }}
      NEXT_PUBLIC_FRONTEND_URL: ${{ vars.PROD_NEXT_PUBLIC_FRONTEND_URL || 'https://cred-x.in' }}
      NEXT_PUBLIC_BRAND_PREFIX: ${{ vars.PROD_NEXT_PUBLIC_BRAND_PREFIX || 'Cred-X' }}
      NEXT_PUBLIC_BRAND_ACRONYM: ${{ vars.PROD_NEXT_PUBLIC_BRAND_ACRONYM || 'TIE' }}
      NEXT_PUBLIC_BRAND_EXPANSION: ${{ vars.PROD_NEXT_PUBLIC_BRAND_EXPANSION || 'Tarun''s Investment Engine' }}
      NEXT_PUBLIC_DISABLE_AUTH: ${{ vars.PROD_NEXT_PUBLIC_DISABLE_AUTH || 'false' }}
      NEXT_PUBLIC_DISABLE_API_PROXY: ${{ vars.PROD_NEXT_PUBLIC_DISABLE_API_PROXY || 'false' }}
      NEXT_PUBLIC_API_DEBUG: ${{ vars.PROD_NEXT_PUBLIC_API_DEBUG || 'false' }}
      NEXT_PUBLIC_RECOMMENDATION_AUDIT_ENABLED: "true"
      NEXTAUTH_URL: ${{ vars.PROD_NEXTAUTH_URL || 'https://cred-x.in' }}
      NEXTAUTH_SECRET: build-only-runtime-secret-is-loaded-on-ec2
      AUTH_TRUST_HOST: "true"
      BACKEND_API_URL: http://127.0.0.1:8000

    steps:
      - name: Start checkout timer
        run: echo "CHECKOUT_STARTED_AT=$(date +%s)" >>"${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: abacd883a6cb17f257bbd869e1c530234fbefd48

      - name: Record checkout duration
        id: checkout-timing
        run: echo "seconds=$(( $(date +%s) - CHECKOUT_STARTED_AT ))" >>"${GITHUB_OUTPUT}"

      - name: Start dependency restore timer
        run: echo "DEPENDENCIES_STARTED_AT=$(date +%s)" >>"${GITHUB_ENV}"

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore reusable Next.js Webpack cache
        uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: >-
            ${{ runner.os }}-node22-next-webpack-${{
              hashFiles('frontend/package-lock.json')
            }}-${{
              hashFiles('frontend/app/**', 'frontend/components/**', 'frontend/hooks/**',
              'frontend/lib/**', 'frontend/providers/**', 'frontend/services/**',
              'frontend/types/**', 'frontend/next.config.ts', 'frontend/tsconfig.json')
            }}
          restore-keys: |
            ${{ runner.os }}-node22-next-webpack-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev --prefer-offline --no-audit --fund=false --loglevel=error

      - name: Record dependency restore duration
        id: dependency-timing
        run: echo "seconds=$(( $(date +%s) - DEPENDENCIES_STARTED_AT ))" >>"${GITHUB_OUTPUT}"

      - name: Log build runner resources
        run: |
          echo "==> CPU"
          nproc
          echo "==> Memory"
          free -h
          echo "==> Swap"
          swapon --show || true
          echo "==> Disk"
          df -h "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"

      - name: Stamp production build fingerprint
        run: |
          build_timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/stamp-frontend-build.mjs \
            frontend/lib/generatedBuildInfo.ts \
            "${RELEASE_SHA}" \
            "${build_timestamp}"
          echo "BUILD_TIMESTAMP=${build_timestamp}" >>"${GITHUB_ENV}"

      - name: Build production frontend with Webpack
        id: build
        working-directory: frontend
        run: |
          set -o pipefail
          started_at="$(date +%s)"
          set +e
          /usr/bin/time -v -o "${RUNNER_TEMP}/frontend-webpack-resources.txt" \
            npm run build 2>&1 | tee "${RUNNER_TEMP}/frontend-webpack-build.log"
          build_status="${PIPESTATUS[0]}"
          set -e
          echo "seconds=$(( $(date +%s) - started_at ))" >>"${GITHUB_OUTPUT}"
          echo "==> Frontend build resource usage"
          cat "${RUNNER_TEMP}/frontend-webpack-resources.txt"
          exit "$build_status"

      - name: Package standalone frontend runtime
        id: package
        run: |
          started_at="$(date +%s)"
          deploy/no-docker/package-frontend-artifact.sh \
            frontend/.next \
            "${RUNNER_TEMP}/${FRONTEND_ARTIFACT_FILE}" \
            "${RELEASE_SHA}" \
            "${BUILD_TIMESTAMP}" \
            webpack
          echo "seconds=$(( $(date +%s) - started_at ))" >>"${GITHUB_OUTPUT}"

      - name: Verify packaged frontend runtime before upload
        run: |
          mkdir "${RUNNER_TEMP}/production-frontend-runtime"
          tar -xzf "${RUNNER_TEMP}/${FRONTEND_ARTIFACT_FILE}" \
            -C "${RUNNER_TEMP}/production-frontend-runtime"
          node scripts/verify-frontend-artifact-runtime.mjs \
            "${RUNNER_TEMP}/production-frontend-runtime" \
            "${RELEASE_SHA}"

      - name: Start artifact upload timer
        if: success()
        run: echo "UPLOAD_STARTED_AT=$(date +%s)" >>"${GITHUB_ENV}"

      - name: Upload production frontend artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FRONTEND_ARTIFACT_NAME }}
          path: |
            ${{ runner.temp }}/${{ env.FRONTEND_ARTIFACT_FILE }}
            ${{ runner.temp }}/${{ env.FRONTEND_ARTIFACT_FILE }}.sha256
          compression-level: 0
          if-no-files-found: error
