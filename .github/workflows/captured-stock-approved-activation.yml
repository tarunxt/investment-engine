            host_config_operation() {
              sudo -n python3 -B - "$1" "$STATE_DIR/host-config.json" <<'HOST_CONFIG'
            """Read-only host-config fingerprint. Retain metadata/hashes, never file contents."""
            import hashlib
            import json
            import os
            from pathlib import Path
            import re
            import stat
            import sys
            
            ROOTS=(Path('/etc/systemd/system'),Path('/etc/nginx'))
            
            def fingerprint(roots=ROOTS):
                result={}; total=0
                for root in roots:
                    if not root.is_dir() or root.is_symlink():raise RuntimeError('Known configuration root required')
                    pending=[root]
                    while pending:
                        path=pending.pop();info=path.lstat()
                        entry={'uid':info.st_uid,'gid':info.st_gid,'mode':stat.S_IMODE(info.st_mode)}
                        if stat.S_ISDIR(info.st_mode):
                            entry['kind']='directory';pending.extend(sorted(path.iterdir()))
                        elif stat.S_ISLNK(info.st_mode):entry.update(kind='symlink',target=os.readlink(path))
                        elif stat.S_ISREG(info.st_mode):
                            if info.st_size>16*1024*1024:raise RuntimeError('Bounded config file required')
                            fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW)
                            with os.fdopen(fd,'rb') as stream:
                                opened=os.fstat(stream.fileno())
                                if (opened.st_dev,opened.st_ino,opened.st_size)!=(info.st_dev,info.st_ino,info.st_size):raise RuntimeError('Stable config file required')
                                data=stream.read(16*1024*1024+1)
                            total+=len(data)
                            entry.update(kind='file',sha256=hashlib.sha256(data).hexdigest())
                        else:raise RuntimeError('Known configuration entry required')
                        result[str(path)]=entry
                        if len(result)>10000 or total>64*1024*1024:raise RuntimeError('Bounded config tree required')
                return result
            
            def operation(phase,path,roots=ROOTS,owner_uid=0):
                parent=os.open(path.parent,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW)
                try:
                    info=os.fstat(parent)
                    if info.st_uid!=owner_uid or stat.S_IMODE(info.st_mode)!=0o700:raise RuntimeError('Private state directory required')
                    if phase=='prepare':
                        payload=json.dumps(fingerprint(roots),sort_keys=True).encode()
                        fd=os.open(path.name,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600,dir_fd=parent)
                        with os.fdopen(fd,'wb') as target:target.write(payload);target.flush();os.fsync(target.fileno())
                    elif phase=='verify':
                        fd=os.open(path.name,os.O_RDONLY|os.O_NOFOLLOW,dir_fd=parent)
                        with os.fdopen(fd,'rb') as source:
                            state=os.fstat(source.fileno())
                            if not stat.S_ISREG(state.st_mode) or state.st_uid!=owner_uid or stat.S_IMODE(state.st_mode)!=0o600 or state.st_nlink!=1 or state.st_size>4*1024*1024:raise RuntimeError('Private regular state required')
                            payload=source.read(4*1024*1024+1)
                        if json.loads(payload)!=fingerprint(roots):raise RuntimeError('Unchanged host configuration required')
                    else:raise RuntimeError('Named operation required')
                    current=path.parent.lstat()
                    if stat.S_ISLNK(current.st_mode) or (current.st_dev,current.st_ino)!=(info.st_dev,info.st_ino):raise RuntimeError('Stable state directory required')
                finally:os.close(parent)
            
            if __name__=='__main__':
                try:
                    if len(sys.argv)!=3 or not re.fullmatch(r'/srv/investor/\.audit-activation-[0-9a-f]{40}-[0-9]+-[0-9]+/host-config\.json',sys.argv[2]):raise RuntimeError('Known state target required')
                    operation(sys.argv[1],Path(sys.argv[2]))
                    print('host_configuration_'+sys.argv[1]+'=true; writes_to_host_configuration=false')
                except Exception as error:
                    print('activation_host_config=blocked; error_type='+type(error).__name__)
                    raise SystemExit(1)
            HOST_CONFIG
            }
            prepare_frontend_adapter() {
              sudo -n python3 -B - "$APP_ROOT/deploy/no-docker/redeploy.sh" > "$contained_driver/redeploy-audit-activation.sh" <<'FRONTEND_ADAPTER'
            """Private exact-source adapter: promote an artifact without installing host config."""
            import hashlib
            from pathlib import Path
            import sys
            
            SOURCE_SHA256='474c37bb276855cce2c028fd75767b7095a274a3d189277782aa487fdf116e72'
            OLD='''if [[ "$DEPLOY_FRONTEND" == "true" ]]; then
              install_systemd_unit "$FRONTEND_SERVICE_NAME"
              echo "==> Install/update frontend nginx template when changed"
              install_or_update_nginx_template
            fi'''
            NEW='''if [[ "$DEPLOY_FRONTEND" == "true" ]]; then
              echo "==> Private activation preserves existing systemd and Nginx configuration"
              preserved_frontend_unit="$SYSTEMD_UNIT_ROOT/$(systemd_unit_file_name "$FRONTEND_SERVICE_NAME")"
              sudo test -f "$preserved_frontend_unit" || { echo "Existing frontend unit required" >&2; exit 1; }
              INSTALLED_SYSTEMD_UNITS+=("$preserved_frontend_unit")
            fi'''
            
            def adapt(source):
                if hashlib.sha256(source).hexdigest()!=SOURCE_SHA256:raise RuntimeError('Exact reviewed redeployer required')
                text=source.decode()
                if text.count(OLD)!=1:raise RuntimeError('Exact configuration block required')
                return text.replace(OLD,NEW,1)
            
            if __name__=='__main__':
                try:
                    if len(sys.argv)!=2 or sys.argv[1]!='/srv/investor/deploy/no-docker/redeploy.sh':raise RuntimeError('Known source required')
                    sys.stdout.write(adapt(Path(sys.argv[1]).read_bytes()))
                except Exception as error:
                    print('activation_frontend_adapter=blocked; error_type='+type(error).__name__,file=sys.stderr)
                    raise SystemExit(1)
