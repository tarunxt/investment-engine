            Run as the existing operational identity under the existing deployment lock.
            The retained state contains flag lines, offsets and hashes, never credentials.
            No services, database, provider or queue operations are performed here.
            """
            import base64
            import hashlib
            import json
            import os
            from pathlib import Path
            import re
            import stat
            import tempfile
            
