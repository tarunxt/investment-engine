            cd "$APP_ROOT/backend"
            source "$APP_ROOT/deploy/no-docker/load-env-file.sh"
            load_env_file /etc/investor/backend.env
            export CREDX_RECOVERY_MODE=1 PYTHONDONTWRITEBYTECODE=1
            .venv/bin/python -B - "$credx_activation_phase" <<'ADMISSION'
            """Read-only schema/runtime/drain admission for the proposed flag activation."""
            import hashlib
            import json
            import os
            from pathlib import Path
            import subprocess
            import sys
            
            TARGET='22a7ee52deda57df24809b18531a85437fc57b695b5662162d68f30c01c248d1'
            REVISION='recommendation_audit_001'
            TABLES=('recommendation_evidence','recommendation_decisions','recommendation_verifications','recommendation_spend_accounts','recommendation_spend_attempts')
            PREFIX='credx:recovery:analysis:v1:'
            
            
            class ActivationAdmissionBlocked(RuntimeError):pass
            
            
            def require(value,gate):
                if not value:raise ActivationAdmissionBlocked(gate)
            
            
            def check_runtime_targets(settings,phase):
                for unit in ('investor-backend','investor-recovery-analysis'):
                    result=subprocess.run(['systemctl','show',unit,'--property=ActiveState,MainPID'],capture_output=True,text=True,timeout=5,check=True)
                    values=dict(line.split('=',1) for line in result.stdout.splitlines() if '=' in line)
                    must_stop=phase=='stopped' or (phase=='fenced' and unit=='investor-backend')
                    if must_stop:
                        require(values.get('ActiveState')=='inactive' and values.get('MainPID')=='0','producer_consumer_fence')
                        continue
                    require(values.get('ActiveState')=='active' and int(values.get('MainPID','0'))>0,'active_runtime')
                    env=dict(part.split(b'=',1) for part in Path('/proc/'+values['MainPID']+'/environ').read_bytes().split(b'\0') if b'=' in part)
                    require(env.get(b'DATABASE_URL',b'').decode()==settings.database_url,'runtime_database_target')
                    require((env.get(b'CELERY_BROKER_URL') or env.get(b'REDIS_URL') or b'').decode()==(settings.celery_broker_url or settings.redis_url),'runtime_broker_target')
            
            
            def check_queue(settings,Redis):
                with Redis.from_url(settings.celery_broker_url or settings.redis_url,socket_connect_timeout=3,socket_timeout=3) as broker:
                    pipeline=broker.pipeline(transaction=False)
                    for priority in range(10):pipeline.llen(PREFIX+'credx_recovery_analysis'+('' if priority==0 else '\x06\x16'+str(priority)))
                    pipeline.hlen(PREFIX+'unacked');pipeline.zcard(PREFIX+'unacked_index')
                    counts=pipeline.execute()
                require(len(counts)==12 and all(isinstance(count,int) and count==0 for count in counts),'empty_recovery_queue')
                return {'pending':sum(counts[:10]),'unacked':counts[10],'unacked_index':counts[11]}
            
            
            def main(phase):
                from sqlalchemy import Column,MetaData,String,Table,create_engine,func,inspect,select,text
                from sqlalchemy.engine import make_url
                from sqlalchemy.pool import NullPool
                from redis import Redis
                from app.core.config import settings
                require(not any(key.startswith('PG') for key in os.environ),'inherited_libpq_configuration')
                url=make_url(settings.database_url)
                require(url.get_backend_name()=='postgresql','postgresql_target')
                url=url.set(drivername='postgresql+psycopg2')
                require(url.host and url.username and url.database and url.password is not None,'database_authority')
                require(set(url.query)<={'sslmode','sslcert','sslkey','sslrootcert'} and all(isinstance(value,str) for value in url.query.values()),'database_query_overrides')
                check_runtime_targets(settings,phase)
                engine=create_engine(url,poolclass=NullPool,connect_args={'connect_timeout':3,'options':'-c statement_timeout=5000 -c lock_timeout=1000'},echo=False)
                try:
                    with engine.connect() as connection:
                        transaction=connection.begin()
                        try:
                            connection.execute(text('SET TRANSACTION READ ONLY'))
                            identity=connection.execute(text('SELECT current_database(), inet_server_addr()::text, inet_server_port(), current_schema()')).one()
                            require(hashlib.sha256(json.dumps(list(identity)).encode()).hexdigest()==TARGET,'exact_migrated_database_target')
                            tables=set(inspect(connection).get_table_names())
                            require(set(TABLES)<=tables,'complete_audit_schema')
                            version=Table('alembic_version',MetaData(),Column('version_num',String))
                            require(list(connection.execute(select(version.c.version_num)).scalars())==[REVISION],'exact_audit_revision')
                            jobs=Table('jobs',MetaData(),Column('status',String),Column('auto_rebalance_portfolio',String))
                            job_count=connection.execute(select(func.count()).select_from(jobs).where(jobs.c.status.in_(('pending','processing')),jobs.c.auto_rebalance_portfolio.in_(('india','indmoney_us')))).scalar_one()
                            require(job_count==0,'no_existing_equity_jobs')
                            audits=Table('recommendation_verifications',MetaData(),Column('status',String))
                            audit_count=connection.execute(select(func.count()).select_from(audits).where(audits.c.status.in_(('queued','processing')))).scalar_one()
                            require(audit_count==0,'no_inflight_audit_verifications')
                            trigger_count=connection.execute(text("SELECT count(*) FROM pg_catalog.pg_trigger tr JOIN pg_catalog.pg_class rel ON rel.oid=tr.tgrelid JOIN pg_catalog.pg_namespace ns ON ns.oid=rel.relnamespace WHERE NOT tr.tgisinternal AND ns.nspname=current_schema() AND tr.tgenabled='O' AND ((rel.relname='recommendation_evidence' AND tr.tgname='recommendation_evidence_immutable') OR (rel.relname='recommendation_decisions' AND tr.tgname='recommendation_decisions_immutable'))")).scalar_one()
                            require(trigger_count==2,'immutable_trigger_metadata')
                            queue=check_queue(settings,Redis)
                            print(json.dumps({'activation_admission':phase,'database_target_fingerprint':TARGET,'alembic_revision':REVISION,'active_equity_jobs':job_count,'active_audit_verifications':audit_count,'queue':queue,'transaction_read_only':True},sort_keys=True))
                        finally:transaction.rollback()
                finally:engine.dispose()
            
            
            if __name__=='__main__':
                try:
                    require(len(sys.argv)==2 and sys.argv[1] in {'observe','fenced','stopped'},'named_admission_phase')
                    main(sys.argv[1])
                except Exception as error:
                    print('activation_admission=blocked; error_type='+type(error).__name__+('; gate='+str(error) if isinstance(error,ActivationAdmissionBlocked) else ''))
                    raise SystemExit(1)
            ADMISSION
            DATABASE
            }
