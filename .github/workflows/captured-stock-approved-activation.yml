                # Systemd allows quoted multiline values and backslash continuations. This
                # deliberately bounded editor refuses those constructs before retaining
                # state, rather than confusing a line inside an unrelated value with a key.
                validate_single_line_assignments(data)
                parts=data.split(b'\n')
                lines=[part+b'\n' for part in parts[:-1]]+([parts[-1]] if parts[-1] else [])
                changes=[]
