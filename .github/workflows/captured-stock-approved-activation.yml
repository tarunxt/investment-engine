            def validate_single_line_assignments(data):
                for line in data.split(b'\n'):
                    line=line.rstrip(b'\r').strip(b' \t')
                    if not line or line.startswith((b'#',b';')):continue
                    match=re.fullmatch(rb'[A-Za-z_][A-Za-z0-9_]*[ \t]*=[ \t]*(.*)',line)
