                    require((current_info.st_uid,current_info.st_gid,stat.S_IMODE(current_info.st_mode))==(info.st_uid,info.st_gid,stat.S_IMODE(info.st_mode)),'pre_write_owner_mode_drift')
                    if planned!=before:atomic_write(path,planned,current_info)
